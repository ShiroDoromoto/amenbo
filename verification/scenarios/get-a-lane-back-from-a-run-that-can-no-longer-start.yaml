# A definition goes on being edited while runs of it are out, and a run waiting for a lane is the one
# that can be edited out from under. Take the entry off while it waits, and what it is promoted into
# is a picture with nowhere to begin: no step has run, so what it would open is the entry, and there
# is none. Nothing about it will ever change again on its own.
#
# What that costs, if nobody ends it, is a lane — the number of runs this machine will carry at once,
# which is small on purpose. A run sitting `running` for good holds one of them, and the next thing a
# reader launches waits behind a run that is not going anywhere.
#
# ── Why the queue is where this is walked ───────────────────────────────────────────────────────
# A run that starts with a lane free has its first step opened within the second, and from then on it
# has somewhere it came from. A run that waits has none of that: it is the one window in which the
# picture can be changed under a run that has not begun. So the lanes are filled first, and the run
# this road is about is the one that never got one.
#
# ── Why the edit is made at a terminal ──────────────────────────────────────────────────────────
# Amenbo draws no control over which step a run starts at — the field is the terminal's, and the
# screen reads it. That is also why the step is in the road rather than in its premise: standing a
# definition up with no entry would refuse every launch, and the run that has to exist before the
# edit could never be made.
#
# ── Why both rows are read ──────────────────────────────────────────────────────────────────────
# One run is ended by the reader and the other by Amenbo, and the running tab says "stopped" for
# both. What tells them apart is the line under it, so a build that ended the promoted run for the
# wrong reason — or ended it in the same breath as the one the reader stopped — reads apart here and
# nowhere else.
id: get-a-lane-back-from-a-run-that-can-no-longer-start
title: A run promoted into a definition with no step to start at is ended, and says so under its row
description: >
  Fill every lane, leave one run waiting behind them, and take the entry off the definition at a
  terminal while it waits. Then stop one of the runs holding a lane. The waiting run is promoted into
  a picture it cannot begin, and the running tab carries two stopped rows that do not read alike: the
  one the reader stopped says so, and the one Amenbo ended says there was nothing left to open.
given:
  # One agent this machine can start, kept standing once it has printed — three of its panes are what
  # hold the lanes while this road works.
  - { type: action, domain: workspace, op: can-start, with: { count: 1, then: reads } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — four runs, three lanes" }, as: auto }
  - { type: action, domain: automation, op: step-add, with: { target: auto, name: take, agent: claude-code, prompt: take the next task }, as: take }
  - { type: action, domain: automation, op: exit-add, with: { step: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { target: take, exit: got one } }
  - { type: action, domain: automation, op: edge-add, with: { target: take } }
  - { type: action, domain: automation, op: entry, with: { target: auto, step: take } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The terminal the edit will be made at, opened before any run has a pane — a shell opens in the
  # pane already standing, and after the runs are out every pane standing is one of theirs.
  - type: action
    domain: workspace
    op: open-shell

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # Three runs, which is every lane this machine carries.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: first

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: second

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: third

  - type: assert
    domain: automation
    op: lanes
    with:
      held: 3
      of: 3

  # And the fourth, which is the run this road is about. The press answers that it is waiting rather
  # than refusing to make it — a queue is a run that exists and has not begun.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: waiting

  - type: assert
    domain: automation
    op: queued
    with:
      target: waiting

  # The entry taken off while it waits. Nothing on the screen is touched between here and the press
  # that frees a lane: what is being read is what the waiting run is promoted into.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: automation
    op: entry-off
    with:
      target: auto

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  # Still waiting: the edit was to the definition, and a run that has not begun is not looked at until
  # a lane comes free.
  - type: assert
    domain: automation
    op: run-row
    with:
      target: waiting
      state: queued

  # The lane handed back, which is what promotes the run behind it.
  - type: action
    domain: automation
    op: press-run
    with:
      target: first
      press: stop

  - type: assert
    domain: automation
    op: run-row
    with:
      target: first
      state: stopped
      reason: by_human

  # And the promoted run, ended by Amenbo rather than by the reader — within a second of taking the
  # lane, that being how often a run is looked at. The line under the row is the whole difference
  # between this row and the one above it.
  - type: assert
    domain: automation
    op: run-row
    with:
      target: waiting
      state: stopped
      reason: no_way_on

  # The lane it held for that second is back, and what holds the other two are the runs still under
  # way. A run that was left `running` with nowhere to go would read here as a third lane held by
  # nobody.
  - type: assert
    domain: automation
    op: lanes
    with:
      held: 2
      of: 3
