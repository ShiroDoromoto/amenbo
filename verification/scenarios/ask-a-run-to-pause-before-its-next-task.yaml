# Pausing one run waits for the action under way to end, and an action can be half of one task. The
# other pause stops a run at the seam between tasks: it goes on until it next comes to the built-in
# that takes one, and pauses there with no task in hand. A run that takes no task has no such seam, so
# asking it is refused and it goes on to its end.
#
# A run started at a terminal opens no step, so neither pause settles here: the run stays `running`
# with the request on it. What the road reads is which run carries it.
id: ask-a-run-to-pause-before-its-next-task
title: A run that takes tasks is asked to pause before its next task, and one that takes none is refused
description: >
  Start two runs, one of an automation that takes tasks and one of an automation that does not. Ask
  each to pause before its next task. The run that takes tasks carries the request and is still
  running; asking the other is refused, and it carries none.
given:
  # Two rather than one for `hold-a-run-and-let-it-go-again`'s reason: the premise cannot stand up a
  # row shorter than two.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }

  # The automation that takes tasks. Nothing is handed to the AI, so its filter finds none, and the
  # way out for no task is drawn for its launch.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that takes tasks" }, as: taking }
  - { type: action, domain: automation, op: place-add, with: { target: taking, builtin: take_task }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: taking, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

  # The automation that takes none: a fetch, and the end whatever it brings back. What it looks at is
  # answered on the road: answering is a move a road makes.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that takes none" }, as: plain }
  - { type: action, domain: automation, op: place-add, with: { target: plain, builtin: fetch }, as: at_fetch }
  - { type: action, domain: automation, op: edge-add, with: { target: at_fetch, exit: 取ってきた } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_fetch, exit: 見つからない } }

steps_cli:
  # A run's steps are opened by the app, so a run is started with one up on the store.
  - { type: action, domain: store, op: app-up }

  - { type: action, domain: automation, op: cfg-set, with: { target: at_fetch, name: 形式, choice: コマンド } }
  - { type: action, domain: automation, op: cfg-set, with: { target: at_fetch, name: 見に行く先, text: "echo nothing to see" } }

  - type: action
    domain: automation
    op: start
    with:
      target: taking
    as: taking_run

  - type: action
    domain: automation
    op: start
    with:
      target: plain
    as: plain_run

  - type: assert
    domain: automation
    op: run
    with:
      target: taking_run
      status: running
      pause_before_next_task: false

  - type: action
    domain: automation
    op: pause-before-next-task
    with:
      target: taking_run

  # Asked, and still running: the pause waits for the built-in that takes a task. It is not the
  # pause at the end of the action, which is a request of its own.
  - type: assert
    domain: automation
    op: run
    with:
      target: taking_run
      status: running
      pause_before_next_task: true
      pause_requested: false

  - type: action
    domain: automation
    op: pause-before-next-task
    with:
      target: plain_run
      refused: invalid_value

  - type: assert
    domain: automation
    op: run
    with:
      target: plain_run
      status: running
      pause_before_next_task: false
      pause_requested: false
