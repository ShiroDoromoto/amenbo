name: Full regression (nightly)

# The whole of ci.yml, once a night, with its path gate forced open.
#
# ci.yml runs each build/test job only when the diff could have moved it, and the same judgment now
# decides what the local gate runs (`make gate`). One definition, read by both — which is what makes
# a hole in it invisible: a layer missing one of its inputs, or a path that belongs to no layer, is
# skipped by a filter that believes it has judged, and both sides skip it together. The run is green
# and short, and nothing in the diff says otherwise.
#
# This leg is the second net. It asks for none of that judgment — every gated job runs — so a hole
# shows up as a red nightly rather than as a pile of red on the day someone runs `make release`,
# where the tag-time full run is the last thing standing between a wrong filter and a shipped build.
#
# Nightly rather than weekly: what accumulates behind a hole is commits, and the count is what makes
# the eventual failure hard to read. A day's worth is one change to look at.
#
# It calls ci.yml rather than restating its jobs: two copies of the suite would drift, and the copy
# nobody watches is the one that rots. This is the same shape rot-weekly.yml uses for rot-gates.yml.
#
# It runs on Linux like every leg of the CI net; the macOS .app bundle stays a distribution artifact.

on:
  schedule:
    # Nightly at 08:00 UTC. Two hours after scale-heavy.yml and an hour after rot-weekly.yml, so
    # the three timed legs never contend for the same runners.
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read
      pull-requests: read
