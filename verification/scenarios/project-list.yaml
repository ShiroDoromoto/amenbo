id: project-list
title: The projects are listed in the order they are kept, and one opens to its own fields and counts
description: >
  The reading side of projects. The listing is what a person picks a place of work from, and the
  detail is what says how much is in it — a count that does not follow the tasks makes the listing
  lie about where the work is.
steps_cli:
  - { type: action, domain: project, op: create, with: { name: SCENARIO PROJECT — registered first }, as: first }
  - { type: action, domain: project, op: create, with: { name: SCENARIO PROJECT — registered second }, as: second }

  # Both are in the listing, and a newly added project is appended after the existing ones.
  - { type: assert, domain: project, op: listed, with: { target: first, present: true } }
  - { type: assert, domain: project, op: listed, with: { target: second, position: last } }

  # The detail opens on the row itself: the name it was given, and an empty project counted as empty.
  - { type: assert, domain: project, op: field, with: { target: second, field: name, equals: SCENARIO PROJECT — registered second } }
  - { type: assert, domain: project, op: field, with: { target: second, field: task_counts.total, equals: 0 } }
  - { type: assert, domain: project, op: field, with: { target: second, field: archived, equals: false } }

  # The counts follow the tasks: two filed here, one of them finished, and the detail says so.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — still to do }, as: piled }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — carried out }, as: cleared }
  - { type: action, domain: task, op: move, with: { target: piled, project: second } }
  - { type: action, domain: task, op: move, with: { target: cleared, project: second } }
  - { type: action, domain: task, op: done, with: { target: cleared } }
  - { type: assert, domain: project, op: field, with: { target: second, field: task_counts.total, equals: 2 } }
  - { type: assert, domain: project, op: field, with: { target: second, field: task_counts.completed, equals: 1 } }
  - { type: assert, domain: project, op: field, with: { target: second, field: task_counts.incomplete, equals: 1 } }
