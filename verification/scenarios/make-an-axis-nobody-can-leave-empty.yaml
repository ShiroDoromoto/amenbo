# An axis a project cannot be left empty on, and the places the demand bites. Classification is
# otherwise entirely optional — a task filed under nothing is a task like any other — so what this
# raises is the exception: the axis whose answer a project will not do without. Both records are
# written in two stages, and the demand lands on the second of them alone — the step that ends a
# task's creation, and the one that ends a decision's writing — and nowhere else, which is what keeps
# raising it from stopping a board that is already full: the work already filed is finished being
# written, so it never meets the guard. It is also what keeps the demand off the first stage: a
# writer who has not settled the axis yet still gets the record down, and answers it before the
# writing ends. A road that walked only the filing would read the same over a build whose flag does
# nothing, so this one is written to be turned away seven times — on the axis nobody could answer, on
# the axis whose answers are all closed, on the creation that left the answer out, on the writing that
# would have ended with it out, on the hand that would take the answer back off one task at a time, on
# the removal that would take it off every task at once, and on the removal that would leave the axis
# with nothing to answer with at all. Writing a
# decision has two ways in rather than one, so the promotion is walked beside the record: both of them
# record, and a road that walked only one would not say that neither demands. One axis is answered
# before anyone could be asked: a time axis is filled from the era whose window covers today, so it is
# blank only where no era covers today — and there the record is written all the same, and the end of
# the writing is where it is asked for.
id: make-an-axis-nobody-can-leave-empty
title: An axis marked required turns away the creation and the finished writing that left it empty, records what is still being written, and holds the answer on once it is there
description: >
  Raise the demand on an axis offering no values and be refused — a requirement nobody could answer
  would stop every creation on the project — and be refused the same way on an axis whose values are
  all closed, a closed one being no answer to give. Raise it on an axis that offers two, file a task
  without answering it, and watch the creation refused and the task held out of the mailbox. Put a value on
  and watch the same creation end. A decision left blank is recorded rather than turned away, and so is
  one raised out of a comment: both ways in ask for nothing, and the answer riding along with the
  record only saves the trip back. The records written before the demand went up meet it where their
  writing ends, and answering the axis opens them. Superseding is not one of those doors — it draws an
  edge and ends nobody's writing. A required time axis is answered by the era the store writes itself:
  with no era covering today it is recorded blank, and the end of the writing is where it is asked for.
  Then try to take the value back off and be refused there too —
  from the task, and from the axis itself, where removing the value would empty every task on it at
  once unless the removal says where they go. Say where, and the value goes with the task carried
  over, and with the decision beside it; the axis's last value does not go at all, until the demand
  itself is lowered. The work that was already on the board when the demand went up is read back
  untouched.
# Two axes and one piece of settled work. The axes are the world rather than the road: filing under
# one is `classify-work-along-an-axis`'s road, and walking it again here would prove that road twice
# and this one not at all. `Focus` is left offering nothing on purpose — it is the axis the first
# refusal is about. And the standing task is finished being written *before* any demand goes up,
# which is the state the road reads back once the demand is up: a demand raised over a board changes
# nothing already on it.
given:
  - type: action
    domain: dimension
    op: create
    with:
      name: Focus

  - type: action
    domain: dimension
    op: create
    with:
      name: Medium

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: Medium
      value: print

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: Medium
      value: web

  # `Shelf` is the second axis the first refusal is about. It stands here holding the one value it will
  # end up offering nothing but — retiring that value is a step on the road rather than the world, so
  # it is taken there.
  - type: action
    domain: dimension
    op: create
    with:
      name: Shelf

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: Shelf
      value: back-issues

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO WORLD — work this board already carried
    as: standing

  - type: action
    domain: task
    op: finish-creating
    with:
      target: standing

  # Two records written before any demand goes up, and here for the same reason the standing task is:
  # once the flag is raised the second stage turns a blank decision away, so the records that go on to
  # meet the *decision's* door have to be the ones already on the board when it went up.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO WORLD — a record this board already carried
    as: standing-ruling

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO WORLD — the record that would replace it
    as: standing-revision

steps_cli:
  # The demand nobody could satisfy, refused where it would be raised. An axis offering no values has
  # no answer to give, so a task could never carry one — and the creation it would hold is every
  # creation on the project.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Focus
      refused: invalid_dimension_required_without_values

  - type: action
    domain: dimension
    op: closable
    with:
      dimension: Shelf

  - type: action
    domain: dimension
    op: value-close
    with:
      dimension: Shelf
      value: back-issues

  # The same refusal on an axis that has values and offers none of them. A closed value keeps what is
  # filed under it and takes nothing new, so an axis whose values are all closed has no answer to give
  # either — what the demand counts is what the axis still offers, and a road that walked only the
  # empty axis would read the same over a build counting rows.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Shelf
      refused: invalid_dimension_required_without_values

  # The same move on an axis that has answers to give, and it goes through. The two lines together are
  # what says the guard is about the values and not about the flag.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Medium

  # Raising it over a board changes nothing already on it: the work whose writing was finished before
  # the demand went up is finished still.
  - type: assert
    domain: task
    op: field
    with:
      target: standing
      field: draft
      equals: false

  # Nothing about filing this one says the axis is required — the first stage of a creation asks for
  # nothing, which is what makes the second stage the place the demand is met.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — filed with the answer missing
    as: seed

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed
      refused: invalid_task_required_dimension

  # Turned away leaves the task where it was rather than half-finished: still being written, and so
  # still out of the one listing a session takes its next work from.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: true

  - type: assert
    domain: task
    op: listed
    with:
      filter: "status:todo ready:yes"
      target: seed
      present: false

  # The answer goes on, and the very same step that was turned away now ends the creation — which is
  # what says the demand let go rather than never having been there.
  - type: action
    domain: dimension
    op: set
    with:
      target: seed
      dimension: Medium
      value: print

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "status:todo ready:yes"
      target: seed
      present: true

  # The same demand on the other kind of record, and the record is not where it is read. A decision is
  # written in two stages like a task, and the first asks for nothing — so one left blank is recorded
  # rather than turned away, and it is the writing's end that will not come until the axis is answered.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer missing
    as: blank-ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: blank-ruling
      field: draft
      equals: true

  # The answer rides along with the record instead, which saves the trip back to put it on afterwards
  # rather than being what lets the record through.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer given
      dimension: Medium
      value: print
    as: ruling

  # The other way a decision is written. A record is not always typed out: a line already said on a
  # timeline can be raised into one, and this way in asks no more than the other — the axis is empty
  # again, and the promotion goes through again.
  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — the reasoning that turned out to be worth a record of its own
    as: note

  - type: action
    domain: comment
    op: promote
    with:
      target: note
      title: SCENARIO SEED — raised out of a comment with the answer missing
    as: raised-blank

  - type: assert
    domain: decision
    op: field
    with:
      target: raised-blank
      field: draft
      equals: true

  # And the answer rides along here too, on the same word the record takes it on. The comment is still
  # there to raise a second time, which is what says a promotion leaves the line it was raised from
  # where it was.
  - type: action
    domain: comment
    op: promote
    with:
      target: note
      title: SCENARIO SEED — raised out of a comment with the answer given
      dimension: Medium
      value: print
    as: raised

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:Medium=print"
      target: raised
      present: true

  # And the second door, met by a record written before the demand went up. Raising a flag does not
  # reach back, so this one is on the board with the axis blank — and it is the end of the writing that
  # reads it.
  - type: action
    domain: decision
    op: finish-writing
    with:
      target: standing-ruling
      refused: invalid_decision_required_dimension

  # Turned away leaves it where it was, exactly as the creation was left: still being written, and so
  # still nothing the work resting on it can start off.
  - type: assert
    domain: decision
    op: field
    with:
      target: standing-ruling
      field: draft
      equals: true

  - type: action
    domain: dimension
    op: set
    with:
      target: standing-ruling
      dimension: Medium
      value: print

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: standing-ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: standing-ruling
      field: draft
      equals: false

  # And what is not that door. Superseding draws one edge and ends nobody's writing, so a new side with
  # the axis still blank goes through without being asked — and comes back still being written, which is
  # what says the demand is on the end of the writing rather than on anything that merely names a
  # decision.
  - type: action
    domain: decision
    op: supersede
    with:
      target: standing-revision
      replaces: standing-ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: standing-revision
      field: draft
      equals: true

  - type: action
    domain: dimension
    op: set
    with:
      target: standing-revision
      dimension: Medium
      value: print

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: standing-revision

  - type: assert
    domain: decision
    op: field
    with:
      target: standing-revision
      field: draft
      equals: false

  # And the one axis this first door lets past. A time axis answers itself — the era whose window covers
  # today goes on as the record is made — so reading the demand where the record is written would turn a
  # writer away over a value that very write is putting on. Here every era the axis offers closed years
  # ago, which is the one state where the axis is required and a new record still has nothing to carry:
  # the record goes through all the same, and the exception is about which axis it is rather than about
  # whether an answer arrived.
  - type: action
    domain: dimension
    op: create
    with:
      name: Era

  - type: action
    domain: dimension
    op: time-axis
    with:
      dimension: Era

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: Era
      value: Founding

  - type: action
    domain: dimension
    op: period
    with:
      dimension: Era
      value: Founding
      start: "2000-01-01"
      end: "2000-12-31"

  - type: action
    domain: dimension
    op: required
    with:
      dimension: Era

  # Recorded rather than refused. The other required axis is answered on the way in so that what is left
  # blank is the time axis alone — a record turned away over `Medium` would say nothing about which of
  # the two this door reads.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded while no era covers today
      dimension: Medium
      value: print
    as: eraless

  # And the demand is real, one door further on. The end of the writing reads every required axis, the
  # time axis included, so what the record let past is what that door asks for — and the record is left
  # half-written exactly as the one above it was.
  - type: action
    domain: decision
    op: finish-writing
    with:
      target: eraless
      refused: invalid_decision_required_dimension

  - type: assert
    domain: decision
    op: field
    with:
      target: eraless
      field: draft
      equals: true

  # And the door does not swing back. A demand met only at the creation would be a demand anyone could
  # empty a minute later, so taking the value off a required axis is refused as well — the way back to
  # an empty answer is to lower the demand, not to slip under it.
  - type: action
    domain: dimension
    op: unset
    with:
      target: seed
      dimension: Medium
      value: print
      refused: invalid_dimension_required_unset

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=print"
      target: seed
      present: true

  # Nor does the door swing back one turn further out. Taking the value itself away would empty every
  # task answering with it at once — the same state the line above refuses one task at a time — so a
  # required axis will not let it go while anybody is on it, and says so instead of doing it quietly.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: print
      refused: invalid_value

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=print"
      target: seed
      present: true

  # What it asks for is somewhere for them to go, and given that, the value goes. The task is carried
  # over rather than emptied, which is the whole of the difference between this and being turned away.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: print
      to: web

  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: Medium
      value: print
      present: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=web"
      target: seed
      present: true

  # And what was carried over is everything that answered with the value, not merely the tasks: one
  # axis and one set of values means one removal, so the decisions filed under it land where the tasks
  # did rather than being quietly emptied behind the same demand.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:Medium=web"
      target: ruling
      present: true

  # And the last one does not go at any price. Naming a destination is no way past this one — there is
  # no other value of the axis to name — so what is left is a demand the axis can still answer.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: web
      refused: invalid_value

  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: Medium
      value: web
      present: true

  # Lowered, the axis is an ordinary one again and the same hand goes through. The demand is an
  # attribute and not a one-way gate: what it holds shut, lowering it opens.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Medium
      required: false

  - type: action
    domain: dimension
    op: unset
    with:
      target: seed
      dimension: Medium
      value: web

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=web"
      target: seed
      present: false

steps_gui:
  # The screen's half, and it is a different half. A terminal meets the refusals as codes on an exit
  # status; this face has no code to give back, so what it does instead is hold the controls — the box
  # that would raise a demand nobody could answer, the button that would end a task's creation while
  # the demand is not met, the button that would record a decision the same way, and the removal that
  # will not go until it has been told where the tasks land. A held control is a thing only a screen
  # can be asked about, which is why the road here is those four and not the codes again.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Focus
      refused: invalid_dimension_required_without_values

  - type: action
    domain: dimension
    op: closable
    with:
      dimension: Shelf

  - type: action
    domain: dimension
    op: value-close
    with:
      dimension: Shelf
      value: back-issues

  # And held on the axis that lists a value and offers none — the state a box counting rows is live in,
  # where pressing it brings back a refusal the terminal reads as a code and this face has nowhere to
  # put.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Shelf
      refused: invalid_dimension_required_without_values

  - type: action
    domain: dimension
    op: required
    with:
      dimension: Medium

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — filed with the answer missing
    as: seed

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed
      refused: invalid_task_required_dimension

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: true

  # Answered from the task's own pane, where the axis's control sits — the same place the held button
  # names, so a reader turned away by it has nowhere else to go.
  - type: action
    domain: dimension
    op: set
    with:
      target: seed
      dimension: Medium
      value: print

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: false

  # The same record on this face, and the form holds nothing back. It offers the required axes as
  # selects so the answer can ride with the record, but one left on `None` records the decision all the
  # same — the demand belongs to the end of the writing, and the button beside these selects is not a
  # door.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer missing
    as: blank-ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: blank-ruling
      field: draft
      equals: true

  # Answered where the form offers it, and the answer goes in with the decision rather than after it —
  # which is what the selects are there for, and the door a blank one would be turned away at passes.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer given
      dimension: Medium
      value: print
    as: ruling

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: ruling
      field: draft
      equals: false

  # And the other control this face holds: the value the answer was given cannot simply be removed
  # while the answer stands on it, so the manager asks where the tasks go and carries them there. A
  # terminal names the destination on the command line; here it is a control that has to be found, and
  # the reading afterwards is of the board rather than of a refusal — the task is drawn under the value
  # it was moved to, which no exit status could have said.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: print
      to: web

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=web"
      target: seed
      present: true
