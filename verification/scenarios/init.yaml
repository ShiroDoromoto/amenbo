# Binding is not a convenience — it *is* an AI's reach. A folder's `.amenbo` names the one project
# an agent launched there may read and write, so a pointer that fails to land leaves the agent
# reaching nothing, and one that lands on the wrong project lets it write where it was never sent.
# Nothing about that is visible from inside the workspace's own tests: the pointer is a file the
# shipped binary places in a real folder, and the folder is what answers for it.
id: init
title: A folder is given a project of its own, a second is pointed at one that exists, and the pointer can be taken back
description: >
  Raise a project in a fresh folder with `init` and read the pointer back from inside it, then point
  a second folder at this run's own project with `bind` — the many-to-one relation a shared checkout
  rests on. Resync that folder's guidance block and confirm a second pass finds nothing left to
  write, which is what makes the command safe to aim at every folder on the device. Finally unbind,
  and confirm the folder reaches nothing again.
steps_cli:
  # `init` in an unclaimed folder raises a project there and points the folder at it. The binding it
  # hands back is what the next step checks the pointer against.
  - type: action
    domain: folder
    op: init
    with:
      dir: standalone
    as: own

  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      project: own

  # A second folder pointed at a project that already exists — many folders to one project, which is
  # what a checkout cloned twice, or a repo and its worktree, actually look like.
  - type: action
    domain: folder
    op: bind
    with:
      dir: shared

  - type: assert
    domain: folder
    op: bound
    with:
      dir: shared
      present: true

  # The first folder is untouched by the second binding — a bind points one folder, never a tree.
  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      project: own

  # The guidance block, brought forward to this build's format. Binding already wrote one, so the
  # resync has nothing to do — and that is the assert: it rewrites only what differs, which is why
  # it can be pointed at every bound folder without churning any of them.
  - type: action
    domain: folder
    op: sync-guide
    with:
      dir: shared

  - type: assert
    domain: folder
    op: resynced
    with:
      dir: shared
      changed: false

  # Taking the pointer back. The project is kept — this is the inverse of bind, not a teardown — so
  # the folder that has its own project still has it.
  - type: action
    domain: folder
    op: unbind
    with:
      dir: shared

  - type: assert
    domain: folder
    op: bound
    with:
      dir: shared
      present: false

  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      project: own
