# The integrity check, on both its faces. The reads are asked of a store that has been used rather
# than a fresh one: an emptiness check is sound by definition, and the references these commands look
# for — a dependency edge, a decision's link to the work it drives, a comment hanging off a task —
# only exist once something has drawn them. Then the face that writes: something is put wrong, seen to
# be reported, repaired, and seen to be gone.
id: put-the-store-right
title: A store carrying real work reports sound — and what is left broken is reported, repaired, and gone
description: >
  Build up the shape a real store has (two tasks with an edge between them, a decision linked to the
  work it drives, a comment on the timeline) and then ask both integrity faces what they see: the
  device-wide sweep, and the shape check narrowed to a single task. Both are side-effect-free reads,
  so the store is asked twice over and asserted unchanged by the asking.

  The repair is walked separately, and it is walked end to end — a fix that sweeps nothing looks
  exactly like a fix that works, so the problem is put there first and the same read that raised it
  is what says it went. The last thing walked needs no repair at all: a project whose folder has been
  taken off is intact and unreachable at once, and all that is owed is being told.
steps_cli:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the work that waits
    as: seed

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the blocker in front of it
    as: blocker

  - type: action
    domain: task
    op: depend
    with:
      target: seed
      on: blocker

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — a timeline hanging off the task
    as: note

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the premise the work stands on
    as: premise

  - type: action
    domain: decision
    op: link
    with:
      target: premise
      task: seed

  # The edges and the premise are all on now, so both creations are finished. A store carrying real
  # work is one where the writing ended: what holds the work back below is the two premises above it,
  # declared on purpose, and not a creation nobody closed.
  - type: action
    domain: task
    op: finish-creating
    with:
      target: blocker

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  # The device-wide sweep: orphaned references, broken ordering, stale bindings.
  - type: assert
    domain: store
    op: doctor
    with:
      ok: true

  # The shape check, over everything and then narrowed to one task — the same face a user reaches
  # for when a single task looks wrong rather than the store.
  - type: assert
    domain: store
    op: validate
    with:
      ok: true

  - type: assert
    domain: store
    op: validate
    with:
      target: seed
      ok: true

  # Neither read moves anything: the premises that were declared still hold the work back.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: ready
      equals: false

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — a timeline hanging off the task
      present: true

  # ── The face that writes ────────────────────────────────────────────────────────────────────
  # A folder bound by an older build: the binding is sound, and only the pointer left in the folder
  # is in a shape this build no longer writes. Nothing Amenbo does today produces one, which is why
  # the repair is worth a line — the state it answers for is not reachable by using Amenbo normally.
  - type: action
    domain: folder
    op: init
    with:
      dir: elsewhere
    as: theirs

  - type: action
    domain: folder
    op: legacy-pointer
    with:
      dir: elsewhere

  # It is reported — and reported as a warning, so the store's verdict is untouched. A repair that
  # could only be seen through `ok` would be invisible here, which is most of what doctor raises.
  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
      issue: legacy_pointer
      present: true

  - type: action
    domain: store
    op: doctor-fix

  # The same read that raised it is what says it is gone. This is the whole gate: a repair that
  # sweeps nothing is indistinguishable from one that works, until something it had to sweep is here.
  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
      issue: legacy_pointer
      present: false

  # And what was written is the right thing: the folder still answers with the project it named all
  # along, which a pointer rewritten to some other key would fail. Asking from inside a folder heals
  # its pointer too, so this says nothing about whether the sweep ran — the read above is that gate.
  - type: assert
    domain: folder
    op: bound
    with:
      dir: elsewhere
      project: theirs

  # ── A project nothing leads to ──────────────────────────────────────────────────────────────
  # Nothing here is broken: every row is intact and every constraint holds. What is gone is the way
  # in — a project is reached through the folder someone stands in — so the project left behind by
  # taking its last folder off is a list nobody can operate. Its own board says so to whoever opens
  # it; this is the place that says it for the whole machine, which is the only way to find one you
  # are not looking at.
  - type: action
    domain: folder
    op: unbind
    with:
      dir: elsewhere

  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
      issue: project_without_folder
      present: true

  # Linking a folder back is the whole fix, and the read that raised it is what says it took.
  - type: action
    domain: folder
    op: bind
    with:
      dir: elsewhere
      project: theirs

  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
      issue: project_without_folder
      present: false

  # ── The bytes the sweep reclaims ────────────────────────────────────────────────────────────
  # The other half of `--fix`, and the half that raises no issue at all: attachment files nothing
  # references any more. Removing an attachment already reclaims its blob — but only once the blob is
  # past the hour that protects an attach in flight, so what a run creates is always spared, and the
  # bytes sit there until this sweep comes for them. That is the state built here.
  - type: action
    domain: repo
    op: write-file
    with:
      path: hanging.txt
      content: SCENARIO — bytes that outlive the row that named them

  - type: action
    domain: task
    op: attach
    with:
      target: seed
      file: hanging.txt
    as: hanging

  - type: action
    domain: attachment
    op: rm
    with:
      target: hanging

  # The row is gone and the bytes are not: too young to collect, which is the whole reason the sweep
  # has anything left to do.
  - type: assert
    domain: store
    op: blobs
    with:
      count: 1

  - type: action
    domain: store
    op: age-blobs

  - type: action
    domain: store
    op: doctor-fix

  # Nothing reports this one — no issue is raised for it and `--json` carries no count — so the bytes
  # being gone is the only thing that can say the sweep ran.
  - type: assert
    domain: store
    op: blobs
    with:
      count: 0

# ── The faces of `--fix` that are not walked here, and why ────────────────────────────────────
# `--fix` also sweeps orphaned attachments: rows whose record is gone. That reference is the one no
# foreign key can hold (`target_type` names the table, so no `REFERENCES` can branch on it), and what
# stands in the database's place is every delete op calling `sweep_polymorphic`. So the state is not
# reachable by using Amenbo either: every attach checks its target, and every delete takes the
# attachments with it. A scenario driving the shipped binary has no way to leave one behind, which is
# exactly the point — the rows this reports are the residue of a bug, not of a workflow.
#
# It is covered from the other side instead, at the layer that can arrange it: the doctor unit tests
# plant an attachment on each of the four target types with the target absent, and the blob test walks
# report → sweep → report and asserts the bytes it was holding go with the row.
#
# `--fix` also forgets orphan bindings: folder rows no live project claims. That state is not
# reachable by using Amenbo, so there is nothing here for a scenario to put wrong. Deleting a project
# releases every folder bound to it in the same breath — the pointer, the guidance block and the
# registry row all go — and that is the only operation that drops the project a row points at. A row
# is left over only when the release itself fails part way, which a scenario driving the shipped
# binary cannot arrange.
#
# So the face is covered from the other side: `retire-a-project.yaml` binds a folder, deletes its project,
# and asks `doctor` for the absence of `orphan_binding`. That is the assertion worth making — the
# sweep has nothing to sweep because the delete cleans up after itself, and a delete that stopped
# doing so would turn that line red.
