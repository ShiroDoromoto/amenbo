# A built-in is one of Amenbo's own actions, defined in its code. Nobody builds or changes one, but a reader
# placing one still has to be able to see what the run will do there — so the library lists the
# built-ins under a head of their own, and opening one reads its definition instead of building it.
#
# Both entrances to that reading are walked: the actions tab's row, before anything places it, and
# the placement's own panel, once it is on a line. The count of automations placing it is read at
# each, because the placement is what moves it. A build that lost the head, the press that places one
# or the read-only screen would leave a built-in nobody could put on a picture or look inside.
#
# The road is the screen's alone. The terminal places a built-in by its key (`place-add`), and reads
# no library the way the screen draws one.
#
# **Every word of a built-in is drawn in the machine's language**, so the road names it by its key and
# what it declares by the words the store keeps them under — the same words the terminal writes. It
# walks in any language the interface is drawn in.
id: place-a-built-in-and-read-what-it-does
title: A built-in is read from the library, put in on a line from its own head, and read again from its placement
description: >
  On the actions tab, open the built-in that waits (`wait`) and read what it does, the three settings
  it reads and its one way out, with no automation running it yet. On an automation, put it in on the line
  leaving a library action, from the head for the built-ins in the panel the `+` opens — which lists no
  row for the built-in that takes a task — and read it on the picture. Press its box, open the action
  standing on it, and read the same screen again, now run by one automation.
given:
  # One library action to stand before the built-in, with a way out to draw the line it goes in on.
  - { type: action, domain: automation, op: action-add, with: { name: draft }, as: draft }
  - { type: action, domain: automation, op: step-add, with: { target: draft, name: write, prompt: write the draft }, as: write }
  - { type: action, domain: automation, op: action-entry, with: { target: draft, step: write } }
  - { type: action, domain: automation, op: exit-add, with: { action: draft, name: drafted } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one a built-in goes on" }, as: auto }
  # The role starts at the built-in that takes a task, the only start a role has, and the library
  # action goes on after it — the picture draws only what the role's start reaches. The start is not
  # the built-in the road reads, so the count read below is the road's placement alone.
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: draft }, as: at_draft }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_draft } }

steps_gui:
  # Before anything places it: the built-in is on the library's list, and opens to be read.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: builtin-open
    with:
      builtin: wait

  - type: assert
    domain: automation
    op: builtin-read
    with:
      builtin: wait
      settings: [時間, 分, 秒]
      exits: [完了]
      used_by: 0

  # The line it goes in on: leaving the library action by its way out finishes the task.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: pick-box
    with:
      name: draft

  - type: action
    domain: automation
    op: set-next
    with:
      exit: drafted
      ends: done

  # Put in on that line, off the head for the built-ins in the panel the `+` opens. The built-in that
  # takes a task is not on it: that one stands only where a role starts, put there by the role's own
  # button.
  - type: action
    domain: automation
    op: insert-box
    with:
      after: draft
      exit: drafted
      builtin: wait

  - type: assert
    domain: automation
    op: pictured
    with:
      builtin: wait
      present: true

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: draft
      exit: drafted
      to_builtin: wait

  # And read again from where it stands: the placement's panel opens the same screen, and the
  # placement is now counted on it.
  - type: action
    domain: automation
    op: pick-box
    with:
      builtin: wait

  - type: action
    domain: automation
    op: open-placed

  - type: assert
    domain: automation
    op: builtin-read
    with:
      builtin: wait
      used_by: 1
