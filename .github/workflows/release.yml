name: Release

# Cut a release from PUBLIC CI, not a developer's laptop. A `v*` tag push
# builds every OS's unified installer + CLI on its native runner, then one aggregate
# job uploads them to a GitHub *prerelease* and attaches build provenance
# (attestation) signed with the workflow's keyless OIDC identity. A prerelease is
# downloadable but NOT latest: users keep the previous version until a human verifies
# the real bytes and runs the separate promote job. Building is not shipping —
# nothing here touches what users get.
#
# This is the ONLY place a release is built. It must never run on a merge or branch
# push: only a `v*` tag (the real path) or a manual dispatch (a re-run against a tag).
# The human/AI gate closes BEFORE the tag is pushed.
#
# The native-amd64 Linux GUI bundle and its GUI e2e run in the `linux` job below, so a
# broken tauri/webview hop is caught exactly when it would otherwise ship.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A release must finish once started — never cancel an in-progress run. Group per ref
# so two tags don't serialize against each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the aggregate `release` job widens its own.
permissions:
  contents: read

# The release stamp. Every binary compiled in this workflow — CLI, sidecar CLI, GUI —
# carries `AMENBO_BUILD=release`, and that stamp is what allows a binary to migrate the
# production store forward. It lives HERE and nowhere else: not in the Makefile, not in a
# local `cargo build`, so a working-tree build cannot pass itself off as a distributed one
# and carry real user data past what the released app can open. Losing this line ships
# artifacts that refuse to migrate — the release rehearsal walks that path, so it surfaces
# before users do.
env:
  AMENBO_BUILD: release

jobs:
  macos:
    name: macOS installers (.pkg arm64 + x86_64) + CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # rust-toolchain.toml pins the channel; rustup installs it on first use.
      # macos-latest is Apple Silicon (arm64) — add the Intel target so the Apple
      # toolchain cross-builds the x86_64 slice (no zig needed on macOS).
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Add the Intel mac target
        run: rustup target add x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Standalone CLI binaries (wharfy `prebuilt`): the `script` channel's install.sh
      # and the CLI archives ship these, distinct from the sidecar CLI bundled inside
      # each installer.
      - name: Build the mac CLI (arm64 + x86_64)
        run: |
          mkdir -p dist
          cargo build --release -p amenbo-cli --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/amenbo dist/amenbo-darwin-arm64
          cargo build --release -p amenbo-cli --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/amenbo dist/amenbo-darwin-amd64

      - name: Install GUI deps
        working-directory: app
        run: npm ci

      # Load the Apple Developer ID identities (Application, for the .app; Installer,
      # for the .pkg) into a throwaway keychain. A Developer ID Designated Requirement
      # pins to the TEAM ID rather than to one certificate's hash, so the end user's
      # notification authorization survives both an update and a certificate renewal —
      # which the self-signed identity this replaced could not do (its DR carried the
      # leaf's own hash, so reissuing it reset every grant).
      # MAC_SIGN_RELEASE is derived from the secret's presence rather than hardcoded,
      # so a fork without secrets still builds (ad-hoc, unsigned container).
      - name: Import the mac Developer ID signing identities
        env:
          MAC_SIGN_RELEASE: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 != '' && '1' || '' }}
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/import-signing-cert-mac.sh

      # One unified .pkg per arch: GUI in ~/Applications + the sidecar CLI symlinked
      # onto PATH. tauri's beforeBuildCommand builds the CLI sidecar for the target
      # triple; the Intel build cross-compiles from Apple Silicon.
      # MAC_SIGN_RELEASE makes dist-gui-mac sign the .app (Developer ID Application,
      # hardened runtime + timestamp) and the .pkg (Developer ID Installer); the
      # MAC_NOTARY_* App Store Connect API key then has each notarized and stapled, so
      # Gatekeeper stops warning and validation also succeeds offline. Both are
      # derived from secret presence, so a fork without them still builds unsigned.
      # TAURI_SIGNING_* present → dist-gui-mac also emits the updater artifact
      # (.app.tar.gz + .sig, tar of the signed and STAPLED .app). Absent on a fork → the
      # updater step self-skips, the .pkg still builds. The key is password-protected,
      # so both secrets are required.
      # This is the longest step in the release: notarization is a round trip to Apple
      # per artifact (4 here — .app and .pkg, twice over), each waited on.
      - name: Build the mac installers (.pkg, both archs) — signed + notarized
        env:
          MAC_SIGN_RELEASE: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 != '' && '1' || '' }}
          MAC_NOTARY_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          make dist-gui-mac MAC_GUI_ARCH=arm64
          make dist-gui-mac MAC_GUI_ARCH=amd64

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: |
            dist/amenbo-darwin-arm64
            dist/amenbo-darwin-amd64
            dist/amenbo-darwin-arm64.pkg
            dist/amenbo-darwin-amd64.pkg
            dist/amenbo-darwin-arm64.app.tar.gz
            dist/amenbo-darwin-arm64.app.tar.gz.sig
            dist/amenbo-darwin-amd64.app.tar.gz
            dist/amenbo-darwin-amd64.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux AppImage + amd64 CLI + GUI e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: rustc --version && cargo --version

      # The amd64 CLI is built in the Ubuntu 22.04 container, not on the runner: the runner's glibc
      # is newer than the floor the AppImage sets, and a natively built CLI stops dead with
      # `GLIBC_2.39 not found` on the distributions the GUI beside it still runs on. Docker is
      # preinstalled here and this runner is native amd64. The arm64 CLI is a separate native job
      # (linux-arm-cli) running the same recipe, so nothing here has to cross-compile.
      - name: Build the Linux amd64 CLI
        run: make dist-cli-linux LINUX_CLI_ARCH=amd64

      # The Linux GUI bundle (the AppImage, per-user and self-updating) builds in the
      # shared Docker recipe on this NATIVE amd64 runner, because Apple Silicon can't
      # build amd64 under qemu (the Tauri CLI SIGABRTs). Docker is preinstalled and
      # runs natively here.
      # TAURI_SIGNING_* present → the AppImage stage layers createUpdaterArtifacts and
      # minisign-signs the AppImage in place, emitting the .AppImage.sig updater artifact the
      # GUI self-update path reads. Absent on a fork → the AppImage still builds,
      # just unsigned (no updater artifact), and the manifest step skips linux.
      - name: Build the Linux GUI bundle (AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: make dist-gui-linux LINUX_GUI_ARCH=amd64

      # Run the real AppImage GUI under Xvfb, write to the store from a separate CLI
      # process (the binary built above), and read the board back off the screen: the
      # new card must appear with no interaction. Guards the last hop (tauri's emit
      # reaching the WebKitGTK webview), which only breaks on a tauri/webview upgrade —
      # so gating it at release time is exactly when a broken hop would otherwise ship.
      - name: GUI e2e — an external write must repaint the running webview
        run: make verify-gui-linux
      - name: Upload the e2e screenshots (evidence, pass or fail)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-e2e-linux-amd64
          path: dist/gui-e2e/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: |
            dist/amenbo-linux-amd64
            dist/amenbo-app-linux-x86_64.AppImage
            dist/amenbo-app-linux-x86_64.AppImage.sig
          if-no-files-found: error

  linux-arm-cli:
    name: Linux arm64 CLI
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On an arm64 runner (free for public repos) rather than cross-compiled — no zig, no
      # emulation — and through the same 22.04 container as amd64, so both architectures carry the
      # one glibc floor. arm64 ships the CLI only (the `script` channel + CLI archive); there is no
      # arm64 Linux GUI bundle.
      - name: Build the Linux arm64 CLI
        run: make dist-cli-linux LINUX_CLI_ARCH=arm64

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-arm
          path: dist/amenbo-linux-arm64
          if-no-files-found: error

  windows:
    name: Windows installer (NSIS) + CLI
    runs-on: windows-latest
    # The store is SQLCipher-encrypted, so rusqlite's bundled-sqlcipher-vendored-openssl
    # builds OpenSSL from source, and openssl-src configures it by shelling out to perl.
    # Steps that run under git-bash resolve `perl` to MSYS2's, which lacks
    # Locale::Maketext::Simple and dies in ./Configure — so name the runner's Strawberry
    # Perl, which openssl-src reads ahead of PERL and PATH.
    env:
      OPENSSL_SRC_PERL: C:/Strawberry/perl/bin/perl.exe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The perl check fails in seconds if the image ever moves Strawberry Perl; without it
      # a bad path only surfaces once the OpenSSL build gets that far.
      - name: Show toolchain
        run: |
          rustc --version && cargo --version
          & $env:OPENSSL_SRC_PERL --version

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Native MSVC build of the standalone CLI (wharfy `prebuilt`).
      - name: Build the Windows CLI
        shell: bash
        run: |
          mkdir -p dist
          cargo build --release -p amenbo-cli
          cp target/release/amenbo.exe dist/amenbo-windows-amd64.exe

      - name: Install GUI deps
        working-directory: app
        run: npm ci

      # The unified NSIS installer (GUI + sidecar CLI, which the NSIS hook puts on
      # PATH) builds natively — Tauri's Windows bundle can't be cross-built (WebView2 /
      # NSIS / Authenticode all expect Windows). tauri's beforeBuildCommand builds the
      # CLI sidecar; the installer is unsigned (SmartScreen's first-run warning
      # is accepted).
      # -c src-tauri/updater.conf.json layers createUpdaterArtifacts over tauri.conf.json for this
      # build alone (kept out of the committed config so keyless dev builds never require the key),
      # so tauri also emits the signed updater artifact. With createUpdaterArtifacts: true (not the
      # "v1Compatible" zip form) that artifact is the bare installer itself (*-setup.exe + .exe.sig),
      # so the Windows updater target and the distributed installer are the same file. The key is
      # password-protected, so both secrets are required.
      - name: Build the Windows installer (NSIS)
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis -c src-tauri/updater.conf.json

      # Copy the produced installer and its updater signature to stable, release-declared names.
      # The installer .exe doubles as the Windows updater artifact, so its detached .exe.sig rides
      # alongside; there is no separate .nsis.zip under createUpdaterArtifacts: true.
      - name: Collect the installer + updater artifact under their release names
        shell: bash
        run: |
          cp app/src-tauri/target/release/bundle/nsis/*setup.exe dist/amenbo-app-windows-x64-setup.exe
          cp app/src-tauri/target/release/bundle/nsis/*setup.exe.sig dist/amenbo-app-windows-x64-setup.exe.sig

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/amenbo-windows-amd64.exe
            dist/amenbo-app-windows-x64-setup.exe
            dist/amenbo-app-windows-x64-setup.exe.sig
          if-no-files-found: error

  release:
    name: Prerelease + attest provenance
    needs: [macos, linux, linux-arm-cli, windows]
    runs-on: ubuntu-latest
    # id-token + attestations let wharfy sign build provenance with the workflow's
    # keyless OIDC identity (no secret to register); contents lets it write the GitHub
    # release. Stripping these is caught red below, not shipped unattested.
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # wharfy reads the version from the git tag

      # Reassemble every runner's output into dist/ at the paths wharfy.yaml names.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Show the assembled dist/
        run: ls -l dist

      # wharfy's own install script; the ubuntu runner carries no Homebrew. It installs
      # per-user under $HOME/.local, which needs no elevation but is not on PATH yet.
      # Because amenbo feeds BYO inputs (prebuilt: / bundle:), `wharfy build` never calls
      # goreleaser, so nothing else needs installing.
      - name: Install wharfy
        run: |
          curl -fsSL https://github.com/ShiroDoromoto/wharfy/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # build packages the prebuilt CLIs + installers into release assets; sign is a
      # no-op (nothing here signs for distribution) kept for pipeline shape; release
      # uploads them as a PRERELEASE and attaches provenance. A prerelease is
      # downloadable but not latest — users are untouched until the promote job
      # flips it.
      #
      # The permissions above mean provenance IS attached. If someone strips them,
      # wharfy only WARNS (attest_unavailable) and still uploads — so turn that warning
      # red here (never ship unattested).
      - name: Release as a prerelease + attest provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wharfy build
          wharfy sign
          # --yes is what makes this an upload: without it wharfy prints the plan and
          # exits 0, so the job goes green having shipped nothing.
          wharfy release --yes --prerelease 2>&1 | tee release.log
          if grep -qi 'attest_unavailable' release.log; then
            echo "::error::build provenance was not attached (attest_unavailable): the release job is missing id-token/attestations write permission" >&2
            exit 1
          fi

      # The automatic update fetches its own copy of the Windows and Linux installers, under a name no
      # new install ever asks for, so the two audiences land on two assets. GitHub reports one download
      # count per asset: an asset both audiences pull reports a sum, and a sum cannot be split back into
      # its parts afterwards. The bytes and the detached minisign signature are copied unchanged — a
      # signature covers content, so it still verifies, and the copy's .sig matching the new-install
      # one is what says the two are the same build. macOS needs no copy: a new install there is the
      # .pkg, so its .app.tar.gz already carries updates alone.
      - name: Copy the GUI installers to their update-download names
        run: |
          set -euo pipefail
          pairs=(
            "amenbo-app-windows-x64-setup.exe:amenbo-app-windows-x64-setup-update.exe"
            "amenbo-app-linux-x86_64.AppImage:amenbo-app-linux-x86_64-update.AppImage"
          )
          for pair in "${pairs[@]}"; do
            src="dist/${pair%%:*}"
            dst="dist/${pair#*:}"
            cp "$src" "$dst"
            cp "${src}.sig" "${dst}.sig"
            echo "→ ${dst} (+ .sig)"
          done

      # The CLI archives split the same way, for the same reason: install.sh fetches one and `amenbo
      # update --apply` fetches the other, and one asset cannot report both. They are packaged by
      # wharfy straight onto the release — dist/ holds the bare binaries it packaged, not the archives
      # — so the copies are taken back off the release that was just made. Their names come from the
      # release rather than being spelled here, leaving wharfy the one that decides how an archive is
      # named. The names are handed to the verify step below through a file, so both read one list.
      - name: Copy the CLI archives to their update-download names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*')"
          fi
          mkdir -p dist/cli-update
          mapfile -t archives < <(gh release view "$TAG" --json assets \
            --jq '.assets[].name | select(test("^amenbo_.*\\.(tar\\.gz|zip)$")) | select(test("-update\\.") | not)')
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no CLI archive on ${TAG} to copy — wharfy uploaded none" >&2
            exit 1
          fi
          : >cli-update-names.txt
          uploads=()
          for name in "${archives[@]}"; do
            gh release download "$TAG" --pattern "$name" --dir dist/cli-update --clobber
            case "$name" in
              *.tar.gz) dst="${name%.tar.gz}-update.tar.gz" ;;
              *.zip)    dst="${name%.zip}-update.zip" ;;
              *)        echo "::error::unexpected CLI archive name: ${name}" >&2; exit 1 ;;
            esac
            cp "dist/cli-update/${name}" "dist/cli-update/${dst}"
            uploads+=("dist/cli-update/${dst}")
            echo "$dst" >>cli-update-names.txt
            echo "→ ${dst}"
          done
          gh release upload "$TAG" "${uploads[@]}" --clobber

      # The GUI self-update path (tauri-plugin-updater) reads a Tauri-schema manifest that is NOT
      # wharfy's latest.json — assemble it from the per-OS updater artifacts' signatures and attach
      # it, plus the updater artifacts themselves, onto the same prerelease. wharfy uploads only what
      # wharfy.yaml declares, so these ride alongside via gh (amenbo owns its updater manifest;
      # wharfy stays a generic distributor). The tag resolves the same way the verify step does.
      - name: Attach the Tauri updater artifacts + manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*')"
          fi
          scripts/build-tauri-manifest.sh "$TAG" dist
          gh release upload "$TAG" \
            dist/amenbo-darwin-arm64.app.tar.gz dist/amenbo-darwin-arm64.app.tar.gz.sig \
            dist/amenbo-darwin-amd64.app.tar.gz dist/amenbo-darwin-amd64.app.tar.gz.sig \
            dist/amenbo-app-windows-x64-setup.exe.sig \
            dist/amenbo-app-windows-x64-setup-update.exe dist/amenbo-app-windows-x64-setup-update.exe.sig \
            dist/amenbo-app-linux-x86_64.AppImage.sig \
            dist/amenbo-app-linux-x86_64-update.AppImage dist/amenbo-app-linux-x86_64-update.AppImage.sig \
            dist/latest-tauri.json \
            --clobber

      # wharfy attests everything IT uploads, but the updater artifacts above ride via gh, so wharfy
      # never sees them — leaving them the only release assets without build provenance. wharfy verify
      # (and the weekly rot check) flags any partly-attested release red (attest_unverified), so attest
      # these here too, with the same keyless OIDC identity, bound to the exact bytes just uploaded.
      # (What a new install downloads on Windows and Linux — the setup.exe and the AppImage — is a
      # wharfy-declared bundle and is already attested; what rides via gh is each one's detached .sig
      # and the update-named copy, so those are the ones listed here.)
      - name: Attest the gh-attached updater artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/amenbo-darwin-arm64.app.tar.gz
            dist/amenbo-darwin-arm64.app.tar.gz.sig
            dist/amenbo-darwin-amd64.app.tar.gz
            dist/amenbo-darwin-amd64.app.tar.gz.sig
            dist/amenbo-app-windows-x64-setup.exe.sig
            dist/amenbo-app-windows-x64-setup-update.exe
            dist/amenbo-app-windows-x64-setup-update.exe.sig
            dist/amenbo-app-linux-x86_64.AppImage.sig
            dist/amenbo-app-linux-x86_64-update.AppImage
            dist/amenbo-app-linux-x86_64-update.AppImage.sig
            dist/cli-update/*-update.tar.gz
            dist/cli-update/*-update.zip
            dist/latest-tauri.json

      # A green release job is not proof of a release. If wharfy ever prints its plan
      # and exits 0 without uploading (a real near-miss once left 5 jobs green and 0
      # releases), nothing above catches it — attest_unavailable stays silent when
      # there is no upload at all. So measure the actual result off the GitHub API: the
      # prerelease must exist, be live (not draft) and flagged prerelease (not latest),
      # and carry every installer wharfy.yaml declares plus latest.json. Any gap is red.
      - name: Verify the prerelease actually shipped (exists, complete, prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*')"
          fi
          echo "Verifying the release for tag: $TAG"

          # gh api 404s (non-zero) when no release exists for the tag — that alone
          # catches "green but shipped nothing".
          rel="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          if [ "$(jq -r '.draft' <<<"$rel")" != "false" ]; then
            echo "::error::release ${TAG} is a draft — it is not downloadable" >&2
            exit 1
          fi
          if [ "$(jq -r '.prerelease' <<<"$rel")" != "true" ]; then
            echo "::error::release ${TAG} is not a prerelease — it would be served as latest to every user before verification" >&2
            exit 1
          fi

          # Expected installers = the bundles wharfy.yaml declares (its block is the
          # file's last top-level key, so it runs to EOF), by basename, plus wharfy's
          # latest.json update manifest. Derived here so the two stay one source of truth.
          mapfile -t expected < <(awk '/^bundle:/{f=1} f' wharfy.yaml \
            | grep -oE 'path: dist/[^ }]+' | sed 's|.*/||')
          expected+=("latest.json")
          # The Tauri updater artifacts + manifest attached alongside (gh, not wharfy).
          expected+=(
            "amenbo-darwin-arm64.app.tar.gz" "amenbo-darwin-arm64.app.tar.gz.sig"
            "amenbo-darwin-amd64.app.tar.gz" "amenbo-darwin-amd64.app.tar.gz.sig"
            "amenbo-app-windows-x64-setup.exe.sig"
            "amenbo-app-windows-x64-setup-update.exe" "amenbo-app-windows-x64-setup-update.exe.sig"
            "amenbo-app-linux-x86_64.AppImage.sig"
            "amenbo-app-linux-x86_64-update.AppImage" "amenbo-app-linux-x86_64-update.AppImage.sig"
            "latest-tauri.json"
          )
          # The update-named CLI archives, as the copy step recorded them (wharfy names the originals,
          # so spelling them a second time here would be a second source of truth for the same names).
          mapfile -t cli_updates <cli-update-names.txt
          expected+=("${cli_updates[@]}")

          assets="$(jq -r '.assets[].name' <<<"$rel")"
          echo "Release assets:"; echo "$assets"

          missing=0
          for name in "${expected[@]}"; do
            if ! grep -qxF "$name" <<<"$assets"; then
              echo "::error::release ${TAG} is missing the expected asset: ${name}" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
