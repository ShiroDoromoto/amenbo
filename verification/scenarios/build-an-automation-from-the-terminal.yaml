# A definition is built at the terminal and read back at the terminal. Building one is three layers of
# rows that mean nothing apart — an automation places library actions, an action holds
# steps, and a step is one terminal — handed over an id at a time, and a reader who could only see
# what they had built by opening a build screen would be building blind. An AI would carry what it
# built in the conversation alone, with nothing for the next session to pick up. So the road that
# builds one is the road that reads it, in the two layers it was built in: `automation show` for the
# placements on the automation, and `automation action-show` for the steps inside one action.
id: build-an-automation-from-the-terminal
title: An automation built at the terminal is read back whole at the terminal, one layer at a time
description: >
  Write two library actions — one of two steps joined inside it, one of a single step — place both
  on an automation, and read the definition back. The two listings come first: what is there, and how
  far a rewrite of an action would carry. Then the automation's layer: each placement with the ways
  out, the inputs and the settings its action declares, the setting this placement answered beside
  the one it left, and where each way out takes the run. Then the action's layer: its steps with
  their prompts, and the line that carries the second step out by the action's own way out. A box
  nobody built is asked for on both layers, since a read that answered every name it was given would
  read as green off the present half alone.

steps_cli:
  # The first action. It is born empty, and what it holds is two steps: one that looks for the task
  # and one that takes it.
  - type: action
    domain: automation
    op: action-add
    with: { name: SCENARIO SEED — take }
    as: take

  - type: action
    domain: automation
    op: step-add
    with: { target: take, name: look, agent: claude-code, prompt: look for the next task }
    as: look
  - type: action
    domain: automation
    op: exit-add
    with: { step: look, name: found }
  - type: action
    domain: automation
    op: port-add
    with: { step: look, name: brief, kind: value, required: true }

  - type: action
    domain: automation
    op: step-add
    with: { target: take, name: claim, agent: claude-code, prompt: take the task you found }
    as: claim
  - type: action
    domain: automation
    op: exit-add
    with: { step: claim, name: got one }
    as: claim_got_one
  - type: action
    domain: automation
    op: port-add
    with: { target: claim_got_one, name: note, kind: value, required: true }
  - type: action
    domain: automation
    op: action-entry
    with: { target: take, step: look }

  # What the action says to the automations placing it: a way out of its own and what leaving by it
  # hands on, an input, and two settings.
  - type: action
    domain: automation
    op: exit-add
    with: { action: take, name: got one }
    as: take_got_one
  - type: action
    domain: automation
    op: port-add
    with: { target: take_got_one, name: task, kind: task_take, required: true }
  - type: action
    domain: automation
    op: port-add
    with: { target: take_got_one, name: note, kind: value, required: true }
  - type: action
    domain: automation
    op: port-add
    with: { action: take, name: brief, kind: value, required: true }
  - type: action
    domain: automation
    op: cfg-add
    with: { action: take, name: how many, kind: number, required: true }
  - type: action
    domain: automation
    op: cfg-add
    with: { action: take, name: where to work, kind: folder }

  # And what joins the two layers inside it: the first step goes on to the second, the second leaves
  # by the action's own way out, and what each end needs crosses the edge of the action — the input
  # in, and the note out.
  - type: action
    domain: automation
    op: edge-add
    with: { in_action: true, target: look, exit: found, to: claim }
  - type: action
    domain: automation
    op: edge-add
    with: { in_action: true, target: claim, exit: got one, exit_to: got one }
  - type: action
    domain: automation
    op: wire-add
    with: { in_action: true, from_port: brief, to: look, to_port: brief }
  - type: action
    domain: automation
    op: wire-add
    with: { in_action: true, target: claim, exit: got one, from_port: note, to_port: note }

  # The second action, of one step. What it takes in is its own, and nothing about the wire that
  # fills it on the automation changes what it declares.
  - type: action
    domain: automation
    op: action-add
    with: { name: SCENARIO SEED — review }
    as: review
  - type: action
    domain: automation
    op: step-add
    with: { target: review, name: read, agent: claude-code, prompt: read what was written }
    as: read
  - type: action
    domain: automation
    op: action-entry
    with: { target: review, step: read }
  - type: action
    domain: automation
    op: port-add
    with: { action: review, name: note, kind: value, required: true }

  - type: action
    domain: automation
    op: create
    with: { name: "SCENARIO SEED — one task, two actions" }
    as: auto

  # Listed before anything is placed on it, which is the state the count is read for: a row says what
  # this is, and whether there is anything on it yet.
  - type: assert
    domain: automation
    op: listed
    with: { target: auto, placements: 0, present: true }

  - type: action
    domain: automation
    op: place-add
    with: { target: auto, action: take }
    as: at_take
  - type: action
    domain: automation
    op: place-add
    with: { target: auto, action: review }
    as: at_review
  - type: action
    domain: automation
    op: entry
    with: { target: auto, placement: at_take }

  # The one answer written while building. It is the placement's, not the action's: another
  # automation placing the same action answers it again.
  - type: action
    domain: automation
    op: cfg-set
    with: { target: at_take, name: how many, number: 3 }

  - type: action
    domain: automation
    op: edge-add
    with: { target: at_take, exit: got one, to: at_review }
  - type: action
    domain: automation
    op: edge-add
    with: { target: at_review }
  - type: action
    domain: automation
    op: wire-add
    with: { target: at_take, exit: got one, from_port: note, to: at_review, to_port: note }

  # Built, and the row says so. A definition that had lost its placements would still be listed, so
  # the count is the half worth asking for.
  - type: assert
    domain: automation
    op: listed
    with: { target: auto, placements: 2, present: true }

  # The library row, and the number a rewrite of the action would carry to. It is counted in
  # automations and not in placements, and this project's shelf is where it was put.
  - type: assert
    domain: automation
    op: action-listed
    with: { target: take, steps: 2, used_by: 1, reach: project }

  # The automation's layer. The ways out are the two the action is born with — the unnamed one and
  # the error one — and the one it declared; the setting answered on this placement reads back as the
  # number that was written, and the one nobody answered reads back as unanswered, which is a state of
  # its own rather than an empty answer.
  - type: assert
    domain: automation
    op: placement-read
    with:
      target: auto
      name: SCENARIO SEED — take
      exits: ["", "*", got one]
      inputs: [brief]
      settings: { how many: 3, where to work: ~ }

  - type: assert
    domain: automation
    op: placement-read
    with:
      target: auto
      name: SCENARIO SEED — review
      exits: ["", "*"]
      inputs: [note]
      settings: {}

  # A placement nobody made.
  - type: assert
    domain: automation
    op: placement-read
    with: { target: auto, name: SCENARIO SEED — publish, present: false }

  # Where each way out takes the run on the automation. The first is named, which is what says a
  # reader can tell one of an action's ways out from another; the last closes the run.
  - type: assert
    domain: automation
    op: edge-read
    with: { target: auto, from: SCENARIO SEED — take, exit: got one, to: SCENARIO SEED — review }
  - type: assert
    domain: automation
    op: edge-read
    with: { target: auto, from: SCENARIO SEED — review, ends: done }

  # The action's layer. Each step carries the prompt it was written with, and declares what it
  # declares of its own — which is not what the action declares to the automations placing it.
  - type: assert
    domain: automation
    op: step-read
    with:
      target: take
      name: look
      prompt: look for the next task
      exits: ["", "*", found]
      inputs: [brief]
  - type: assert
    domain: automation
    op: step-read
    with:
      target: take
      name: claim
      prompt: take the task you found
      exits: ["", "*", got one]
      inputs: []
  - type: assert
    domain: automation
    op: step-read
    with: { target: take, name: publish, present: false }

  # The two lines inside it: on from the first step to the second, and out of the action by its own
  # way out — the line that makes what a step does reach the placement around it.
  - type: assert
    domain: automation
    op: edge-read
    with: { target: take, in_action: true, from: look, exit: found, to: claim }
  - type: assert
    domain: automation
    op: edge-read
    with: { target: take, in_action: true, from: claim, exit: got one, exit_to: got one }
