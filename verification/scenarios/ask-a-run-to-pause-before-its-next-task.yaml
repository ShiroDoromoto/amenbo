# Pausing one run waits for the action under way to end, and an action can be half of one task. The
# other pause stops a run at the seam between tasks: it goes on until it next comes to the built-in
# that takes one, and pauses there with no task in hand. A role started by a task starts its round at
# that built-in; a run of a role started by a trigger takes no task, and pauses instead where it comes
# back to where its round starts.
#
# A run started at a terminal opens no step, so neither pause settles here: the run stays `running`
# with the request on it. What the road reads is that the run carries it.
id: ask-a-run-to-pause-before-its-next-task
title: A run that takes tasks is asked to pause before its next task, and carries the request
description: >
  Start a run of an automation that takes tasks and ask it to pause before its next task. The run
  carries the request and is still running.
given:
  # Two rather than one for `hold-a-run-and-let-it-go-again`'s reason: the premise cannot stand up a
  # row shorter than two.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }

  # The task the run takes. A start with no task to take opens no run, so one is handed to the AI.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run takes before it is asked }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }

  # The automation that takes tasks.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that takes tasks" }, as: taking }
  - { type: action, domain: automation, op: place-add, with: { target: taking, builtin: take_task, starts: true }, as: at_take }
  # The task is the born role's, whose round starts there: a run takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed, role_of: taking } }
  - { type: action, domain: automation, op: place-add, with: { target: taking, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_cli:
  # A run's steps are opened by the app, so a run is started with one up on the store.
  - { type: action, domain: store, op: app-up }
  # A run starts from the newest saved version, so it is saved first.
  - { type: action, domain: automation, op: save, with: { target: taking } }

  - type: action
    domain: automation
    op: start
    with:
      target: taking
    as: taking_run

  - type: assert
    domain: automation
    op: run
    with:
      target: taking_run
      status: running
      pause_before_next_task: false

  - type: action
    domain: automation
    op: pause-before-next-task
    with:
      target: taking_run

  # Asked, and still running: the pause waits for the built-in that takes a task. It is not the
  # pause at the end of the action, which is a request of its own.
  - type: assert
    domain: automation
    op: run
    with:
      target: taking_run
      status: running
      pause_before_next_task: true
      pause_requested: false
