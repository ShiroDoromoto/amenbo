# Finding where a word is written. A listing answers which records match; this answers which places
# carry the word, which is the question anyone holding half a memory of something actually asks — and
# since words left the filter grammar, this is the only place they go. The line holds the five faces a
# reader lands on (a title, a body, a remark on it, a label it was filed under, the name of what is
# attached), the folding that decides what counts as a match at all, the narrowings, and what each row
# says about where the record it points at stands. The screen's road asks the row two things more, both
# of them things only it draws: which of the four places it calls itself, and where the words are marked
# inside its excerpt.
id: find-where-a-word-is-written
title: A word leads to the places it is written — a title, a body, a comment, a label, an attachment — and the narrowings leave the rest out
description: >
  Write one word into a task's title, another into its notes and a third into a comment on it, and
  write the first word into a decision as well. Then ask for each word and check the face it comes
  back on. What is under test is that the answer names the place: a search that returned the right
  record on the wrong face, or that quietly returned everything, reads as a green list either way, so
  every arm names the face it expects and every narrowing is asserted from both sides. The row is asked
  one thing more — where the record it points at stands — because a place in work that is over is a
  different answer from a place in work still to be taken, and the ref says neither.
# The record both roads write their words onto. Filing it is nothing this scenario asks about — the
# question is where a word is written, not how work gets onto a board — and standing it up is what
# gets the screen open at all: an untouched store has no project, so there is no board to walk this
# on, and no card to open for the remark the road writes onto it.
#
# The neighbouring project and the two records filed in it are here for the same reason: what the last
# narrowing on either road needs is something to leave out, and raising a project and filing work in it
# are roads of their own. The screen's road needs them stood up for one more reason. A board with
# nothing on it draws the first loop and no way to add a card — that is the board's own decision, and
# the graduation is meant to happen by itself when the first task lands — so a road that raised this
# project itself would then be asking an operator to put a card on a board that offers no way to.
#
# The two files are here for the same reason and one more. A screen road cannot make a file — hanging
# one is a move on a record, and the bytes have to be lying somewhere already — so the road that hangs
# these was asking an operator to attach what nothing had written. What they hold does not matter:
# what a search reaches of an attachment is what it is called, never its bytes.
given:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the retention window
    as: window

  - type: action
    domain: task
    op: finish-creating
    with:
      target: window

  - type: action
    domain: project
    op: create
    with:
      name: scenario-elsewhere
    as: elsewhere

  # Its title is written so that neither record's title holds the other's inside it. The screen's road
  # is judged by reading the shot back, and a reading is a substring: a neighbour named as an extension
  # of the record above would leave the step that asks for it to be gone unable to say it is, whatever
  # the screen actually drew.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — retention, filed elsewhere
      project: elsewhere
    as: exile

  - type: action
    domain: task
    op: finish-creating
    with:
      target: exile

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — retention, decided elsewhere
      project: elsewhere
    as: exile_why

  - type: action
    domain: repo
    op: write-file
    with:
      path: throughput.log
      content: "one\n"

  - type: action
    domain: repo
    op: write-file
    with:
      path: handover.log
      content: "one\n"

steps_cli:
  - type: action
    domain: task
    op: update
    with:
      target: window
      notes: the window is measured in days, never in rows

  - type: action
    domain: task
    op: comment
    with:
      target: window
      text: the sweep runs nightly

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — retention of the outbox
    as: outbox

  # The three faces of one record. Each word was written in exactly one of them, so a search that
  # answered on the wrong face would be caught here rather than read as a hit.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      face: body

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      face: comment

  # The same word, written on another record entirely: a search crosses the two sides, and reaching
  # a decision is not something a task listing could do at all.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      face: title

  # Past the bodies, onto what a person named rather than wrote: the label a task was filed under, the
  # axis that label belongs to, and the name of what is attached to it. None of that text is held on the
  # task, so each is the join under test — and the task filed under neither stays out.
  - type: action
    domain: dimension
    op: create
    with:
      name: surface

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: surface
      value: typography

  - type: action
    domain: dimension
    op: set
    with:
      target: window
      dimension: surface
      value: typography

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the one filed under nothing
    as: bystander

  - type: action
    domain: repo
    op: write-file
    with:
      path: measurements.log
      content: "one\n"

  - type: action
    domain: task
    op: attach
    with:
      target: bystander
      file: measurements.log
      name: the latency measurements

  - type: assert
    domain: task
    op: found
    with:
      words: typography
      target: window
      face: label

  - type: assert
    domain: task
    op: found
    with:
      words: surface
      target: window
      face: label

  - type: assert
    domain: task
    op: found
    with:
      words: typography
      target: bystander
      present: false

  - type: assert
    domain: task
    op: found
    with:
      words: measurements
      target: bystander
      face: attachment

  - type: assert
    domain: task
    op: found
    with:
      words: measurements
      target: window
      present: false

  # The words are matched on a folded copy, so one reaches the place it is written however it was
  # typed — width and case are not differences anyone means by them.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — ＧＡＭＭＡ, the one spelled the wide way
    as: gamma

  - type: assert
    domain: task
    op: found
    with:
      words: gamma
      target: gamma
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: RETENTION
      target: window
      face: title

  # Words are ANDed over the RECORD, not over one face: the title carries the first word and the
  # comment the second, and the title is still a place the reader is sent to.
  - type: assert
    domain: task
    op: found
    with:
      words: retention nightly
      target: window
      face: title

  # A word nobody wrote leaves nothing standing, however much of the query the record does carry.
  - type: assert
    domain: task
    op: found
    with:
      words: retention unwritten
      target: window
      present: false

  # `--kind` keeps one side: the decision is out of a search narrowed to tasks.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      present: false

  # `--face` is the other axis: which face of the record the words are on. The word written in the
  # notes is still a place when the search is narrowed to the body, and nowhere when it is narrowed to
  # the title — the record carries the word either way, so a narrowing that did nothing would read as
  # green without the second half.
  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      only_face: body
      face: body

  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      only_face: title
      present: false

  # The two axes are judged apart, so naming both asks for their product — the remarks on decisions,
  # which neither axis alone can reach. The same word is written on a remark on each side, and the
  # pair keeps the decision's while the task's falls away.
  - type: action
    domain: decision
    op: comment
    with:
      target: outbox
      text: the sweep was agreed to here

  - type: assert
    domain: decision
    op: found
    with:
      words: sweep
      target: outbox
      kind: decision
      only_face: comment
      face: comment

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      kind: decision
      only_face: comment
      present: false

  # Several words and a side, together. Words are ANDed over the record, and that question is only put
  # when there is more than one of them — so it is the pair that reaches the crossing: one word never
  # asks it, and naming no side asks it of both. Each side is walked from the side that keeps it, and
  # once from the side that does not, because a crossing that answered nothing at all would read as
  # green from the negative half alone.
  - type: assert
    domain: task
    op: found
    with:
      words: retention nightly
      target: window
      kind: task
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention sweep
      target: outbox
      kind: decision
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention nightly
      target: window
      kind: decision
      present: false

  # Past where the words are, to what the record carrying them is. A row that says only the ref sends
  # the reader off to `show` for the very thing they were about to ask — is this place work still to be
  # taken, or work that is over — so both answers are asked for, and the decision is asked in its own
  # vocabulary rather than the task's.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the retention pass that already ran
    as: ran

  - type: action
    domain: task
    op: finish-creating
    with:
      target: ran

  - type: action
    domain: task
    op: done
    with:
      target: ran

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: ran
      standing: done

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      standing: todo

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      standing: proposed

  # `--filter` is read in the grammar of the side named beside it, and each side has its own: the task
  # list's keys narrow the tasks, the decision list's narrow the decisions. Both halves are walked,
  # because a narrowing that reached only one side would read as green from either one alone.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      kind: task
      filter: "status:todo"
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      filter: "status:todo"
      present: false

  # The other grammar, on the other side. `status:proposed` is a decision's word — a task has no such
  # status — and the decision comes back on it, which is the whole of what this narrowing was for.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: decision
      filter: "status:proposed"
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: decision
      filter: "status:accepted"
      present: false

  # `--project` is the other narrowing, and deliberately not a key of that grammar: a project is an
  # axis both sides carry, so scoping to one has to leave the decisions standing where the filter above
  # took them out. Both halves are asserted — the neighbour's rows fall away, and the decision of the
  # project asked for does not. The neighbour it reads across is the one the premise stood up.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: exile
      present: true

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: exile
      project: elsewhere
      face: title

  # The half the filter cannot do: the scope keeps the decision of the project asked for.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: exile_why
      project: elsewhere
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      project: elsewhere
      present: false

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      project: elsewhere
      present: false

# The same goal reached on the screen that answers it. The road is shorter than the terminal's, and cut
# on what a reading can settle rather than on what matters less: a hit row leads with the record it
# belongs to whichever face the words were on, so the screen says which records the words reach, and the
# face is named in each step for the eye that closes it. That is also why every step that asks for
# something to be missing asks it of the whole record — a word narrowed off one face still draws the
# other faces' rows, and the title with them.
steps_gui:
  - type: action
    domain: task
    op: update
    with:
      target: window
      notes: the window is measured in days, never in rows

  # Bound, because the road comes back to this remark at the end to hang something off it: an
  # attachment is the one face that lands on a record and on a remark alike.
  - type: action
    domain: task
    op: comment
    with:
      target: window
      text: the sweep runs nightly
    as: nightly

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — retention of the outbox
    as: outbox

  # A remark on the other side, so all four of the places a hit can be on are written somewhere on this
  # road. Its word is its own: what the rows are asked at the end is which place each one names, and a
  # word two of them carried would leave the reader with nothing to tell those two rows apart by.
  - type: action
    domain: decision
    op: comment
    with:
      target: outbox
      text: the queue is drained at dawn

  # One word per face. Each was written in exactly one of the three, so the record coming back for all
  # three is the screen reaching every face a card of its own would never show.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      face: body

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      face: comment

  # The crossing to the other side, which is what makes this a screen of its own rather than a board's
  # search box: a decision has no card on any board.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention unwritten
      target: window
      present: false

  # The narrowings the screen draws its own controls for — one row of chips for which record, a second
  # for which of its faces, and the box that takes that side's own grammar. Each takes something out of
  # an answer it was in a step ago, and the box is read in whichever grammar the chips beside it name.
  # The scope is the fourth, and comes at the end of the road because it needs a second project first.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      present: false

  # The second row, on its own: the words are written on this task's title and on a remark on it, and
  # asking for remarks alone leaves only the second.
  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      only_face: comment
      face: comment

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      only_face: comment
      present: false

  # Both rows at once — the question one row of chips could not put, since picking the face gave up the
  # side. It is asked here of the pairing that has an answer, and of the one that cannot.
  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      kind: task
      only_face: comment
      face: comment

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      kind: decision
      only_face: comment
      present: false

  # Several words and a side chip together. The screen ANDs the words over the record the same way the
  # terminal does, and that question is only put when there is more than one of them — so the chip and
  # the second word cross here and nowhere else on this road. Both sides are kept once and dropped once.
  - type: assert
    domain: task
    op: found
    with:
      words: retention sweep
      target: window
      kind: task
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention drained
      target: outbox
      kind: decision
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention sweep
      target: window
      kind: decision
      present: false

  # The third control, before anything is written into it. Its grammar follows the side, so with no side
  # chosen there is none for the words to be read in and the box takes nothing at all. The steps under
  # this one are the other half: each types into that same box, having named a side first — so a build
  # that let it be typed into either way walks every one of them and is caught only here.
  - type: assert
    domain: task
    op: narrowing-shut

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      kind: task
      filter: "status:todo"
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      filter: "status:todo"
      present: false

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: decision
      filter: "status:proposed"
      face: title

  # What the row says about the record it points at, past the ref and the title. Each side is asked for
  # its own vocabulary — a task's state is not a decision's — because the row reads them out of two
  # dictionaries and a build that crossed them would still draw a line here. The CLI walked the same
  # ground above; this is the half only an eye can close, the row being the screen's own.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      face: title
      standing: todo

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      face: title
      standing: proposed

  # The fourth control, and the only one the screen offers as a choice rather than as an expression: a
  # project is one finite list of names, the same for both sides. The second project the premise stood
  # up is what there is to choose between, and it holds a record of each kind — so the pull-down has a
  # neighbour to name, and naming it has something to keep as well as something to drop.
  #
  # Both halves, because a scope that did nothing would read as green from either one alone: the
  # neighbour's rows fall away, and the rows of the project asked for stay.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: exile
      project: elsewhere
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      project: elsewhere
      present: false

  # The half the narrowing box cannot do at all. Written into that box a project would take the
  # decisions out of the answer as the side effect of being named, which is the whole reason it is a
  # pull-down of its own.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: exile_why
      project: elsewhere
      face: title

  # What each row actually draws, which is the half a pipe cannot carry. Two things are asked of it at
  # once: which of the four places it calls itself, and whether the words are marked where they landed
  # inside the excerpt. Both go wrong on one token — a dictionary key crossed and the row still reads,
  # in the wrong words; a style dropped and the excerpt still reads, with nothing lit inside it — so a
  # gate that never looked at the row would stay green through either.
  #
  # All four places are walked, because the row's wording is the only thing that tells them apart: the
  # ref says which side and nothing about a remark, and the face says "attachment" of one hung on a
  # record and one hung on a remark alike.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      face: title
      landed_on: task
      marked: retention

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      face: comment
      landed_on: task-comment
      marked: sweep

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      face: title
      landed_on: decision
      marked: retention

  - type: assert
    domain: decision
    op: found
    with:
      words: drained
      target: outbox
      face: comment
      landed_on: decision-comment
      marked: drained

  # The pair the face cannot separate at all. An attachment hangs off a record or off a remark on one,
  # and the row says "attachment" of both — so which of the two it is is read off the place the row
  # names and nowhere else. Two files, because one hung twice would leave the two rows telling apart by
  # nothing but their place, which is the very reading under test.
  - type: action
    domain: task
    op: attach
    with:
      target: window
      file: throughput.log

  - type: action
    domain: comment
    op: attach
    with:
      target: nightly
      file: handover.log

  - type: assert
    domain: task
    op: found
    with:
      words: throughput
      target: window
      face: attachment
      landed_on: task
      marked: throughput

  - type: assert
    domain: task
    op: found
    with:
      words: handover
      target: window
      face: attachment
      landed_on: task-comment
      marked: handover
