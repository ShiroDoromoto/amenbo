# A step's terminal used to be ended only when the next step opened, so the last step of a run stood
# on after the run was over: the agent waiting for input, still allowed the commands a step may type,
# over a task the run had already handed back. Now Amenbo ends the terminal of a run that is over, on
# the next look the thread that keeps runs going takes (`app/src-tauri/src/automation_watch.rs`).
#
# The report is typed in the pane itself, which is another process to the app: the one road on which
# nothing inside the app hears the run end, and the look is what finds it. The way out it takes calls
# a person, so the run ends there rather than going on to a built-in, which would end the terminal
# the old way and prove nothing.
id: see-a-run-pane-stop-taking-lines-once-the-run-is-over
title: Once a run is over, the program in its last step's pane is ended too
description: >
  Start a run that takes a task with the built-in and then opens one step, whose done way out stops
  for a person. In the pane the run is drawn in, report the step done. The run fails there, halted,
  and within seconds the program in that pane has ended: its last lines stay, and a line typed at it
  is not answered.
given:
  # `runs` keeps the stand-in standing and carries out what is typed at it, which is what lets the
  # report be typed in the pane and a later line be seen going unanswered.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task the built-in the run starts at takes, so the run goes on to the step after it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # One action holding one step, which leaves the action by its done way out.
  - { type: action, domain: automation, op: action-add, with: { name: work }, as: work }
  - { type: action, domain: automation, op: step-add, with: { target: work, name: do, prompt: do the work and report }, as: do }
  - { type: action, domain: automation, op: action-entry, with: { target: work, step: do } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: do, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that stops for a person after its step" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: work }, as: at_work }
  - { type: action, domain: automation, op: agent-set, with: { target: at_work, step: do, agent: claude-code } }
  # The done way out of the step ends the run halted: no built-in after it to end the terminal.
  - { type: action, domain: automation, op: edge-add, with: { target: at_work, halt: true } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_work } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: do
      action: work
      present: true

  # Typed in the pane, which is a process of its own: the app hears nothing of it but what the store
  # then says.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      report: nothing left to do

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: do
      action: work
      state: failed
      reason: halted
      present: true

  # The run is over, so its last step's program is too — the pane keeps what it said and takes no more.
  - type: assert
    domain: automation
    op: run-pane-ended
    with:
      target: run
