# Reading one decision back in full. `show` is where a reader learns whether what they are about to
# stand on still holds: the body, whether it is current, what it replaced, and the premise it was
# built on. Those relations are not decoration — they are the answer to "is this still true?", and a
# chain that came out of the shipped build broken sends the next piece of work onto rotten ground.
id: decision-show
title: A decision shows its body, its supersession chain in both directions, and the premise it stands on
description: >
  Build the smallest shape that has all three: a premise, a decision that replaces an older one, and
  the older one it replaced. Then read each side back. Currency is derived from the edges rather than
  stored, so the superseded decision is asked whether it still counts as current — the one answer a
  reader takes everything else from.
steps:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the premise it stands on
    as: premise

  - type: action
    domain: decision
    op: accept
    with:
      target: premise

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the policy being replaced
    as: old

  - type: action
    domain: decision
    op: accept
    with:
      target: old

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the policy that replaces it
    as: new

  # The body is written while the decision is still proposed; accepting freezes it, and superseding
  # accepts. So it is set — and read back — before the edges are drawn.
  - type: action
    domain: decision
    op: edit
    with:
      target: new
      body: The rule this decision settles, as the reader will find it.

  - type: assert
    domain: decision
    op: field
    with:
      target: new
      field: body
      equals: The rule this decision settles, as the reader will find it.

  - type: action
    domain: decision
    op: supersede
    with:
      target: new
      replaces: old

  - type: action
    domain: decision
    op: builds-on
    with:
      target: new
      on: premise

  # The new decision's own card: settled, current, and carrying both of its relations.
  - type: assert
    domain: decision
    op: field
    with:
      target: new
      field: status
      equals: accepted

  - type: assert
    domain: decision
    op: field
    with:
      target: new
      field: current
      equals: true

  - type: assert
    domain: decision
    op: edge
    with:
      target: new
      kind: supersedes
      other: old
      present: true

  - type: assert
    domain: decision
    op: edge
    with:
      target: new
      kind: builds_on
      other: premise
      present: true

  # The replaced decision, read from its own side: still accepted — the row is not touched — but no
  # longer current, and naming what replaced it.
  - type: assert
    domain: decision
    op: field
    with:
      target: old
      field: status
      equals: accepted

  - type: assert
    domain: decision
    op: field
    with:
      target: old
      field: current
      equals: false

  - type: assert
    domain: decision
    op: edge
    with:
      target: old
      kind: superseded_by
      other: new
      present: true

  # And the premise, which names its impact radius: overturn this one and the decision above wants
  # revisiting. That reverse direction is the one a reader consults before touching a premise.
  - type: assert
    domain: decision
    op: edge
    with:
      target: premise
      kind: built_on_by
      other: new
      present: true
