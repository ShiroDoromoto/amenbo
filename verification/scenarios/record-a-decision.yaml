# The path a why takes from being written down to being finished. A decision is saved decided — the
# talking is over before anyone types it — and what is still open is the writing, so the ends a writer
# reaches are finishing it and opening it again to write further. A record nobody took leaves by the
# other door, which is open only while the writing is. What the shipped build has to get right is which
# stage a record is in: the flag that says the writing is unfinished is what holds the work resting on
# it, and the state the store keeps is what every reader downstream trusts.
id: record-a-decision
title: A why is saved decided and still being written — the writing is finished, opened again and finished once more, or the record is turned down
description: >
  Record a decision, read back that its writing is still open, write its body, and walk it through the
  ends that writing can reach: finished (which stamps who finished it), opened again (which puts the
  record back in hand), and finished once more. A second decision leaves by the other door, rejection,
  whose reason lands on the timeline rather than in a field of its own. A decision whose writing is
  over is what other work waits on, so the flag these lines read is the one a task's readiness is
  derived from, and the finished record names who finished it.
steps_cli:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — a decision to be ruled on
    as: rec

  # A recorded decision is already decided and not yet written out. Saving it is the first of the two
  # stages its writing takes, and the flag is what says which one it is in.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: draft
      equals: true

  - type: action
    domain: decision
    op: edit
    with:
      target: rec
      body: "SCENARIO — the rationale, as it stands before the writing ends."

  # The body is what a decision is for, so it is read back off the store rather than assumed from
  # the edit having exited zero.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: body
      equals: "SCENARIO — the rationale, as it stands before the writing ends."

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: rec

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: draft
      equals: false

  # And the word the store keeps it under, which is what a reader downstream narrows by. It is pinned
  # here because it is the vocabulary itself that is under test: a record is `decided` from the moment
  # it is saved, and the stage above moved the flag rather than this.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: status
      equals: decided

  # Who ended the writing is on the record, because what the stage says is "I have finished writing
  # this" — a thing only its writer can say, and a writer can be a person or an AI. Read back off the
  # shipped build, not assumed from the command having exited zero.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: decided_by.id
      equals: human

  # Nothing has replaced it, which is asked of the edges rather than of a word: `superseded:no` is
  # the listing arm a reader narrows by when looking for what has not been overturned.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "superseded:no"
      target: rec
      present: true

  # Finishing is not a one-way door. Opening it again raises the flag, which puts the record back in
  # hand and sends the work resting on it back to waiting.
  - type: action
    domain: decision
    op: reopen
    with:
      target: rec

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: draft
      equals: true

  - type: action
    domain: decision
    op: edit
    with:
      target: rec
      body: "SCENARIO — the rationale, as it reads after the second look."

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: rec

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: body
      equals: "SCENARIO — the rationale, as it reads after the second look."

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: draft
      equals: false

  # The other door out of the writing, and the only one open while the writing is: turned down. A
  # record nobody took governs nothing, and the reason it was turned down lands on its timeline —
  # there is no field for it, because it is a thing said.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — a record that does not carry
    as: dropped

  - type: action
    domain: decision
    op: reject
    with:
      target: dropped
      reason: SCENARIO — turned down, and here is why

  - type: assert
    domain: decision
    op: field
    with:
      target: dropped
      field: status
      equals: rejected

  - type: assert
    domain: decision
    op: commented
    with:
      target: dropped
      text: SCENARIO — turned down, and here is why
