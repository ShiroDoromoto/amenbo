# A process can die and the store not hear about it. What is left is a task reserved with nobody at
# it — out of every mailbox while it sits there, which is the whole of why nobody notices — and, on
# the other face, a proposal open under a pane that is gone, waiting for a ruling nobody is coming to
# make.
#
# Amenbo can see both, and from two halves neither of which can be read off the other: the store says
# what is reserved and what is still proposed, and the running window says which of the panes it
# opened are still there. A write from inside a pane carries the session that made it, so which pane
# reserved a task is a column rather than a guess.
#
# ── Why it is read on the ledger and nowhere else ─────────────────────────────────────────────────
# The answer is a standing inventory rather than news. Just after the app comes up nothing is running,
# so everything a pane ever reserved is in it — true, and news nowhere. A frame with nothing in it is
# a place for news; a ledger is where a person goes to read stock. So the mark is drawn on the rows
# themselves, on the two faces that hold them, and it interrupts nobody who has not come to read.
#
# ── The claim is the absent half ──────────────────────────────────────────────────────────────────
# Work begun at somebody's own terminal leaves no session on the line at all, and Amenbo cannot see
# whether that terminal is still open. Marking it would be telling a person their own work had
# stopped. So the world stands two reservations up beside each other and two proposals beside each
# other, alike in every way the screen draws except the one under test, and each face is read twice.
#
# ── The screen road alone ─────────────────────────────────────────────────────────────────────────
# There is no second road here and no gap in one. What is under test is a mark the window puts on a
# row out of something only a running window knows — which of its own panes are alive — and a binary
# asked the same question from outside has no panes at all.
#
# ── Why both readings are for an eye ──────────────────────────────────────────────────────────────
# The mark is a glyph and a word of the interface, so a reading of the word would hold this gate to
# the one language the run was set up in. It carries no colour to read instead: it is drawn muted on
# purpose, being an absence of movement rather than news.
id: see-on-the-ledger-what-nothing-is-working-on
title: The ledger marks the reservations and the proposals that nothing is working on any more
description: >
  Open a project whose board holds two reservations — one made inside a pane that has since gone, one
  made at somebody's own terminal — and read which of them the ledger marks. Then cross to the same
  project's decision records, holding two open proposals put up the same two ways, and read the same
  thing there. Amenbo marks what it can see nothing is at, and says nothing about the work whose far
  end it cannot see.

given:
  # The reservation a pane made and walked away from. `adrift` is what puts a session on the line; no
  # road can make one, because a driver has no pane to be given a session id by.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — reserved from a pane that is gone
    as: left_behind

  - type: action
    domain: task
    op: finish-creating
    with:
      target: left_behind

  - type: action
    domain: task
    op: adrift
    with:
      target: left_behind

  # And its twin, reserved the ordinary way. Nothing on the line says where from, which is exactly
  # what a person's own terminal leaves — and what Amenbo must never read as abandoned.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — reserved at a terminal of my own
    as: still_mine

  - type: action
    domain: task
    op: finish-creating
    with:
      target: still_mine

  - type: action
    domain: task
    op: status
    with:
      target: still_mine
      status: in_progress

  # The same pair on the other face. A decision is born proposed, and that birth is the only moment
  # the store records who put it up, so the two are told apart at creation and never afterwards.
  - type: action
    domain: decision
    op: adrift
    with:
      title: SCENARIO SEED — put up from a pane that is gone
    as: unsettled

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — put up at a terminal of my own
    as: mine_to_settle

steps_gui:
  # Arrive at the board rather than assume it. The project is the one a run already stands in: this
  # world raises none of its own, because what it stands up is work, and work is filed where the CLI
  # standing it up is bound.
  - type: action
    domain: project
    op: open
    with:
      project: cwd

  # What the board says of the reservation nothing is at. It is said on the card, among the marks a
  # card already carries about what is wrong with the work — the reader is looking at the work, and
  # this is one more thing true of it.
  - type: assert
    domain: task
    op: adrift
    with:
      target: left_behind

  # And the half that is the claim. Both cards are reserved and both are in the same column; what
  # separates them is a thing only the window can see, and where it cannot see, it says nothing.
  - type: assert
    domain: task
    op: adrift
    with:
      target: still_mine
      present: false

  - type: action
    domain: decision
    op: open-face

  # The same reading on the face where the next move actually is. What a proposal nobody is settling
  # needs is a ruling, and ruling is done here and nowhere else.
  - type: assert
    domain: decision
    op: adrift
    with:
      target: unsettled

  - type: assert
    domain: decision
    op: adrift
    with:
      target: mine_to_settle
      present: false
