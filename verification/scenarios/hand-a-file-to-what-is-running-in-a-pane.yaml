# Getting a file to the thing working in a pane, which is the one hand-over that stays inside Amenbo.
#
# What reaches the pane is a path and nothing else. Amenbo moves no bytes: the file or the folder
# stays exactly where it is, and what lands in the line the person types into is where it stands.
# Every road here ends in that same place.
#
# ── Why the newline is the reading and not a detail ──────────────────────────────────────────────
# What arrives is put in front of the person, never sent for them. The screen at that moment may be a
# first-run question, and one of the answers really found on one ran a script off the network, so a
# build that pressed return on somebody's behalf would be answering a question nobody read. That is
# why every reading here is of the input line rather than of what a program printed: the two look
# alike on a shot and mean opposite things.
#
# ── Why "nothing was written" is read three times ────────────────────────────────────────────────
# The whole of what this face promises is a thing *not* happening, and a thing not happening is only
# a reading where the screen could have shown it. So the tree is read before anything is handed over
# and again after the drag, and the path itself is read for the landing a carry would have made not
# being in it. A copy keeps the name it came with, so the name alone says the same thing either way;
# only the path tells a hand-over from a carry.
#
# ── Why the path is read for the road's word and not the folder's ────────────────────────────────
# Which folder is bound is the operator's to pick; the road only says what to call the one they
# picked. So its real name is theirs, and it is drawn on the pane's prompt, on the project's tab and
# over the column of files besides — a reading taken of the whole shot finds that name on every
# screen here, carry or no carry, and the step goes red on a screen that is right. `.amenbo-inbox` is
# the name this road gives the landing a carry would make. It is the road's own word, it is nowhere
# in the interface, and it is on the shot only where a carry put it — which is what the tree is read
# for on either side of the drag, and what the line is read for here.
#
# What a copy costs is why it is worth all three. Two of the same file, and the copy is the one
# nobody ever sees change — a landing Amenbo makes under the project's folder is ignored wholesale,
# so a fix made in it shows neither in git's diff nor on the rows the panel colours. A folder costs
# the whole tree under it.
#
# ── Why six roads and not one ────────────────────────────────────────────────────────────────────
# A file dragged in from the machine, a hand full of them dragged in at once, a folder off a row of
# the panel, a file off a row, a row carried onto a pane by hand, and the row's menu pressed for a
# pane that is behind the page: six doors and one answer. The drags go first, on a line with nothing
# else standing on it — that is the only moment the path can be read for what is *not* in it, and a
# hand full is where a carry would show worst, taking every one of them in.
#
# ── Why the last road turns a page first ─────────────────────────────────────────────────────────
# The menu hands the file to the pane being worked in, and turning a page moves what is drawn without
# moving that — so the pane the item names is often one the reader cannot see, and a path pasted into
# it would be a hand-over with nothing to read. The pane is put behind the page on purpose, and what
# is read afterwards is that it came back.
#
# ── Why the last road needs a second pane ────────────────────────────────────────────────────────
# The four above are walked on one pane, where "the pane it landed on" and "the pane the reader was
# in" are the same box and nothing can tell them apart. Two of the five doors point at a pane — the
# drag from outside, and the carry — and what a pointer says is which one, so the road opens a second
# pane and stands the reader in the other one before each of them.
#
# What it reads there is not only the path. A landing settles which pane is being worked in and where
# the keyboard is, and that is the one way a hand-over can be right and still be wrong: the path in
# one pane, the words the reader types after it in another.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no terminal road here and no gap in one. A drop is the operating system's, the menu is
# drawn where the pointer is, and what is under test is a line standing unsent on a screen — none of
# the three is a thing a binary can be asked for.
id: hand-a-file-to-what-is-running-in-a-pane
title: What is handed to the pane reaches it as the path it is already at
description: >
  Open a pane in the project's folder and get six things to what is running in it: a file dragged in
  from the machine, a pair dragged in together, a folder off a row of the panel beside it, a file off
  a row, a row carried onto a pane of its own, and a row named from its menu to a pane the page turn
  had taken away. Nothing is copied and nothing is moved — no landing is made for any of them, on the
  tree under the project's folder or in the path handed over — and all six put the whole path in the
  line the person types into, unsent, for them to send. The two that point at a pane land in the one
  the pointer named, and leave it the pane being worked in; the one named from the menu brings its
  pane back on the screen.

given:
  # One project, bound to one folder, and the folder is named here rather than left to be added
  # afterwards. Both halves are what the first step below stands on: the way in that opens a picker is
  # the face of a project that has nowhere to run yet, and a project bound to several would put the
  # question of which folder in front of every press that opens a pane. Bound to exactly one, the
  # press opens there and asks nothing, which is what the six roads below need standing before them.
  - type: action
    domain: project
    op: create
    with:
      name: Workshop
      dir: workshop
    as: workshop

  # The file the third road hands over, and the folder the second one does — one write makes both,
  # since the folder is the one the file is written into.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: workshop
      path: notes/watering.md
      content: |
        SCENARIO the greenhouse is watered on Tuesdays

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # Which project's panes the face is drawing, pressed rather than assumed: what the face comes up on
  # is the run's business, and every reading below — the folders down the panel, the rows handed over
  # — is this project's.
  - type: action
    domain: terminal
    op: go-project
    with:
      project: Workshop

  # The pane every step below is about. A plain shell rather than an agent: what is under test is
  # where the path lands and that nothing sent it, and an agent would answer the line on its own.
  #
  # The frame and not the picker. The picker is the face of a project with nowhere to run yet, and
  # this one was bound where the world was stood up — so the press opens a pane in that folder and
  # asks nothing, and a road that reached for the way in here would be hunting a control that is not
  # on the screen.
  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: open-shell

  # A line of the road's own, so this pane can be named later. Nothing reads it until the page has a
  # second pane on it — and by then "the pane" names two, which is exactly when the last road needs
  # to say which one it means.
  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the pane the reader is in

  # The panel, which is the door the second and third roads come through.
  - type: action
    domain: terminal
    op: show-side
    with:
      side: files

  - type: action
    domain: files
    op: tree
    with:
      open: true

  # What the folder holds before anything is handed over. This is the reading the one after the drag
  # is measured against — without it, "nothing was written" would be said of a folder that might
  # never have had anything written in it for any reason at all.
  - type: assert
    domain: files
    op: listed
    with:
      name: .amenbo-inbox
      section: tree
      present: false

  # The road in from the machine. The operator brings the file, because a drop reads the disk they
  # are sitting at and nothing this run laid down is reachable from there.
  - type: action
    domain: terminal
    op: drop-in
    with:
      brings: handed.txt

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: handed.txt

  # And the whole of what changed, read off the one line that can carry it: the path is the one the
  # file is at on the operator's own disk, so the landing a carry makes is nowhere in it. A carry
  # puts the file there under the same name, which is what makes the path the reading that tells the
  # two apart — the name alone would say the same thing either way.
  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: .amenbo-inbox
      present: false

  # Nothing was made to hold it either — not a copy, and not the folder a copy would land in. The
  # panel draws ignored rows like any other, so a landing made here would be on the tree.
  - type: assert
    domain: files
    op: listed
    with:
      name: .amenbo-inbox
      section: tree
      present: false

  # The same gesture with a hand full rather than one thing in it. It is one drop and not two: a pair
  # picked up together and let go once puts both paths on the line side by side, and two drops one
  # after the other would say nothing about what one hand full does.
  - type: action
    domain: terminal
    op: drop-in
    with:
      brings: seeds.csv
      beside: labels.txt

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: seeds.csv

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: labels.txt

  # And still no landing on the line, which is the reading a hand full could break where one thing
  # did not: a carry that took the pair in would have put both of them there.
  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: .amenbo-inbox
      present: false

  # The second road: a folder, named the same way a file is. Nothing is carried, so the tree under it
  # costs no more to name than one file does.
  - type: action
    domain: files
    op: menu-on-folder
    with:
      name: notes
      section: tree

  - type: action
    domain: files
    op: hand-to-pane

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: notes

  # The third road: a file off a row, which is where this face started. It is read on the same line
  # as the two before it — a reader who hands over several things in a row gets them side by side,
  # and a reading taken before the others would not say so.
  - type: action
    domain: files
    op: enter
    with:
      name: notes

  - type: action
    domain: files
    op: menu
    with:
      name: watering.md
      section: tree

  - type: action
    domain: files
    op: hand-to-pane

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: watering.md

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: handed.txt

  # ── The fifth road, and what a landing settles ────────────────────────────────────────────────
  # A second pane, because everything above this line happens where "the pane it landed on" and "the
  # pane the reader was in" are the same box. From here they are two, and that is the only way the
  # rest of this can be read at all.
  - type: action
    domain: terminal
    op: set-panes
    with:
      count: 2

  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the pane beside it

  # And the same words again, on the row above it. A line in a terminal is a line that moves: the
  # roads below leave three paths standing unsent on this pane's input line, and an input line four
  # rows deep pushes what is above it off the top of the shot. The row does not move, and it is read
  # off the tree rather than off the picture, so nothing the pane scrolls away or wraps reaches it.
  # That is what lets the two steps at the end of this road say which pane the page is showing.
  #
  # The name is the words the pane is already carrying, because there is nothing else here to call
  # it by: a pane nobody has named wears the folder it works in, and both panes on this road work in
  # the one folder.
  - type: action
    domain: terminal
    op: name-pane
    with:
      shows: SCENARIO the pane beside it
      name: SCENARIO the pane beside it

  # Back to the first pane, which is what makes the reader's pane the one the landing is *not* in.
  # The paths standing on its line go off with the press, which is what a line typed under them
  # does — they have been read, and what this step is for is where the reader is standing.
  - type: action
    domain: terminal
    op: type-line
    with:
      shows: SCENARIO the pane the reader is in
      text: SCENARIO the reader stands here

  - type: assert
    domain: terminal
    op: worked-in
    with:
      shows: SCENARIO the pane the reader is in

  # The road this face was missing: the row taken hold of and carried, rather than named to the pane
  # the reader is already in. Where it comes down is the reader's own answer and nothing else's.
  - type: action
    domain: files
    op: carry-to-pane
    with:
      name: watering.md
      section: tree
      onto: SCENARIO the pane beside it

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: watering.md
      on: SCENARIO the pane beside it

  # And what the landing settles. A person who carried a path into a pane has said which pane they
  # mean, so the next thing they type goes there — without this, the path lands in one pane and the
  # words after it in another, which is the one way a hand-over can be right and still be wrong.
  - type: assert
    domain: terminal
    op: worked-in
    with:
      shows: SCENARIO the pane beside it

  # Back again, for the drag from outside: it lands where the pointer is, so the reader has to be
  # somewhere else for that to be worth reading.
  - type: action
    domain: terminal
    op: type-line
    with:
      shows: SCENARIO the pane the reader is in
      text: SCENARIO the reader stands here again

  - type: action
    domain: terminal
    op: drop-in
    with:
      brings: handed.txt
      onto: SCENARIO the pane beside it

  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: handed.txt
      on: SCENARIO the pane beside it

  # The same reading for the other door. Both gestures point at a pane, so both answer for it.
  - type: assert
    domain: terminal
    op: worked-in
    with:
      shows: SCENARIO the pane beside it

  # ── The sixth road: the same menu, to a pane that is not on the screen ────────────────────────
  # A page turn moves what is drawn and not which pane is worked in, so the pane the menu hands to is
  # often behind the page. One pane to a page is the plainest way to stand the two apart.
  - type: action
    domain: terminal
    op: set-panes
    with:
      count: 1

  - type: action
    domain: terminal
    op: go-page
    with:
      page: 1

  # The pane the menu is about, off the screen. This is what the reading after the hand-over is
  # measured against — without it, "the pane is there" would be said of a pane that never left. A
  # page that is not being shown draws neither the pane nor the row above it, so the row answers the
  # same question — and it answers the other half of it, further down, where the pane cannot.
  - type: assert
    domain: terminal
    op: label
    with:
      shows: SCENARIO the pane beside it
      present: false

  - type: action
    domain: files
    op: menu
    with:
      name: watering.md
      section: tree

  - type: action
    domain: files
    op: hand-to-pane

  # And the pane comes up. What is read is the row above it and not the line: the line here already
  # holds this path from the road above, and a page that had stayed where it was would have put the
  # file somewhere the reader cannot see. The row rather than the pane, because by now the pane has
  # three paths standing on its input line and the words it printed have gone off the top of it —
  # the row carries them still, which is the whole of why this road named it.
  #
  # It is not read for the keyboard either. The pane it names is the one being worked in and was
  # before the page turned — what the menu answers for is showing it, and where the keyboard stands
  # after a page comes back is the page turn's own business, not this hand-over's.
  - type: assert
    domain: terminal
    op: label
    with:
      shows: SCENARIO the pane beside it
