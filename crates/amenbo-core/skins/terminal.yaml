# Terminal — one monospace stack for everything, square corners, no shadows, and not one byte of
# font carried: the faces are the ones the device already has.

name: terminal
title: "Terminal"
skin_v: 1
author: "Amenbo"
version: "1"
license: "Apache-2.0"
themes: [light, dark]

light:
  c-accent: "#00686b"
