[package]
name = "amenbo-verify-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "CLI driver: maps a verification scenario to shipped-binary invocations and asserts via --json."
# The bins are declared explicitly (dashed names over the src/bin/ underscore defaults).
autobins = false

[lib]
name = "amenbo_verify_cli"
path = "src/lib.rs"

[[bin]]
name = "verify-cli"
path = "src/main.rs"

[[bin]]
name = "verify-all"
path = "src/bin/verify_all.rs"

[dependencies]
amenbo-scenario = { path = "../core" }
# The loopback host a premise stands behind a remote that asks who is sending (`domain::repo`'s
# `git-remote-asking`). It is the main tree's test-support crate, reached by path across the
# workspace boundary — which is the reach its own module doc-comment describes, and the reason a
# third hand-rolled listener is not written here.
amenbo-static-host = { path = "../../crates/amenbo-static-host" }
serde_json = "1"
serde_yaml = "0.9"
# Where a driver reaches past the binary's face — the premises whose world no command writes and no
# run can wait for: a device somebody has been coming back to (`store worn-in`), one the plugins were
# taken into (`store carried-in`), and one whose panes an older build left held at a split
# (`store held-at-a-split`). The same kind of reach `age-blobs` makes on a blob's mtime, and the
# store is a plain SQLite file (no shipped path keys one). `bundled` so the build carries its own
# SQLite rather than asking each machine for one.
rusqlite = { version = "0.40", features = ["bundled"] }
