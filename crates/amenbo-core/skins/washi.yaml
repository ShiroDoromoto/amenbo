# Washi — colour and nothing else. Paper and sumi ink, over the whole open palette; every
# length, weight and face is left as this build draws it.

name: washi
title: "Washi"
# The name is the paper, so it travels as the word rather than as a translation of it. Japanese
# is the one language that writes the word it already has.
