# The terminal a run opens for a step has the same `amenbo` on its PATH as any other, so the agent
# working that step can type `automation start` and set a second run going, or `automation stop` and
# put its own down. Neither is the agent's to do: the work came with the text the step starts on, and
# what the run does next is the run's. So the binary asks where it is standing before it reads or
# writes anything, and turns those verbs away there. The same holds past `automation`:
# a task's status is the run's to move, and `task done` typed there would close one with no commit
# on it — so that is turned away too, with a sentence of its own.
#
# The refusal is the whole of this road. What reaches from inside a step — `step-take`, `step-out`,
# `step-done` — is walked by `walk-a-run-from-one-step-to-the-next`, and the six reading verbs that
# also reach are held by the CLI's own tests. What no test can stand in for is this: a shipped binary
# in a terminal a shipped window opened, with the environment that window set on it.
id: reach-for-a-run-verb-from-inside-a-step
title: A verb that drives a run, or closes a task, is turned away in the pane that run is drawn in
description: >
  Start a run, and in the pane it is drawn in reach for the two verbs that would put it down — pause
  and stop — as the agent working the step could. Each is turned away, and the running tab still says
  the run is under way. Both are walked because they are two ways to the same end: a build where only
  one arm of the guard was written would turn the first away and let the second through. Then reach
  for `task done` on a task of the project: it is turned away too, and the task is still to do — and
  for `worktree start`, which a built-in does for the run.
given:
  # Claude Code is one of the two agents this machine can start — two being the fewest the premise
  # stands up — so the step is not refused for who carries it out. `runs` keeps the stand-in standing
  # and carries out what is typed at it, which is what the command typed in the pane needs.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task `task done` is reached for on. It is not the run's — the step never takes one — since
  # the door turns the command away before it reads which task is named, so any task stands for it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task a step tries to close }, as: seed }
  # The action the run opens, holding the one step it runs. The way out that takes the task is
  # declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one to reach out of" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # The pane the step was opened in. It is the terminal the verbs below are typed at, and the line
  # over it is where the run's own number is read off.
  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      present: true

  # The first reach: the verb that would hold the run the step is part of.
  - type: action
    domain: automation
    op: command-in-pane
    with:
      target: run
      command: automation pause <run>
      refused: automation_outside_only

  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  # Nothing moved. A build that let the verb through would draw this row as held.
  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: running

  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The second reach: the verb that would put the run down for good.
  - type: action
    domain: automation
    op: command-in-pane
    with:
      target: run
      command: automation stop <run>
      refused: automation_outside_only

  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: running

  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The third reach, past `automation`: the command that would close a task. The run moves a
  # task's status, so this is turned away under the same code with a sentence of its own.
  - type: action
    domain: automation
    op: command-in-pane
    with:
      target: run
      task: seed
      command: task done <ref>
      refused: automation_outside_only

  # Nothing moved. A build that let the command through would have the task done.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: todo

  # The fourth reach: what a built-in does for the run. Cutting the task's worktree is the run's,
  # so this is turned away under the same code with the sentence that points at step-out.
  - type: action
    domain: automation
    op: command-in-pane
    with:
      target: run
      task: seed
      command: worktree start <ref>
      refused: automation_outside_only
