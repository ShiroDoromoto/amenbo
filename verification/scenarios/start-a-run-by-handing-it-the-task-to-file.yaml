# A run can be handed a task as it starts: the title, the notes, the classification and the files to
# attach are filed as a task before the run is made, under the automation's first role and given to
# the AI. The run's entry, the built-in that takes a task, takes it, and from there the
# run goes on as one that took a task does.
#
# The terminal hands it a file the run wrote as well, and meets the guards the start keeps in front of
# it. A title is required, an axis the project requires needs a value, and a file that is not there
# cannot be attached. Each is refused before any task is filed or any run is made. So is a start with
# no app up on the store, since only the app opens a step. A run started at a terminal opens no step,
# so what is read is the run it started.
id: start-a-run-by-handing-it-the-task-to-file
title: A run starts on the task filed from the title, classification and file it is handed
description: >
  Place the built-in that takes a task as an automation's entry, then close it. Start it from the
  terminal with no app up on the store and read it refused; then, with the app up, start it handing a
  title, notes, a value on the axis the project requires and a file, and read the run under way. Start
  it with no title, with no value on that axis, and with a file that is not there, and read each
  refused.
given:
  # The axis the road requires. Values first: an axis offering none cannot be required.
  - { type: action, domain: dimension, op: create, with: { name: 職種 } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: 職種, value: エンジニア } }

  # Take, close.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one handed a task to file" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_cli:
  # Every task has to carry a value on it from here on.
  - { type: action, domain: dimension, op: required, with: { dimension: 職種, required: true } }
  # A run starts from the newest saved version, so it is saved first.
  - { type: action, domain: automation, op: save, with: { target: auto } }

  - type: action
    domain: repo
    op: write-file
    with:
      path: screenshot-notes.md
      content: "the field is gone below 400 pixels wide\n"

  # With no app up on the store, nothing is started: a run's steps are opened by the app, so a run
  # accepted now would move no further. Once one is up, the same start goes through.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      title: the login page loses the password field on a narrow window
      dim: 職種=エンジニア
      refused: app_not_running

  - { type: action, domain: store, op: app-up }

  - type: action
    domain: automation
    op: start
    with:
      target: auto
      title: the login page loses the password field on a narrow window
      notes: seen on a phone held upright
      dim: 職種=エンジニア
      file: screenshot-notes.md
    as: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running

  # A task cannot be filed without a title.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      dim: 職種=エンジニア
      refused: invalid_value

  # The project requires the axis, and nothing handed answers it.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      title: one with no value on the axis
      refused: invalid_make_task_required_empty

  # A file that is not there has nothing to attach.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      title: one handed a file that is not there
      dim: 職種=エンジニア
      file: missing.md
      refused: not_found
