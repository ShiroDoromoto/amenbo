# The pane a run is drawn in cannot be taken away while the run is going. A pane is an ordinary thing
# to take away, and a press that also stopped the run was one a reader made meaning only to tidy the
# page — so the control is drawn and cannot be pressed until the run is over, and stopping is its own
# press beside the run's state. Once the run is stopped, the pane goes like any other.
id: close-the-pane-a-run-is-drawn-in
title: The pane a run is drawn in is taken away only once the run is over, and stops nothing going
description: >
  Start a run and read its pane: the run is under way, and the control that takes the pane away
  cannot be pressed. Stop the run from the line over the pane, then take the pane away, and read what
  is left: the pane is gone, and the run's row on the history tab says it was canceled — by the stop,
  not by the pane going.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  # The task the built-in the run starts at takes, so the run goes on to the step after it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The action the run opens once the built-in has taken the task, holding the one step it runs. Its
  # way out is declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one to close" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # Under way, and the pane held up by it: the control that would take it away cannot be pressed.
  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      state: running
      present: true

  # Stopped from the line over the pane, which keeps the pane.
  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: stop
      on: pane

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      state: canceled
      present: true

  # And now the pane goes, the way any other does.
  - type: action
    domain: automation
    op: close-run-pane
    with:
      target: run

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      present: false

  # The run itself, read on the tab that holds the runs that are over: a canceled one goes straight
  # there, since the person who stopped it knows already.
  - type: action
    domain: automation
    op: screen
    with:
      tab: history

  - type: assert
    domain: automation
    op: history-row
    with:
      target: run
      state: canceled
