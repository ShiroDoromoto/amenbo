# A setting says what kind of answer it takes, and one of those kinds brings its own list: a `choice`
# is answered off a pulldown, and what that pulldown holds is written out by whoever declared it, a
# line to a choice. The box that takes those lines is drawn under the row and under no other kind's,
# so declaring the kind and writing what it offers are one move on the action's input panel — and a reader who can
# declare the setting but not say what it offers has a pulldown with nothing in it.
#
# ── Why the move off `choice` is where this road ends ───────────────────────────────────────────
# A choice list belongs to a `choice` and to nothing else: core refuses a setting carrying one on any
# other kind. So the row moving to another kind has to take the list with it, in the same call — and
# a build that left it behind would be refused by core and the reader would watch the kind not move.
# That is what the last half reads, on the far side: the rows a task filter is answered on are drawn
# under the same name, and pressing one of them takes the setting off the launch place. Neither would
# happen to a row whose move was refused.
#
# ── What this road leaves to its sibling ───────────────────────────────────────────────────────
# That the lines written into the box are the lines the pulldown then offers.
# `answer-a-setting-from-the-list-written-under-it` walks that, by answering the setting off the list
# rather than moving it away from one. This road is about the move, so it writes the list and leaves
# it unanswered — which is what keeps the launch place free to say something about the move itself.
#
# ── Where each half is done ─────────────────────────────────────────────────────────────────────
# The setting is the action's, so it is declared, written out and insisted on in the action's own
# input panel; the answer is the placement's, so it is given in the panel a placement opens on the
# automation. The road goes from the one to the other, which is the way a reader goes.
id: write-out-what-a-setting-offers-and-move-it-off-that-kind
title: What a choice setting offers is written out under it, and moving the setting off that kind takes the list with it
description: >
  Declare a setting on an action's own screen as the kind that is answered off a list, write the list
  out under it a line to a choice, and say the step is refused without an answer — which puts the
  setting on the launch place. Then move it to the kind a task filter is answered on, which it can
  only reach by taking its list with it, and answer it on the placement's panel. The launch place
  lets it go.
given:
  # Claude Code is one of the two agents this machine can start — two being the fewest the premise
  # stands up — so nothing on the launch place is ever about who carries the step out.
  - { type: action, domain: workspace, op: can-start, with: { count: 2 } }

  # The action the panel is read on, holding the one step it runs. It works on the task the built-in
  # before it takes, and the line inside the action carries the step's way out by the action's.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — a setting to write a list under" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }
  # Both ways out say what happens after them, so the definition opens with nothing in its way and
  # everything the launch place says below is what this road put there.
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: true

  # On the action placed there: the setting, the list under it, and insisting on it.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: action
    domain: automation
    op: open-part
    with:
      part: input

  - type: action
    domain: automation
    op: declare
    with:
      what: setting
      name: which way
      kind: choice

  - type: action
    domain: automation
    op: redeclare
    with:
      what: setting
      name: which way
      choices:
        - take the next one
        - stop here

  - type: action
    domain: automation
    op: redeclare
    with:
      what: setting
      name: which way
      required: true

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which way
      present: true

  # The move off `choice`, on the action again — which can only land by taking the list with it.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: action
    domain: automation
    op: open-part
    with:
      part: input

  - type: action
    domain: automation
    op: redeclare
    with:
      what: setting
      name: which way
      kind: taskfilter

  # And the rows a task filter is answered on, under the same name on the placement's panel.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: pick-box
    with:
      name: take

  - type: action
    domain: automation
    op: answer-filter
    with:
      setting: which way
      row: assignee
      value: My AI

  - type: assert
    domain: automation
    op: launch
    with:
      ready: true
