# Declaring that one decision takes another as a premise. The edge says two things at once — read the
# premise first, and revisit this decision if the premise is ever overturned — and it is the only
# thing that carries the second. A premise recorded nowhere gets overturned quietly, and the work
# standing on it keeps going.
id: decision-builds-on
title: A decision names the premise it stands on, and the premise gains the impact radius that names it back
description: >
  Draw the edge from the standing decision to its premise, and read it back from both ends: the
  standing one names what it rests on, and the premise names who would want revisiting. The edge is
  then drawn a second time, because a scenario is replayed and re-run and the command has to take
  that without refusing it; the reading afterwards is unchanged.
steps_cli:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the store is one file on the device
    as: premise

  - type: action
    domain: decision
    op: accept
    with:
      target: premise

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the backup is a copy of that file
    as: standing

  - type: action
    domain: decision
    op: accept
    with:
      target: standing

  - type: action
    domain: decision
    op: builds-on
    with:
      target: standing
      on: premise

  # Forward: what this decision took as given, and where a reader is sent first.
  - type: assert
    domain: decision
    op: edge
    with:
      target: standing
      kind: builds_on
      other: premise
      present: true

  - type: assert
    domain: decision
    op: field
    with:
      target: standing
      field: builds_on.0.name
      equals: SCENARIO DECISION — the store is one file on the device

  # The premise it points at is untouched — the edge is a reading order, not a correction of the
  # older decision, so nothing draws a supersedes edge at it.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "superseded:no"
      target: premise
      present: true

  # Reverse: the impact radius. This is the direction that answers "if I overturn this, what wants
  # revisiting?", and it is the reason the edge is worth drawing at all.
  - type: assert
    domain: decision
    op: edge
    with:
      target: premise
      kind: built_on_by
      other: standing
      present: true

  # Drawn a second time: the command takes it, and the reading is the same afterwards.
  - type: action
    domain: decision
    op: builds-on
    with:
      target: standing
      on: premise

  - type: assert
    domain: decision
    op: edge
    with:
      target: standing
      kind: builds_on
      other: premise
      present: true
