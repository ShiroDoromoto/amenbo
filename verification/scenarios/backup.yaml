# Writing the snapshot. What this line owns is the writing itself: an archive lands at the path it
# was given, the store it was taken from is untouched by the taking, and a second one can be written
# alongside the first. Whether an archive puts a store back is `restore`'s to prove, and it is proved
# there in one round trip — a backup asserted usable here and a restore asserted elsewhere would let
# each side lean on the other and both read green.
id: backup
title: A snapshot of the whole store lands at the path it was given, and the store carries on unchanged
description: >
  Fill a store, take a snapshot of it, and check the archive is on disk with bytes in it. Then work
  on: the timeline is read back, and a second snapshot is taken to its own path. The destination of a
  backup must not already exist, so taking two is not a repetition — it is the ordinary case of
  keeping yesterday's archive while writing today's.
steps:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — in the store when the snapshot was taken
    as: seed

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — a timeline the archive has to carry too
    as: note

  - type: action
    domain: store
    op: backup
    as: monday

  - type: assert
    domain: store
    op: snapshot
    with:
      target: monday
      present: true

  # Backing up is a read: the store is exactly as it was, rows and timeline alike.
  - type: assert
    domain: task
    op: listed
    with:
      filter: "done:false"
      target: seed
      present: true

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — a timeline the archive has to carry too
      present: true

  # Later, with more work in the store, another archive — and the first one still stands where it is.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — registered after the first snapshot

  - type: action
    domain: store
    op: backup
    as: tuesday

  - type: assert
    domain: store
    op: snapshot
    with:
      target: tuesday
      present: true

  - type: assert
    domain: store
    op: snapshot
    with:
      target: monday
      present: true
