name: scale-heavy-manual

# The full 10k read-scaling guard on demand — the same body _ci.yml's `scale-heavy` job runs on the
# `full` legs, for when a change touched a read hot path and neither the clock nor a full run is the
# answer. This leg exists for its latency: a couple of minutes for the one guard, against the whole
# suite for ci-full-manual.yml.
#
# The timed leg is ci-full-nightly.yml, which reaches this body through _ci.yml along with everything
# else it forces open. There is no scale-heavy-nightly.yml: a second schedule for one job of that run
# would only ask the same question twice.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scale-heavy:
    uses: ./.github/workflows/_scale-heavy.yml
    permissions:
      contents: read
