# Building an automation is always half-finished — a setting nobody answered, an input nothing
# reaches — and every one of those saves. What decides whether it may be started is read once, on the
# screen, and the same list the press is refused by is the one a reader is shown before they press.
# So the screen has to be where they are put right too: a reader who can see what is missing and
# cannot fix it there is a reader sent back to the terminal for something the screen just told them.
id: answer-what-an-automation-is-missing-from-its-own-screen
title: What the launch place says is in the way is put right on the screen, and the line for it goes
description: >
  Stand a definition up with two holes in it — a required setting nobody answered and a required
  input nothing reaches — and close both from the screen: the setting on the rows its kind is
  answered by, the input from the list of what fits. Each is read twice, there and gone. A build that
  drew the list once and never read it again would pass the first half of each and fail the second,
  which is the failure this road is written against.
given:
  # The action that takes the task. Its named way out hands on a value, which is what the placement
  # after it is left waiting for. The step inside declares the same, and the lines inside the action
  # carry the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, agent: claude-code, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: wire-add, with: { in_action: true, target: claim, exit: got one, from_port: note, to_port: note } }
  # The hole a person answers: a required setting, declared on the action and left unanswered on its
  # placement. A task filter is the kind worth walking, being the one the screen refuses to let
  # anybody write as an expression.
  - { type: action, domain: automation, op: cfg-add, with: { action: take, name: which, kind: taskfilter, required: true } }

  # The hole a wire closes: a required input on the action after it, with nothing joined to it.
  - { type: action, domain: automation, op: action-add, with: { name: work }, as: work }
  - { type: action, domain: automation, op: step-add, with: { target: work, name: do, agent: claude-code, prompt: do the work }, as: do }
  - { type: action, domain: automation, op: action-entry, with: { target: work, step: do } }
  - { type: action, domain: automation, op: port-add, with: { action: work, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: do, exit_to: "" } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — two holes to close" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: work }, as: at_work }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_work } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_work } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # Both holes, named on the launch place before anything is done about them.
  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which
      present: true

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unwired_input
      box: work
      at: note
      present: true

  # And on the picture as well, where the placement wears it.
  - type: assert
    domain: automation
    op: pictured
    with:
      name: work
      unfed: true

  # The setting, answered on the rows its kind is taken on. Which row and which value are the
  # reader's words; what a filter expression would look like never appears on this screen.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: take

  - type: action
    domain: automation
    op: answer-filter
    with:
      setting: which
      row: assignee
      value: My AI

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which
      present: false

  # The input, filled from the list of what fits. What is offered is what carries the same kind, so
  # the way out that hands a value on is the only thing this list can hold.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: work

  - type: action
    domain: automation
    op: pick-wire
    with:
      input: note
      from: take

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unwired_input
      box: work
      at: note
      present: false

  # And the mark the placement wore for it comes off, which is the same fact read on the other half of the
  # screen: the picture and the launch place are two readings of one definition, and a build where
  # only one of them moved would be answering from a definition it had already read.
  - type: assert
    domain: automation
    op: pictured
    with:
      name: work
      unfed: false
