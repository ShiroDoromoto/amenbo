# The image a project shows for itself, from the file a reader picks to the square the surfaces draw
# it in. It is a screen road and could be no other: the terminal's whole door onto a project's fields
# takes a name, a note, a colour and a view, and there is nowhere on it to hand over an image.
#
# What the road is for is the half no build-time test reaches. The screen bakes the small square, the
# file the reader chose goes to core as bytes, and core writes the pair — the version the surfaces draw
# and the original it was baked from, kept so a larger one can be made later without asking for the
# file again. Every part of that has its own test; what none of them walks is a person choosing a file
# off a real disk and the pair coming back out of a real store afterwards.
#
# So the road leaves the settings and comes back, and that is the step that matters. A form holding
# what was typed into it draws exactly what a stored image draws, and the two come apart only where
# the screen was left and returned to. Everything before that arrival says the screen moved; only the
# arrival says the store did.
#
# Then it crosses to the other face, where the same image is drawn a second time. The settings are
# where a project is given one; the tabs down the edge of the terminal face are what it was given one
# for, and they are drawn from one picture handed to that face rather than from a read per project. So
# an image the settings draw and the tabs do not is the shape this half catches, and it is caught in
# both directions — the tab falls back to the colour and the letter once the image is taken away, the
# way the square beside the button does.
#
# The image is a fixture rather than something the road describes: what is under test is a picture
# being drawn, so any file of the right name would prove nothing. It lands in the folder the run makes
# for itself, and the run says that path before the first step is handed over — nothing in these
# instructions can name it, since they are rendered from this file alone.
id: give-a-project-an-image-of-its-own
title: A project is given an image to show for itself, it is still there after the screen is left and returned to, its tab down the edge of the other face draws it too, and taking it away puts the colour and the letter back on both
description: >
  Open the settings a project keeps for itself, read the square it draws while it has no image of its
  own — the project's colour with the first letter of its name on it — and give it one, choosing a file
  off the disk and saving the form. Then walk out to the board and back in, which is the only way to
  ask whether what is drawn came out of the store rather than out of the form, and cross to the
  terminal face, where the project's tab is drawn with that same image. Take the image away again
  last, and the colour and the letter are what the square and the tab both hold once more.
given:
  # The project the road works on. Raising one is a road of its own and this one opens on the settings,
  # so what stands the project up is the premise.
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  # The file the picker is pointed at. A screen road cannot make one — every move it has is a move on a
  # record — and this is an image, which no line of YAML holds.
  - type: action
    domain: repo
    op: copy-fixture
    with:
      from: image/scenario-icon.png
      path: scenario-icon.png

steps_gui:
  - type: action
    domain: project
    op: open-settings
    with:
      project: Greenhouse

  # What a project draws before anybody gives it an image. It is read first because the two states are
  # told apart by an eye, and an eye that never saw the fallback has nothing to tell the image from.
  - type: assert
    domain: project
    op: icon
    with:
      target: greenhouse
      present: false

  - type: action
    domain: project
    op: set-icon
    with:
      target: greenhouse
      file: scenario-icon.png

  - type: assert
    domain: project
    op: icon
    with:
      target: greenhouse
      present: true

  # Out to the board and back onto the settings. The reading after this is the one the road is for: a
  # square filled by the form and a square filled from the store are the same picture, and only a screen
  # that was left and returned to says which one has been standing there.
  - type: action
    domain: project
    op: open
    with:
      project: Greenhouse

  - type: action
    domain: project
    op: open-settings
    with:
      project: Greenhouse

  - type: assert
    domain: project
    op: icon
    with:
      target: greenhouse
      present: true

  # And the other surface that draws it. The tabs down the edge of the terminal face are all drawn from
  # the one picture that face is handed, so an image standing in the settings and nowhere here would be
  # an image the tabs never heard about. The tab is read where it stands: every project has one whether
  # or not the face is drawing that project's panes, and pressing this one first would have the road
  # reading the tab it had just moved the whole face onto.
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: assert
    domain: terminal
    op: tab-icon
    with:
      project: Greenhouse
      present: true

  # Back to the ledger, which is where the settings are reached from.
  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  - type: action
    domain: project
    op: open-settings
    with:
      project: Greenhouse

  # And the way back off. Clearing takes the original with the version that was drawn, so what the
  # square falls back to is the same thing it held before the road began.
  - type: action
    domain: project
    op: clear-icon
    with:
      target: greenhouse

  - type: assert
    domain: project
    op: icon
    with:
      target: greenhouse
      present: false

  # And the tab with it. What the square fell back to is what the tab falls back to — the colour and
  # the letter — and this reading is what says taking the image away reached the picture the tabs are
  # drawn from as well.
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: assert
    domain: terminal
    op: tab-icon
    with:
      project: Greenhouse
      present: false
