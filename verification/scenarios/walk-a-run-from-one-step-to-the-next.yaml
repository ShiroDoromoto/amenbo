# A run is a picture walked one step at a time, and the whole of it happens inside one pane. When a
# step reports, what changes is the terminal standing in that pane: the next step opens in the same
# place, carrying what the step before it handed on. Nothing new is stood up — a second pane per
# step would leave a run of six steps with six panes and a reader with no way to say
# which one is live.
#
# This is the only road that walks a run **forward**. The others start one and stop one; between the
# two, the three things a step types (`take`, `out`, `done`) had nowhere to be typed until the pane
# ops landed, and what a release could break here is the swap itself.
id: walk-a-run-from-one-step-to-the-next
title: A step reporting swaps the terminal in the run's own pane for the next step
description: >
  Start a run of an automation of two placed actions, one step inside each. Work the first step the
  way its agent would — take a task, hand a value on, report the way out taken — and read what the
  press did. A way out the step does not declare is tried first and turned away, leaving the first
  step where it was. Then the pane is still the run's, and its header now names the second
  step, with the action it belongs to. The value is handed along the wires out of the first action and into the
  second, so that the second step has a reason to open at all. Report the second step as well, and
  the built-in after it closes the task and ends the run: the pane's header says the run completed.
given:
  # Claude Code is one of the two agents this machine can start — two being the fewest the premise
  # stands up — so no step is refused for who carries it out. `runs` keeps the stand-in standing and
  # carries out what is typed at it, which is what the three commands a step types need.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }

  # The task the first step goes and takes. It is named here rather than found, because what the
  # command takes is a ref and a road cannot know the number in advance.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task this run walks }, as: seed }

  # The first action: one step that takes the task and hands a line of text on. What leaving it by
  # "got one" hands on is declared on both layers — the step's way out is what the step reports, and
  # the action's is what the next placement is fed from — and the lines inside the action carry the
  # one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task and say what it is about }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: wire-add, with: { in_action: true, target: claim, exit: got one, from_port: note, to_port: note } }

  # The second action: one step that reads what the first handed on. The input is the action's, so a
  # placement of it can be fed, and the step's, so the step is handed it.
  - { type: action, domain: automation, op: action-add, with: { name: review }, as: review }
  - { type: action, domain: automation, op: step-add, with: { target: review, name: read, prompt: read what the step before handed on }, as: read }
  - { type: action, domain: automation, op: action-entry, with: { target: review, step: read } }
  - { type: action, domain: automation, op: port-add, with: { action: review, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: port-add, with: { step: read, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: wire-add, with: { in_action: true, from_port: note, to: read, to_port: note } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: read, exit_to: "" } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — two actions in a row" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: review }, as: at_review }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_review, step: read, agent: claude-code } }
  - { type: action, domain: automation, op: wire-add, with: { target: at_take, exit: got one, from_port: note, to: at_review, to_port: note } }

  # Every way out says what happens after it, or the launch check stops the road before it starts.
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_review } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_review, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # One pane, on the first step. It is read again at the end, where what it says is that the run went
  # on in the place it was already in.
  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      present: true


  # What the step's agent types, in the pane the run opened for it. Which step is being answered
  # comes off that terminal's own environment, so these are only typeable here.
  - type: action
    domain: automation
    op: take-in-pane
    with:
      target: run
      task: seed

  # The task is the run's now, and the line over the pane says which one it is working.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: in_progress

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      task: seed
      present: true

  - type: action
    domain: automation
    op: out-in-pane
    with:
      target: run
      name: note
      value: nothing was in the way

  # A way out the step does not declare. A way out is typed by its id, and `0` is one no way out
  # carries. Refused, it writes nothing: the line names the ways out that are declared, each with its
  # id, and the step stays where it was.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      exit: "0"
      report: read the task and found nothing in the way
      refused: invalid_value

  # Still the first step. A build that let an id nobody declared through would have ended it — by
  # the error way out, or by whichever way out it guessed.
  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      task: seed
      present: true

  # The report, and the way out it was left by. The way out is what the run reads to decide where to
  # go — a report with no way out named would leave by the done way out, which this step does not use.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      exit: got one
      report: read the task and found nothing in the way

  # The swap. The pane is the same one, and what stands in it is the second step.
  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: read
      action: review
      task: seed
      present: true

  # The second step reports, and what is left is the built-in that closes the task, which ends the
  # run. The pane stays standing on the last step, so its header is what says the run is over: a
  # build that only named the step there would leave a finished run looking like one stopped partway.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      report: read what was handed on

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      state: completed
      present: true
