[package]
name = "amenbo-verify-gui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "mac GUI harness: reads a verification scenario as a screen checklist, and drives the screen tool for the moves, the shots and the readings."
# The bin is declared explicitly (dashed name over the src/bin/ underscore default).
autobins = false

[lib]
name = "amenbo_verify_gui"
path = "src/lib.rs"

[[bin]]
name = "verify-gui"
path = "src/main.rs"

[dependencies]
amenbo-scenario = { path = "../core" }
# The CLI driver, for the two things this harness needs that are already written there: the
# throwaway store a run is given, and the vocabulary a premise is stood up in. Both are the shipped
# binary being driven, which is what that crate is — a second spelling of `plugin install` here
# would drift from the road's the moment either learned something.
amenbo-verify-cli = { path = "../cli" }
serde_json = "1"
serde_yaml = "0.9"
