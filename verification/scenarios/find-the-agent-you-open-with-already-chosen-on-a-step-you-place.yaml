# An action placed on an automation has steps, and each is carried out by an agent. A step nobody
# chose for is one the launch check refuses, so a reader once had to choose again for every step of
# every placement before a run could start. Nothing is written on a placement now: who carries a step
# out is decided in order — what the step names, then the role's default, then Amenbo's own
# (`amenbo_core::wake::step_agent`: the agent chosen for the project, and never the one a pane was
# last opened with). So a step nobody chose for is carried out by the agent the project's panes open
# with, and the placement's own line for it stays on nobody chosen.
#
# ── Where it is read ────────────────────────────────────────────────────────────────────────────
# The panel of a pressed placement says only what the step itself names, and this one names nothing.
# What a step falls back to is drawn in one place: the table under the picture, a row per step the
# role's round reaches, with the agent and the model it is carried out by
# (`app/src/screens/AutomationRoleCarriers.tsx`). A cell the step chose is marked ●; one it falls back
# to is muted and unmarked, which is the reading here.
#
# ── Why the answer is given on the project's settings ───────────────────────────────────────────
# The project's answer is written by its settings screen and by nothing else
# (`app/src/screens/ProjectSettingsScreen.tsx`, `wake_remember`). The agent a pane was last opened
# with is not an answer for a step: it is a habit of opening panes, and reading it put steps on
# agents nobody had chosen for the automation. There is no terminal road to the project's answer,
# which is why this goal is the screen's alone.
#
# ── Why the agent is named ──────────────────────────────────────────────────────────────────────
# The cell reads the agent's own name, and a road reading a name has to have chosen it. The machine is
# stood up (`can-start`), which is what lets a road name one at all; two of them, so that the
# settings screen draws its Agent field, which it leaves out where there is nothing to choose between.
id: find-the-agent-you-open-with-already-chosen-on-a-step-you-place
title: A step of an action placed on an automation is carried out by the agent chosen for its project
description: >
  Stand a machine up with two agents on it, choose one of them by name as the project's agent on its
  settings screen, and go to the project's automations. On an automation that starts at the built-in
  that takes a task, put a library action of one step in on the line leaving it: the table under the
  picture says that step is carried out by the project's agent, muted and unmarked as a value it falls
  back to rather than one anybody chose on it.
given:
  - type: action
    domain: project
    op: create
    with:
      name: Harbour
      dir: harbour-side
    as: harbour

  - type: action
    domain: workspace
    op: can-start
    with:
      count: 2

  # One step, so the table draws one row for it and there is no question of which.
  - { type: action, domain: automation, op: action-add, with: { name: draft, project: harbour }, as: draft }
  - { type: action, domain: automation, op: step-add, with: { target: draft, name: write, prompt: write the draft }, as: write }
  - { type: action, domain: automation, op: action-entry, with: { target: draft, step: write } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — placed with an agent on it", project: harbour }, as: auto }
  # A role starts only at the built-in that takes a task, so the library action goes in on a line
  # leaving that one. The built-in's way out for having taken a task ends the run,
  # which is the line the `+` stands on.
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_take }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した } }

steps_gui:
  # ── The answer, given the way a reader gives it ───────────────────────────────────────────────
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: go-project
    with:
      project: Harbour

  - type: action
    domain: workspace
    op: project-agent
    with:
      agent: Claude Code

  # ── And the placement whose step falls back to it ─────────────────────────────────────────────
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: insert-box
    with:
      after_builtin: take_task
      exit: 着手した
      action: draft

  # The reading. Nobody chose on this placement, and the role has no default, so the step falls back
  # to Amenbo's — the agent chosen for the project. A build that forgot the project's answer draws no
  # row for the step, since nobody carries it out, or names another agent in the cell.
  - type: assert
    domain: automation
    op: carrier-shows
    with:
      step: write
      field: agent
      value: Claude Code
      marked: false
