# The way into amenbo that never passes through a terminal, and the screens only this road ever shows.
#
# A reader arriving with no folder linked yet is offered two ways in: raise a project, or open one
# this device already holds. Both are the interface's own to carry out — raising goes to a screen of
# its own, and opening asks which project and then hands over the folder picker, the same call the
# project settings screen makes. What undoes that is a card handing over a command and pointing the
# reader at a terminal: a folder linked from a terminal is a folder linked, so such a card leaves
# behind exactly the rows a working one does. There is no read to ask and no exit code to fail.
#
# The road ends where the binding takes the reader: that project's board, which — with nothing on it
# yet — is already holding out the first loop, the folder it names being the one just picked. That
# is the whole of what linking was for, and it is the one place the reader is shown it.
#
# Every step of it is read off a shot, and a shot of the wrong screen carries the words no more than
# the right one does — so what says the run stood where it was meant to is each step's own shot, an
# eye on the ones a reading cannot settle.
#
# What this wants in front of it is a device with a project on it and nothing on that project's
# board: the open card is offered where there is something to open, the choices it lists are what the
# store holds, and the loop at the end is what an untouched board leads with. Stand the project named
# below in the store the build under test opens (`devtool devgui cli`), and start the run on the
# getting started screen — the one screen nothing here can move to, since the first shot is taken
# before anyone is handed the run.
#
# Everything after it is a step: the road crosses three screens, so drive it stepped (`--step`) and
# carry out each move at the hand-back before it.
id: link-a-folder
title: A reader with nothing linked opens a project this device holds, picks a folder for it, and lands on that project's board with the first loop waiting
description: >
  Stand where a reader with nothing linked yet arrives, and walk the second way in to its end. Two
  cards, and nothing on the screen to paste into a terminal. Open the second and it asks which of
  this device's projects the folder is to be linked to — the step it takes before the folder picker —
  answer it, pick a folder, and read what the board that opens leads with.
steps_gui:
  - type: assert
    domain: folder
    op: ways-in
    with:
      absent: "bind --project"

  - type: action
    domain: folder
    op: open-existing-card

  - type: action
    domain: folder
    op: choose-project
    with:
      project: Greenhouse

  - type: assert
    domain: folder
    op: open-existing
    with:
      project: Greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse

  - type: assert
    domain: folder
    op: first-loop
    with:
      hands_over: AGENTS.md
