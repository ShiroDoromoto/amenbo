# Several rows picked out in the file panel, and the acts that then reach every one of them.
#
# A panel that can only act on the row under the pointer makes a reader do one file at a time, which
# is what every file manager stopped asking for decades ago. What is under test is not the picking on
# its own — a band drawn on three rows proves nothing — but that what a reader reaches for afterwards
# is about the rows they picked: the path copied out of the row menu, and the bin.
#
# ── Why the two gestures are read differently ────────────────────────────────────────────────────
# They answer different questions, so the road asks each the way only it can be asked. The adding key
# is read on two rows that are **not** neighbours, so that a press which had quietly taken everything
# between them fails; Shift is read on a run of three, so that a press which had done nothing but move
# to the row it was on leaves a different answer than a press which reached.
#
# ── Why the range is measured from a row picked two steps earlier ────────────────────────────────
# The range runs from wherever the last press without Shift landed, and the road walks away from the
# panel in between — into a file, and back out. That is the same fact read twice: what a reader picked
# is the panel's, not the tree's, so opening a file and coming back does not put it down.
#
# ── Why the paths are read in another file's text ────────────────────────────────────────────────
# A clipboard is off every window a run can shoot, so what a copy left is read where it is put down.
# The box is a file the road never copied, for the reason the single-row road uses one: a reading
# taken on the copied file's own text could not tell a paste that landed from a header drawing its
# name.
#
# ── What this road does not walk ─────────────────────────────────────────────────────────────────
# The other half of what a selection reaches — copying the rows themselves and pasting them into
# another folder — is not here, because a shot cannot be made to say it happened: a copy keeps the
# name it came from, the step that pastes opens the folder it lands in, and nothing shuts one again.
# So the copies and the rows they came from are drawn under one name each, and a reading that found
# one of them would have found it either way.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no second road. A selection is a thing on a screen: what the binary is handed is the paths
# themselves, and every command there names the files it is about.
id: pick-several-rows-and-act-on-all-of-them
title: The rows picked out in the panel are the rows the row menu and the bin act on
description: >
  Open the terminal face on a project whose folder holds four files. Pick two rows that are not
  neighbours with the key this machine adds to a selection with, and copy their paths from the row
  menu: both come out, and the row between them does not. Then reach from the second of them back to
  the first with Shift and press the bin: all three go together, and the file below the run stays.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

  # The three rows the road picks out. They sort together and above the file the paths are read in,
  # which is what makes a range across them a range of exactly these three.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: alpha.md
      content: SCENARIO the first of the three

  # The one in the middle. It is never pressed: what reaches it is Shift, and what must not is the
  # adding key.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: bravo.md
      content: SCENARIO the second of the three

  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: charlie.md
      content: SCENARIO the third of the three

  # The text box the copied paths are read in, and the row that says the bin took the run and not the
  # tree. It sorts below the three, so it is outside the range and on the screen after it.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: keep.md
      content: SCENARIO this file was here before anything was pasted into it

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: action
    domain: terminal
    op: show-side
    with:
      side: files

  - type: action
    domain: files
    op: tree
    with:
      open: true

  - type: assert
    domain: files
    op: listed
    with:
      name: alpha.md
      section: tree

  # ── two rows picked out, and the menu acting on both ──────────────────────────────────────────
  # Not neighbours, which is what the adding key is for: a press that had reached everything between
  # them would take bravo.md with it, and the reading below is what notices.
  - type: action
    domain: files
    op: pick
    with:
      name: alpha.md
      section: tree

  - type: action
    domain: files
    op: pick
    with:
      name: charlie.md
      section: tree

  # Opened on one of the two rows already picked out, which is the press a reader makes to act on
  # what they gathered — and what they gathered has to survive it.
  - type: action
    domain: files
    op: menu
    with:
      name: alpha.md
      section: tree

  - type: action
    domain: files
    op: copy-path

  - type: action
    domain: files
    op: open
    with:
      name: keep.md
      section: tree

  - type: action
    domain: files
    op: paste-into-editor

  - type: assert
    domain: files
    op: reading
    with:
      shows: alpha.md

  - type: assert
    domain: files
    op: reading
    with:
      shows: charlie.md

  # And the row standing between them is not on the clipboard: what came out is the two rows picked,
  # not the run they stand at either end of.
  - type: assert
    domain: files
    op: reading
    with:
      shows: bravo.md
      present: false

  - type: action
    domain: files
    op: back

  # ── the run reached with Shift, and the bin taking all of it ──────────────────────────────────
  # Measured from charlie.md, which is where the last press without Shift landed — two steps and a
  # file ago. Reaching back to alpha.md takes bravo.md with it, which no press of this road has ever
  # been on: that is the whole of what Shift is being asked here.
  - type: action
    domain: files
    op: pick-to
    with:
      name: alpha.md
      section: tree

  - type: action
    domain: files
    op: press
    with:
      key: delete

  - type: action
    domain: files
    op: answer
    with:
      answer: "yes"

  - type: assert
    domain: files
    op: listed
    with:
      name: alpha.md
      section: tree
      present: false

  - type: assert
    domain: files
    op: listed
    with:
      name: bravo.md
      section: tree
      present: false

  - type: assert
    domain: files
    op: listed
    with:
      name: charlie.md
      section: tree
      present: false

  # And the file below the run is still there: what went was the rows picked out, not everything the
  # tree was drawing.
  - type: assert
    domain: files
    op: listed
    with:
      name: keep.md
      section: tree
