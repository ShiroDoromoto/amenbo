# The one thing about getting started that only the screen ever says.
#
# A reader arriving with no folder linked yet is offered two ways in: raise a project, or open one
# this device already holds. Both are the interface's own to carry out — raising goes to a screen of
# its own, and opening asks which project and then hands over the folder picker, the same call the
# project settings screen makes. What undoes that is a card handing over a command and pointing the
# reader at a terminal: a folder linked from a terminal is a folder linked, so such a card leaves
# behind exactly the rows a working one does. There is no read to ask and no exit code to fail.
#
# The absence is read off a shot, and a shot of the wrong screen carries the command no more than the
# right one does — so what says the run stood where it was meant to is the second step, which is the
# card itself and is closed by an eye on its shot.
#
# What this wants in front of it is a device with a project on it: the open card is offered where
# there is something to open, and the choices it lists are what the store holds. Stand the project
# named below in the store the build under test opens (`devtool devgui cli`) and go to the getting
# started screen. The two steps are read off two screens, so drive it stepped (`--step`): the first
# shot is the screen as a reader arrives at it, and the run then hands back — open the second card
# and choose that project in it before releasing the second shot.
id: ways-in
title: Both ways in are the app's own to carry out — raise a project, or open one this device holds — and neither hands over a command to type
description: >
  Stand where a reader with nothing linked yet arrives, and read what is offered. Two cards, and
  nothing on the screen to paste into a terminal. Open the second and it asks which of this device's
  projects the folder is to be linked to — the whole of what that card is for, and the step it takes
  before the folder picker.
steps_gui:
  - type: assert
    domain: folder
    op: ways-in
    with:
      absent: "bind --project"

  - type: assert
    domain: folder
    op: open-existing
    with:
      project: Greenhouse
