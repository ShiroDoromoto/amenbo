# A task on the ledger says which pane its work is happening in, and pressing it goes there.
#
# It is `follow-a-ref-out-of-the-pane` read the other way. That road proves a ref drawn in a terminal
# is a way to the record; this one proves the record is a way back to the terminal. Until both stand,
# the ledger and the panes are joined in one direction only — an agent can point at its work, and
# nobody can find the agent.
#
# ── What the row is made of, and why neither half may be guessed ─────────────────────────────────
# Two things have to be true before the row is drawn, and they are held by two different parts of the
# app. A status move made inside a pane is written under that pane's session, which is
# what says the task is *held here*; and the terminal face is the only thing that knows which of its
# places is drawing that session, which is what says *where here is*. Neither is inferred from the
# other, and the row is absent unless both speak.
#
# So the road makes the move the only way it can be made — the CLI, from inside the pane — and reads
# the row by the pane's own name. A second task is reserved in the world instead, outside any pane,
# and it is `in_progress` exactly like the first: the same status, no row. That is the pair that
# gives "read, never inferred" something to mean, and it is the pair a build that guessed the pane
# from the folder and the time would fail on.
#
# ── Why two panes on two pages ──────────────────────────────────────────────────────────────────
# With one pane, "it went to the pane" and "it showed the terminal" are the same screen, and a press
# that only switched the face would read green. At one pane to a page the second pane is on a page of
# its own, and the road leaves the reader standing on it — so the press has a page to bring up, and
# what is on the screen afterwards says which pane it went to.
#
# ── The closing half ────────────────────────────────────────────────────────────────────────────
# The pane is then taken away with its work left standing, and the row goes with it while the
# reservation does not. **That is the whole honesty of this row**: it says "no pane here is working
# on this", and never "nobody is". A build that kept the row would offer a press into a terminal that
# is not there; one that dropped the reservation with it would have the screen deciding what the
# ledger holds.
id: go-to-the-pane-a-task-is-being-worked-in
title: A task names the pane its work is happening in, and pressing it goes to that pane
description: >
  Open a pane, reserve a task from inside it with the CLI, and name the pane with a line of the
  reader's own. Open a second pane, which at one to a page stands on a page of its own, and leave the
  reader there. On the ledger the task now draws a row naming the first pane — and a task reserved
  outside any pane, holding the same status, draws none. Press the row: the screen goes to the
  terminal, on the first pane's page, with that pane in front. Then take that pane away and leave its
  work standing: the row goes and the reservation does not.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Foundry
    as: foundry

  - type: action
    domain: folder
    op: bind
    with:
      dir: castings
      project: foundry

  # The task the pane takes. It is reserved from inside the pane below rather than here, because
  # where the move is made is the whole of what this road is about.
  - type: action
    domain: task
    op: create
    with:
      title: Reline the crucible before the next pour
      project: foundry
    as: crucible

  - type: action
    domain: task
    op: finish-creating
    with:
      target: crucible

  # The other task, reserved out here — which is a person at their own shell, an editor, another
  # machine. It reaches `in_progress` by the same path and leaves no row behind it, and it is what
  # keeps the reading above from being "any task that is being worked on".
  - type: action
    domain: task
    op: create
    with:
      title: Order the sand for the moulding floor
      project: foundry
    as: sand

  - type: action
    domain: task
    op: finish-creating
    with:
      target: sand

  - type: action
    domain: task
    op: status
    with:
      target: sand
      status: in_progress

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # Pressed rather than assumed: which project the face comes up on is the run's business, and a road
  # that read a screen it had not put itself on would be reading somebody else's.
  - type: action
    domain: terminal
    op: go-project
    with:
      project: Foundry

  # One pane to a page, so the second pane below lands on a page of its own. It is set while nothing
  # is open, so what follows is pages filling rather than a page being cut down to what is on it.
  - type: action
    domain: terminal
    op: set-panes
    with:
      count: 1

  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  # Down to a plain shell. What an agent does with a line typed at it is the agent's own, and the
  # command below is the whole of what puts this road's reservation where the row reads it.
  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task status <ref> in_progress --actor ai
      target: crucible

  # The reader's own words, which are what names this pane — and so what the row on the task has to
  # carry. Nothing else on the screen says them.
  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the pane at the furnace

  # The second pane, on a page of its own, and the reader is left standing on it. Without this the
  # press below would have nowhere to go and would prove only that the face came up.
  - type: action
    domain: terminal
    op: open-pane
    with:
      from: strip

  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the pane the reader is left on

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # The row, and the pane it names. Read on the task the pane reserved.
  - type: assert
    domain: task
    op: pane
    with:
      target: crucible
      shows: SCENARIO the pane at the furnace

  # And not on the other one, which is `in_progress` by the same word and was reserved where nothing
  # was watching. A build that read the ledger instead of the record of where the move was made would
  # draw the row here too, and it would point at somebody else's terminal.
  - type: assert
    domain: task
    op: pane
    with:
      target: sand
      shows: SCENARIO the pane at the furnace
      present: false

  - type: action
    domain: task
    op: go-to-pane
    with:
      target: crucible
      shows: SCENARIO the pane at the furnace

  # Where it landed. At one pane to a page this is the page that pane is on and no other, so finding
  # its line is finding the page the press brought up.
  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO the pane at the furnace

  # The page the reader was standing on when they left the terminal. It is still there and still
  # running; what the press did was move the screen off it.
  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO the pane the reader is left on
      present: false

  # ── The pane goes, the reservation stays ────────────────────────────────────────────────────────
  - type: action
    domain: terminal
    op: remove-pane
    with:
      shows: SCENARIO the pane at the furnace
      target: crucible
      answer: leave

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # The row is gone with the pane that carried it — there is nowhere left to be sent.
  - type: assert
    domain: task
    op: pane
    with:
      target: crucible
      shows: SCENARIO the pane at the furnace
      present: false

  # And the reservation is not. Read together, the two above are the sentence the row is allowed to
  # say: no pane here is working on this. A build that let the screen answer for the ledger would
  # have this one back at waiting.
  - type: assert
    domain: task
    op: field
    with:
      target: crucible
      field: status
      equals: in_progress
