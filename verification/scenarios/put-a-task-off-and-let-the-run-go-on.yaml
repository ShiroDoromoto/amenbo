# A run that lets go of the task it took without closing it hands it back to a person, and the task
# waits there until a person hands it back to the AI. A task that only waits for another — a fix that has
# to land first — needs no person, and was held up all the same.
#
# The built-in that puts the task off is the fourth way. The task goes back to `todo` on whoever it was
# on — the AI here — with the step's report on it, and the run goes on to whatever the picture draws
# next: here, the end of the run.
id: put-a-task-off-and-let-the-run-go-on
title: A run puts its task off, still on the AI, and goes on without stopping
description: >
  Start a run whose built-in takes a task, and report the step after it done into the built-in that
  puts the task off, which ends the run. The task is `todo` again, still assigned to the AI, with the
  step's report on its timeline, and the run has not failed: it is on the history tab as completed.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }

  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task that waits for another }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }

  # The same one-step action as hand-a-task-back-to-a-person-and-let-the-run-go-on, after the built-in
  # that takes the task. What follows it is the put-off, which ends the run: going round to the take would
  # take the same task again, since nothing here makes it wait for another.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that puts its task off" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: defer_task }, as: at_later }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_later } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, to: at_later } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_later } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # The step says the task waits for another, and leaves by the way out drawn to the put-off.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      exit: got one
      report: this task waits for the fix on main

  # Back to `todo`, and still on the AI, so a run takes it again once nothing holds it back.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: todo

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: assignee_kind
      equals: ai

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: this task waits for the fix on main
      present: true

  # Put off and ended: the run is over, and not failed.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: history

  - type: assert
    domain: automation
    op: history-row
    with:
      target: run
      state: completed
