# Work that was reserved and then abandoned by a process dying, put back in front of a person.
#
# A pane can die and the ledger not hear about it. What is left is a task sitting reserved with nobody
# at it — and a reserved task is out of everybody's mailbox, so nothing offers it and nothing on any
# screen said so. This road is the screen that now does.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no second road here and no gap in one. What is under test is a question drawn on the
# terminal face, and a terminal has nowhere to draw one: somebody at a shell reads their reservations
# by asking for them, which is a different thing and is walked elsewhere.
#
# ── The two reservations, and why the second one is the point ────────────────────────────────────
# The world stands up two tasks, reserved two different ways:
#
#  - one **in a pane** (`task adrift`), which carries the session that made it. Nothing is running
#    under that session — no driver has a pane — so it is a reservation nothing is at, and Amenbo can
#    say so because it knows which of its own sessions are still open.
#  - one **plainly** (`task status`), which carries no session at all. That is what a reservation made
#    at somebody's own terminal looks like, and Amenbo cannot see that terminal. It must not be asked
#    about, and the road reads its absence in the same question as the other one's presence — one
#    screen, both halves, so a build that started guessing would fail here rather than quietly widening.
#
# ── And the other kind, which is the same rule ───────────────────────────────────────────────────
# A decision put up for discussion and never settled is left in the middle exactly as a reservation is,
# and it is found the same way: the ledger says which pane put it up, the store says it is still
# proposed. So the world stands up two of those as well, one in a pane and one not, and the question
# is read for both. The question is one sentence over the two kinds — it is one question — and which kind
# a row is, and so what pressing it opens, is said by the ref it carries.
#
# ── Why the question is where it is ──────────────────────────────────────────────────────────────
# A face with nothing open on it is the one place with room for it and the one place a reader is
# already looking for something to start. So the road opens the face and reads what it is asking about
# — the project the face is on, and no other. The folder it is given is what puts the screen in that
# project.
#
# ── What pressing it may do, and what it may not ─────────────────────────────────────────────────
# Pressing a task opens it on the ledger's face. That is the whole of the affordance and it is the
# half worth defending: Amenbo does not know the work stopped, only that nothing it opened is at it,
# so it may not move a task back on its own. The road ends on the task's own face, which is where a
# person decides.
id: be-asked-about-work-nothing-is-doing-any-more
title: What a pane that has gone left in the middle is put back in front of a person, and what Amenbo cannot speak for is not
description: >
  Stand up four things left open in one project — a reservation and a proposal made in a pane that is
  no longer running, and one of each made the way somebody's own terminal makes them — then open the
  terminal face and give it that project's folder. Beside the pane it opens, the face asks about the
  two the pane left and says nothing about the other two. Pressing one opens that record on the
  ledger's face, each kind on the face that reads it, which is where the answer is given: nothing on
  this screen moves anything.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  # The folder is what puts a screen in a project: the project's panes open in it, and the question is
  # asked about the project it belongs to and no other.
  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO carry the ledger migration through
      project: greenhouse
    as: abandoned

  - type: action
    domain: task
    op: finish-creating
    with:
      target: abandoned

  # A phrase the task carries on its own face and nowhere else, so the step that reads which record the
  # press opened has something to read it by: the title is on the slot's row too.
  - type: action
    domain: task
    op: update
    with:
      target: abandoned
      notes: SCENARIO the store format has to move before anything else can

  # Reserved in a pane. Nothing runs under that session, so from this moment nothing is at it.
  - type: action
    domain: task
    op: adrift
    with:
      target: abandoned

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO sort the sender out
      project: greenhouse
    as: elsewhere

  - type: action
    domain: task
    op: finish-creating
    with:
      target: elsewhere

  # Reserved with nothing to say who by — what a reservation made at somebody's own terminal leaves.
  # Amenbo cannot see that terminal, so this one is never to be asked about.
  - type: action
    domain: task
    op: status
    with:
      target: elsewhere
      status: in_progress

  # The other kind, both halves of it. A decision is born proposed, so putting one up in a pane is the
  # only moment its author can be recorded — there is nothing to say later.
  - type: action
    domain: decision
    op: adrift
    with:
      title: SCENARIO which way the store format should move
      project: greenhouse
    as: unsettled

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO what to call the second window
      project: greenhouse
    as: theirs

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # The project's folder, which is what the question is asked about. It is the same one press the face
  # opens on, and here it is also what puts the screen in the project the question is about.
  - type: action
    domain: terminal
    op: open-folder
    with:
      dir: greenhouse

  - type: assert
    domain: terminal
    op: adrift
    with:
      target: abandoned

  # The half the whole rule rests on, read on the same screen: what Amenbo cannot speak for is what it
  # says nothing about — and it holds for both kinds, on the one screen, under the one question.
  - type: assert
    domain: terminal
    op: adrift
    with:
      target: elsewhere
      present: false

  - type: assert
    domain: terminal
    op: adrift
    with:
      target: unsettled

  - type: assert
    domain: terminal
    op: adrift
    with:
      target: theirs
      present: false

  # Pressing it opens the task, and opening is all it does.
  - type: action
    domain: terminal
    op: open-adrift
    with:
      target: abandoned

  - type: assert
    domain: task
    op: opened
    with:
      target: abandoned
      shows: SCENARIO the store format has to move before anything else can

  # And the reservation is still the reservation. This is the half the question's whole shape rests on:
  # the screen asked, and what to do about it is the person's.
  - type: assert
    domain: task
    op: field
    with:
      target: abandoned
      field: status
      equals: in_progress

  # And the same for the other kind, which lands on the other face. Back to the terminal first: the
  # press above left it, which is what a press that opens a record is for.
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # A proposal that was asked about is a proposal still open: the screen put it in front of somebody,
  # and settling it is theirs.
  - type: action
    domain: terminal
    op: open-adrift
    with:
      target: unsettled

  - type: assert
    domain: decision
    op: field
    with:
      target: unsettled
      field: status
      equals: proposed
