# One automation for tasks that need different things after they are taken: the built-in that splits
# by an axis sends the task down the way out named by its value on that axis. It is
# placed on one axis, and its ways out are that axis's values and the one for a task that carries none,
# so a line is drawn off a value by its name like off any other way out.
#
# The task carries the value that has a line of its own, and that line closes it; the other value and
# the unsorted one halt the run instead, so a run that went down the wrong one would not read as over.
# A run is only walked where the window started it, so the walk is the screen's; the terminal reads
# the placement standing on the axis's values.
id: send-a-task-down-the-line-its-category-names
title: A run splits a task by its category and goes down the way out its value names
description: >
  Give an axis a task holds one value of two values, and hand the AI a task carrying one of them.
  Place the built-in that takes a task, then the one that splits by that axis, with the task's value
  going on to closing it and the other ways out halting the run. On screen, start it and read the run
  over on the history tab and the task done.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  - { type: action, domain: dimension, op: create, with: { name: 職種 } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: 職種, value: エンジニア } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: 職種, value: デザイナー } }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the engineer's task, dimension: 職種, value: エンジニア }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that splits by the role" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: split_by_dim, axis: 職種 }, as: at_split }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_split } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_split, exit: エンジニア, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_split, exit: デザイナー, halt: true } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_split, exit: 分類なし, halt: true } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_cli:
  # The placement stands on the axis: a line hangs off a value by its name, as the built-ins are named.
  - type: assert
    domain: automation
    op: edge-read
    with:
      target: auto
      from: 分類で分ける
      exit: エンジニア
      to: タスクを閉じる

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: action
    domain: automation
    op: screen
    with:
      tab: history

  - type: assert
    domain: automation
    op: history-row
    with:
      target: run
      state: completed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: done
