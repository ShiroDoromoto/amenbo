# An axis a project cannot be left empty on, and the places the demand bites. Classification is
# otherwise entirely optional — a task filed under nothing is a task like any other — so what this
# raises is the exception: the axis whose answer a project will not do without. The demand lands on
# the steps a record passes through once — the one that ends a task's creation, and, on the decision
# side, both the record itself and the ruling that settles it — and nowhere else, which is what keeps
# raising it from stopping a board that is already full: the work already filed is finished being
# written, so it never meets the guard. A road that walked only the filing would read the same over a
# build whose flag does nothing, so this one is written to be turned away eight times — on the axis
# nobody could answer, on the creation that left the answer out, on the decision that would be
# recorded without it, on the acceptance that left it out, on the supersession that would settle a
# decision the same way, on the hand that would take the answer back off one task at a time, on the
# removal that would take it off every task at once, and on the removal that would leave the axis
# with nothing to answer with at all. The decision's two doors are walked by different people — one
# writes, another rules — which is why both are here, and why the rulings that meet the second door
# are the ones written before the demand went up.
id: make-an-axis-nobody-can-leave-empty
title: An axis marked required turns away the creation, the record and the acceptance that left it empty, and holds the answer on once it is there
description: >
  Raise the demand on an axis offering no values and be refused — a requirement nobody could answer
  would stop every creation on the project. Raise it on an axis that offers two, file a task without
  answering it, and watch the creation refused and the task held out of the mailbox. Put a value on
  and watch the same creation end. A decision left blank is turned away as it is recorded, and goes
  through once the answer rides along with it; the rulings written before the demand went up meet it
  where they are settled, through the acceptance and through the supersession that promotes one, and
  answering the axis opens both. Then try to take the value back off and be refused there too —
  from the task, and from the axis itself, where removing the value would empty every task on it at
  once unless the removal says where they go. Say where, and the value goes with the task carried
  over, and with the decision beside it; the axis's last value does not go at all, until the demand
  itself is lowered. The work that was already on the board when the demand went up is read back
  untouched.
# Two axes and one piece of settled work. The axes are the world rather than the road: filing under
# one is `classify-work-along-an-axis`'s road, and walking it again here would prove that road twice
# and this one not at all. `Focus` is left offering nothing on purpose — it is the axis the first
# refusal is about. And the standing task is finished being written *before* any demand goes up,
# which is the state the road reads back once the demand is up: a demand raised over a board changes
# nothing already on it.
given:
  - type: action
    domain: dimension
    op: create
    with:
      name: Focus

  - type: action
    domain: dimension
    op: create
    with:
      name: Medium

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: Medium
      value: print

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: Medium
      value: web

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO WORLD — work this board already carried
    as: standing

  - type: action
    domain: task
    op: finish-creating
    with:
      target: standing

  # Two rulings written before any demand goes up, and here for the same reason the standing task is:
  # once the flag is raised the record's own door turns a blank decision away, so the records that go
  # on to meet the *ruling's* door have to be the ones already on the board when it went up.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO WORLD — a ruling this board already carried
    as: standing-ruling

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO WORLD — the ruling that would replace it
    as: standing-revision

steps_cli:
  # The demand nobody could satisfy, refused where it would be raised. An axis offering no values has
  # no answer to give, so a task could never carry one — and the creation it would hold is every
  # creation on the project.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Focus
      refused: invalid_dimension_required_without_values

  # The same move on an axis that has answers to give, and it goes through. The two lines together are
  # what says the guard is about the values and not about the flag.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Medium

  # Raising it over a board changes nothing already on it: the work whose writing was finished before
  # the demand went up is finished still.
  - type: assert
    domain: task
    op: field
    with:
      target: standing
      field: draft
      equals: false

  # Nothing about filing this one says the axis is required — the first stage of a creation asks for
  # nothing, which is what makes the second stage the place the demand is met.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — filed with the answer missing
    as: seed

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed
      refused: invalid_task_required_dimension

  # Turned away leaves the task where it was rather than half-finished: still being written, and so
  # still out of the one listing a session takes its next work from.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: true

  - type: assert
    domain: task
    op: listed
    with:
      filter: "status:todo ready:yes"
      target: seed
      present: false

  # The answer goes on, and the very same step that was turned away now ends the creation — which is
  # what says the demand let go rather than never having been there.
  - type: action
    domain: dimension
    op: set
    with:
      target: seed
      dimension: Medium
      value: print

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "status:todo ready:yes"
      target: seed
      present: true

  # The same demand on the other kind of record, and its first door is the record itself. A decision is
  # written by one person and ruled on by another, so a demand read only at the ruling would turn away
  # somebody who was never the one who left the axis blank — the writer hears it here instead.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer missing
      refused: invalid_decision_required_dimension

  # The answer rides along with the record, and the same step goes through — which is what says the
  # demand let go rather than never having been there.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer given
      dimension: Medium
      value: print
    as: ruling

  # And the second door, met by a ruling written before the demand went up. Raising a flag does not
  # reach back, so this one is on the board with the axis blank — and it is the settling that reads it.
  - type: action
    domain: decision
    op: accept
    with:
      target: standing-ruling
      refused: invalid_decision_required_dimension

  # Turned away leaves it where it was, exactly as the creation was left: still under discussion, and
  # so still nothing the rest of the store is reading as settled.
  - type: assert
    domain: decision
    op: field
    with:
      target: standing-ruling
      field: status
      equals: proposed

  - type: action
    domain: dimension
    op: set
    with:
      target: standing-ruling
      dimension: Medium
      value: print

  - type: action
    domain: decision
    op: accept
    with:
      target: standing-ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: standing-ruling
      field: status
      equals: accepted

  # And the other door onto that same state. Superseding settles the new side on its way through, so it
  # is a settling like the acceptance above and meets the demand there too — which is what says the
  # guard is on the transition rather than on the one command that happens to be named after it.
  - type: action
    domain: decision
    op: supersede
    with:
      target: standing-revision
      replaces: standing-ruling
      refused: invalid_decision_required_dimension

  - type: assert
    domain: decision
    op: field
    with:
      target: standing-revision
      field: status
      equals: proposed

  - type: action
    domain: dimension
    op: set
    with:
      target: standing-revision
      dimension: Medium
      value: print

  - type: action
    domain: decision
    op: supersede
    with:
      target: standing-revision
      replaces: standing-ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: standing-revision
      field: status
      equals: accepted

  # And the door does not swing back. A demand met only at the creation would be a demand anyone could
  # empty a minute later, so taking the value off a required axis is refused as well — the way back to
  # an empty answer is to lower the demand, not to slip under it.
  - type: action
    domain: dimension
    op: unset
    with:
      target: seed
      dimension: Medium
      value: print
      refused: invalid_dimension_required_unset

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=print"
      target: seed
      present: true

  # Nor does the door swing back one turn further out. Taking the value itself away would empty every
  # task answering with it at once — the same state the line above refuses one task at a time — so a
  # required axis will not let it go while anybody is on it, and says so instead of doing it quietly.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: print
      refused: invalid_value

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=print"
      target: seed
      present: true

  # What it asks for is somewhere for them to go, and given that, the value goes. The task is carried
  # over rather than emptied, which is the whole of the difference between this and being turned away.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: print
      to: web

  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: Medium
      value: print
      present: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=web"
      target: seed
      present: true

  # And what was carried over is everything that answered with the value, not merely the tasks: one
  # axis and one set of values means one removal, so the decisions filed under it land where the tasks
  # did rather than being quietly emptied behind the same demand.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:Medium=web"
      target: ruling
      present: true

  # And the last one does not go at any price. Naming a destination is no way past this one — there is
  # no other value of the axis to name — so what is left is a demand the axis can still answer.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: web
      refused: invalid_value

  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: Medium
      value: web
      present: true

  # Lowered, the axis is an ordinary one again and the same hand goes through. The demand is an
  # attribute and not a one-way gate: what it holds shut, lowering it opens.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Medium
      required: false

  - type: action
    domain: dimension
    op: unset
    with:
      target: seed
      dimension: Medium
      value: web

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=web"
      target: seed
      present: false

steps_gui:
  # The screen's half, and it is a different half. A terminal meets the refusals as codes on an exit
  # status; this face has no code to give back, so what it does instead is hold the controls — the box
  # that would raise a demand nobody could answer, the button that would end a task's creation while
  # the demand is not met, the button that would record a decision the same way, and the removal that
  # will not go until it has been told where the tasks land. A held control is a thing only a screen
  # can be asked about, which is why the road here is those four and not the codes again.
  - type: action
    domain: dimension
    op: required
    with:
      dimension: Focus
      refused: invalid_dimension_required_without_values

  - type: action
    domain: dimension
    op: required
    with:
      dimension: Medium

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — filed with the answer missing
    as: seed

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed
      refused: invalid_task_required_dimension

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: true

  # Answered from the task's own pane, where the axis's control sits — the same place the held button
  # names, so a reader turned away by it has nowhere else to go.
  - type: action
    domain: dimension
    op: set
    with:
      target: seed
      dimension: Medium
      value: print

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: draft
      equals: false

  # The same demand on the other kind of record, met at the same door the terminal meets it at — and
  # this face answers with a held control rather than a code. What it holds is the button that records,
  # the decision twin of the task's held finish-creating and on a different screen, which is why a road
  # that walked only the task's would leave this unwalked.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer missing
      refused: invalid_decision_required_dimension

  # Answered where the form asks, and the same control that was shut lets the record through. The
  # answer goes in with the decision rather than after it, which is what the demand being met at the
  # form means at all — and the settling that a blank one would have been turned away at now passes.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded with the answer given
      dimension: Medium
      value: print
    as: ruling

  - type: action
    domain: decision
    op: accept
    with:
      target: ruling

  - type: assert
    domain: decision
    op: field
    with:
      target: ruling
      field: status
      equals: accepted

  # And the other control this face holds: the value the answer was given cannot simply be removed
  # while the answer stands on it, so the manager asks where the tasks go and carries them there. A
  # terminal names the destination on the command line; here it is a control that has to be found, and
  # the reading afterwards is of the board rather than of a refusal — the task is drawn under the value
  # it was moved to, which no exit status could have said.
  - type: action
    domain: dimension
    op: value-rm
    with:
      dimension: Medium
      value: print
      to: web

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:Medium=web"
      target: seed
      present: true
