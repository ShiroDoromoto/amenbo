# The way out of the app says a terminal is about to go, and lets the reader go or stay.
#
# **Ending the app ends every terminal in it at once.** A session is the process's — not a window's
# and not a pane's — so the gesture that ends Amenbo takes down every agent that was running, and what
# any of them was in the middle of doing does not come back (`app/src-tauri/src/quit.rs`). The talk
# itself does: each place is opened again on the session it was left in
# (`app/src-tauri/src/frames.rs`). Nothing
# afterwards can notice the running was lost, so the only place it can be said is in front of the
# gesture.
#
# ── Why no task is named ─────────────────────────────────────────────────────────────────────────
# The question says a terminal is going and nothing about what any of them was doing. What tied a
# pane to a task was a key the world could rewrite behind the pane, so a box naming what was about
# to be lost named as often work somebody had already finished elsewhere. What survives the app is on
# the ledger, which is where this road reads it.
#
# The one thing it does name is a provider whose pane will **not** be in its conversation afterwards,
# because the plain sentence promises every one of them will be
# (`app/src-tauri/src/frames.rs`, `panes_without_a_way_back`). Every pane on the legs about the
# ledger is a plain shell, which holds no conversation to come back to, so what those legs read is
# the plain sentence — said as an absence, because a build that named a provider there would be
# frightening somebody off a quit that costs them nothing.
#
# ── Why the last leg opens on a named provider ───────────────────────────────────────────────────
# The named half is the promise's other side, and it can only be walked on a pane whose provider has
# no way back. Which providers those are is the catalog's answer and changes; what does not change is
# that the machine this road stands up holds the catalog's own commands in its own order, so the leg
# names one of them and the sentence is read for that name. The pane has to be **running** besides —
# the question is only raised over something still going — which is why the stand-ins on this road
# stay open rather than printing and ending.
#
# The provider written below is the one the catalog has no way back for today. The day it gains one
# this leg goes red, and that is the road asking to be pointed at whichever provider is still without
# — not a fault in the build (`crates/amenbo-core/src/harness.rs`, `LAUNCHES`, the `resume` field).
#
# ── Why both doors are walked ────────────────────────────────────────────────────────────────────
# There are two ways out and they arrive by different roads. The menu's item is one this app wrote,
# which is what `⌘Q` reaches — the platform's own quit is wired to the operating system's terminate
# and never offers this side a say. The close pressed on the last window passes no menu at all and is
# caught in the run loop instead. One gate, two doors: a road that walked one would prove half of it.
#
# ── Why the silent way out is on the road ────────────────────────────────────────────────────────
# **No terminal open means no question.** That is a promise as much as the question is — a build that
# asked every time would put a box in front of somebody with nothing to lose, and the road that only
# ever walked the question would call that build green. So the last leg quits with no pane open and
# reads that nothing stood in the way.
#
# ── Why the app comes back between the legs ──────────────────────────────────────────────────────
# Every answer but `cancel` ends the app, and a road cannot walk on from there. The run brings another
# up on the same store, which is the harness's move and not the operator's: the app has to come up
# pointed at the run's own store and be namable by a pid. What the next leg opens on is therefore
# whatever the last one left written down, which is exactly what the readings below are about.
id: be-asked-before-the-app-takes-every-terminal-with-it
title: The way out of the app asks before it ends every terminal, and moves nothing on the ledger
description: >
  Reserve a task from a terminal running in a pane, then ask Amenbo to end. The question says every
  terminal is about to go, names no task, and offers two answers. Stay, and nothing has happened: the
  app is still running and the task is still held. Ask again and go — the app ends and the reservation
  is still standing when it comes back. Then do the same through the other door, the close on the last
  window, and that reservation stands too. Then quit with no pane open at all, and nothing is asked.
  Finally open a pane on a provider that will not be in its conversation again, and read the question
  naming it.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Foundry
    as: foundry

  - type: action
    domain: folder
    op: bind
    with:
      dir: forge
      project: foundry

  - type: action
    domain: task
    op: create
    with:
      title: Re-line the quench tank
      project: foundry
    as: tank

  - type: action
    domain: task
    op: finish-creating
    with:
      target: tank

  - type: action
    domain: task
    op: create
    with:
      title: Sharpen the plate shears
      project: foundry
    as: shears

  - type: action
    domain: task
    op: finish-creating
    with:
      target: shears

  # The row of things a pane can be opened with, made the run's answer rather than the machine's: the
  # catalog's own commands, in the catalog's own order, in front of whatever the operator has. Four of
  # them, because the last leg opens on the fourth. They stay open rather than printing and ending —
  # the way out asks about what is still running, and a stand-in that had already finished would leave
  # nothing to be asked about.
  - type: action
    domain: terminal
    op: can-start
    with:
      count: 4
      then: reads

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # Pressed rather than assumed: which project the face comes up on is the run's business, and a road
  # that read a screen it had not put itself on would be reading somebody else's.
  - type: action
    domain: terminal
    op: go-project
    with:
      project: Foundry

  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  # Down to a plain shell. What an agent does with a line typed at it is the agent's own, and the two
  # commands below are the whole of what puts a reservation on the ledger for the legs to read.
  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task list --actor ai

  # The move the readings below are about. It is made with the CLI from inside the pane because that
  # is where an agent makes one, and this road is about what the way out does to it.
  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task status <ref> in_progress --actor ai
      target: tank

  # ── Stay ────────────────────────────────────────────────────────────────────────────────────────
  # The menu's door. The question is read for what it says and what it does not, and then declined —
  # and what follows is the whole of what "nothing happens" has to mean.
  - type: action
    domain: store
    op: quit
    with:
      how: menu
      asks: true

  # The plain sentence, read for what it does not say. Every pane up is a shell, which holds no
  # conversation and is not one of the panes this half of the promise is about — so the question
  # singles nobody out. A build that named a provider here would be talking somebody out of a quit
  # that costs them nothing.
  - type: assert
    domain: store
    op: quit-names
    with:
      agent: Gemini CLI
      present: false

  - type: action
    domain: store
    op: answer-quit
    with:
      answer: cancel

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # The half a screen could get wrong on its own: a box that tidied the ledger up on the way out would
  # read the same on the question above and lose the fact here.
  - type: assert
    domain: task
    op: field
    with:
      target: tank
      field: status
      equals: in_progress

  # ── Go, and leave it standing ───────────────────────────────────────────────────────────────────
  # The answer that is not a mistake to be talked out of: somebody stepping away for the night has
  # every reason to leave a reservation where it is. The app ends on it, and the run brings one back.
  - type: action
    domain: store
    op: quit
    with:
      how: menu
      asks: true

  - type: action
    domain: store
    op: answer-quit
    with:
      answer: leave

  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: action
    domain: terminal
    op: go-project
    with:
      project: Foundry

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # Still held, across the very gap that could have unmade it. A person who meant to leave the
  # reservation standing has been taken at their word.
  - type: assert
    domain: task
    op: field
    with:
      target: tank
      field: status
      equals: in_progress

  # ── Go, through the other door ──────────────────────────────────────────────────────────────────
  # A fresh pane, on a run of the app that is itself fresh. The reservation is made the same way, and
  # the way out this time is the close on the last window — no menu is passed on the way. The two
  # doors arrive by different roads inside the app, so this is the half of the gate the menu cannot
  # prove.
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task list --actor ai

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task status <ref> in_progress --actor ai
      target: shears

  - type: action
    domain: store
    op: quit
    with:
      how: last-window
      asks: true

  - type: action
    domain: store
    op: answer-quit
    with:
      answer: leave

  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: action
    domain: terminal
    op: go-project
    with:
      project: Foundry

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # Still held. The door was different and the answer moved nothing, which is what the question
  # promises whichever way it was raised.
  - type: assert
    domain: task
    op: field
    with:
      target: shears
      field: status
      equals: in_progress

  # And the one left standing two legs ago is still standing. The press could only ever reach the
  # terminals, and never the ledger behind them.
  - type: assert
    domain: task
    op: field
    with:
      target: tank
      field: status
      equals: in_progress

  # ── Nothing to lose ─────────────────────────────────────────────────────────────────────────────
  # This run of the app was brought up by the run and nobody has opened a pane in it. There is nothing
  # to be asked about, so nothing is asked — the gesture is the whole of it.
  - type: action
    domain: store
    op: quit
    with:
      how: menu
      asks: false

  # ── And the half the plain sentence cannot say ──────────────────────────────────────────────────
  # A pane on a provider with no way back, running. The machine this road stood up holds the
  # catalog's own commands in the catalog's own order, so the name below is on the row whatever the
  # operator has installed of their own.
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: pick-start
    with:
      agent: Gemini CLI

  - type: action
    domain: terminal
    op: open-start

  - type: action
    domain: store
    op: quit
    with:
      how: menu
      asks: true

  # The goal this leg is here for. The sentence promises every pane comes back into its conversation;
  # this one will not, and the question says whose it is rather than leaving the reader to find out
  # at the next start.
  - type: assert
    domain: store
    op: quit-names
    with:
      agent: Gemini CLI

  - type: action
    domain: store
    op: answer-quit
    with:
      answer: leave
