# What a plugin is, read off the shelf it is on — before anything of it is installed.
#
# A catalog is served as two documents: the list every row is drawn from, and one detail document per
# plugin, fetched only when someone opens it. The detail is where installing it stops being a name and
# a description — the switch it hangs on, the events it will be woken for, the settings it will ask
# for, and whether this build can speak to it at all. It is what a person reads to decide, and a
# registered catalog's plugin is exactly the case that needs it: nothing outside the official index is
# reviewed by anybody, so the author's own declarations are the whole of what there is to go on.
#
# The reach it takes is per catalog. A row browsed off a registered shelf has to open against that
# shelf's document, not the official index's — where the name is not listed at all, so the panel comes
# up with the entry alone and nothing under it.
#
# Hence a scenario written for the screen. No CLI reads a catalog's detail document: `plugin list`
# answers per installed manifest, and installing off this catalog would need a signed asset, which is
# what the fake world deliberately cannot make. The fixtures serve it (`devtool fixtures gui`, with
# `--app` pointing at the build under test), and the declarations below are theirs.
id: plugin-detail
title: A plugin a registered catalog serves opens its detail from that catalog
description: >
  Open one row off a catalog of one's own registering. What comes up under it is that catalog's own
  detail document — the setting the plugin will ask for, in the words its author wrote — and not the
  empty panel a name the official index never listed would leave.
steps_gui:
  - type: assert
    domain: plugin
    op: detail
    with:
      name: standup
      source: In-house catalog
      declares: Channel webhook
