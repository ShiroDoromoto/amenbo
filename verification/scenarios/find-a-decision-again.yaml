# Finding a decision again. A store's decisions are read by narrowing, never by dumping the corpus,
# so this is not a convenience on top of the listing — it is how anyone reaches a decision they did
# not just write. This line holds the arms a reader actually reaches for: the keyword, which is
# `search`'s alone, and the two the listing narrows by — what a decision is, and what it is filed
# under.
#
# The two drivers ask the same thing and get there differently, which is what a terminal and a screen
# are. A terminal writes the whole narrowing as one line of grammar and reads the answer back; a
# screen has the values standing in front of it, so the set is composed press by press and the shot
# between two presses is where a set is told from an axis that simply kept the last one. Only the
# screen half can be asked that, which is why it is the longer road.
id: find-a-decision-again
title: A decision is found by keyword, by what it is, and by what it is filed under — and the ones that do not match stay out
description: >
  Record decisions on different subjects, leave them at different stages of their writing, and file
  them under different values of an axis, then ask for each by keyword, by where its writing got to and
  by classification. What is under test is the narrowing itself: an answer that returned everything, or
  that quietly returned nothing, reads as green either way, so every arm is asserted from both sides —
  the decision that matches is present, the one that does not is absent. On screen the same narrowing
  is composed in the panel the values stand in, which adds the two questions only a screen has: that an
  axis takes a set rather than the last press, and that folding the values away keeps the narrowing
  while giving back the room.
given:
  # The world both drivers open on: a corpus already worth separating — a record written out, one still
  # being written, a third that only the axis tells from the first, and one that was turned down.
  # Recording, writing out and filing are roads of their own (`record-a-decision`,
  # `read-whether-a-decision-still-holds`, `classify-work-along-an-axis`); walking any of them to
  # arrange this world would prove that road twice and this one not at all.
  - type: action
    domain: dimension
    op: create
    with:
      name: theme

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: theme
      value: main

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: theme
      value: window

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the retention window
    as: retention

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the installer layout
    as: installer

  # The third: written out like the first, so the flag keeps it, and filed under the other value, so
  # only the classification axis can take it away.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the sidebar width
    as: sidebar

  # And the fourth, which is the one the state axis can reach and the flag cannot: a record turned down
  # is not half-written, so nothing but its own state separates it.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the second window bar
    as: dropped

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: retention

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: sidebar

  - type: action
    domain: dimension
    op: set
    with:
      target: retention
      dimension: theme
      value: main

  - type: action
    domain: dimension
    op: set
    with:
      target: installer
      dimension: theme
      value: window

  - type: action
    domain: dimension
    op: set
    with:
      target: sidebar
      dimension: theme
      value: window

  - type: action
    domain: dimension
    op: set
    with:
      target: dropped
      dimension: theme
      value: main

  # Filed before it is turned down, because a record nobody took is one nobody goes back to.
  - type: action
    domain: decision
    op: reject
    with:
      target: dropped

steps_cli:
  # By keyword: `search` reads over title and body, and the subject that was not asked for stays out.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: retention
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: installer
      present: false

  # By how far the writing got, which is the separation a reader makes before anything else — a record
  # written out is the store's answer, a half-written one is still somebody at a keyboard. It is a flag
  # and not a state, so it is asked for on a key of its own.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "draft:no"
      target: retention
      present: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "draft:no"
      target: installer
      present: false

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "draft:yes"
      target: installer
      present: true

  # And by the state itself, which the flag cannot stand in for: the record it keeps is written out like
  # the one it leaves out, so nothing but the state separates them.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "status:rejected"
      target: dropped
      present: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "status:rejected"
      target: retention
      present: false

  # And by what it is filed under, which is the arm none of those above reaches: the record it leaves
  # out is written out like the one it keeps, so nothing but the axis separates them.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:theme=main"
      target: retention
      present: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:theme=main"
      target: sidebar
      present: false

  # The two narrowings together, which is what a reader actually types: they AND, so the record that
  # answers one of them and not the other is out.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "draft:no dim:theme=window"
      target: sidebar
      present: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "draft:no dim:theme=window"
      target: installer
      present: false

steps_gui:
  - type: action
    domain: decision
    op: open-filters

  # Read with nothing chosen yet, which is what makes every "gone" below mean anything: a row the
  # list never drew would be absent from every shot of this road, and each of those steps would pass
  # on a list that had lost it before the narrowing began.
  - type: assert
    domain: decision
    op: narrowed
    with:
      target: installer
      present: true

  - type: assert
    domain: decision
    op: narrowed
    with:
      target: dropped
      present: true

  # The panel offers the state and the writing on one axis, because that is where a reader looks for
  # both — so the set below is composed of one of each.
  - type: action
    domain: decision
    op: choose-filter
    with:
      axis: status
      value: rejected

  # One value in, and the record the value does not name is gone. This is the shot the set is proved
  # against: it has to be taken before the second value goes in, or nothing tells a set from an axis
  # that simply kept the last press.
  - type: assert
    domain: decision
    op: narrowed
    with:
      target: installer
      present: false

  - type: action
    domain: decision
    op: choose-filter
    with:
      axis: status
      value: draft

  - type: assert
    domain: decision
    op: narrowed
    with:
      target: installer
      present: true

  # And the row the first press brought in is still there, which is the whole of the question: a press
  # that had cleared its neighbour would leave the list holding this one's opposite and nothing else.
  - type: assert
    domain: decision
    op: narrowed
    with:
      target: dropped
      present: true

  - type: action
    domain: decision
    op: choose-filter
    with:
      axis: dim:theme
      value: main

  # The second axis, which the first one cannot stand in for: the record it takes away is one the axis
  # above chose, so it is standing until this press. Both halves are read, or what the press is
  # credited with is a row the first axis had already taken.
  - type: assert
    domain: decision
    op: narrowed
    with:
      target: installer
      present: false

  - type: assert
    domain: decision
    op: narrowed
    with:
      target: dropped
      present: true

  - type: action
    domain: decision
    op: close-filters

  - type: assert
    domain: decision
    op: filters-folded
    with:
      axes: 2

  # And the narrowing outlives the values it was composed in. Both halves are read, because a fold
  # that dropped the selection and one that kept it look alike on the row that was standing anyway.
  - type: assert
    domain: decision
    op: narrowed
    with:
      target: dropped
      present: true

  - type: assert
    domain: decision
    op: narrowed
    with:
      target: installer
      present: false
