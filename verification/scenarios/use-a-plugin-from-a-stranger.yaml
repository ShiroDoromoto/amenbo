# Someone else's plugin, and what it may say to the AI reading this folder's briefing.
#
# `amenbo agent --json` is a document an AI follows, so a sentence that lands in it is read as
# guidance the user put there. An author Amenbo has never met can write one — the manifest is theirs
# — and no machine can rule on whether a sentence is a description or an instruction. So the line is
# not drawn around the wording: it is drawn around who wrote it. The catalog's badge is the one thing
# an author cannot grant themselves, and a plugin without it carries no prose into that document at
# all — its calls arrive as lines to type, and nothing else it wrote comes with them.
#
# What is lost is not what is hidden. The one sentence every manifest must carry is still written
# where a person reads it, which is the face it was for.
#
# The badge is taken off an installed plugin here rather than a stranger's plugin being installed:
# every plugin the official catalog serves arrives badged, so this state has no other road to it.
id: use-a-plugin-from-a-stranger
title: A plugin from outside the catalog is callable, and none of its author's prose reaches the AI's briefing
description: >
  Install a plugin, take the catalog's badge off it so it stands as any stranger's would, and switch
  it on. Read the entry point: the plugin is offered and its calls arrive as lines an AI can type,
  with the calling form Amenbo puts in front of the author's own subcommand. Then read what is not
  there — the occasion the author named, the line beside each call, and the description every
  manifest must carry — none of which reaches a document an AI follows. Finally read the face a
  person reads, where that description is written whoever wrote it: what the split decides is which
  reader a sentence reaches, not whether it is kept.
steps_cli:
  - type: action
    domain: plugin
    op: install
    with:
      name: worktree

  # Off the catalog's shelf and out of its name: from here on this is a plugin like any a user finds
  # on their own.
  - type: action
    domain: plugin
    op: unbadge
    with:
      name: worktree

  - type: action
    domain: plugin
    op: enable
    with:
      name: worktree

  - type: action
    domain: plugin
    op: declare-agent
    with:
      name: worktree
      when: SCENARIO — when an AI should reach for this plugin
      cmd: start <task-id>
      does: SCENARIO — what the call does, and what it returns

  # The call still arrives, whole and typeable. A stranger's plugin is not a suspect one: the user
  # installed it and switched it on, and an entry point that dropped it would be answering a question
  # about trust that the gate already answered.
  - type: assert
    domain: plugin
    op: at-entry
    with:
      name: worktree
      present: true
      cmd: start <task-id>

  # And nothing the author wrote in words comes with it. `cmd` is held to a grammar, so no sentence
  # fits in it; every field that could hold one is simply not there to hold it.
  - type: assert
    domain: plugin
    op: at-entry
    with:
      name: worktree
      present: true
      absent: desc,when,does

  # The sentence is not gone, it is where its reader is: `plugin list` is what a person reads, and
  # every plugin's description is written there whoever wrote it. What it says is the author's and is
  # not read back here — where it is readable is Amenbo's, and that is what is under test.
  - type: assert
    domain: plugin
    op: listed
    with:
      name: worktree
      desc: true
