# The one thing about a plugin that only the screen ever says.
#
# A catalog's own document carries an `official` flag per entry, and the badge is the strongest claim
# a row can wear. It is not the entry's to make: a catalog anyone may register can put the flag on
# everything it serves, so the merge clears it on everything but the official index's own. Nothing in
# the CLI reads it back — `plugin catalog list` answers per catalog, `plugin list` per installed
# manifest — so a merge that stopped clearing it would ship looking exactly like one that did.
#
# Hence a scenario written for the screen alone. What it needs is a registered catalog whose entries
# claim to be official, which the fake world serves and registers (`devtool fixtures gui`, and
# `--app` points it at the build under test): both of its plugins claim the badge, so a merge that
# stopped folding takes this shelf's name off both rows rather than one.
id: plugin-browse
title: An entry a registered catalog serves is badged with that catalog, however loudly its own document claims to be official
drivers: [gui]
description: >
  Look at the market with a catalog of one's own registered. Its rows say where they came from — the
  name that catalog was given at registration — and not "official", which the catalog's document
  claims for every entry on it and which no shelf outside the official index can grant itself.
steps:
  - type: assert
    domain: plugin
    op: browsed
    with:
      name: standup
      source: In-house catalog
      official: false
