# Retro — dark only. A black command window in a white double frame, drawn in a pixel face that
# travels with the file. There is no light side: this look is the black ground.
#
# `font-smooth: none` and the three weights go together. The face is drawn on a grid, so smoothing
# puts a grey rim on every dot; with it off, the synthesised bold that the weights ask for is a
# line two device pixels wide instead of one, and nothing in between. Turn the smoothing back on
# and the same bold is what smears.

name: retro
title: "Retro"
skin_v: 1
author: "Amenbo"
version: "1"
license: "Apache-2.0"
themes: [dark]

