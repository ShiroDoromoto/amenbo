# A pane is a real terminal, and under it stands a box that is Amenbo's own.
#
# What the box buys is text editing that does not differ by CLI. Undo is a different press in every
# agent and one of them has no undo at all, so a pane that sent keys through could never offer it;
# a box on the page has undo, redo and select-all from the browser, whatever is running above it.
#
# ── What the road is about ──────────────────────────────────────────────────────────────────────
# Two things, and they are the two halves of one rule.
#
# **A line written there is unsent until a person sends it.** That is what parts this box from the
# terminal's own input line: a build that sent as it was written would have answered whatever the
# program was asking at that moment, and on a first run one of the real answers to that runs a
# script off the network. So the road writes, reads the box with nothing run, and only then sends.
#
# **An empty box hands its presses on.** The keys that walk a history, complete a word or leave a
# menu are the ones a person at a prompt reaches for without looking, and a box standing in the way
# of them would have taken them away by being there. What decides is what is written, and never what
# the program is drawing — that second question cannot be asked of a terminal at all, which is the
# whole reason the rule is the one it is.
#
# **And the up arrow is the way back, out of either box.** The rule above leaves a person unable to
# answer a program that has put a menu up, so the up arrow — on the first line where something is
# written — is left as the road out: it moves the keyboard to the terminal and goes there itself.
# Walking and choosing are the one press, and a build that handed the arrow on while keeping the
# keyboard would let a menu be walked and never chosen. What was written stays in the box, which is
# the half the road reads after it — a way out that threw the line away is one nobody would take
# twice.
#
# ── Why the box is opened first, and read as it opens ───────────────────────────────────────────
# A pane comes up with the box folded away, and the presses in it go to the program: that is what a
# pane is before anybody asks for anything else, and a slash command typed at a CLI needs the
# characters to reach it to be completed at all. So a person who means to write asks for the box, and
# the box comes to hand with the keyboard already in it — a pane hands it there as the box comes up,
# there being no click to make after. That is read at the top of the road because it is the one
# moment it can be read: every step after this one has put the keyboard somewhere itself.
#
# ── Why the arrow is walked first ───────────────────────────────────────────────────────────────
# The box is empty when a pane has just been opened and at no other point on this road, so the press
# that only an empty box hands on is walked before anything is written. It is read twice over: the
# shell walked its history, and the mark says the keyboard left with the press. `ctrl-c` after it is
# the road tidying up as much as anything: the recalled line is standing at the prompt, and it is the
# fifth press the box hands on, so abandoning it walks one more of them and leaves a clean prompt for
# the half that follows — and that press puts the keyboard back in the box, because it is asked for
# over a box the operator clicks into first.
#
# ── Why the stop is walked over a written box, and what it does not prove ───────────────────────
# Escape and ctrl-c are the exception to the rule above: they go to the program whatever is written,
# because they are the presses that mean "stop" and somebody reaching for one has usually begun the
# next line already. What a plain prompt can answer for is that the line survived the
# press — read below — and no more than that: a shell draws nothing at all in answer to escape, and
# what it draws for ctrl-c is a mark and a fresh prompt that a reading cannot tell from the words
# already on the pane. **So the arrival is not read here.** A road that could read it would have to
# open the pane on a program that visibly ends, and that is not this road: what is sent here has to
# be answered the same way every time, which is why the pane is taken down to a shell.
#
# ── Why a second pane is opened at the end ──────────────────────────────────────────────────────
# Everything above is one pane, and one pane cannot say where the keyboard went. A person working in
# two presses the one they mean and writes — the frame moving and the keyboard moving are one act to
# them, and a build where only the frame moved leaves them typing into the pane they pressed away
# from. So the last leg opens a second pane, presses the first, and reads the mark that says which
# box has the keyboard.
#
# ── Why the mark is read rather than typed at ───────────────────────────────────────────────────
# A character sent to find out where the keyboard is would be a character added to the line still
# standing in that box, which the leg before this one has just read. The mark beside the box says the
# same thing and takes nothing: the box tells the page as it takes the keyboard, and the mark is
# drawn from that answer.
#
# ── Why the pane runs a shell ───────────────────────────────────────────────────────────────────
# What is sent has to be answered by something that answers the same way every time. A folder with
# an agent on it opens on the agent, and what an agent does with a line is the agent's own — so the
# pane is taken down to a plain prompt first, the way every road that speaks in one does.
id: write-a-line-under-the-pane-and-send-it
title: A line is written in the box under the pane, stands there unsent, and goes when it is sent
description: >
  Open a pane on a plain shell and open the box beneath it, which a pane comes up without. The box
  has the keyboard as it opens, nobody having clicked into it. With nothing written in it, press the
  up arrow and watch the shell's own history answer it — the press went past the box. Then write a
  line in the box: it stands there with nothing run. Send it with return, and it reaches the
  terminal. Write a second and send it with the press beside the box instead. Then write a third, and leave the box by
  the first line's up arrow: the shell walks its history, and the third line is still standing in the
  box. Then open a second pane and press back onto the first, and read which box the keyboard is in.
  What is under test is that the box holds what is written until a person sends it, stays out of the
  way while it is empty, lets a person back to the program without losing what they wrote, and comes
  to hand both as a pane opens and in the pane a press moves the work to.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # The frame and not the way in beside it: the project was bound where the world was stood up, so
  # the press opens a pane in that folder and asks nothing.
  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: open-shell

  # ── The box, asked for, and the keyboard that comes with it ───────────────────────────────────
  # Asked for before anything can be written in it: a pane that came up folded has nothing to write
  # in. Every step below this one is about that box.
  - type: action
    domain: terminal
    op: open-box

  # Nothing has been clicked since, so what the mark says here is what opening the box did. Read
  # before the line below is typed, which is the last moment nothing else has moved the keyboard.
  - type: assert
    domain: terminal
    op: keys-in-the-box

  # ── The empty box, which hands its presses on ─────────────────────────────────────────────────
  # Typed at the terminal itself rather than in the box, and that is the point of it: what the arrow
  # below asks for is the shell's own history, and only a line the shell was given is in it.
  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the seedling trays were counted on the first cold morning

  - type: action
    domain: terminal
    op: press-through
    with:
      key: up

  # The shell answered the press, which is the whole of what "handed on" means here. The line is back
  # where it was typed, waiting to be run again.
  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: SCENARIO the seedling trays were counted on the first cold morning

  # And the keyboard went with the press. That is the half a walked line cannot say on its own: a
  # build that handed the arrow on and kept the keyboard leaves the person walking a menu they have
  # no way to choose from, because the return that would choose is the box's.
  - type: assert
    domain: terminal
    op: keys-in-the-box
    with:
      present: false

  # Abandoned rather than run, which walks the fifth press the box hands on and leaves the prompt
  # clean for what follows.
  - type: action
    domain: terminal
    op: press-through
    with:
      key: ctrl-c

  # ── Written in the box, and nothing sent ──────────────────────────────────────────────────────
  - type: action
    domain: terminal
    op: write-to-pane
    with:
      text: SCENARIO this line is written and has not been sent anywhere

  - type: assert
    domain: terminal
    op: still-to-send
    with:
      shows: SCENARIO this line is written and has not been sent anywhere

  # ── Sent with the keys ────────────────────────────────────────────────────────────────────────
  # Return held with this machine's own modifier. Return alone writes a new line, which is what the
  # box was made to allow, so the send is the two together.
  - type: action
    domain: terminal
    op: send-written
    with:
      by: key

  # It reached the program: the shell was given the line, echoed it, and did not know the command.
  # What is read is the line itself, which is on the pane because the terminal put it there.
  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO this line is written and has not been sent anywhere

  # ── And sent with the press beside the box ────────────────────────────────────────────────────
  # A second line, because the first is already on the screen: a press read against words that were
  # there before it would say nothing about the press.
  - type: action
    domain: terminal
    op: write-to-pane
    with:
      text: SCENARIO this second line went by the press beside the box

  - type: action
    domain: terminal
    op: send-written
    with:
      by: button

  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO this second line went by the press beside the box

  # ── The way back out of a written box ─────────────────────────────────────────────────────────
  # A third line, and it is not sent: what this half is about is leaving the box with something still
  # in it. One line and not two, because the road out is the up arrow on the *first* line — a caret
  # any lower and the press is the box's own.
  - type: action
    domain: terminal
    op: write-to-pane
    with:
      text: SCENARIO this third line is being left behind in the box

  - type: action
    domain: terminal
    op: press-out

  # The press reached the program, which is what "the keyboard went with it" means here: the shell
  # walked its history back to the line it was last given, and that line is the one the box sent a
  # moment ago. Different words from the third line, so neither reading can be the other's.
  - type: assert
    domain: terminal
    op: in-the-box
    with:
      shows: SCENARIO this second line went by the press beside the box

  # And nothing was paid for the way out. The third line is where it was written, still unsent.
  - type: assert
    domain: terminal
    op: still-to-send
    with:
      shows: SCENARIO this third line is being left behind in the box

  # ── And the press that stops, made over a line half written ───────────────────────────────────
  # The state the two readings above leave is the one this half wants: a line the shell is holding on
  # its own input line, and a line standing unsent in the box. The press that abandons the first is
  # made without emptying the second, which is the one exception to the box's rule —
  # somebody reaching for "stop" has usually started writing the next thing already, and a box that
  # took the press by standing there would have taken away the only answer to what was just sent.
  - type: action
    domain: terminal
    op: press-through
    with:
      key: ctrl-c
      holding: true

  # What the box was holding is where it was. That is the half of the exception a prompt can answer
  # for: the press cost the line nothing, so the way out of a mis-sent line is one a person can take
  # without losing the one they were writing.
  - type: assert
    domain: terminal
    op: still-to-send
    with:
      shows: SCENARIO this third line is being left behind in the box

  # ── The pane a press moves the work to ────────────────────────────────────────────────────────
  # A second pane, opened where the first one was opened from. It is the one being worked in the
  # moment it comes up, which is what makes the press below a press that moves the work.
  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: open-shell

  # This pane's box too, and before a word is typed at it: the readings at the end of the road are of
  # two marks, and a pane still folded draws neither of them. The box comes to hand with the keyboard
  # in it, which the line below then takes away again — that order is the point, because what those
  # readings rest on is a box that is there and does not have the keyboard.
  - type: action
    domain: terminal
    op: open-box

  # Typed at the terminal so this pane has words of its own to be named by. Both panes work in the
  # one folder, and there is nothing else here to tell them apart by.
  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the second pane was opened beside the first

  # The keyboard is in this pane now, and in its terminal rather than in its box: the line above was
  # typed at the program. Read before the press, so what the press moves is a thing the road watched
  # standing somewhere else first.
  - type: assert
    domain: terminal
    op: keys-in-the-box
    with:
      on: SCENARIO the second pane was opened beside the first
      present: false

  # Back to the first pane, by a press and nothing more.
  - type: action
    domain: terminal
    op: press-pane
    with:
      shows: SCENARIO this second line went by the press beside the box

  # Where the press put the keyboard: in the box under the pane it moved the work to, so the next
  # thing this person types is written where they pressed.
  - type: assert
    domain: terminal
    op: keys-in-the-box
    with:
      on: SCENARIO this second line went by the press beside the box

  # And the pane they left keeps none of it. Both boxes are read, because one of them saying yes is
  # only half of what a person needs: a build that handed the keyboard to every box would pass the
  # reading above.
  - type: assert
    domain: terminal
    op: keys-in-the-box
    with:
      on: SCENARIO the second pane was opened beside the first
      present: false

  # And nothing was written or sent on the way: the third line stands in that box as it was left.
  - type: assert
    domain: terminal
    op: still-to-send
    with:
      shows: SCENARIO this third line is being left behind in the box
      on: SCENARIO this second line went by the press beside the box
