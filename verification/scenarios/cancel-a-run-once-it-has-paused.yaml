# Cancelling a run cuts nothing off: only a paused run is cancelled, and nothing is under way in one.
# A run still going is turned away, with the two ways on — pause it and cancel it once it has
# stopped, or force-cancel it where it stands, which asks first since what it cuts off can leave
# changes half made.
#
# The two roads walk different halves, because a pause settles only where the app is carrying the run.
# A run started at a terminal opens nothing, so its pause stays asked for and the run stays running:
# the terminal road reads the refusal, and that the refusal still stands while the pause is only
# asked for, and ends the run with the force-cancel. The screen road starts a run that takes the
# task filed with its role and holds it in the built-in that waits, pauses it after that task from its
# row, and cancels it once it is paused.
#
# The wait is the room the screen road needs: the pause has to be asked for while the task is still
# being worked. The task going to done is what says the round is over and the pause has taken hold.
id: cancel-a-run-once-it-has-paused
title: Only a paused run is cancelled; a run still going is paused first, or force-cancelled
description: >
  Start a run whose first box takes a task, filed with its role, and holds it in a wait. At the
  terminal, cancelling it is turned away while it is running, and still turned away once a pause has
  only been asked for; the force-cancel ends it canceled. On the screen, pause it from the running tab
  after the task it is on, wait for the task to be done, read its row paused, cancel it, and read it on
  the history tab as canceled.
given:
  # The task the run takes, handed to the AI and written through.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run is paused after }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }

  # Take → wait → close, and out once there is nothing to take. The terminal road carries no built-in
  # out at all, so the wait is left unanswered there.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one paused and cancelled" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_take }
  # The task is the born role's, whose round starts there: a run takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed, role_of: auto } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: wait }, as: at_wait }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_wait } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_wait, exit: 完了, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_cli:
  # A run's steps are opened by the app, so a run is started with one up on the store.
  - { type: action, domain: store, op: app-up }
  # A run starts from the newest saved version, so it is saved first.
  - { type: action, domain: automation, op: save, with: { target: auto } }

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # Running, so there is something under way to cut off: turned away.
  - type: action
    domain: automation
    op: cancel
    with:
      target: run
      refused: invalid_value

  - type: action
    domain: automation
    op: pause
    with:
      target: run

  # A pause asked for is not a pause: the run is still going until it settles, so the cancel is
  # still turned away.
  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running
      pause_requested: true

  - type: action
    domain: automation
    op: cancel
    with:
      target: run
      refused: invalid_value

  # The force-cancel ends it where it stands.
  - type: action
    domain: automation
    op: stop
    with:
      target: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: canceled

steps_gui:
  - { type: action, domain: workspace, op: show-face, with: { face: workspace } }
  - { type: action, domain: workspace, op: show-face, with: { face: tasks } }
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: auto } }

  # Long enough to ask for the pause while the task is still being worked.
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "60" } }

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # Taken, and held in the wait.
  - { type: assert, domain: task, op: field, with: { target: seed, field: status, equals: in_progress } }

  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: assert, domain: automation, op: run-row, with: { target: run, state: running } }

  # Paused after the task it is on: the wait ends, the task is closed, and the run pauses where it
  # would take the next one.
  - { type: action, domain: automation, op: press-run, with: { target: run, press: pause-before-next-task } }
  - { type: action, domain: task, op: wait-field, with: { target: seed, field: status, equals: done, seconds: 180 } }

  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: assert, domain: automation, op: run-row, with: { target: run, state: paused } }

  # A paused run is cancelled with no question: there is nothing to cut off.
  - { type: action, domain: automation, op: press-run, with: { target: run, press: cancel } }

  - { type: action, domain: automation, op: screen, with: { tab: history } }
  - { type: assert, domain: automation, op: history-row, with: { target: run, state: canceled } }
