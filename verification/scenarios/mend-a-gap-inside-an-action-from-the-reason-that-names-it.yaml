# A gap inside an action reads, under the automation's head, like one of the box's own — a way out with
# nothing after it, named by the step it leaves. The box's panel cannot mend it: what happens after a
# step's way out is written on the action's own picture. So the reason's line says it opens the action
# to fix it, and the press opens that action over the automation, on the step it names, where the way
# out is decided. Back on the automation, the reason is gone.
id: mend-a-gap-inside-an-action-from-the-reason-that-names-it
title: A reason whose gap is inside an action opens the action on its step, and is mended there
description: >
  Stand a definition up whose only hole is a way out inside an action: the step inside has nothing set
  to happen after it. Read the reason under the head naming the step, and press it: the action's build
  screen opens over the automation's with that step picked out. Decide the way out there, go back, and
  read the automation ready to start.
given:
  # The action whose step leaves by a way out nothing is set to happen after.
  - { type: action, domain: automation, op: action-add, with: { name: draft }, as: draft }
  - { type: action, domain: automation, op: step-add, with: { target: draft, name: write, prompt: write the draft }, as: write }
  - { type: action, domain: automation, op: action-entry, with: { target: draft, step: write } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one hole inside an action" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: draft }, as: at_draft }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_draft, step: write, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_draft } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_draft, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # The hole, named by the step inside, on the launch place.
  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: open_exit
      box: write
      pressable: true
      present: true

  # Its line says it opens the action, and the press lands there, on the step.
  - type: action
    domain: automation
    op: press-reason
    with:
      reason: open_exit
      box: write
      opens: draft

  - type: assert
    domain: automation
    op: action-over
    with:
      name: draft
      draft: false

  # Decided where it is written: the step's done way out ends the action by its own.
  - type: action
    domain: automation
    op: set-next
    with:
      ends: exit

  - type: action
    domain: automation
    op: action-back

  # Back on the automation, nothing is in the way any more.
  - type: assert
    domain: automation
    op: launch
    with:
      ready: true
