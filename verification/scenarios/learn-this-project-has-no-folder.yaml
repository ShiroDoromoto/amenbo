# A project with no folder linked is one no AI can reach. The pointer a folder carries is the whole of
# an agent's reach, so a project without one is a list kept by hand — which is not what any of this is
# for. Creating a project asks for a folder, so the way in here is having the last one unbound, which is
# allowed, or having been raised before that rule existed. Either way the reader has to be told, and the
# board is where they are standing when they could act on it.
#
# What is under test is the telling, on a board that has work on it. How much work is not part of the
# question, and that is the half that goes wrong quietly: a warning drawn only over an empty board
# leaves the reader holding forty cards and no folder — the very one nothing else on the screen speaks
# about — with nothing said to them at all. So the road puts a card down first and reads the warning
# over it.
#
# The other half is that it stands alone. A board carries one standing notice, and the two that would
# otherwise be up here both hand the reader the same command to give their AI. So the reading is taken
# the other way round: that command has to come back off the shot missing. What that catches is a board
# holding out the first loop, or the wiring text, over a project with nowhere to open a terminal and
# nothing to paste into — an offer the reader cannot take.
#
# GUI only, and not by omission: which notice a board carries leaves behind exactly the rows the others
# do. There is no read to ask and no exit code to fail — the screen is the only witness.
#
# The project with no folder linked is declared below and stood up before the app is launched. What is
# left to the operator is to stand on that project's own board: the card is made on the screen the
# warning is then read over.
id: learn-this-project-has-no-folder
title: A project with no folder linked says so on its own board, over the work it is already holding, and is the only notice standing there
description: >
  Put a card on the board of a project that has no folder linked, then read what the board carries above
  it. The warning is there whatever the board holds, it offers the one move that ends it, and the cards
  it stands over are left where they were. What says it is standing alone is the command the other two
  notices both hand over being nowhere on the screen.
given:
  # Raised with a folder, because raising one asks for a folder — the way into this state is having
  # the last one taken off afterwards, which is the second step and the whole of the premise.
  - type: action
    domain: project
    op: create
    with:
      name: Orchard
      dir: orchard

  - type: action
    domain: folder
    op: unbind
    with:
      dir: orchard

steps_gui:
  - type: action
    domain: task
    op: create
    with:
      title: Draft the winter planting order

  - type: assert
    domain: folder
    op: none-linked
    with:
      absent: agent --json
