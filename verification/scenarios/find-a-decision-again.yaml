# Finding a decision again. A store's decisions are read by narrowing, never by dumping the corpus,
# so this is not a convenience on top of the listing — it is how anyone reaches a decision they did
# not just write. This line holds both arms a reader actually types: the keyword, which is `search`'s
# alone, and the status, which is the listing's.
id: find-a-decision-again
title: A decision is found by keyword and by status, and the ones that do not match stay out
description: >
  Record two decisions on different subjects and settle one of them, then ask for each by keyword and
  by status. What is under test is the narrowing itself: an answer that returned everything, or that
  quietly returned nothing, reads as green either way, so every arm is asserted from both sides — the
  decision that matches is present, the one that does not is absent. The two arms are two commands:
  words go to `search`, and the listing's filter narrows by status.
steps_cli:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the retention window
    as: retention

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the installer layout
    as: installer

  - type: action
    domain: decision
    op: accept
    with:
      target: retention

  # By keyword: `search` reads over title and body, and the subject that was not asked for stays out.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: retention
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: installer
      present: false

  # By status: settled and unsettled are the two a reader separates before anything else — an
  # accepted decision is standing policy, a proposed one is still someone's suggestion.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "status:accepted"
      target: retention
      present: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "status:accepted"
      target: installer
      present: false

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "status:proposed"
      target: installer
      present: true
