name: ci-full-manual

# The whole of _ci.yml on demand, with its path gate forced open — the same body the nightly
# leg runs (ci-full-nightly.yml), reached by hand instead of by the clock.
#
# This is the run that stands before a tag: `make release` names it, and what it is watching is
# the path filter's own judgment rather than the diff. Cutting a release on a narrowed run would
# ship whatever a wrong filter skipped.
#
# It is a file of its own rather than a second trigger on the nightly leg because both would then
# share one concurrency group, and dispatching this would cancel a nightly midway.
#
# The hand at the button is not always a person's: _dependabot-automerge.yml dispatches this against
# the branch it just pushed a lockfile repair onto, because that push started no run of its own and
# the head it left needs a verdict. That is why the group is keyed by ref — two branches judged at
# once must not cancel each other — and why the job below is named `ci`.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named `ci` to match ci-change.yml: a called workflow's checks are reported as
  # `<this id> / <job name>`, and `ci / all green` is the single check main requires. A run started
  # here has to be able to answer it, or the verdict it produces satisfies nothing.
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      full: true
    permissions:
      contents: read
      pull-requests: read
