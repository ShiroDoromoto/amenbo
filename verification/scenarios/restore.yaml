# The way back in. This is the round trip, deliberately in one line: a backup checked only for
# existence and a restore checked only against a store nobody diverged would both read green while
# the archive held nothing usable. So the store is moved on after the snapshot — a new task, and a
# finished one — and the restore has to undo both.
id: restore
title: A store is put back from its snapshot — what the archive held returns, what happened after it is gone
description: >
  Seed a store, snapshot it, then diverge from the snapshot in the two directions a store can move:
  something added that was not in it, and something changed that was. Restoring is a replace, not a
  merge, so both have to come back to where the archive left them — the added task gone, the finished
  one open again — with the decision and the timeline intact and the restored store reporting sound.
steps:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — in the archive
    as: seed

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — a note taken before the snapshot
    as: note

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — settled before the snapshot
    as: settled

  - type: action
    domain: decision
    op: accept
    with:
      target: settled

  - type: action
    domain: store
    op: backup
    as: snapshot

  # Move on from the snapshot, both ways: a row the archive never saw, and a row it saw open.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — registered after the archive was written
    as: afterwards

  - type: action
    domain: task
    op: done
    with:
      target: seed

  - type: action
    domain: store
    op: restore
    with:
      target: snapshot

  # What the archive held is back, down to the state each row was in.
  - type: assert
    domain: task
    op: listed
    with:
      filter: "done:false"
      target: seed
      present: true

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: todo

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — a note taken before the snapshot
      present: true

  - type: assert
    domain: decision
    op: field
    with:
      target: settled
      field: status
      equals: accepted

  # And what happened after it is not: a restore that merged would leave this one standing.
  - type: assert
    domain: task
    op: listed
    with:
      filter: "done:false"
      target: afterwards
      present: false

  # A store swapped underneath itself is only restored if it is also sound.
  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
