# A run has to have somewhere to stand. Every step of one opens a terminal, and terminals live in the
# workspace — so a press made while no workspace is open is a press with nowhere to put what it
# starts, and it is turned away at the press rather than listed among the things a definition is
# short of. That is the line this road walks: the one refusal that is about the window and not about
# the definition, and the press right after it, which stands a pane up.
id: start-an-automation-from-the-build-screen
title: The press that starts a run is turned away while no workspace is open, and stands a pane up once one is
description: >
  Stand a definition up that has nothing missing, and press the button that starts a run twice: once
  with the ledger on the screen and no workspace open, and once with the workspace standing. The
  first is refused and says why, the second draws the run's own pane. The launch place is read
  first, so that the refusal is known to be about the window — a definition still short
  of something would refuse for its own reasons and the road would prove nothing.
given:
  # Claude Code is one of the two agents this machine can start — two being the fewest the premise
  # stands up — so the launch check has nothing to say about who carries the step out. `reads` keeps
  # the stand-in standing, which is what leaves a pane on the screen to read.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }

  # The task the built-in the run starts at takes, so the run goes on to the step after it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The action the run opens once the built-in has taken the task, holding the one step it runs. Its
  # way out is declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — nothing missing" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  # Both ways out say what happens after them. A way out with nothing after it is the one thing a
  # launch check will not let past, and this road is about the other refusal.
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # Nothing is in the way of this definition, which is what makes the refusal below about the window.
  - type: assert
    domain: automation
    op: launch
    with:
      ready: true

  # The press with nowhere to put what it would start. A closed workspace is not on the list above —
  # it is not about the definition, and it stops being true the moment a window opens — so it is
  # raised here, at the press.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      refused: workspace_closed

  - type: assert
    domain: automation
    op: run-pane
    with:
      present: false

  # A workspace, and the same press again.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      present: true

  # The press goes where the run went: the run's pane is the one being worked in, rather than the
  # reader being left on the build screen to go looking for it.
  - type: assert
    domain: workspace
    op: worked-in
    with:
      shows: "SCENARIO SEED — nothing missing"
