# The window the workspace is split out into holds it whole — every pane, the rail, the
# sizes and the pages — and comes up on the pane the person was working in.
#
# `put-the-workspace-on-its-own-screen` walks the same control on a board with one pane on it, and one
# pane is the shape everything this road is about is invisible in. A window that carried one pane out
# carries the right one where there is only one, and a window that came up on the first page comes up
# in the right place where there is only one page. **Neither of them is what a person has on their
# screen**: a board holds several panes over several pages, and what "put the workspace on the other
# display" means is that all of it goes.
#
# ── What breaks without this road ────────────────────────────────────────────────────────────────
# A window that took one pane still looks like a window that worked. It draws a terminal, the line
# typed into it is on it, and nothing on the screen says the other two panes are unreachable until
# the reader goes looking for them — by which time they have moved the window to the second display
# and started working. What they find then is a terminal they cannot add a pane to, page away from or
# split, and the only way back to the panes they left is folding the whole app into one window again.
#
# ── Why the panes carry lines ────────────────────────────────────────────────────────────────────
# Every pane is typed into for the reason every road that speaks in a pane types: the line is the
# reader's own words, so it is on the screen because a person put it there and not because the
# interface drew it — which is what lets a road tell one terminal from another in any language. Three
# of them, so "the page the reader was on" is a page that is neither the first nor the last.
#
# ── Why the panes are one to a page ──────────────────────────────────────────────────────────────
# A pane with nothing to be measured against takes the whole page, so three panes opened in a row are
# three pages without anything being pressed for. That is what makes the pages worth reading: with
# three of them, the window coming up on the second is a fact about where the reader was rather than
# an accident of there being only one place to come up on.
#
# They are gathered onto one page at the end for the same reason in reverse — a page that draws all
# three at once is what says the panes came over as panes and not as a picture of one. It takes three
# presses rather than one because a size is one pane's answer: the reader points the control at a
# pane, and the panes behind it are laid down again around what they asked for. Walking that in the
# second window is the reading — the control is there, and what it does there is what it does on the
# board.
#
# ── Why it folds back ────────────────────────────────────────────────────────────────────────────
# The shape a machine last used the app in is remembered where a throwaway store does not reach, so a
# road that walked away split out would hand whoever owns the machine two windows they never asked
# for. The last steps are the road's own tidying as much as they are the half of the decision they
# prove.
#
# The world is a project with one folder, so nothing is asked about where a pane works — that
# question is `choose-the-folder-a-split-out-window-works-in`'s and
# `open-a-pane-where-a-project-keeps-more-than-one-folder`'s. What the panes run is the reader's own
# shell, and a terminal is not a record: there is no work on the board to stand up.
id: take-the-whole-workspace-to-the-other-screen
title: The window the workspace is split out into holds the whole face, and opens on the pane that was being worked in
description: >
  Open three panes one to a page and get a line onto each, go back to the middle one, and split the
  workspace out. The window that opens comes up on that pane, and the other two are reachable in it by
  the pages beside them — then set it to four panes to see all three standing on one page, which is
  the split control working in the second window too. Fold back, and the board has them all again.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Sawmill
    as: sawmill

  # One, so nothing is asked about where a pane works — every press on an empty frame opens there.
  - type: action
    domain: folder
    op: bind
    with:
      dir: log-yard
      project: sawmill

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # Pressed rather than assumed: which project the face comes up on is the run's business, and it is
  # the project whose panes the split-out window draws.
  - type: action
    domain: workspace
    op: go-project
    with:
      project: Sawmill

  # The first pane, and down to a plain shell — what an agent does with a line typed at it is the
  # agent's own, and these lines have to sit where they were put.
  - type: action
    domain: workspace
    op: open-pane
    with:
      from: face

  - type: action
    domain: workspace
    op: open-shell

  - type: action
    domain: workspace
    op: type-line
    with:
      text: SCENARIO the first page

  # The second and the third, each landing on a page of its own because a page holds one. A page that
  # holds one is full as soon as it has one, so the way in is the strip beside the pane.
  - type: action
    domain: workspace
    op: open-pane
    with:
      from: strip

  - type: action
    domain: workspace
    op: open-shell

  - type: action
    domain: workspace
    op: type-line
    with:
      text: SCENARIO the middle page

  - type: action
    domain: workspace
    op: open-pane
    with:
      from: strip

  - type: action
    domain: workspace
    op: open-shell

  - type: action
    domain: workspace
    op: type-line
    with:
      text: SCENARIO the last page

  # Back to the middle one, which is where the reader is when they press. The line is a second one
  # and names nothing: what it does is put them in that pane.
  - type: action
    domain: workspace
    op: go-page
    with:
      page: 2

  - type: action
    domain: workspace
    op: type-line
    with:
      shows: SCENARIO the middle page
      text: SCENARIO still the middle page

  # Out into a window of its own. Every step from here names its window, this one included, because
  # from here there are two: the board keeps the product's name alone, and the other carries it with
  # a dash and a word after it. The word is in the run's own language, so the window is named below by
  # the part of its title every language keeps.
  - type: action
    domain: workspace
    op: split-out
    window: Amenbo

  # **It came up where the reader was.** A window that opened on the first page would draw a terminal
  # and look exactly like this one, and the reader would be somewhere they did not ask to be.
  - type: assert
    domain: workspace
    op: pane
    window: "Amenbo — "
    with:
      shows: SCENARIO still the middle page

  # And the pages are there, which is what says the other panes came over rather than being left on a
  # board nobody is looking at. Read from the far one back, so a window that could only reach forward
  # is caught too.
  - type: action
    domain: workspace
    op: go-page
    window: "Amenbo — "
    with:
      page: 3

  - type: assert
    domain: workspace
    op: pane
    window: "Amenbo — "
    with:
      shows: SCENARIO the last page

  - type: action
    domain: workspace
    op: go-page
    window: "Amenbo — "
    with:
      page: 1

  - type: assert
    domain: workspace
    op: pane
    window: "Amenbo — "
    with:
      shows: SCENARIO the first page

  # And the sizes, the last of the three things this window has to be able to do. It is a grip on the
  # pane itself rather than a control in the header, so what it says here is that the panes came over
  # and not a picture of them. The pane this window came up on goes first: at a quarter it no longer
  # fills its page, and the panes behind it are laid down again around it.
  - type: action
    domain: workspace
    op: stretch-pane
    window: "Amenbo — "
    with:
      size: quarter

  - type: assert
    domain: workspace
    op: pane-size
    window: "Amenbo — "
    with:
      size: quarter

  # The one before it, which comes back to the first page and takes this one with it. The page a
  # pane is on is worked out from the order every time, so a pane that shrank lets the ones behind it
  # come up — and the screen follows the pane that was pulled.
  - type: action
    domain: workspace
    op: go-page
    window: "Amenbo — "
    with:
      page: 1

  - type: action
    domain: workspace
    op: press-pane
    window: "Amenbo — "

  - type: action
    domain: workspace
    op: stretch-pane
    window: "Amenbo — "
    with:
      size: quarter

  # And the last of the three, which is now alone on the page after the first.
  - type: action
    domain: workspace
    op: go-page
    window: "Amenbo — "
    with:
      page: 2

  - type: action
    domain: workspace
    op: press-pane
    window: "Amenbo — "

  - type: action
    domain: workspace
    op: stretch-pane
    window: "Amenbo — "
    with:
      size: quarter

  # All three on one page now, with the one way in beside them — which is what says they came over as
  # panes and not as a picture of one.

  - type: assert
    domain: workspace
    op: frames
    window: "Amenbo — "
    with:
      count: 3
      empty: 1

  - type: action
    domain: workspace
    op: fold-back
    window: "Amenbo — "

  # One window again, with all three panes on its face — each still drawing its own session, which is
  # what says the move cost none of them anything.
  - type: assert
    domain: workspace
    op: frames
    with:
      count: 3
      empty: 1

  - type: assert
    domain: workspace
    op: pane
    with:
      shows: SCENARIO still the middle page
