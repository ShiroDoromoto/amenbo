name: _ci

# The body of the merge gate. It starts nothing itself — `ci-change.yml` runs it on a
# change, `ci-full-nightly.yml` and `ci-full-manual.yml` run it with the path gate forced
# open. Every job lives in this one workflow, so one event fires one workflow run (with N
# jobs) instead of N separate runs. Runner minutes are unchanged — each job still gets its
# own runner — but the run list, status, and concurrency group are unified.
#
# Cost: this repo is public, so Actions minutes are free — the net is no longer drawn
# to save minutes but by what a change can affect: the `changes` path gate below runs
# each build/test job only when a change could have moved it. The host crate IS clippy+test
# gated (the `app-rust` job below), but the native Tauri .app *bundle* (macOS only) is
# deliberately NOT built here — it is a distribution artifact reserved for a tag/dispatch
# trigger, not a test gate.
#
# Which OS a job runs on follows from what only that OS can compile. Everything platform-neutral
# stays on Linux, and the Rust jobs are mirrored onto the other two because the code they judge is
# not: `target_os = "macos"` and `cfg(windows)` branches are invisible to a Linux compiler, so on
# Linux alone they would ride into a release never having been built. The host crate is mirrored
# onto both, and so is the workspace. Those mirrors build and test only — the installers each OS
# ships stay in the release workflow.
#
# The path gate decides what a diff can have moved, and it can be wrong: a layer whose inputs are
# not all listed, or a path listed under no layer at all, is skipped by a filter that believes it
# has judged. Nothing in that diff says so — the run is green and short. The nightly entry calls
# this workflow with `full: true`, which forces every gated job on whatever the diff touched, so a
# hole in the filter surfaces within a day instead of on release day.
#
# Concurrency belongs to the entries, not here: each one keys its own group, so the nightly leg and
# a change's run never take each other down.

on:
  workflow_call:
    inputs:
      full:
        description: run every gated job, whatever the diff touched (the nightly leg)
        type: boolean
        default: false

# Cache writes belong to main. Every rust-cache step below restores; only a run on main saves.
# A run on a PR reads main's entry — a run may restore from its base branch and the default one —
# and then throws away what it built, which sounds wasteful until the saving is counted. Each PR
# filled entries of its own, scoped to `refs/pull/<n>/merge`, which no other PR can read and which
# outlive the merge by a week: measured on 2026-08-17 that was 3.8GB of the repository's 10GB budget
# held by five already-merged PRs and one already-merged task branch. Past the budget GitHub evicts
# the least recently used entry, and the entry evicted is as likely to be one main is still using —
# which is how a Windows leg comes to rebuild from nothing — 727s, measured on this workflow.
#
# What a PR gives up is the delta its own lockfile bump rebuilds on every push, and not a cold build:
# rust-cache's restore key drops the lockfile hash, so a bumped lock still lands on main's entry and
# recompiles only what moved.
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Path gate for the build/test jobs: run each only when a change can affect it.
  #
  # `rust` (gates the workspace's test jobs, the e2e job beside each of them, the
  # lint jobs that judge the source once, and the host crate's) is a positive
  # allowlist of the Rust build inputs: the workspace crates, the
  # manifests/lockfile, the toolchain + lint + nextest config, .cargo/, the
  # out-of-workspace Tauri host crate (app/src-tauri), and this workflow. A change confined to relay/ or docs (or
  # any non-Rust tree) matches none of these, so the Rust suite is skipped.
  #
  # `gui` (gates gui-web) is a positive allowlist of every front-end build input:
  # the app/ tree (src, package*.json, tsconfig, vite/vitest config, src-tauri
  # types), plus the root .nvmrc that setup-node reads and the workflow itself.
  # A Rust-only change touches none of these, so the GUI typecheck+build+vitest is
  # skipped. app/src-tauri/** is under app/**, so a Tauri command change still
  # reruns the GUI (its TS bindings may depend on it).
  #
  # The audit jobs are path-gated too: cargo-audit on the Cargo manifests/lock (+
  # its config), npm-audit on the app's package manifests/lock — so a change that
  # touches no dependency (e.g. a relay-only or docs push) doesn't run them. The
  # trade-off is that a newly-disclosed advisory on an UNCHANGED dep isn't flagged
  # until the next dependency change — which is why those two, and the two linter
  # gates (whose runner-side versions float), are defined in _rot-gates.yml and also
  # run on a timer from rot-gates-weekly.yml, with no path filter at all. Here they
  # stay gated: a job a diff can't have moved has nothing new to report, so skipping it
# keeps the run list to what actually changed.
  # tree-guards stays always-on: what it looks for — an internal-note reference,
  # Japanese test prose — can appear in any file, and the scans are seconds.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    # On pull_request events dorny/paths-filter lists changed files via the GitHub
    # API, which needs pull-requests:read. The repo's default token is
    # contents/metadata/packages:read only, so without this the job fails with
    # "Resource not accessible by integration" on every PR — which, since the
    # gated jobs `needs: changes`, would skip ALL build/test on PRs. (push events
    # diff via git and need no extra scope.)
    permissions:
      contents: read
      pull-requests: read
    # `full` is the one place the nightly leg is honoured: every gated job below reads these
    # outputs and nothing else, so forcing them here turns the whole workflow on without an event
    # guard on each job. `inputs.full` is empty on push and pull_request, which is falsy, so those
    # two keep reading the filter. Written as `and/or` rather than `||` because a filter output is
    # the STRING "false", and a non-empty string is truthy in an expression.
    outputs:
      rust: ${{ inputs.full && 'true' || steps.filter.outputs.rust }}
      verification: ${{ inputs.full && 'true' || steps.filter.outputs.verification }}
      gui: ${{ inputs.full && 'true' || steps.filter.outputs.gui }}
      go: ${{ inputs.full && 'true' || steps.filter.outputs.go }}
      shell: ${{ inputs.full && 'true' || steps.filter.outputs.shell }}
      cargo_deps: ${{ inputs.full && 'true' || steps.filter.outputs.cargo_deps }}
      npm_deps: ${{ inputs.full && 'true' || steps.filter.outputs.npm_deps }}
      catalog_key: ${{ inputs.full && 'true' || steps.filter.outputs.catalog_key }}
    steps:
      - uses: actions/checkout@v7
      # Skipped on the nightly leg: there is no diff to read there (the run is a schedule, not a
      # push or a pull request), and its answer would be discarded by the outputs above anyway.
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ !inputs.full }}
        with:
          # The layer definitions themselves live in .github/paths-filters.yml, because the
          # local gate (`make gate`) reads the same file to pick the stages it runs. A layer
          # declared in one place cannot drift from the other.
          filters: .github/paths-filters.yml

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel (1.96.0) and components
      # (rustfmt/clippy); rustup installs them on the first cargo invocation, which is what this
      # step is for — rust-cache below reads the rustc version.
      - name: Show toolchain
        run: rustc --version && cargo --version

      # rust-cache over a hand-rolled actions/cache: it caches only reusable
      # dependency artifacts (not this workspace's own crates, which change every
      # commit and would bloat the key), auto-evicts stale entries, and keys on the
      # rustc version + Cargo.lock + enabled features — so a lockfile bump no longer
      # throws away the whole `target`. Must run after the toolchain exists (Show
      # toolchain above triggers the rustup install) since it reads the rustc version.
      #
      # `shared-key` puts every job that builds this workspace on one cache entry per
      # platform. Without it the key carries the job id, so each job fills a cache of its own
      # — and the six here (this one, rust-e2e, lint, and their three mac-win counterparts)
      # compile the same dependencies from the same lockfile, which when there were four of them
      # was 774MB of the repository's 10GB cache budget spent storing one answer four times, and
      # a new job starting from nothing every time one is added.
      #
      # This job is the one that saves, and what it stores is the dependency build every reader
      # wants. It is no longer the widest build — `lint` builds all targets under all features —
      # but the three features this workspace declares (`e2e`, `scale`, `scale-heavy`) are empty
      # markers that gate targets rather than pull crates, so both feature sets resolve to one
      # dependency graph. The readers take it with `save-if: false` rather than racing to upload
      # the same bytes and having the loser's upload rejected.
      #
      # `SAVE_CACHE` (top of this file) narrows that to a run on main: on a PR this job restores
      # main's entry like the readers do, and saves nothing.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ env.SAVE_CACHE }}

      # nextest runs each test in its own process and in parallel — faster than
      # `cargo test` and it prints per-test timings (slow tests surface in the
      # final summary; thresholds live in .config/nextest.toml).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest

      # The everyday test run skips the feature-gated heavy suites (read_scaling_guard
      # behind `scale`, the cli_e2e_* slices behind `e2e`) so local runs stay sub-second; CI MUST
      # enable them or those guards silently rot. Enable scale+e2e only, and not `--all-features`:
      # `scale` (not `scale-heavy`) seeds read_scaling_guard at a *medium*
      # store and runs only its deterministic O(result) ratio guards — the full 10k seed + the
      # wall-clock guards run on the `full` legs (the `scale-heavy` job below), off the PR path. The `ci` profile
      # (.config/nextest.toml) runs every test to completion (no fail-fast) so one failure doesn't
      # mask the rest.
      #
      # The e2e slices are not here — they are the `rust-e2e` job below, and this one holds the rest
      # of the suite. `cli_e2e_*` is every slice of that suite (crates/amenbo-cli/tests/e2e), named
      # by prefix so a new one lands on the right side of the line without either job being touched.
      - name: Test (feature-gated scale suites + everything else)
        run: cargo nextest run --profile ci --features scale,e2e -E 'not binary(/^cli_e2e/)'

  # The e2e half of the suite, on a runner of its own. The rest of it is the `rust` job above, and
  # neither half asserts anything the other decides — so the gate's wait is the longer of the two and
  # not their sum. On Windows that is the difference that matters: the e2e slices and everything else
  # are the two longest test runs in the workflow, and only one of them stands on the critical path.
  #
  # A runner of its own is also the separation the e2e suite needs. Run interleaved with the rest on
  # one box, it has twice been ended mid-test by a signal — the CLI child had already written its
  # answer, and re-running the same commit was green — which points at the load the run puts on the
  # machine rather than at anything either side asserts. Two jobs keep that load apart, and they let
  # each half report its whole picture: the `ci` profile runs every test to completion, and one job
  # going red says nothing about whether the other one ran.
  #
  # No clippy and no doc steps here: those judge the tree once, in the `lint` job, which is where
  # every verdict that is about the source rather than about a test run now lives. The feature set
  # matches (`scale,e2e`), so this job builds the same dependencies the `rust` job does and reads its
  # cache rather than filling one of its own.
  rust-e2e:
    name: cargo test (CLI e2e)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and components; rustup installs them on the first cargo
      # invocation, which is what this step is for — rust-cache below reads the rustc version.
      - name: Show toolchain
        run: rustc --version && cargo --version

      # The `rust` job's cache, read and not written: same workspace, same lockfile, same features, so
      # the entry it saves is the one this job wants. `save-if: false` because the two run at once and
      # only one upload of identical bytes can land.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest

      - name: Test (the CLI e2e suites)
        run: cargo nextest run --profile ci --features scale,e2e -E 'binary(/^cli_e2e/)'

  # The `rust` job above, on the two platforms it cannot speak for. Twelve files in the workspace carry
  # a `target_os = "macos"` branch and twelve a `cfg(windows)` one; on Linux the compiler walks past
  # every one of them, so nothing builds them on the way to a release. This job builds and tests them
  # on every change that can reach them. The host crate's other half is gated the same way, by
  # app-rust-mac-win below.
  #
  # It mirrors the `rust` job's test step and stops there. Clippy is the `lint` / `lint-mac-win`
  # pair, which between them cover all three platforms for the same reason this job exists — a
  # `cfg`-gated branch is invisible to the compiler that walks past it, and so is the lint on what
  # is inside it. The doc steps stay on Linux alone:
  # almost every doc comment in the tree is outside an OS branch, so a third rustdoc run would
  # re-read what one has already judged. What that leaves out is a doc link written inside a
  # `cfg`-gated item — no platform but its own can resolve it — and that sliver is accepted rather
  # than paid for with a rustdoc run per OS on every change.
  rust-mac-win:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Windows only: the runner's default TEMP is C:\Users\RUNNER~1\AppData\Local\Temp, on the
      # system drive, while the workspace and every target dir sit on D:. The suite stands up a
      # store per test and places it by `std::env::temp_dir()`, so the default splits the hottest
      # I/O of the run off the drive doing all its other work. Naming the workspace drive's temp
      # dir instead cut Windows test execution by 40% on this job and 12% on the e2e one (median of
      # 4-7 repetitions per condition, measured 2026-08-18 — a single pair proves nothing here, the
      # same condition scatters 759-1212s across runners). The build is unmoved, and rust-cache's
      # key does not read TMP/TEMP, so nothing goes cold on the way in. RUNNER_TEMP rather than a
      # literal D:\a\_temp — which is what it resolves to today — because the runner puts it on the
      # workspace drive by construction, so an image that moves the workspace moves this with it.
      # The same step heads rust-e2e-mac-win and app-rust-mac-win below.
      - name: Put TMP/TEMP on the workspace drive
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          echo "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          echo "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      # The store is SQLCipher-encrypted, so rusqlite's bundled-sqlcipher-vendored-openssl builds
      # OpenSSL from source, and openssl-src configures it by shelling out to perl. On Windows the
      # perl a step resolves may be MSYS2's, which lacks Locale::Maketext::Simple and dies in
      # ./Configure — so name the runner's Strawberry Perl, which openssl-src reads ahead of PERL
      # and PATH. A step rather than the job's `env` because the variable must be ABSENT on macOS,
      # not empty: openssl-src takes an empty value as the program to run. Same reason, and the same
      # wording, as app-rust-mac-win below — both jobs build this workspace.
      - name: Name the runner's Strawberry Perl for the OpenSSL build
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV

      - name: Show toolchain
        run: rustc --version && cargo --version

      # One entry per platform, shared with rust-e2e-mac-win and lint-mac-win the way the `rust` job
      # shares with rust-e2e and lint — the key carries the OS and arch, so this saves the mac one
      # and the Windows one and the Linux job's entry is untouched. This leg is the saver on both,
      # for the same reason the `rust` job is on Linux: the features are empty markers, so the
      # dependency build it stores is the one every reader on this platform wants — and on main
      # alone (`SAVE_CACHE`).
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: ${{ env.SAVE_CACHE }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest

      # Same line, and the same reason, as the `rust` job: the e2e slices are the `rust-e2e-mac-win`
      # job below, and this one holds the rest of the suite.
      - name: Test (feature-gated scale suites + everything else)
        run: cargo nextest run --profile ci --features scale,e2e -E 'not binary(/^cli_e2e/)'

  # `rust-e2e`, on the two platforms it cannot speak for — the same argument as `rust-mac-win`, for
  # the other half of the suite. Windows is where the line between the halves pays most: both of its
  # test runs are the slowest of their kind in the workflow, so taking either one off the critical
  # path is worth minutes rather than seconds.
  #
  # It mirrors the e2e step and the OpenSSL build's perl, and stops there — clippy belongs to
  # `lint-mac-win` and the doc steps to `lint`, neither of which is about a test run.
  rust-e2e-mac-win:
    name: cargo test (CLI e2e, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Same step, and the same reason, as `rust-mac-win` above: the default TEMP is on C: while
      # the workspace is on D:, and it is the tests reading `std::env::temp_dir()` that pay for the
      # split.
      - name: Put TMP/TEMP on the workspace drive
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          echo "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          echo "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      # Same reason, and the same wording, as `rust-mac-win` above: rusqlite's vendored SQLCipher
      # builds OpenSSL from source, openssl-src configures it through perl, and the perl a step
      # resolves on Windows may be MSYS2's, which dies in ./Configure. A step rather than the job's
      # `env` because the variable must be ABSENT on macOS, not empty.
      - name: Name the runner's Strawberry Perl for the OpenSSL build
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV

      - name: Show toolchain
        run: rustc --version && cargo --version

      # `rust-mac-win`'s entry for this platform, read and not written — the same arrangement as
      # rust-e2e and the `rust` job.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest

      - name: Test (the CLI e2e suites)
        run: cargo nextest run --profile ci --features scale,e2e -E 'binary(/^cli_e2e/)'

  # Every verdict on the source itself, in one job: clippy, the doctests, and the intra-doc links.
  # It is here rather than inside the test jobs because a lint riding along with tests is run once
  # per test job, and the test jobs are split — by suite already, and by shard next.
  # That is the same verdict on the same tree, paid for N times. A job that runs tests runs tests.
  #
  # It reads the `rust` job's entry and saves nothing: same workspace, same lockfile, and the same
  # dependency graph (the features are empty markers), so the entry that job stores is the one this
  # one wants.
  lint:
    name: clippy + doctests + doc links
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel and components (rustfmt/clippy); rustup installs them on
      # the first cargo invocation, which is what this step is for — rust-cache below reads the rustc
      # version.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      # -D clippy::disallowed_methods enforces the facet env funnel (clippy.toml):
      # raw std::env::var/var_os is banned outside amenbo_core::env so a facet can
      # never silently fall back to human from a new call site. `--all-features`
      # lints the feature-gated targets too (the scale and e2e suites) so they can't
      # rot — required-features targets are invisible to a plain `--all-targets` build.
      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::disallowed_methods

      # nextest does NOT run doctests; run them separately so a `/// ```rust` example can't
      # silently skip CI. The tree carries one (amenbo-static-host) and ```text blocks
      # everywhere else, so this is a near-instant honesty backstop, not a cost.
      - name: Doctests
        run: cargo test --doc --features scale,e2e

      # Whether doc comments point at a symbol that does not exist. An intra-doc link to a removed
      # function sends the reader to code that is not there, so stop it mechanically rather than by
      # prose discipline. Links to private items are allowed on the crate side (a doc reader sees
      # private too) = all that fails here is a broken link.
      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items

  # Clippy on the two platforms Linux cannot lint for. The reason is the one that puts `rust-mac-win`
  # in this workflow at all: a `target_os = "macos"` or `cfg(windows)` branch is walked past by every
  # other compiler, so a lint that runs only on Linux has never read the code inside it. The doc
  # steps stay on the Linux leg alone — see `rust-mac-win` for why that sliver is accepted.
  #
  # Reads `rust-mac-win`'s entry for its platform and saves nothing, the same arrangement as `lint`
  # on Linux.
  lint-mac-win:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Same reason, and the same wording, as `rust-mac-win` above: rusqlite's vendored SQLCipher
      # builds OpenSSL from source, openssl-src configures it through perl, and the perl a step
      # resolves on Windows may be MSYS2's, which dies in ./Configure. A step rather than the job's
      # `env` because the variable must be ABSENT on macOS, not empty.
      - name: Name the runner's Strawberry Perl for the OpenSSL build
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV

      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      # The same lint contract as the Linux leg, on the branches only this platform compiles.
      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::disallowed_methods

  # The deepest tier of the same suite, and the only job here that no diff can open. `read_scaling_guard`
  # proves the read hot paths stay O(result) as the store grows: its deterministic ratio guards say so at
  # a medium seed in seconds, and the `rust` job runs those on every PR via `--features scale`. Its
  # wall-clock guards — sublinearity, and the board's O(N^2) net — only bite at the full 10k seed, where
  # they cost about 23s on top of a full-10k seeding run.
  #
  # `inputs.full` and not a path filter: what decides this one is cadence, not what the diff touched. A
  # regression in this class has to be caught within a day, not within a merge, and the seeding is too
  # slow to put in front of every PR. So it rides the legs that already ask for everything —
  # ci-full-nightly.yml on the clock, and ci-full-manual.yml before a tag, which is what puts the guard
  # in front of a release for the first time.
  #
  # It calls _scale-heavy.yml rather than restating its steps, because scale-heavy-manual.yml calls the
  # same body for the on-demand answer: a change that touched a read hot path gets a verdict in a couple
  # of minutes there instead of waiting out a full run here. One body, two callers, nothing to drift.
  scale-heavy:
    if: ${{ inputs.full }}
    uses: ./.github/workflows/_scale-heavy.yml
    permissions:
      contents: read

  # The pre-distribution verification harness (verification/) is its own cargo workspace, OUTSIDE
  # the main one, so the `rust` job above — which drives the default (main) manifest — never
  # compiles or tests it. Without this job its three crates (scenario schema + loader, the CLI
  # driver, the mac GUI harness) would ride into the tree clippy- and test-free. It is cheap: pure
  # Rust on ubuntu, gated to changes under verification/. The mac-only run (the screen tool: its
  # shots and its Vision readings) is NOT gated here — that is the release-time real-artifact
  # check, not a build-time gate.
  verification:
    name: verification harness (clippy + test)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.verification == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verification
          save-if: ${{ env.SAVE_CACHE }}

      # -D warnings holds the harness to the same bar as the rest of the tree, but
      # -A clippy::disallowed_methods is deliberate: this workspace black-box-drives the
      # shipped/installed binary, so it reads process env raw (AMENBO_BIN) — it is outside the
      # facet env funnel amenbo_core::env enforces, and has no dep on it. The gui crate builds here
      # too: its calls to the mac screen tool are runtime shell-outs, so the code compiles and its
      # unit tests (shooting + reading injected) pass with no macOS.
      - name: Clippy (all targets)
        run: cargo clippy --manifest-path verification/Cargo.toml --all-targets -- -D warnings -A clippy::disallowed_methods

      - name: Test
        run: cargo test --manifest-path verification/Cargo.toml

  # The harness's own macOS half. Its gui crate keeps the parts whose subject is a mac side effect
  # — reading a real .app bundle, the file modes it must have — behind `target_os = "macos"`, so the
  # Linux job above compiles past them and they are exercised by nothing until someone drives a
  # release on a mac. That is the wrong place to learn the harness is broken, since it is the tool
  # that says whether the build may ship. There is no Windows leg: the harness drives the mac
  # artifact, and carries no Windows branch to build.
  verification-macos:
    name: verification harness (clippy + test, macOS)
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.verification == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verification
          save-if: ${{ env.SAVE_CACHE }}

      # Same lint contract, and the same deliberate -A, as the Linux leg above.
      - name: Clippy (all targets)
        run: cargo clippy --manifest-path verification/Cargo.toml --all-targets -- -D warnings -A clippy::disallowed_methods

      - name: Test
        run: cargo test --manifest-path verification/Cargo.toml

  gui-web:
    name: GUI typecheck + build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.gui == 'true' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Pinned Node comes from .nvmrc; keeps CI in lockstep with the version-pin
      # files instead of a hardcoded number.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The Vitest unit suite (front-end logic: reconcile self-heal, IPC, i18n,
      # bind-folder). Host-independent — pure Node, so it gates per-PR on Linux
      # without the macOS bundle. Mirrors the `npm test` leg of the local make-test
      # gate so the front-end logic can't rot unnoticed.
      - name: Test
        run: npm test

  # devtool is not built or shipped by anything else here — it is the optional helper that gives a
  # task its own dev GUI and measures the agent entry — so no other job compiles it, and
  # nothing but this one would notice it breaking. Publishing it without this job would be
  # publishing a tool that rots. It is seconds: one stdlib-only module, no dependencies to
  # resolve, tests that touch only temp dirs and git.
  go:
    name: devtool vet + test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # The version pin lives in devtool/go.mod, next to the module, rather than being written
      # again here. `cache: false` because the module has no dependencies to cache — the cache
      # keys on a go.sum this module has no reason to have.
      - uses: actions/setup-go@v7
        with:
          go-version-file: devtool/go.mod
          cache: false

      # `make go-gate` is the same entry point, minus the skip it does for a clone with no Go —
      # here Go is installed, so call the script the target calls and let the job fail rather than
      # report a green skip.
      - name: Format, vet and test the devtool module
        run: bash scripts/go-gate.sh

  # The gates that can also go red on a tree nobody touched (the linter floats its runner-side
  # version; the audits float the advisory DB; the catalog key's other copy is another repository's). Their definitions live in _rot-gates.yml so that this
  # workflow and the weekly timer (rot-gates-weekly.yml) run the same thing rather than two copies that
  # drift — see that file for what each one gates and why the build/test jobs are not among them.
  # Here they keep their path filter; the weekly leg runs them unfiltered.
  rot-gates:
    needs: changes
    uses: ./.github/workflows/_rot-gates.yml
    with:
      shell: ${{ needs.changes.outputs.shell == 'true' }}
      cargo_deps: ${{ needs.changes.outputs.cargo_deps == 'true' }}
      npm_deps: ${{ needs.changes.outputs.npm_deps == 'true' }}
      catalog_key: ${{ needs.changes.outputs.catalog_key == 'true' }}
      # The one gate a change cannot judge: it probes the live release, not the tree.
      provenance: false

  # amenbo is Apache-2.0 and ships binaries that statically link every Rust dependency, so a
  # strong-copyleft crate anywhere in the tree would make what we distribute undistributable.
  # Nobody reads a license at bump time — Dependabot bumps are auto-merged — so the allow-list in
  # deny.toml is the only thing that would notice one arriving. It stays HERE rather than in
  # _rot-gates.yml: unlike the audits, this verdict is a function of the lockfiles alone, so it
  # cannot go red on a tree nobody touched, and the weekly leg would only re-run it for nothing.
  cargo-license:
    name: cargo deny (licenses)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.cargo_deps == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-deny

      - name: Check the workspace's licenses
        run: cargo deny check licenses

      # Same argument as the audit gate: the Tauri host crate is out of the workspace and carries
      # its own lockfile (the whole GTK/WebKit stack lives there), so the root check never sees it.
      # One config governs both trees.
      - name: Check the Tauri host crate's licenses
        run: cargo deny --config deny.toml --manifest-path app/src-tauri/Cargo.toml check licenses

      # And once more for the verification harness: its own cargo workspace, its own lockfile, so
      # the root check never sees it either. It is publish=false and never shipped, but the
      # convention is that every lockfile in the tree passes the one allow-list — otherwise a
      # dependency's license could change here unwatched (Dependabot bumps are auto-merged).
      - name: Check the verification harness's licenses
        run: cargo deny --config deny.toml --manifest-path verification/Cargo.toml check licenses

  # The same argument, for the other half of what we ship. cargo deny never sees the GUI's npm
  # dependencies, but they ride into the Tauri bundle exactly as the crates do — and they arrive the
  # same unwatched way, since Dependabot bumps are auto-merged. The gate reads the allow-list out of
  # deny.toml rather than keeping a second copy, so "what amenbo may ship" cannot come to mean two
  # different things. It sits beside cargo-license for the same reason that job is here and not in
  # _rot-gates.yml: the verdict is a function of the lockfile alone.
  npm-license:
    name: npm licenses (GUI shipped deps)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.npm_deps == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A real run only exercises the tree we have, which is green — so it shows the gate can say
      # yes, and never that it can still say no. These pin the refusals (node's own runner, no
      # dependency): they run first, because a broken judge passing everything is the failure mode
      # the check below cannot report on itself.
      - name: Test the gate's judgment
        run: node --test "guards/**/*.test.mjs"

      # No `npm ci`: npm records each resolved package's license in the lockfile, so the check reads
      # a file rather than an install.
      - name: Check the shipped npm dependencies' licenses
        run: node guards/check-npm-licenses.mjs

  # The Tauri host crate (app/src-tauri) is `exclude`d from the root workspace, so
  # the `rust` job above never compiles it — a core refactor can break it on main
  # unnoticed. This job closes that gap by clippy+test gating the crate. It is NOT
  # the native .app bundle build (that stays tag/dispatch-only, per the header) —
  # just `cargo` over the host crate, which needs the Tauri Linux system libs
  # (webkit/gtk) to link.
  app-rust:
    name: app crate clippy + test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # Tauri v2's webkit/gtk system deps — required to compile the `tauri` crate on
      # Linux (the runner already has build-essential/curl).
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # rust-toolchain.toml (repo root) pins the channel + clippy for this crate too.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      # Separate cache from the workspace jobs: the host crate is out-of-workspace with
      # its own lock and target dir (app/src-tauri/target). `workspaces` points
      # rust-cache at that manifest so it keys on the right lockfile and target, and no
      # `shared-key` here means the key carries this job id — which is what keeps it apart
      # from the entry the four workspace jobs share.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ env.SAVE_CACHE }}

      # The host crate's build.rs (tauri_build) validates tauri.conf.json's
      # externalBin=binaries/amenbo. That sidecar CLI is normally staged by tauri's
      # beforeBuildCommand, which a plain `cargo clippy/test` never runs, and
      # binaries/ is gitignored — so on a cache miss (or when tauri.conf.json
      # changes and build.rs re-runs) this job would fail with `resource path …
      # doesn't exist`. Stage it up front with the same script the GUI build uses.
      - name: Stage CLI sidecar (externalBin)
        run: node app/scripts/prepare-cli-sidecar.mjs

      # Same lint contract as the core/cli `rust` job, including the facet env funnel
      # (-D clippy::disallowed_methods): the host crate reads AMENBO_* only via
      # amenbo_core::env, never raw std::env.
      - name: Clippy (all targets)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings -D clippy::disallowed_methods

      - name: Test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      # store_watch's network-FS test is #[ignore]d until something hands it a real
      # mount. Stand up NFS + SMB on the runner and give it one: `is_network_dir` reads
      # the statfs magic to choose polling over a
      # kernel watch, and when that table is wrong the GUI arms an inotify watch that reports
      # nothing from the server side — another host's writes are lost, silently and forever.
      # Light enough for every run: no bundle, just the test binary this job builds.
      #
      # Built as the normal user on purpose. Only the binary runs under sudo (mount(8) needs
      # it); a `cargo test` under sudo would leave root-owned artifacts in the cached target.
      - name: Build the store_watch test binary
        id: store-watch-bin
        run: |
          bin=$(cargo test --manifest-path app/src-tauri/Cargo.toml --test store_watch \
                  --no-run --message-format=json \
                | jq -r 'select(.executable != null and .target.name == "store_watch") | .executable' \
                | tail -1)
          test -x "$bin" || { echo "no store_watch test binary"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: store_watch against real NFS + SMB + 9P mounts
        run: sudo bash scripts/verify-network-watch.sh "${{ steps.store-watch-bin.outputs.bin }}"

      # Same doc-link contract as the `rust` job — this crate is out of the
      # workspace, so the other job's `--workspace` doc run never sees it.
      - name: Doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path app/src-tauri/Cargo.toml --no-deps --document-private-items

  # The `app-rust` job above, on the two platforms it cannot speak for — the same argument as
  # `rust-mac-win`, for the other tree. The host crate is where the OS branches are thickest: the
  # menu, autostart, each platform's notifier, and the store watch that chooses between a kernel
  # watch and polling. Only the Linux side of any of it is built by the job above, and the Windows
  # side has never been built by a gate at all — the release workflow was the first thing to
  # compile it, and by then the change is already on main.
  #
  # No bundle here either: this is `cargo` over the crate, exactly as the Linux job is. The network-
  # FS step is not mirrored — it stands up NFS/SMB/9P mounts on the runner, which is a Linux
  # apparatus, and what it verifies (that the watch falls back to polling off a local disk) is the
  # same question wherever it is asked.
  app-rust-mac-win:
    name: app crate clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Same step, and the same reason, as `rust-mac-win` above: the default TEMP is on C: while
      # the workspace is on D:, and it is the tests reading `std::env::temp_dir()` that pay for the
      # split.
      - name: Put TMP/TEMP on the workspace drive
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          echo "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          echo "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      # The store is SQLCipher-encrypted, so rusqlite's bundled-sqlcipher-vendored-openssl builds
      # OpenSSL from source, and openssl-src configures it by shelling out to perl. On Windows the
      # perl a step resolves may be MSYS2's, which lacks Locale::Maketext::Simple and dies in
      # ./Configure — so name the runner's Strawberry Perl, which openssl-src reads ahead of PERL
      # and PATH. A step rather than the job's `env` because the variable must be ABSENT on macOS,
      # not empty: openssl-src takes an empty value as the program to run. The sidecar staged below
      # builds the CLI, which is what brings this job to that OpenSSL build at all.
      - name: Name the runner's Strawberry Perl for the OpenSSL build
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV

      # The sidecar staging step below is a Node script; nothing else here needs a runtime.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Show toolchain
        run: rustc --version && cargo clippy --version

      # Two workspaces, not one: the crate under test is out-of-workspace with its own lock and
      # target dir, and the sidecar step builds the ROOT workspace in release. Caching only the
      # host crate would leave that release build — OpenSSL from source included — to be redone
      # from nothing on every run.
      #
      # The `.` here is not the entry `rust-mac-win` shares under `shared-key: workspace`, however
      # alike the two look: that one holds a debug build (clippy and test drive the dev profile),
      # this one a release build (prepare-cli-sidecar.mjs passes `--release`). Neither can be
      # dropped in favour of the other.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
          save-if: ${{ env.SAVE_CACHE }}

      # Same reason as the Linux job: build.rs validates tauri.conf.json's externalBin, which a
      # plain clippy/test never stages, and binaries/ is gitignored.
      - name: Stage CLI sidecar (externalBin)
        run: node app/scripts/prepare-cli-sidecar.mjs

      - name: Clippy (all targets)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings -D clippy::disallowed_methods

      - name: Test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  # Two lockfiles sit outside the workspace and have to follow it: the Tauri host crate's, and the
  # verification harness's. Both are `exclude`d and carry a lock of their own, and both reach core
  # through a path dependency — so a workspace bump changes what those locks resolve to, while the
  # commit that made the bump never opens either file. No cargo invocation in this workflow passes
  # `--locked`, so a stale lock would stay green and drift; what finds it is the next person to run
  # cargo over that manifest, as unrelated churn in their working tree.
  #
  # `cargo metadata` re-resolves and rewrites a lock without compiling anything, so this job needs
  # neither the Tauri system libs nor a target dir — the whole verdict is the diff it leaves behind.
  #
  # It opens on either gate: a workspace bump (`rust`) moves both, and a change confined to the
  # harness's own manifest (`verification`) moves only the second.
  #
  # Dependabot's own pull requests are exempt, because they are the ones that cause the drift and
  # failing them would deadlock the auto-merge (a red run never reaches the merge workflow). Theirs
  # is repaired ahead of the merge instead, by the lockstep job in _dependabot-automerge.yml.
  out-of-workspace-locks:
    name: out-of-workspace lockfiles follow the workspace
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ (needs.changes.outputs.rust == 'true' || needs.changes.outputs.verification == 'true')
          && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7

      - name: Re-resolve the host crate's lockfile
        run: cargo metadata --manifest-path app/src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Re-resolve the verification harness's lockfile
        run: cargo metadata --manifest-path verification/Cargo.toml --format-version 1 > /dev/null

      - name: The lockfiles must not have moved
        run: |
          stale=0
          for lock in app/src-tauri/Cargo.lock verification/Cargo.lock; do
            if ! git diff --exit-code -- "$lock"; then
              echo "::error file=${lock}::behind the workspace — run 'make lock' and commit the result"
              stale=1
            fi
          done
          exit "$stale"

  # The comment guard. Where tree-guards below reads whole lines, this one reads the comments
  # themselves: where they sit, what shape they take, and the vocabulary they may not use — a
  # reference to this project's own tracker, and Japanese. The hook runs the same command, so this
  # is its backstop (a hook is bypassable, and an outside contributor has no esorp at all).
  #
  # Every comment in the tree is judged, and so is the whole of every tracked file that carries no
  # code in the step after. Both faces stand at zero, so there is nothing to excuse and a violation
  # anywhere is the change's to answer for, whichever line it sits on. Reading the tree also names
  # the files a family declares but no scanner can read ("not inspected"), which a scope drawn round
  # a diff shows only when such a file is touched.
  #
  # The version is pinned with its checksum: an unpinned linter floats its own verdict, and a gate
  # that changes its mind on a tree nobody touched belongs in _rot-gates.yml, not here.
  comment-guard:
    name: Comment guard (placement, form, vocabulary)
    runs-on: ubuntu-latest
    env:
      ESORP_VERSION: 0.6.0
      ESORP_SHA256: bd0a8136aa859892e21b51270ba6202e40529e100c0e8aeb5558726822e257c2
    steps:
      # The tree as it stands is the whole subject, so the default shallow clone holds everything
      # this job reads.
      - uses: actions/checkout@v7

      - name: Install esorp
        run: |
          url="https://github.com/ShiroDoromoto/esorp/releases/download/v${ESORP_VERSION}/esorp_${ESORP_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o esorp.tar.gz
          echo "${ESORP_SHA256}  esorp.tar.gz" | sha256sum -c -
          tar -xzf esorp.tar.gz esorp
          sudo install -m 0755 esorp /usr/local/bin/esorp
          rm -f esorp esorp.tar.gz

      - name: Audit every comment in the tree
        run: esorp check

      - name: Audit the prose and the config values of every tracked file that carries no code
        run: |
          chmod +x guards/check-prose.sh
          guards/check-prose.sh

  tree-guards:
    name: Tree guards (internal-note refs, test prose, CLI shim, change scopes, CLI name, sidecar name, dev self-update, TS derive)
    runs-on: ubuntu-latest
    # Backstop for the local pre-commit hook, which runs the first two scans over
    # staged additions only. All have fixed patterns — no secret needed. The rest
    # are the odd ones out: they assert an invariant across a whole tree rather than
    # scanning added lines, so they live in `make test` and here, not in pre-commit.
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files for internal-note references
        run: |
          chmod +x guards/check-doc-refs.sh
          git ls-files -z | xargs -0 guards/check-doc-refs.sh --

      - name: Scan tracked files for Japanese test prose
        run: |
          chmod +x guards/check-test-prose.sh
          git ls-files -z | xargs -0 guards/check-test-prose.sh --

      - name: Assert the GUI/CLI version-skew invariant holds
        run: |
          chmod +x guards/check-cli-shim.sh
          guards/check-cli-shim.sh

      - name: Assert every change-feed dataset is folded into a GUI scope
        run: |
          chmod +x guards/check-change-scopes.sh
          guards/check-change-scopes.sh

      - name: Assert every worded command names this build's CLI
        run: |
          chmod +x guards/check-cli-name.sh
          guards/check-cli-name.sh

      - name: Assert the CLI beside the app is looked for under the name the bundle ships
        run: |
          chmod +x guards/check-sidecar-name.sh
          guards/check-sidecar-name.sh

      - name: Assert the GUI asks which channel it is before self-updating
        run: |
          chmod +x guards/check-dev-selfupdate.sh
          guards/check-dev-selfupdate.sh

      - name: Assert the TypeScript bindings are generated from the GUI crate alone
        run: |
          chmod +x guards/check-ts-derive.sh
          guards/check-ts-derive.sh

      - name: Assert the merge gate below waits for every job in this workflow
        run: |
          chmod +x guards/check-ci-aggregate.sh
          guards/check-ci-aggregate.sh

      - name: Assert every workflow_run trigger names a workflow that can fire
        run: |
          chmod +x guards/check-workflow-run-names.sh
          guards/check-workflow-run-names.sh

  # The one check the merge target requires. Every job above feeds it, so its verdict is the whole
  # workflow's verdict — and what the ruleset pins is a single name that does not move when a job is
  # added, renamed, or skipped by the path gate. Naming the jobs individually there would put the
  # merge condition in a place no diff shows, where a rename silently drops one.
  #
  # `always()` is load-bearing. Without it a failed dependency SKIPS this job rather than running it,
  # and a skipped required check is not a red one — the merge would sit on a verdict that never
  # arrives, or take one that was never given. So it always runs, and folds the results itself.
  #
  # `skipped` passes: most jobs above are path-gated, and skipping is their ordinary answer to a diff
  # that cannot have moved them. `cancelled` fails: such a job judged nothing. The only cancellation
  # here comes from the concurrency group at the top, which takes down superseded runs — and no merge
  # waits on a superseded run's verdict.
  #
  # Adding a job without a line in `needs:` leaves this gate green without it, and nothing goes red to
  # say so. guards/check-ci-aggregate.sh compares the two lists; tree-guards above runs it.
  all-green:
    name: all green
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - rust
      - rust-e2e
      - rust-mac-win
      - rust-e2e-mac-win
      - lint
      - lint-mac-win
      - scale-heavy
      - verification
      - verification-macos
      - gui-web
      - go
      - rot-gates
      - cargo-license
      - npm-license
      - app-rust
      - app-rust-mac-win
      - out-of-workspace-locks
      - comment-guard
      - tree-guards
    steps:
      - name: Fold every job's result
        env:
          # Read as data rather than one interpolation per job: this expression carries whatever
          # `needs:` names, so the fold cannot fall behind the list the way a hand-written set of
          # `needs.<id>.result` reads would.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::did not pass: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "every job in this workflow passed or was skipped"
