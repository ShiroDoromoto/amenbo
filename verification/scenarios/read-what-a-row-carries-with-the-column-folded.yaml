steps_gui:
  # The width it ships with, read before anything is pressed — the same half the fold's own road
  # reads, and here it is what says the counts below were read at the wide width.
  - type: assert
    domain: task
    op: sidebar-drawn
    with:
      names: shown

  - type: assert
    domain: task
    op: view-warns
    with:
      view: due
      step: stop
      count: 10

  # And nothing on the other step. Read rather than assumed: it is what makes the ten after the press
  # the same ten, instead of a sum the fold arrived at.
  - type: assert
    domain: task
    op: view-warns
    with:
      view: due
      step: heed
      count: 0

  - type: action
    domain: task
    op: sidebar
    with:
      names: hidden

  # The marks, with the counts standing on them. This is the reading a badge over a mark fails.
  - type: assert
    domain: task
    op: sidebar-drawn
    with:
      names: hidden

  # And the digits, at the size the narrow column leaves them.
  - type: assert
    domain: task
    op: view-warns
    with:
      view: due
      step: stop
      count: 10
