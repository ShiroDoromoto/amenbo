id: lint
title: The lint reports every amenbo ref in a file on its way out, and leaves another tracker's alone
description: >
  An id names something only someone holding this store can look up; anywhere else it is a reference
  into nothing. The lint is what catches one before it lands there, and it is the one command whose
  non-zero exit is its answer rather than a failure — a caller wiring it into a hook reads that exit,
  so a build that stopped reporting it would pass silently while letting refs through. The text it is
  pointed at comes from `fixtures/lint/`, since a scenario file may not carry a bare ref itself.
steps_cli:
  # A ref on its way out is reported, and located: the line it sits on is what a person goes to.
  - { type: action, domain: repo, op: copy-fixture, with: { from: lint/decided.txt, path: message.txt } }
  - { type: assert, domain: repo, op: lint, with: { path: message.txt, hits: 1, line: 3 } }

  # Every one of them, not just the first — a report that stops early is one a person acts on twice.
  - { type: action, domain: repo, op: copy-fixture, with: { from: lint/several.txt, path: many.txt } }
  - { type: assert, domain: repo, op: lint, with: { path: many.txt, hits: 3, line: 2 } }

  # Text with nothing of ours in it comes back clean, and with the exit that says so.
  - { type: action, domain: repo, op: copy-fixture, with: { from: lint/clean.txt, path: clean.txt } }
  - { type: assert, domain: repo, op: lint, with: { path: clean.txt, hits: 0 } }

  # What is deliberately left alone: a bare number is a GitHub issue, and a ref carrying no namespace
  # may be another tracker's. The namespace prefix is the whole test, so neither is ours to report.
  - { type: action, domain: repo, op: copy-fixture, with: { from: lint/elsewhere.txt, path: elsewhere.txt } }
  - { type: assert, domain: repo, op: lint, with: { path: elsewhere.txt, hits: 0 } }
