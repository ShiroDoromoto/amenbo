# The way out of a pane names the work its session is holding, and offers three things to do about it.
#
# **A reservation is made from inside a pane, and the pane is the only thing that knows it was.** The
# ledger says a task is `in_progress` and stops there; which terminal took it lives in an area that
# goes when the process does. So `✕` is the last moment anything can say what is about
# to be left behind — press it and the session ends, the place goes, and the task stands reserved with
# nothing left that could say whose it was. Nothing afterwards can notice that happened.
#
# ── Why all three answers are on one road ────────────────────────────────────────────────────────
# They are three different things to want, not one right answer and two mistakes: hand the work back
# and go, go and leave it standing, or stay. **The middle one is the one a road would be tempted to
# leave out**, and it is the one somebody stepping away from a machine for the night presses — a build
# that quietly handed the work back there would be the screen unmaking a fact a person made, which is
# exactly what the question exists to avoid. A road walking `hand-back` alone would prove a third of
# it and read as though it had proved the whole.
#
# ── Why a task is reserved outside a pane as well ────────────────────────────────────────────────
# `flue` is put `in_progress` in the world, where no terminal made the move. It is the half that says
# what the question is reading: the volatile area, not the ledger's `status` column. A build that
# answered `✕` with every reserved task on the board would name it too, and every reading below would
# still pass — so each press is confirmed to name one ref and no other, and this is the task that
# makes that clause mean something.
#
# ── Why one pane at a time ──────────────────────────────────────────────────────────────────────
# Which pane went is another road's goal (`get-rid-of-a-pane-for-good`), and what is under test here
# is the question rather than the page. One pane also keeps every line typed in it unambiguous: a
# command is run in "the pane", and a page with two of them would leave the operator choosing which.
#
# ── Why the line is typed last ──────────────────────────────────────────────────────────────────
# A run clears the pane before it types, so a line put there first would not be on the screen by the
# time it is needed. The pane is named by the words a road typed into it, and this is the road's own
# words being the last thing on it when the way out is pressed.
id: be-told-what-a-pane-is-holding-before-it-goes
title: The way out of a pane names the reservation its session is holding, and each of the three answers does what it says
description: >
  Reserve a task from a terminal running in a pane, then press the way out. The question names that
  task by its ref — and not the one reserved outside any pane — and offers three answers. Stay, and
  nothing has happened: the pane is where it was and the task is still held. Press again and hand the
  work back: the task is waiting for somebody again and the place is gone. Then do the same in a fresh
  pane and go without handing anything back: the place is gone and the reservation is still standing.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Foundry
    as: foundry

  - type: action
    domain: folder
    op: bind
    with:
      dir: forge
      project: foundry

  - type: action
    domain: task
    op: create
    with:
      title: Re-line the quench tank
      project: foundry
    as: tank

  - type: action
    domain: task
    op: finish-creating
    with:
      target: tank

  - type: action
    domain: task
    op: create
    with:
      title: Sharpen the plate shears
      project: foundry
    as: shears

  - type: action
    domain: task
    op: finish-creating
    with:
      target: shears

  # Reserved where no terminal was: the ledger says `in_progress` and the volatile area says nothing
  # about it, which is the difference every reading below rests on.
  - type: action
    domain: task
    op: create
    with:
      title: Sweep the flue before the cold sets in
      project: foundry
    as: flue

  - type: action
    domain: task
    op: finish-creating
    with:
      target: flue

  - type: action
    domain: task
    op: status
    with:
      target: flue
      status: in_progress

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # Pressed rather than assumed: which project the face comes up on is the run's business, and a road
  # that read a screen it had not put itself on would be reading somebody else's.
  - type: action
    domain: terminal
    op: go-project
    with:
      project: Foundry

  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  # Down to a plain shell. What an agent does with a line typed at it is the agent's own, and the two
  # commands below are the whole of what puts this road's reservation where the question reads it.
  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task list --actor ai

  # The move that makes this pane's session the one holding something. It is made with the CLI from
  # inside the pane because that is the only place it can be made from and still be seen here.
  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task status <ref> in_progress --actor ai
      target: tank

  # The road's own words, last onto the screen so they are still on it when the way out is pressed.
  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the pane that hands it back

  # ── Stay ────────────────────────────────────────────────────────────────────────────────────────
  # The question is read for naming this pane's reservation and no other, and then declined. What
  # follows is the whole of what "nothing happens" has to mean.
  - type: action
    domain: terminal
    op: remove-pane
    with:
      shows: SCENARIO the pane that hands it back
      target: tank
      answer: cancel

  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO the pane that hands it back

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # The other half of declining, and the half a screen could get wrong on its own: a box that tidied
  # the ledger up on the way out would read the same on the pane above and lose the fact here.
  - type: assert
    domain: task
    op: field
    with:
      target: tank
      field: status
      equals: in_progress

  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # ── Hand it back, then go ───────────────────────────────────────────────────────────────────────
  - type: action
    domain: terminal
    op: remove-pane
    with:
      shows: SCENARIO the pane that hands it back
      target: tank
      answer: hand-back

  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO the pane that hands it back
      present: false

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # Waiting for somebody again, which is the whole of what the first answer is for.
  - type: assert
    domain: task
    op: field
    with:
      target: tank
      field: status
      equals: todo

  # And the reservation nothing in a pane made is untouched by any of it. The press could only ever
  # reach what its own session wrote down.
  - type: assert
    domain: task
    op: field
    with:
      target: flue
      field: status
      equals: in_progress

  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # ── Go, and leave it standing ───────────────────────────────────────────────────────────────────
  # A fresh pane, since the one before it is gone for good. The same road to a held reservation, and
  # the answer that is not a mistake to be talked out of.
  - type: action
    domain: terminal
    op: open-pane
    with:
      from: face

  - type: action
    domain: terminal
    op: open-shell

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task list --actor ai

  - type: action
    domain: terminal
    op: run
    with:
      command: amenbo task status <ref> in_progress --actor ai
      target: shears

  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the pane that leaves it standing

  - type: action
    domain: terminal
    op: remove-pane
    with:
      shows: SCENARIO the pane that leaves it standing
      target: shears
      answer: leave

  - type: assert
    domain: terminal
    op: pane
    with:
      shows: SCENARIO the pane that leaves it standing
      present: false

  - type: action
    domain: terminal
    op: show-face
    with:
      face: tasks

  # The place is gone and the work is not: a person who meant to leave a reservation where it is has
  # been taken at their word.
  - type: assert
    domain: task
    op: field
    with:
      target: shears
      field: status
      equals: in_progress
