# A refusal about starting a project's AI on amenbo is silent from then on: it takes the report off that
# project's board, and nothing anywhere else says it was ever given. That is what makes this road
# necessary rather than convenient — a reader who declined, by mistake or before they knew what the
# report was offering, has nothing left on the board to change their mind with. The record is the only
# thing standing, so the way back has to be where the record is read.
#
# So the road is walked from both ends. The no is given where it is read, on the report itself, which is
# the only button on that report that writes anything; and the project's own settings carry both halves
# of the way back — what this project answered, and the button that drops it. Dropping is not a third
# answer. It puts the project back to never having been answered for, which is the state the report is
# drawn from, so the report comes back the next time the project is opened.
#
# Hence three states and not a truth value. Yes, no, and never answered are three different screens, and
# the third is the one a yes/no cannot name: a screen that folded it into the no would report a refusal
# from every project nobody has answered for, and would offer to take back an answer that is not there.
#
# Hence a road for the screen alone. The terminal writes the answer and never reads it back, so it has no
# face to read the record on and none to clear it from.
#
# Both readings of the record are closed by an eye rather than by a reading. All three answers are drawn
# as words of the interface, and which of them is standing is not something the presence of text on a
# shot settles; the file the report names is the one line here a reading can close.
#
# What this wants standing before the run: a device holding the project named below, bound to a folder
# carrying the provider's own directory with nothing about amenbo in it, and that project's answer never
# refused — so the report is on its board when the run opens on it. The screen moves at the press, so
# drive it stepped (`--step`) and carry out each move at the hand-back before it.
id: take-back-a-no-about-starting-this-projects-ai
title: A project can decline having its AI started on amenbo where it reads the report, and take the refusal back where it is kept
description: >
  Arrive on a project's board with the report standing on it, and decline there — the one button on the
  report that records anything. Then go to the settings the project keeps for itself, which is the only
  place the refusal is legible at all: read it, drop it, and read what dropping left. Not a yes and not a
  no, but a project that has never been answered for — with nothing further to clear, since there is no
  longer an answer to take back, and the report waiting to come back the next time this project is
  opened. A screen that lost the refusal in silence, or that left it standing after the press, is what
  this road exists to catch.
steps_gui:
  # The report, before anything is said to it. It is read first so that the refusal below is given on a
  # screen the run has seen, rather than aimed at a button taken on trust — and the file it names is the
  # one line on this road a reading can close.
  - type: assert
    domain: repo
    op: ai-launch-notice
    with:
      tool: claude-code
      paste_into: .claude/settings.json

  # The refusal, given where it is read. This is the whole reason it is on the report: the reader who
  # wants to decline is the reader looking at it, and a no put anywhere else is a no they have to go
  # looking for.
  - type: action
    domain: repo
    op: ai-launch-consent
    with:
      answer: "no"

  # And onto the only face that says what was answered. It is a step rather than a note in front of the
  # road so that the screen the record is read on is shot, and so the read below cannot be reached by a
  # hand tidying the screen while the run is held.
  - type: action
    domain: project
    op: open-settings
    with:
      project: Greenhouse

  # The refusal, where it is kept. Nothing else on any screen says it — the report it silenced is gone —
  # so a settings page that showed the answer only when it was a yes would leave a reader with no way of
  # knowing what they had said.
  - type: assert
    domain: repo
    op: ai-launch-answer
    with:
      answer: "no"

  # The way back. It takes no answer of its own: what it leaves behind is the project as it stood before
  # anyone answered for it.
  - type: action
    domain: repo
    op: ai-launch-consent-clear

  # And that is where it left it. Never answered is not a no, and the difference is the whole point of
  # the press — the report is drawn from this state, so the next opening of the project has it standing
  # again. The button that brought the screen here is shut now, since there is nothing left to take back.
  - type: assert
    domain: repo
    op: ai-launch-answer
    with:
      answer: unanswered
