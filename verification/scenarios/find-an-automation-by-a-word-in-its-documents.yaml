# A word written in a document the steps of an automation share is reachable from the box that
# searches everything. What a hit points at is the automation and not the document: one automation
# holds several of them, and a document carries no reference of its own — so the row a reader presses
# takes them to the picture the document belongs to, in that automation's own project. A build that
# indexed the documents and gave a reader nowhere to go would find the word and lose the thing it
# was written about.
id: find-an-automation-by-a-word-in-its-documents
title: A word in an automation's shared documents is found, and the hit opens the automation it was written on
description: >
  Write two shared documents on one automation, each carrying a word of its own, and ask the search
  for them. On the terminal both arms are read — the hit is the automation, on its body — and a word
  nobody wrote is asked for as well, since a search that answered every question the same way would
  read as green from the present half alone. On the screen the same word is asked for and the hit is
  pressed, which is the half only the screen has: what a reader does next with a hit.
given:
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — the one with documents" }, as: auto }
  - { type: action, domain: automation, op: note-add, with: { target: auto, name: house style, body: SCENARIOWORDONE is how it is written here } }
  - { type: action, domain: automation, op: note-add, with: { target: auto, name: what to leave alone, body: SCENARIOWORDTWO is never touched } }
  # One step, so that the screen has something to draw when a hit opens the build screen: what says
  # a reader landed on that definition is the picture of it.
  - { type: action, domain: automation, op: step-add, with: { target: auto, name: take, agent: claude-code, prompt: take the next task } }

steps_cli:
  - type: assert
    domain: automation
    op: found
    with:
      words: SCENARIOWORDONE
      kind: automation
      target: auto
      face: body
      present: true

  # The second document of the same automation. Both are its own, so a build that only reached the
  # first would answer this one with nothing while still looking right above.
  - type: assert
    domain: automation
    op: found
    with:
      words: SCENARIOWORDTWO
      kind: automation
      target: auto
      face: body
      present: true

  # Words are the record's rather than the document's: two words that were written on one automation,
  # a document apart, are both that automation's — so asking for the pair answers with it.
  - type: assert
    domain: automation
    op: found
    with:
      words: SCENARIOWORDONE SCENARIOWORDTWO
      kind: automation
      target: auto
      face: body
      present: true

  # And a word nobody wrote answers with nothing, which is what says the three above were answers.
  - type: assert
    domain: automation
    op: found
    with:
      words: SCENARIOWORDNOWHERE
      kind: automation
      target: auto
      present: false

steps_gui:
  - type: assert
    domain: automation
    op: found
    with:
      words: SCENARIOWORDONE
      kind: automation
      target: auto
      face: body
      present: true

  # What only the screen has: the hit is a way in. Pressing the reference on it moves to that
  # automation's project and opens the build screen on the definition the document was written on.
  - type: action
    domain: automation
    op: open-found
    with:
      target: auto

  - type: assert
    domain: automation
    op: pictured
    with:
      name: take
      present: true

  # The way back is the way back, and it does not bounce: a reader who came in from a hit and pressed
  # "back to the list" is on the list.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: assert
    domain: automation
    op: listed
    with:
      target: auto
      present: true
