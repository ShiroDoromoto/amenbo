# Linking is not a convenience — it *is* an AI's reach. A folder's `.amenbo` names the one project
# an agent launched there may read and write, so a pointer that fails to land leaves the agent
# reaching nothing, and one that lands on the wrong project lets it write where it was never sent.
# Nothing about that is visible from inside the workspace's own tests: the pointer is a file the
# shipped binary places in a real folder, and the folder is what answers for it.
#
# One goal, and the two roads to it are shaped nothing alike — which is the reason they sit in one
# file rather than in two that could quietly drift apart. From a terminal it is one command, and the
# road can carry the pointer's whole life: placed, shared, brought forward, taken back. On screen it
# is a card to open, a project to answer for and a folder to pick.
#
# The end of that life is where the terminal road runs longest. Taking the last folder off a project
# is allowed on purpose — folders get re-homed, and that means taking them all off before putting
# them back — so nothing here counts and refuses. What holds the line instead is the answer: it says
# the project has none left, and that nothing can operate it until one is linked again. That sentence
# is the whole of what stands between a reshuffle and a project nobody can reach, and it is exactly
# the kind of thing that can go missing with every test in the tree still green. The count it
# publishes beside itself is what the road reads, since the state left behind is the same either way.
#
# One folder on that road is not this build's to read at all. A device carries a store per channel —
# what a release installs, what a developer builds, the throwaway one a change is checked in — and a
# pointer's project id is a key in the numbering of whichever store wrote it, so the same number names
# a different project on the other side. A build that read a claimed folder would go quietly to work
# in the wrong one, which is why what stands there is a refusal and not a warning: a warning is
# answered by the write that comes after it. And the refusal says which store the folder belongs to,
# because being turned away only helps a reader who is then told where to go.
#
# The screen meets that same folder with nothing to be turned away from — the interface holds its own
# store open the whole time — so what stands in for the refusal there is the row that lists the
# folder: it names the store the folder belongs to, and stops calling it one an AI can be started in.
# A row that went on saying ready would have the screen saying the opposite of what happens to
# whoever walks in, which is the one way a reader ends up trusting a folder nothing of theirs reaches.
#
# ── What only the screen road ever says ──────────────────────────────────────────────────────────
# A reader arriving with no folder linked yet is offered two ways in: raise a project, or open one
# this device already holds. Both are the interface's own to carry out — raising goes to a screen of
# its own, and opening asks which project and then hands over the folder picker, the same call the
# project settings screen makes. What undoes that is a card handing over a command and pointing the
# reader at a terminal: a folder linked from a terminal is a folder linked, so such a card leaves
# behind exactly the rows a working one does. There is no read to ask and no exit code to fail.
#
# The road ends where the binding takes the reader: that project's board, which — with nothing on it
# yet — is already holding out the first loop, the folder it names being the one just picked. That
# is the whole of what linking was for, and it is the one place the reader is shown it.
#
# Every step of it is read off a shot, and a shot of the wrong screen carries the words no more than
# the right one does — so what says the run stood where it was meant to is each step's own shot, an
# eye on the ones a reading cannot settle.
#
# What that road wants in front of it is a device with a project on it and nothing on that project's
# board: the open card is offered where there is something to open, the choices it lists are what the
# store holds, and the loop at the end is what an untouched board leads with. That project is declared
# below and stood up before the app is launched; what is left to the operator is to stand on the
# getting started screen — the run hands the first step over before it shoots anything, so that is
# where to be by the time it does.
#
# The road crosses three screens: carry each move out when the run hands that step over.
id: link-a-folder
title: A folder is linked to the project it will answer for — from a terminal, and from the screens a reader with nothing linked is offered
description: >
  The goal is one: a folder ends up naming the project that anything launched inside it works in.
  From a terminal the road carries the pointer's whole life — raise a project in a fresh folder with
  `init` and read the pointer back from inside it, point a second folder at this run's own project
  with `bind` (the many-to-one relation a shared checkout rests on), resync that folder's guidance
  block and confirm a second pass finds nothing left to write, then unbind and confirm the folder
  reaches nothing again, take a project's folders off one at a time down to the last, reading off each
  answer how many it has left, and finally walk into a folder another store has already claimed and be
  turned away from it by name. On screen the road is the way in that never passes through a terminal:
  two cards and nothing to paste anywhere, the second asking which of this device's projects the
  folder is to be linked to — the step it takes before the folder picker — then the folder itself,
  and the board that opens with the first loop waiting on it, and finally that project's own settings,
  where a folder another store claimed is listed as that store's rather than as one to start an AI in.
given:
  # The project the card lists and the reader answers with. It is the screen road's alone — the road
  # from a terminal raises its own — but a premise stands before both, and a project more on the device
  # is nothing the terminal road reads.
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  # A folder already on that project's list when the app opens, and claimed by another store before
  # it did. It is a premise rather than a step for the reason the terminal road's is written from
  # outside the folder: a build run in there brings the pointer forward to its own shape, and there is
  # no move on screen that leaves one behind either. The road reads it where a reader would meet it —
  # in the list of the project's folders — having no command to be turned away from.
  - type: action
    domain: folder
    op: bind
    with:
      dir: orchard
      project: greenhouse

  - type: action
    domain: folder
    op: foreign-pointer
    with:
      dir: orchard
      store: amenbo-dev

steps_cli:
  # `init` in an unclaimed folder raises a project there and points the folder at it. The binding it
  # hands back is what the next step checks the pointer against.
  - type: action
    domain: folder
    op: init
    with:
      dir: standalone
    as: own

  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      project: own

  # A second folder pointed at a project that already exists — many folders to one project, which is
  # what a checkout cloned twice, or a repo and its worktree, actually look like.
  - type: action
    domain: folder
    op: bind
    with:
      dir: shared

  - type: assert
    domain: folder
    op: bound
    with:
      dir: shared
      present: true

  # The first folder is untouched by the second binding — a bind points one folder, never a tree.
  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      project: own

  # The guidance block, brought forward to this build's format. Binding already wrote one, so the
  # resync has nothing to do — and that is the assert: it rewrites only what differs, which is why
  # it can be pointed at every bound folder without churning any of them.
  - type: action
    domain: folder
    op: sync-guide
    with:
      dir: shared

  - type: assert
    domain: folder
    op: resynced
    with:
      dir: shared
      changed: false

  # Taking the pointer back. The project is kept — this is the inverse of bind, not a teardown — so
  # the folder that has its own project still has it.
  - type: action
    domain: folder
    op: unbind
    with:
      dir: shared

  - type: assert
    domain: folder
    op: bound
    with:
      dir: shared
      present: false

  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      project: own

  # And the last one off a project goes the same way the others did. A second folder on the project
  # raised above, so the road can take one off with something still holding it and then take that too.
  - type: action
    domain: folder
    op: bind
    with:
      dir: spare
      project: own

  - type: action
    domain: folder
    op: unbind
    with:
      dir: spare

  - type: assert
    domain: folder
    op: folders-left
    with:
      left: 1

  # Nothing counts here and refuses: what the answer does instead is say the project has none left,
  # which is the whole of what stands between a reshuffle and a project nobody can reach. It is read
  # off that answer and not off the store — a build that stopped saying it leaves the same rows behind.
  - type: action
    domain: folder
    op: unbind
    with:
      dir: standalone

  - type: assert
    domain: folder
    op: folders-left
    with:
      left: 0

  - type: assert
    domain: folder
    op: bound
    with:
      dir: standalone
      present: false

  # A folder another store got to first. The pointer left there is this run's own with a different
  # store's name on it, so its id is a live key here and its slug is that project's — everything
  # agrees but the name, which is exactly the pointer no cross-check can catch and the only one that
  # would land a build on a project it was never sent to.
  - type: action
    domain: folder
    op: foreign-pointer
    with:
      dir: elsewhere
      store: amenbo-dev

  - type: assert
    domain: folder
    op: claimed
    with:
      dir: elsewhere
      store: amenbo-dev

steps_gui:
  - type: assert
    domain: folder
    op: ways-in
    with:
      absent: "bind --project"

  - type: action
    domain: folder
    op: open-existing-card

  - type: action
    domain: folder
    op: choose-project
    with:
      project: Greenhouse

  - type: assert
    domain: folder
    op: open-existing
    with:
      project: Greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse

  - type: assert
    domain: folder
    op: first-loop
    with:
      hands_over: agent --json

  # And onto the face that lists what the project is linked to, where the folder claimed before the
  # app opened is waiting. The move is a step of its own so the arrival is shot: the row is read off
  # that shot, not taken on trust that the road got to the right screen.
  - type: action
    domain: project
    op: open-settings
    with:
      project: Greenhouse

  - type: assert
    domain: folder
    op: claimed
    with:
      dir: orchard
      store: amenbo-dev
