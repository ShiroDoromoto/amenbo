# The automations screen has two ways in. From a project it is that project's, where one is made
# and changed. From the sidebar it is every project's on one list: each row names its project, a run
# is started from the row, and a press on the row goes to the project the automation is in rather
# than opening it here — an automation is changed in its own project, and this list changes nothing.
id: read-every-projects-automations-from-the-sidebar
title: The sidebar's automations list every project's, start one from its row, and go to a row's own project to change it
description: >
  Open the automations from the sidebar and read a row from another project naming that project.
  Start this project's automation from its row and read the pane the run stands up. Then press the
  other project's row and land on its build screen inside that project.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  # The task the built-in the run starts at takes, so the run goes on to the step after it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The action the run opens once the built-in has taken the task, holding the one step it runs. Its
  # way out is declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — started from the list" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

  # Another project's automation, which the list draws beside this project's.
  - { type: action, domain: project, op: create, with: { name: SCENARIO PROJECT — another }, as: another }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — the other's round", project: another }, as: elsewhere }

steps_gui:
  # A workspace to put the run in: a run's steps open terminals, and terminals live here.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: task
    op: open-view
    with:
      view: automations

  - type: assert
    domain: automation
    op: every-listed
    with:
      target: elsewhere
      project: another

  # Started from the row: nothing is handed over, so it is the run the build screen would make.
  - type: action
    domain: automation
    op: start-from-list
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: claim
      action: take
      present: true

  # And the press went there: the run's pane is the one being worked in.
  - type: assert
    domain: workspace
    op: worked-in
    with:
      shows: "SCENARIO SEED — started from the list"

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  # The row goes to the project that owns it, where the automation is changed.
  - type: action
    domain: automation
    op: every-open
    with:
      target: elsewhere
      project: another
