# The build screen is not the only way in. A reader looking at a page of the workspace with room
# left on it is in the position of wanting a run too, and should not have to go and find the
# definition's own screen to press the same button. What matters is that the run is the same one:
# nothing is handed over at the press, which task and which folder being the definition's, so a
# build that let this way in pass something along would make two kinds of run out of one.
#
# A task's own pane was a second way in once, and was taken out: a button under a task reads as
# "run this one on this task", and the entry step takes its own (`app/src/components/StartAutomation.tsx`).
id: start-an-automation-from-an-empty-frame
title: A run is started from an empty frame, goes to its own pane, and is the run the build screen would have made
description: >
  Stand one definition up and start it from the control an empty frame of the workspace carries.
  The run is read by the pane it stands up, which is the one being worked in, and by its row on the
  running tab.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  # The action the run opens, holding the one step it runs. The way out that takes the task is
  # declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — from an empty frame" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  # A workspace to put the run in, for the same reason the build screen's press needs one: a run's
  # steps open terminals, and terminals live here.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  # The box a page with room on it draws where the next pane would land.
  - type: action
    domain: automation
    op: start-from-frame
    with:
      target: auto
    as: from_frame

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: from_frame
      step: claim
      action: take
      present: true

  # The frame's press goes to the pane it stood, which is the one being worked in now.
  - type: assert
    domain: workspace
    op: worked-in
    with:
      shows: "SCENARIO SEED — from an empty frame"

  # And it is on the tab that draws every run this device is carrying.
  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: from_frame
      state: running
