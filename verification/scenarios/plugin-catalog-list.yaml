# Where a browse looks. The official catalog is always one of the sources; a third-party one is
# registered by the URL of its catalog.json and joins the view beside it.
#
# Registering one is a trust decision, not a bookmark: the key the catalog publishes beside its
# catalog.json is pinned on the user's consent, and that key is what plugins from it are trusted on.
# The catalog here publishes none, which is its own answer — it can be browsed, and nothing on it can
# be installed. Standing up a catalog that serves a real key, and consenting to its fingerprint, is a
# server this file cannot stand.
#
# The third-party URL here is deliberately one that answers nothing. A catalog that cannot be reached
# still registers and is retried later — one dead source must not cost the view — and that is exactly
# the state a scenario can hold up without standing a server of its own.
id: plugin-catalog-list
title: A third-party catalog joins the browsing view beside the official one, unreachable and all, and can be taken back off
description: >
  Read the browsing view as it comes: the official catalog, alone and reached. Register a third-party
  catalog and read it back as a source of its own — unreachable, which is reported rather than hidden
  and does not take the view down with it. Register the same URL again and see nothing change.
  Then take it off, and the view is back to the one catalog it started with.
steps:
  # What a machine browses before anybody widens anything: the official catalog, and it answers.
  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://shirodoromoto.github.io/amenbo-plugins/catalog.json
      reachable: true

  - type: action
    domain: plugin
    op: catalog-add
    with:
      url: https://example.invalid/plugins/catalog.json

  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://example.invalid/plugins/catalog.json
      present: true

  # A source that cannot be reached says so and stays in the view. Dropping it would quietly narrow
  # what a person believes they are browsing.
  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://example.invalid/plugins/catalog.json
      reachable: false

  # And the official one is untouched by the company it now keeps.
  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://shirodoromoto.github.io/amenbo-plugins/catalog.json
      reachable: true

  # Registering the same URL twice is a no-op rather than a second source, so a browse never counts
  # one catalog's plugins twice.
  - type: action
    domain: plugin
    op: catalog-add
    with:
      url: https://example.invalid/plugins/catalog.json

  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://example.invalid/plugins/catalog.json
      present: true

  - type: action
    domain: plugin
    op: catalog-remove
    with:
      url: https://example.invalid/plugins/catalog.json

  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://example.invalid/plugins/catalog.json
      present: false

  - type: assert
    domain: plugin
    op: catalog
    with:
      url: https://shirodoromoto.github.io/amenbo-plugins/catalog.json
      present: true
