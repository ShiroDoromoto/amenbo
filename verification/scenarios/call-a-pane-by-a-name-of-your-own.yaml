# A pane is called by a name its reader typed, and the row carries it from then on.
#
# **The row above a pane belongs to the frame rather than to the session in it**, which is why it is
# where a person names a pane. Two hands name a frame and they are ranked — the agent running in it,
# then the person, whose word is the last one for good. This road walks the top of that ranking.
#
# The way in is the row's own menu, and it is the only one. That menu is drawn only while a terminal
# is running, so a frame nobody has opened anything in has no name at all — which is the half this
# road cannot walk: a menu that is not on the screen is not something a reading can be asked for.
#
# ── Why the session names the pane first ─────────────────────────────────────────────────────────
# A frame nobody has named is called after the folder it works in, so a road that named one of those
# would prove only that a box writes into a row carrying a fact rather than a name. The session's own
# `talk name` is the lower of the two hands: it puts a name on the row, and that name is what the box
# opens on, selected and waiting to be typed over. The reading at the end is then the ranking being
# kept rather than a first name arriving.
#
# ── Why the word it replaced is not read for its absence ─────────────────────────────────────────
# The line the road typed is still down in the pane, where the shell echoed it back, and it is how the
# steps below say which pane they mean — so a reading that asked for the session's name to be gone
# would be reading the screen for something that was never on it. The reading that is written answers
# the same question: the row carries the person's word, which it could not do if the session's had
# held.
#
# ── One pane ─────────────────────────────────────────────────────────────────────────────────────
# A row is read by the pane running under it, so telling two of them apart is another road's goal
# (`get-rid-of-a-pane-for-good`). What is under test here is what a row says, not which row was
# reached.
#
# The world is empty on purpose. A name is held for the frame and for this run, and nothing else has
# to be standing for one to be given — and choosing the folder is what raises the project it belongs
# to, so the road makes the world it needs by walking in.
id: call-a-pane-by-a-name-of-your-own
title: A person names a pane from the row's own menu, over the word the row was already carrying
description: >
  Open a pane on a folder, send a line into it, and let the session in it say what the pane is
  called — which is what the row carries until somebody says otherwise. Open what else the row can
  do, choose the item that names the pane, and type a name of your own over the one waiting in the
  box. The row carries that name afterwards.

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # A pane exists because somebody chose where it runs, and the choosing is what raises the project
  # around it as well.
  - type: action
    domain: terminal
    op: open-folder
    with:
      dir: lantern

  # Down to a plain shell. What an agent does with a line typed at it is the agent's own, and the two
  # commands below are the road's own words on the pane and the name the person is about to stand over.
  - type: action
    domain: terminal
    op: open-shell

  # The road's own words on the pane, which is how every step below says which pane it means.
  - type: action
    domain: terminal
    op: type-line
    with:
      text: SCENARIO the first line

  # The lower of the two hands. From here the row calls the pane this, until the person outranks it.
  - type: action
    domain: terminal
    op: say
    with:
      verb: name
      text: SCENARIO named by the session

  - type: action
    domain: terminal
    op: name-pane
    with:
      name: SCENARIO named by hand

  # The person's word, on the row and nowhere in the interface around it. It stands over the name the
  # session gave the frame a moment ago, which is the whole of what the last word for good means here.
  - type: assert
    domain: terminal
    op: label
    with:
      shows: SCENARIO named by hand

  # And the row's answer to being narrower than what it holds. A pointer resting on it drops a panel
  # carrying the whole of the row, so the reader of a pane too narrow to draw its name has somewhere
  # to read it. The name here is short enough for the row itself, and that is what makes it a reading
  # of the panel rather than of a width: what is proved is that the panel comes up and says what the
  # row says, on a road where both are the same words.
  - type: action
    domain: terminal
    op: hold-label
    with:
      shows: SCENARIO the first line

  - type: assert
    domain: terminal
    op: label-in-full
    with:
      shows: SCENARIO named by hand
