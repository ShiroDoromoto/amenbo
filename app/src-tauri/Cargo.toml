[package]
name = "amenbo-app"
version = "18.0.0"
description = "amenbo desktop GUI (Tauri shell, amenbo-core direct)"
authors = ["ShiroDoromoto"]
license = "Apache-2.0"
repository = "https://github.com/ShiroDoromoto/amenbo"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Generates the TS types from the Rust DTOs, so the two are not hand-written twice: a camelCase-shaped
# DTO becomes a TS interface under `app/src/bindings/`. Generation runs under `cargo test`, through the
# export test the derive writes.
ts-rs = "12"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# The folder picker ("open a folder" = the GUI's way to bind an existing store).
tauri-plugin-dialog = "2"
# Announces an arrival in the inbox as an OS notification.
tauri-plugin-notification = "2"
# Opens an external URL in the default browser (the TopBar's "Amenbo" link to the product page).
tauri-plugin-opener = "2"
# Calls core directly, as a Rust library — no FFI.
amenbo-core = { path = "../../crates/amenbo-core" }
chrono = { version = "0.4", features = ["clock"] }
# Always-on perf instrumentation: subscribes to the `target="perf"` spans that core and the command
# layer emit, holding the EnvFilter (resolved env > config > channel > build) in a reloadable layer and
# writing to a rolling file. A file is created **only while it is ON** — when OFF the EnvFilter drops
# every perf event, so the lazy writer never opens one.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
# Wakes the GUI when another process (the CLI, an AI) writes (`commands::watch_store`). The kernel's
# file watcher does the waking (macOS: FSEvents / Linux: inotify / Windows: ReadDirectoryChangesW), and
# where that does not work (containers, NFS) the same API falls back to `PollWatcher`. Unrelated to the
# similarly named `notify-rust` (OS notifications), which is a different crate.
notify = "8"

# What a folder holds, pruned the way the folder itself says (`crate::folder`). ripgrep's walker,
# taken for its answer rather than its speed: it reads `.gitignore`, the global one and the parents'
# the way git does, which is how a build directory this project happens to call `.next` drops out of
# the file face without anybody listing it in our own code. A folder that is no repository loses
# nothing — there is simply nothing to read.
ignore = "0.4"

# The short mark a file open in the panel is known by, so that a save does not write over what
# somebody else put there in the meantime (`crate::folder::digest`). Neither a modification time nor
# a length answers that question — a FAT32 volume records times to the nearest two seconds, and an
# edit that keeps the file the same length is invisible to a length. It is the same crate and the
# same version the store already content-addresses its blobs with, so nothing new arrives in the
# tree with it.
blake3 = "1"

# The pseudo-terminal a pane of the talk window is filled with: what runs in one draws full-screen,
# so the pane is a real terminal rather than a rendering of one. wezterm's implementation, chosen
# because it is Rust the whole way down — no build.rs, no C toolchain, no sidecar binary to ship —
# and because its Windows half is ConPTY direct, with no `winpty-agent.exe` to bundle beside the app.
portable-pty = "0.9"
# What a chunk of terminal output travels to the webview as. The bytes a PTY hands back are not
# text — an escape sequence is split wherever the read happened to end, and a multi-byte character
# with it — so they are carried whole and decoded on the far side by the terminal that understands
# them. Same crate core already reads and writes with.
base64 = "0.23"
# What a file's bytes are turned into text with, and back. A panel that read every file as UTF-8 put
# a `?` where each byte it could not read had been — over ten thousand of them in one Shift_JIS
# document — and saving that back would have written the `?`s into the file. The pair is what Zed
# carries for the same job, and it costs about 210 KB of binary between them: this one converts,
# `chardetng` guesses which conversion a file wants. The reasoning is `src/encoding.rs`.
encoding_rs = "0.8"
# Guesses a file's encoding from its bytes, for the 0.155% of files that are not valid UTF-8 (measured
# over 486,169 of them in a real folder). Version 1 rather than 0.1, which has no ISO-2022-JP among
# its candidates.
chardetng = "1.0"
# Draws the session ids the terminals are named by. Sixteen bytes of the operating system's own
# randomness, which is what keeps a name from repeating across restarts of the app. Same crate core
# draws its blob nonces with.
getrandom = "0.4"

# GUI self-update: check the Tauri updater manifest (`latest-tauri.json`, its own endpoint separate from
# wharfy's `latest.json`) and, when it names a newer signed build, download + minisign-verify (mandatory,
# cannot be disabled) + install it in place. The apply is a user action from the update banner — there is
# no silent background update. Desktop-only crate, pulled in off mobile targets alone (matches the
# `#[cfg(desktop)]` registration in lib.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Start at login: writes and removes the per-user registration each OS reads at login — a plist under
# `~/Library/LaunchAgents`, the `HKCU` Run key, a `~/.config/autostart` desktop entry — so no
# administrator right is asked for. Desktop-only crate, and the login of a desktop session is the whole
# subject, so it is pulled in off mobile targets alone (matches `#[cfg(desktop)]` in `autostart.rs`).
tauri-plugin-autostart = "2"
# One process per store: claims the running instance, and hands a second launch's argv to the process
# holding the claim so that launch can raise the window already open and end (`single_instance.rs`).
# The claim is an OS primitive with no shape off the desktop — a Unix socket, a D-Bus name, a named
# mutex — which is why this too is pulled in off mobile targets alone.
tauri-plugin-single-instance = "2"

# `GtkAppChooserDialog` is the whole of "open with" on this OS, and `gio::AppInfo::launch` is what
# starts the application it hands back — a desktop entry, which the opener plugin's `with` would try
# to run as a command name instead (`crate::open_with`). The same GTK the webview is already drawn on,
# named here only so it can be called directly; `gio` comes with it as `gtk::gio`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The freedesktop bin, which is a format rather than a folder: a row put in it is a pair of files,
# one of them a record of where the row came from, and putting the row back means deleting that
# record with it (`crate::trash`). This crate owns both halves and is the only one of the three
# operating systems where it is taken — macOS throws away the answer this side needs, and the
# restore this crate offers on Windows silently drops a file's extension (measured).
trash = "5"
# The lockfile is written for every target at once, so this crate's own Windows backend puts a
# second `windows` (0.56) in it. Nothing builds it: the dependency above is Linux's alone, so on
# Windows this crate is not compiled and neither is anything under it. The two `windows` versions
# cannot be mixed in one crate, which is the other half of why the Windows recycle bin below is
# written here rather than taken from this one.

# The store-watch tests (`tests/store_watch.rs`) dig real directories on a real filesystem.
[dev-dependencies]
amenbo-scratch = { path = "../../crates/amenbo-scratch" }
# A registered catalog is reached by URL and cached under a name derived from it, so a test that opens a
# plugin off one has to be answered on a port rather than handed a file (dev-dependency only).
amenbo-static-host = { path = "../../crates/amenbo-static-host" }
tempfile = "3"

# Asks `statfs(2)` whether the store's directory sits on a network filesystem (`store_watch`). On NFS
# an inotify watch attaches happily and then never reports another host's writes, so the filesystem
# type is the only thing that can choose polling.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS OS notifications are delivered by hand through UNUserNotificationCenter (the current API). The
# default tauri-plugin-notification route goes notify-rust -> mac-notification-sys, which uses the
# deprecated NSUserNotification: on current macOS that shows no permission dialog, never registers in
# System Settings, and drops delivery silently. Windows and Linux stay on the plugin (WinRT / D-Bus).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
# The macOS half of "start at login" is written by hand through SMAppService for the same reason as the
# notifications above: what tauri-plugin-autostart writes on this OS is a plain ~/Library/LaunchAgents
# plist, which macOS files as a legacy agent under the developer's name instead of listing the app under
# System Settings > Login Items, where somebody looking for it would find it. Windows and Linux stay on
# the plugin.
objc2-service-management = "0.3"
# Asks Launch Services which applications claim a file, for the chooser macOS makes us draw ourselves
# (`crate::open_with`) — the one operating system with no "open with" dialog of its own. Only
# `NSWorkspace` is taken: AppKit's default feature set is the whole framework, and none of the rest of
# it is wanted in a process whose windows belong to Tauri.
# `NSEvent` is taken for its class method alone: it reports the modifier keys as they are right now,
# which is the only way to know whether a drop that just landed was a copy or a move (`crate::dropped`).
# `NSPasteboard` is the machine's own clipboard, which is where a copied file goes: the webview
# cannot carry a file, so both the writing and the reading are this side's (`crate::clipboard`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSEvent", "NSPasteboard", "NSPasteboardItem"] }
# Names the user's home directory, which is where a login registration written by an older version of
# this app sits. Same crate core resolves the app-data base with.
directories = "6"

# Windows OS notifications are delivered by hand through notify-rust. The default
# tauri-plugin-notification desktop route fires a toast and forgets it, exposing no click or action
# callback (its action listener is mobile-only). notify-rust can take WinRT's ToastActivated/Dismissed
# through `wait_for_response`, so a click on the body can be wired to the inbox — symmetric with the
# hand-written UNUserNotificationCenter path on macOS. It is the same version the plugin already pulls
# in transitively (4.18), so it costs no extra build. Linux stays on the plugin (D-Bus).
[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4"
# The shell's own file operation, which is how a row is put in the recycle bin with a sink attached
# to report where it landed — the only door on this OS that says (`crate::trash`). The typed crate
# rather than `windows-sys` beside it, because a sink is a COM object this side implements and only
# `#[implement]` writes one; it is the same 0.61.3 tauri already links, so nothing new is compiled.
# `windows-core` is named outright because that is what `#[implement]` expands to, and `windows` 0.61
# carries no feature that would re-export it under its own name.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
windows-core = "0.61"
# Asks whether the drive is remote (a network drive) (`store_watch`), and whether this process holds an
# administrator's token (`launch`) — elevation is what stops a terminal reaching anything scoop installed.
# Same version tauri already pulls in.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  # `SHOpenWithDialog` is the whole of "open with" on this OS — the shell draws the list, takes the
  # answer and runs it (`crate::open_with`). It is a COM object, so the thread it is called on has to
  # be in an apartment first.
  "Win32_System_Com",
  "Win32_UI_Shell",
  # `GetAsyncKeyState` reads Ctrl and Shift as they are right now — whether a drop that just landed
  # was a copy or a move, which the drag event does not carry (`crate::dropped`).
  "Win32_UI_Input_KeyboardAndMouse",
  # The clipboard, which on this OS holds files as `CF_HDROP` — a block this side writes and reads
  # (`crate::clipboard`). The memory it is written into is the clipboard's once it has been handed
  # over, which is why the allocation is named here too.
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
