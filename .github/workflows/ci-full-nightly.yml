name: ci-full-nightly

# The whole of _ci.yml, once a night, with its path gate forced open.
#
# _ci.yml runs each build/test job only when the diff could have moved it, and the same judgment now
# decides what the local gate runs (`make gate`). One definition, read by both — which is what makes
# a hole in it invisible: a layer missing one of its inputs, or a path that belongs to no layer, is
# skipped by a filter that believes it has judged, and both sides skip it together. The run is green
# and short, and nothing in the diff says otherwise.
#
# This leg is the second net. It asks for none of that judgment — every gated job runs — so a hole
# shows up as a red nightly rather than as a pile of red on the day a tag is cut, where the full run
# is the last thing standing between a wrong filter and a shipped build.
#
# Nightly rather than weekly: what accumulates behind a hole is commits, and the count is what makes
# the eventual failure hard to read. A day's worth is one change to look at.
#
# It calls _ci.yml rather than restating its jobs: two copies of the suite would drift, and the copy
# nobody watches is the one that rots. This is the same shape rot-gates-weekly.yml uses.
#
# It inherits _ci.yml's platforms rather than choosing any of its own, so the macOS and Windows legs
# are forced open here too; the macOS .app bundle stays a distribution artifact, built by neither.
#
# The manual leg of the same body is ci-full-manual.yml. They are separate files so that dispatching
# one does not cancel the other's run: a single workflow holding both triggers shares one
# concurrency group.

on:
  schedule:
    # Nightly at 08:00 UTC. Two hours after scale-heavy-nightly.yml and an hour after
    # rot-gates-weekly.yml, so the three timed legs never contend for the same runners.
    - cron: '0 8 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  full:
    uses: ./.github/workflows/_ci.yml
    with:
      full: true
    permissions:
      contents: read
      pull-requests: read
