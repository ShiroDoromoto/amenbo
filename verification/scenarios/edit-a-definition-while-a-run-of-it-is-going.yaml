# A run works from the copy of its definition it took at the start, so the definition it came from is
# not held while the run is running or paused: the automation is renamed and archived, and the action
# placed on it renamed, with the run still going on from its copy. On the screen the run is named over
# the picture it is going on, and the picture still takes writes.
id: edit-a-definition-while-a-run-of-it-is-going
title: A definition a run is going on is still edited, and the run goes on
description: >
  Start a run, then rename the automation, archive it, and rename the action placed on it — each goes
  through, and the run is still running. On the screen the automation's build screen and the action's
  name the run over the picture and still take writes, the run's band goes to its pane, and once the
  run is stopped the band is gone.
given:
  # Two rather than one because the terminal's premise stands its programs up in front of the
  # machine's own and cannot make a row shorter than two; the step names the first of them either way.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task the built-in the run starts at takes on the screen, so the run goes on to the step after
  # it and stays there while the definition is written.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The built-in that takes a task, one action of one step after it, and every way out decided — the
  # least an automation needs to be started.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one edited under a run" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

steps_cli:
  # A run's steps are opened by the app, so a run is started with one up on the store.
  - { type: action, domain: store, op: app-up }

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running

  # The automation's own fields, archiving included: an archived automation is still the one the run
  # is filed under, and archiving stops nothing already running.
  - type: action
    domain: automation
    op: update
    with:
      target: auto
      name: SCENARIO SEED — renamed under a run

  - type: action
    domain: automation
    op: update
    with:
      target: auto
      archived: true

  # An action placed on it is written too — the run copied its steps at the start.
  - type: action
    domain: automation
    op: action-update
    with:
      target: take
      name: take, renamed under a run

  # None of it reached the run, which goes on from its copy.
  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running

  - type: action
    domain: automation
    op: stop
    with:
      target: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: canceled

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # The automation's own build screen, which the start was pressed on: the run is named over the
  # picture, and the picture still takes writes.
  - type: assert
    domain: automation
    op: held-by
    with:
      target: run

  - type: action
    domain: automation
    op: update
    with:
      target: auto
      name: SCENARIO SEED — renamed under a run

  # The action placed on it is named with the same run, read from the library's side, and is written
  # too.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: assert
    domain: automation
    op: held-by
    with:
      target: run

  - type: action
    domain: automation
    op: action-update
    with:
      target: take
      name: take, renamed under a run

  # The band goes to the pane the run is drawn in.
  - type: action
    domain: automation
    op: held-go
    with:
      target: run

  # Neither write reached the run, which goes on from its copy.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: running

  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: stop

  # Once the run is over, nothing is named over either picture.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: held-by
    with:
      present: false

  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: assert
    domain: automation
    op: held-by
    with:
      present: false
