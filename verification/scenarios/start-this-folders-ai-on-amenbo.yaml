# The instruction to work with Amenbo reaches this folder's AI through a file it is asked to read —
# and a file only works if it is read. The session-start hook is the way in that does not depend on
# that: it arrives through the tool's own protocol, before anything else is asked of the model.
#
# Amenbo's part in it is text, and nothing else. It does not write the provider's settings file, and
# it never says a hook is working — what it can say is that this folder is not wired yet, and hand
# over the text that asks for the wiring. That text is a request for the AI the reader already works
# with: it carries the settings, the file they belong in, and that whatever is in that file stays. So
# the road here is the whole of what a release can break: the folder is told, the text is handed over
# with the file it names, the wiring lands, and Amenbo reads the folder as wired and stops telling the
# tool that landed it — while a tool nobody wired here reads, on its own row, that it is not.
#
# Nothing in it is visible from inside the workspace's own tests: the settings file is a real file in
# a real folder, and the folder is what answers for it.
#
# The screen walks the same road from the other end, and the state both roads start from is declared
# below: the run's own folder carrying the provider's directory with nothing about Amenbo in it, and a
# task on the board of the project that folder answers for — a project that has never held one is
# drawing the first loop, which the report stands aside for, so a board with nothing on it is a board
# with no report on it either. The answer is left where a fresh store leaves it, never given: a no is
# what takes the report away, and a yes is not wiring. What is left to the operator is to open that
# project — the report is drawn on arrival. The copy is a move the shot follows, so make it when the
# run hands that step over.
id: start-this-folders-ai-on-amenbo
title: A folder that does not start its AI on Amenbo says so, hands over what wires it, and stops telling the tool that lands it
description: >
  The reader has a folder their AI works in and no wiring in it, which is where everyone starts. The
  road walks what Amenbo does about that: it names the tool it can see in the folder and says the AI
  is not being started on Amenbo; the text that fixes it comes with the file it goes in and carries
  the launch instruction rather than the spec itself; making the edit is the reader's own act — theirs
  to ask an AI of theirs for — so the run stands in for the hand that does it; and afterwards the
  folder reads as wired, with nothing left for that tool to finish and nothing more said to it.

  Where the road does not stop is the next reader. A tool the folder shows no sign of — somebody
  opening this same folder with one of their own — is warned about nowhere and pointed at by nothing,
  and reads on its own row that it is unwired, with the way to its text beside it.

  Both ends are asked of the standing sweep as well as of the line printed in passing, because a folder
  nobody is standing in is only ever found in the sweep.
given:
  # A folder this reader's AI already works in: the provider's own directory is there, with settings
  # that do nothing about Amenbo. That is the state everyone is in before they are told, and it is the
  # run's own folder, which is already answering for a project — so both roads read this one folder and
  # the screen road has somewhere to be standing.
  - type: action
    domain: repo
    op: write-file
    with:
      path: .claude/settings.json
      content: |
        {
          "permissions": {
            "allow": []
          }
        }

  # The card that spends the first loop, so the board the screen road stands on carries the report
  # rather than the loop. The terminal road never looks at a board, so it reads nothing here.
  - type: action
    domain: task
    op: create
    with:
      title: Draft the winter planting order
    as: card

  # Finished being written, the way work already on a board is: what this card is here for is
  # to be an ordinary one.
  - type: action
    domain: task
    op: finish-creating
    with:
      target: card

steps_cli:
  # Told, and told by name: the folder shows what tool it is, so the report names it rather than
  # leaving the reader to work out which of five it means.
  - type: assert
    domain: repo
    op: ai-launch
    with:
      wired: false
      tool: claude-code

  # And told in the other place too. The line above arrives on whatever command the reader happened to
  # type; the sweep is where they can go and look, which is the only way to find a folder they are not
  # standing in. It says the same thing, by the same name.
  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
      issue: unwired_folder
      present: true

  # What is handed over. The file is half the answer — the same text in the wrong place leaves the
  # folder exactly as it was — and what it injects is the launch instruction, the one line that sends
  # the AI to the entry point, never the entry point's own contents.
  - type: assert
    domain: repo
    op: ai-launch-text
    with:
      tool: claude-code
      carries: agent --json
      paste_into: .claude/settings.json

  # The edit the text asks for. Amenbo writes no settings file, so this is the reader's own AI and not
  # Amenbo — the run only stands in for it.
  - type: action
    domain: repo
    op: wire-ai
    with:
      tool: claude-code

  # And the folder reads as wired. Nothing was recorded to make it so: what changed is the file on
  # disk, which is read afresh every time, so this is the same question as the first assert and it
  # now comes back the other way.
  - type: assert
    domain: repo
    op: ai-launch
    with:
      wired: true

  # The tool that landed it says so on its own row, which is where an AI reads its own answer rather
  # than the folder's.
  - type: assert
    domain: repo
    op: ai-launch-tool
    with:
      tool: claude-code
      wired: true

  # And the one nobody wired here still says it is not. This is the reader who opens a folder somebody
  # else set up, with a tool of their own: the folder shows no sign of it, so there is nothing to point
  # at and nobody is warned — its own row is the whole of what it gets, and it carries the way to its
  # text. Left out, that AI works here reading nothing about Amenbo, in a folder that looks finished.
  - type: assert
    domain: repo
    op: ai-launch-tool
    with:
      tool: codex-cli
      wired: false

  # The sweep goes quiet with it. Nothing was recorded to end the report either — only the wiring
  # landing does, which is what keeps a list of folders to wire from outliving the wiring.
  - type: assert
    domain: store
    op: doctor
    with:
      ok: true
      issue: unwired_folder
      present: false

steps_gui:
  # The report, standing on the project's own board with nothing asked and nothing over it. What raises
  # it is the state — a bound folder that is not wired — and it names the provider the folder traces
  # rather than leaving the reader to work out which of five it means, together with the file the text
  # goes into. This is the line the screen road is here for: Amenbo writes no settings file on this
  # surface either, so the report is the whole of what a reader is given, and it stands until the paste
  # lands rather than closing on anything they say.
  - type: assert
    domain: repo
    op: ai-launch-notice
    with:
      tool: claude-code
      paste_into: .claude/settings.json

  # The way on from there: the button that takes the text. Where it goes is the clipboard, which no
  # shot reads back, so the road ends at the press — what the text carries is held from the other end,
  # by the road above.
  - type: action
    domain: repo
    op: ai-launch-copy
    with:
      tool: claude-code
