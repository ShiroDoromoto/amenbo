# A task filter narrows the tasks a step may take by more than one category at once: one value on
# each of two axes, both of which a task has to carry. The answer is written with `--dim` once per
# value, and the step's task list reads each as a `dim:` token of its own — joined into one, a value
# holding a comma would be read whole and name nothing, and the run would fall over at the list.
#
# The expression the step is handed is held by core's own tests (`amenbo_core::ops::automation_step`);
# what a road can read is the answer, and the refusal of a value that is not there. That refusal comes
# where the answer is written, not where a run later reads it.
id: narrow-the-tasks-a-step-takes-by-category
title: A task filter is answered with a value on each of two categories, and a value that is not there is refused
description: >
  Stand up an automation with a placement that takes a task through a task filter, and two categories
  with a value each. From a terminal the filter is answered with one value on each category and read
  back whole. Answering it with a value the category does not hold is refused on the spot, and the
  answer already written stays as it was. On the screen each category is a row under the filter, its
  values pressed like the rows above it, and the setting stops being named as what is in the way.
given:
  - { type: action, domain: dimension, op: create, with: { name: theme } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: theme, value: main } }
  - { type: action, domain: dimension, op: create, with: { name: stage } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: stage, value: second } }

  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: cfg-add, with: { action: take, name: which, kind: taskfilter, required: true } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — tasks by category" }, as: auto }
  # A picture starts at a built-in a run can start at, so the action answering the filter goes on
  # after the one that takes a task. That built-in's own filter needs no answer, so the only setting
  # the launch check names is the action's.
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }

steps_cli:
  # One value on each of two categories.
  - type: action
    domain: automation
    op: cfg-set
    with: { target: at_take, name: which, status: todo, dim: ["theme=main", "stage=second"] }

  - type: assert
    domain: automation
    op: placement-read
    with:
      target: auto
      name: take
      settings: { which: { status: [todo], dim: ["theme=main", "stage=second"] } }

  # A value the category does not hold is refused where it is written.
  - type: action
    domain: automation
    op: cfg-set
    with: { target: at_take, name: which, status: todo, dim: ["theme=main", "stage=third"], refused: not_found_dimension_value }

  # The answer already written is left as it was.
  - type: assert
    domain: automation
    op: placement-read
    with:
      target: auto
      name: take
      settings: { which: { status: [todo], dim: ["theme=main", "stage=second"] } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which
      present: true

  # A row per category, after the rows every filter has.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: take

  - type: action
    domain: automation
    op: answer-filter
    with:
      setting: which
      row: theme
      value: main

  - type: action
    domain: automation
    op: answer-filter
    with:
      setting: which
      row: stage
      value: second

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which
      present: false
