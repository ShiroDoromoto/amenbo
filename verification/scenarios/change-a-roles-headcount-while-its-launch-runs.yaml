# A launch is under way and its role has more tasks waiting than seats. A reader raises the role's
# headcount for this launch alone, and the new seat takes a task at once; lowered again, no task under
# way is cut off — the seat past the headcount goes once its run finishes the task it is on, and the
# desk counts the seats still to go. Raised again before they have gone, the cut is called off. Put
# back at the definition, the note saying the headcount is this launch's alone is gone. The definition
# itself is never touched: what the next launch copies is the same throughout. Raised once more and
# the launch then stopped from its header, the role reads back at its definition — the headcount was
# the launch's alone, and ends with it.
#
# The automation is the one pause-a-launch-after-the-current-task-from-its-pane walks. Its one role is
# the one it was born with, named after it, and its round starts at the take_task placed first, so
# the launch has one set of seats, read as that role's. Two tasks wait, both filed with that role so
# a seat takes them, and a second seat has one to take.
id: change-a-roles-headcount-while-its-launch-runs
title: A role's headcount is raised, lowered, raised again and put back for one launch, and the definition stays
description: >
  Start a run of an automation whose one role has one seat, with two tasks waiting. Raise the role's
  headcount for this launch to two and see a second run take the other task; lower it to one and read
  that both runs go on, with one seat still to go; raise it to two again and read the cut called off;
  put it back at the definition and read the one seat still to go once more. After each, the role's
  definition still says one. On the screen, raise it to two once more, stop the launch from its header,
  and read the role back at one.
given:
  # Two rather than one because the terminal's premise stands its programs up in front of the
  # machine's own and cannot make a row shorter than two; the step names the first of them either way.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The two tasks the role's seats take on the screen: the first run's, and the one the seat added
  # takes.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the first seat takes }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the seat added takes }, as: second }
  - { type: action, domain: task, op: assign, with: { target: second, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: second } }
  # The action the run opens once the built-in has taken the task, holding the one step it runs. Its
  # way out is declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  # The action the run goes on to, so the task is still the run's once the first step has reported.
  - { type: action, domain: automation, op: action-add, with: { name: after }, as: after }
  - { type: action, domain: automation, op: step-add, with: { target: after, name: wait, prompt: carry on with the task }, as: wait }
  - { type: action, domain: automation, op: action-entry, with: { target: after, step: wait } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: wait, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — headcount" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_start }
  # Both tasks are the born role's, whose round starts there: a seat takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed, role_of: auto } }
  - { type: action, domain: task, op: update, with: { target: second, role_of: auto } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: after }, as: at_after }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_after, step: wait, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_after } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_after, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }

# A run started from the terminal opens no step — the host that opens them is the app's — so no seat
# added here takes a task by itself. What fills it is a second start, which is turned away while the
# one seat is taken and goes through once the headcount is raised: that is the terminal's reading of
# a raise taking hold at once.
steps_cli:
  # A run's steps are opened by the app, so a run is started with one up on the store.
  - { type: action, domain: store, op: app-up }
  # A run starts from the newest saved version, so it is saved first.
  - { type: action, domain: automation, op: save, with: { target: auto } }

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      under_way: 1
      to_let_go: 0
      held: false

  # The one seat is taken, so a second start is turned away rather than queued.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      refused: invalid_automation_run_limit

  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2

  # This launch holds two; the definition still says one.
  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2
      defined: 1
      under_way: 1

  # The seat added is free at once, so the same start goes through now, into the same launch.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run2

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run2
      role: SCENARIO SEED — headcountの係
      headcount: 2
      under_way: 2
      to_let_go: 0

  # Lowered below the runs under way: neither is stopped, and one seat is still to go.
  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      under_way: 2
      to_let_go: 1

  - type: assert
    domain: automation
    op: run
    with:
      target: run2
      status: running

  # Raised again before the seat has gone: the cut is called off, and both runs keep their seats.
  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2
      defined: 1
      under_way: 2
      to_let_go: 0

  # Back at the definition, which lowers it as a cut would: the seat past it is to go once more.
  - type: action
    domain: automation
    op: launch-headcount-reset
    with:
      target: run
      role: SCENARIO SEED — headcountの係

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      under_way: 2
      to_let_go: 1

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: assert
    domain: automation
    op: launch-head
    with:
      target: run
      state: running
      working: 1
      of: 1

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      under_way: 1
      to_let_go: 0

  # Raised, the seat added takes the other task at once: a second run starts into it, and the desk says
  # the headcount is this launch's alone.
  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2
      defined: 1
      under_way: 2
      to_let_go: 0

  - type: assert
    domain: automation
    op: launch-head
    with:
      target: run
      state: running
      working: 2
      of: 2

  # Lowered below the seats working: neither run is stopped, and the desk counts the one still to go.
  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      under_way: 2
      to_let_go: 1

  # Raised again before the seat has gone: the cut is called off.
  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2
      defined: 1
      under_way: 2
      to_let_go: 0

  # Back at the definition, from the button the menu carries while the two differ. The note saying the
  # headcount is this launch's alone is gone, and the seat past it is to go once more.
  - type: action
    domain: automation
    op: launch-headcount-reset
    with:
      target: run
      role: SCENARIO SEED — headcountの係

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      under_way: 2
      to_let_go: 1

  # Raised once more, then the launch stopped from its header: once it has ended the role reads back at
  # its definition, and the note saying the headcount is this launch's alone is gone with the menu. The
  # terminal has no way to end a launch, so this is read on the screen alone.
  - type: action
    domain: automation
    op: launch-headcount-set
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 2

  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: stop
      on: pane

  - type: assert
    domain: automation
    op: launch-head
    with:
      target: run
      state: ended

  - type: assert
    domain: automation
    op: launch-role
    with:
      target: run
      role: SCENARIO SEED — headcountの係
      headcount: 1
      defined: 1
      held: false
