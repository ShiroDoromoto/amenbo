# A script step runs a program instead of a prompt, and which way out it leaves by is what the program
# writes in `output.json` — not its exit code, and not anyone typing at a pane. The app
# starts the program on a thread of its own, writes down what it came to, and opens the next step
# (`app/src-tauri/src/automation.rs`, `run_script`), so there is no terminal for a road to type in and
# nothing to read the choice off but where the run goes next.
#
# Two script steps stand in a row, each with two ways out leading to different places. The first
# leaves by the done one, the second by one it names, and the run only reaches the step after them by
# those two choices: any other way out of either stops the run or closes it. What the second hands on
# is wired into that step as a required input, so the step opening at all says the value came across.
id: send-a-run-down-the-way-out-its-script-names
title: Each script step leaves by the way out its program writes down, and the run goes on to where that way out leads
description: >
  Start a run that takes a task, then walks two script steps before an agent's step. The first
  script's program writes the done way out, which leads on, while its other way out stops the run.
  The second's writes a way out of its own with a value under it, which leads to the agent's step,
  while its done way out would close the task and end the run. With no pane to type in, the run goes
  on by itself: the pane comes up standing on the agent's step, and reporting it closes the task and
  completes the run.
given:
  # The agent's step at the end is carried out by Claude Code, one of the two agents this machine can
  # start. `runs` keeps the stand-in standing and carries out what is typed at it.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }

  # The program both script steps start, told by its arguments which way out to write.
  - { type: action, domain: repo, op: copy-fixture, with: { from: script/leave-by.sh, path: script/leave-by.sh, executable: true } }

  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the scripts look at }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }

  # The first: its program writes the done way out. Its other way out stops the run for a person.
  - { type: action, domain: automation, op: action-add, with: { name: look }, as: look }
  - { type: action, domain: automation, op: step-add, with: { target: look, name: look, program_at: script/leave-by.sh, args: [leave, 完了] }, as: look_step }
  - { type: action, domain: automation, op: action-entry, with: { target: look, step: look_step } }
  - { type: action, domain: automation, op: exit-add, with: { step: look_step, name: red } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: look_step, exit_to: "" } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: look_step, exit: red, halt: true } }

  # The second: its program writes "red", with what it found under `why`. The way out and what it
  # hands on are declared on the step and on the action, and the lines inside carry one to the other.
  - { type: action, domain: automation, op: action-add, with: { name: judge }, as: judge }
  - { type: action, domain: automation, op: step-add, with: { target: judge, name: judge, program_at: script/leave-by.sh, args: [leave, red, why, the build is red] }, as: judge_step }
  - { type: action, domain: automation, op: action-entry, with: { target: judge, step: judge_step } }
  - { type: action, domain: automation, op: exit-add, with: { step: judge_step, name: red }, as: judge_step_red }
  - { type: action, domain: automation, op: port-add, with: { target: judge_step_red, name: why, kind: value, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: judge, name: red }, as: judge_red }
  - { type: action, domain: automation, op: port-add, with: { target: judge_red, name: why, kind: value, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: judge_step, exit: red, exit_to: red } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: judge_step, exit_to: "" } }
  - { type: action, domain: automation, op: wire-add, with: { in_action: true, target: judge_step, exit: red, from_port: why, to_port: why } }

  # The agent's step the red way out leads to, which takes what the second script found.
  - { type: action, domain: automation, op: action-add, with: { name: review }, as: review }
  - { type: action, domain: automation, op: step-add, with: { target: review, name: read, prompt: read why the build is red }, as: read }
  - { type: action, domain: automation, op: action-entry, with: { target: review, step: read } }
  - { type: action, domain: automation, op: port-add, with: { action: review, name: why, kind: value, required: true } }
  - { type: action, domain: automation, op: port-add, with: { step: read, name: why, kind: value, required: true } }
  - { type: action, domain: automation, op: wire-add, with: { in_action: true, from_port: why, to: read, to_port: why } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: read, exit_to: "" } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — two scripts in a row" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: look }, as: at_look }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: judge }, as: at_judge }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: review }, as: at_review }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_review, step: read, agent: claude-code } }
  - { type: action, domain: automation, op: wire-add, with: { target: at_judge, exit: red, from_port: why, to: at_review, to_port: why } }

  # Where each way out leads. The second script's done way out goes straight to closing the task, so
  # a run that reached the agent's step went by the way out the program named.
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_look } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_look, to: at_judge } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_judge, exit: red, to: at_review } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_judge, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_review, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # Nothing is typed between the start and this: the two programs run and end by themselves, and the
  # pane comes up standing on the step their ways out led to. A build that read the exit code, or
  # took the done way out for every script, would have closed the task here and completed the run.
  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: read
      action: review
      task: seed
      present: true

  # The agent's step reports, and the built-in after it closes the task and ends the run.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      report: read why the build is red

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      state: completed
      present: true
