# Work that was reserved and then abandoned by a process dying, put back in front of a person.
#
# A pane can die and the ledger not hear about it. What is left is a task sitting reserved with nobody
# at it — and a reserved task is out of everybody's mailbox, so nothing offers it and nothing on any
# screen said so. This road is the screen that now does.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no second road here and no gap in one. What is under test is a question drawn in an empty
# slot of the terminal face, and a terminal has no empty slot: somebody at a shell reads their
# reservations by asking for them, which is a different thing and is walked elsewhere.
#
# ── The two reservations, and why the second one is the point ────────────────────────────────────
# The world stands up two tasks, reserved two different ways:
#
#  - one **in a pane** (`task adrift`), which carries the session that made it. Nothing is running
#    under that session — no driver has a pane — so it is a reservation nothing is at, and Amenbo can
#    say so because it knows which of its own sessions are still open.
#  - one **plainly** (`task status`), which carries no session at all. That is what a reservation made
#    at somebody's own terminal looks like, and Amenbo cannot see that terminal. It must not be asked
#    about, and the road reads its absence in the same slot as the other one's presence — one screen,
#    both halves, so a build that started guessing would fail here rather than quietly widening.
#
# ── Why the question is where it is ──────────────────────────────────────────────────────────────
# An empty slot is the one place on the face with room for it and the one place a reader is already
# looking for something to start. So the road opens the face, gives the page a folder — which is what
# puts the screen in a project, and the question is asked about that project and no other — and reads
# the slot beside it.
#
# ── What pressing it may do, and what it may not ─────────────────────────────────────────────────
# Pressing a task opens it on the ledger's face. That is the whole of the affordance and it is the
# half worth defending: Amenbo does not know the work stopped, only that nothing it opened is at it,
# so it may not move a task back on its own. The road ends on the task's own face, which is where a
# person decides.
id: be-asked-about-work-nothing-is-doing-any-more
title: A reservation whose pane has gone is put back in front of a person, and one Amenbo cannot speak for is not
description: >
  Stand up two reservations in one project — one made in a pane that is no longer running, one made
  the way somebody's own terminal makes them — then open the terminal face and give its page that
  project's folder. The empty slot beside the pane asks about the first and says nothing about the
  second. Pressing the one it asks about opens that task on the ledger's face, which is where the
  answer is given: nothing on this screen moves it.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  # The folder is what puts a screen in a project: the page's panes open in it, and the question is
  # asked about the project it belongs to and no other.
  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO carry the ledger migration through
      project: greenhouse
    as: abandoned

  - type: action
    domain: task
    op: finish-creating
    with:
      target: abandoned

  # A phrase the task carries on its own face and nowhere else, so the step that reads which record the
  # press opened has something to read it by: the title is on the slot's row too.
  - type: action
    domain: task
    op: update
    with:
      target: abandoned
      notes: SCENARIO the store format has to move before anything else can

  # Reserved in a pane. Nothing runs under that session, so from this moment nothing is at it.
  - type: action
    domain: task
    op: adrift
    with:
      target: abandoned

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO sort the sender out
      project: greenhouse
    as: elsewhere

  - type: action
    domain: task
    op: finish-creating
    with:
      target: elsewhere

  # Reserved with nothing to say who by — what a reservation made at somebody's own terminal leaves.
  # Amenbo cannot see that terminal, so this one is never to be asked about.
  - type: action
    domain: task
    op: status
    with:
      target: elsewhere
      status: in_progress

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # The page's folder, which is the project the question is about. It is the same one press the face
  # opens on, and here it is also what makes the slot beside it a slot in a project.
  - type: action
    domain: terminal
    op: open-folder
    with:
      dir: greenhouse

  - type: assert
    domain: terminal
    op: adrift
    with:
      target: abandoned

  # The half the whole rule rests on, read on the same screen: a reservation Amenbo cannot speak for
  # is one it says nothing about.
  - type: assert
    domain: terminal
    op: adrift
    with:
      target: elsewhere
      present: false

  # Pressing it opens the task, and opening is all it does.
  - type: action
    domain: terminal
    op: open-adrift
    with:
      target: abandoned

  - type: assert
    domain: task
    op: opened
    with:
      target: abandoned
      shows: SCENARIO the store format has to move before anything else can

  # And the reservation is still the reservation. This is the half the question's whole shape rests on:
  # the screen asked, and what to do about it is the person's.
  - type: assert
    domain: task
    op: field
    with:
      target: abandoned
      field: status
      equals: in_progress
