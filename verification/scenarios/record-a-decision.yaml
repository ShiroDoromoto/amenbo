# The path a why takes from being written down to being settled. A decision arrives as a proposal,
# is worked on while it is still one, and is then ruled on — accepted, taken back for a second look
# and accepted again, or turned down. What the shipped build has to get right is the order: the body
# is the reader's to change up to acceptance, and the status the store keeps afterwards is what every
# reader downstream trusts.
id: record-a-decision
title: A why is written down as a proposal, worked on while it is one, and ruled on — accepted, reopened, or turned down
description: >
  Record a decision, read back that it starts unsettled, write its body, and walk it through the
  rulings it can meet: accepted (which freezes the body), reopened (which lifts the freeze so it can
  be said better), and accepted again. A second decision takes the other ruling, rejection, whose
  reason lands on the timeline rather than in a field of its own. Acceptance is what other work waits
  on, so the status these lines read is the one a task's readiness is derived from, and the settled
  record names who settled it.
steps_cli:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — a decision to be ruled on
    as: rec

  # A recorded decision is a proposal, never a settled one: the human rules on it.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: status
      equals: proposed

  - type: action
    domain: decision
    op: edit
    with:
      target: rec
      body: "SCENARIO — the rationale, as it stands before the ruling."

  # The body is what a decision is for, so it is read back off the store rather than assumed from
  # the edit having exited zero.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: body
      equals: "SCENARIO — the rationale, as it stands before the ruling."

  - type: action
    domain: decision
    op: accept
    with:
      target: rec

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: status
      equals: accepted

  # A ruling is only worth what its author is worth, and an AI may settle one as well as a person, so
  # the settled record carries who settled it — read back off the shipped build, not assumed from the
  # accept having exited zero.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: decided_by.id
      equals: human

  # Nothing has replaced it, which is asked of the edges rather than of a word: `superseded:no` is
  # the listing arm a reader narrows by when looking for what has not been overturned.
  - type: assert
    domain: decision
    op: listed
    with:
      filter: "superseded:no"
      target: rec
      present: true

  # A ruling is not a one-way door. Reopening un-settles it, which is what makes the body editable
  # again — the freeze is what acceptance is, so taking the ruling back has to lift it.
  - type: action
    domain: decision
    op: reopen
    with:
      target: rec

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: status
      equals: proposed

  - type: action
    domain: decision
    op: edit
    with:
      target: rec
      body: "SCENARIO — the rationale, as it reads after the second look."

  - type: action
    domain: decision
    op: accept
    with:
      target: rec

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: body
      equals: "SCENARIO — the rationale, as it reads after the second look."

  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: status
      equals: accepted

  # The other ruling: turned down. A rejected proposal never settles anything, and the reason it was
  # turned down lands on its timeline — there is no field for it, because it is a thing said.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — a proposal that does not carry
    as: dropped

  - type: action
    domain: decision
    op: reject
    with:
      target: dropped
      reason: SCENARIO — turned down, and here is why

  - type: assert
    domain: decision
    op: field
    with:
      target: dropped
      field: status
      equals: rejected

  - type: assert
    domain: decision
    op: commented
    with:
      target: dropped
      text: SCENARIO — turned down, and here is why
