name: _dependabot-automerge

# Merge a Dependabot PR once CI has passed on it — nobody has to watch the queue. The one entry
# that reaches this body is dependabot-automerge-after-ci.yml, and the ownership checks that say
# the run was Dependabot's and green live there: what arrives here is the branch alone.
#
# The wait is done here rather than by GitHub's own auto-merge: fire on CI
# *completing*, and merge only if it completed green. Native auto-merge would
# hold for the same verdict now that main requires the aggregate check, but the
# lockfile repair below has to land before the merge, and it runs off this very
# signal — so the merge follows it here instead of racing it from the other side.
#
# The entry's `workflow_run` trigger runs in the context of the base repo with a
# normal GITHUB_TOKEN, so a fork PR cannot reach these permissions — the usual
# pull_request_target hazard does not apply. The token still cannot approve a PR (a
# token cannot approve its own repo's PRs), but approval is not required here:
# nothing on main requires a review.
#
# Merging is automatic. SHIPPING is not: releases stay an explicit human/AI step
# (wharfy), so bumps accumulate on main until someone cuts one deliberately.
#
# The merge is preceded by one repair the bot cannot make for itself — completing
# the bump in the lockfile that sits outside the workspace (see `lockstep`). That
# is why this workflow writes as well as merges.
on:
  workflow_call:
    inputs:
      head_branch:
        description: the Dependabot branch the green run was on
        required: true
        type: string

jobs:
  # The GUI shell crate and the verification harness are both `exclude`d from the workspace and
  # carry lockfiles of their own, but they reach core through a path dependency: a workspace bump
  # changes what those locks resolve to, and Dependabot's PR does not open the files. Merged as-is,
  # main's copies point at a resolution that is no longer real, and the next person to run cargo
  # over one of them wears the churn.
  #
  # So the bump is completed here, before it lands: re-resolve both, and push the result onto the
  # same branch. `cargo metadata` rewrites a lock without compiling, so this costs seconds and needs
  # none of the Tauri system libs.
  #
  # It runs ahead of the merge rather than as a CI job because CI's token is read-only on a
  # Dependabot pull request — the entry's `workflow_run` trigger is what carries a writable one.
  # The run that went green and the tree being merged differ only by a lockfile cargo derived from
  # the manifests CI already judged.
  #
  # But a GITHUB_TOKEN push never starts a run, so the head this leaves behind carries no verdict of
  # its own, and main's required check is asked for one. On the bumps that move a lock, the merge
  # below is therefore refused and the job goes red — visibly, on the PR nobody has merged.
  #
  # A human's PR is held to the same contract by CI's `out-of-workspace-locks` job, which fails
  # instead of pushing.
  lockstep:
    name: Bring the out-of-workspace lockfiles along
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # workflow_run checks out the default branch unless told otherwise, and the branch (not the
      # sha) is what a push needs to land on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_branch }}

      # The entry checked who triggered the run; this checks who owns the branch about to be
      # written to.
      - name: Push the re-resolved lockfiles if they moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                  --json number,author --jq '.[0] | select(.author.login == "app/dependabot") | .number')"
          if [ -z "$pr" ]; then
            echo "no open Dependabot PR on ${BRANCH} — nothing to bring along"
            exit 0
          fi
          cargo metadata --manifest-path app/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --manifest-path verification/Cargo.toml --format-version 1 > /dev/null
          if git diff --quiet -- app/src-tauri/Cargo.lock verification/Cargo.lock; then
            echo "the out-of-workspace lockfiles already follow the workspace"
            exit 0
          fi
          # GitHub's documented identity for a commit an action authored. The leading number is the
          # bot account's id, which is what ties the commit to it rather than to a stranger.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/Cargo.lock verification/Cargo.lock
          git commit -m "chore(deps): follow the workspace in the out-of-workspace lockfiles"
          git push origin "HEAD:${BRANCH}"
          echo "pushed the re-resolved lockfiles onto ${BRANCH} (PR #${pr})"

  merge:
    name: Merge green Dependabot PRs
    runs-on: ubuntu-latest
    needs: lockstep
    permissions:
      contents: write
      pull-requests: write
    steps:
      # workflow_run does not carry the PR, only the head branch it ran on. Find
      # the open PR for that branch and check it really is Dependabot's before
      # touching it (the entry's check is about who triggered CI; this is about
      # who owns the branch being merged).
      - name: Find the PR and merge it if it is Dependabot's
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                  --json number,author --jq '.[0] | select(.author.login == "app/dependabot") | .number')"
          if [ -z "$pr" ]; then
            echo "no open Dependabot PR on $BRANCH — nothing to merge"
            exit 0
          fi
          echo "merging PR #$pr ($BRANCH), CI was green"
          gh pr merge "$pr" --repo "$REPO" --merge --delete-branch
