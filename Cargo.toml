[workspace]
resolver = "2"
members = ["crates/amenbo-core", "crates/amenbo-cli", "crates/amenbo-scratch", "crates/amenbo-static-host"]
# The GUI (Tauri) shell is a standalone crate outside the workspace, excluded so the root
# `cargo build` stays light. It reaches amenbo-core through a path dependency.
exclude = ["app/src-tauri"]

[workspace.package]
version = "5.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ShiroDoromoto/amenbo"

[workspace.dependencies]
# Throwaway directories for the tests (dev-dependency only — never linked into a shipped binary).
amenbo-scratch = { path = "crates/amenbo-scratch" }
# A loopback host for the tests, for the routes that are reached by URL and cannot be a file on disk
# (dev-dependency only — never linked into a shipped binary).
amenbo-static-host = { path = "crates/amenbo-static-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML reader for `plugin validate`: authors write manifests as `plugins/<name>.yaml` in the catalog
# repo, so the author-facing validator must read that form, not only the aggregated `catalog.json`.
# serde_norway is the maintained fork of the (archived) serde_yaml, drop-in on serde.
serde_norway = "0.9"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
directories = "6"
clap = { version = "4", features = ["derive"] }
# Always-on, low-overhead perf instrumentation. The facade only — sites emit `target="perf"`
# spans/events; with no subscriber installed (CLI today) they are cheap no-ops. The GUI installs a
# reloadable file subscriber (see `app/src-tauri/src/perf.rs`).
tracing = "0.1"
