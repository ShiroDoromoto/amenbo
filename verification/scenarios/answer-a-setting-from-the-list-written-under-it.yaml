# A setting whose kind is `choice` is answered off a pulldown, and what that pulldown holds is not
# the build's to decide: it is the list somebody wrote out under the row, a line to a choice. The
# writing and the answering are two halves of one thing, and the second is the only reading the panel
# gives of the first — nothing on this screen shows the list as a list.
#
# ── Why the second line is the one chosen ───────────────────────────────────────────────────────
# The box takes the whole list at once and cuts it on the newlines. A build that cut it wrong — kept
# the first line and dropped the rest, or took the lot as one choice — still offers something, and a
# road reaching for the first line it wrote would be answered by any of those. The second line is
# offered only by a build that read the box the way the row labels it.
#
# ── Why the launch place is the reading ─────────────────────────────────────────────────────────
# The setting is declared as one the step is refused without, so until it is answered the launch
# place names it. Taking that line away is the screen saying a press on the pulldown was an answer,
# and not a selection it merely drew: a build that offered the right lines and wrote none of them
# down would pass the press and fail here.
#
# ── Where each half is done ─────────────────────────────────────────────────────────────────────
# The setting is the action's, so it is declared, written out and insisted on in the action's own
# input panel; the answer is the placement's, so it is given in the panel a placement opens on the
# automation. The road goes from the one to the other, which is the way a reader goes.
id: answer-a-setting-from-the-list-written-under-it
title: What is written out under a choice setting is what its pulldown offers, and choosing from it answers the setting
description: >
  Declare a setting on an action's own screen as the kind that is answered off a list, write two
  choices out under it a line apiece, and say the step is refused without an answer — which puts the
  setting on the launch place of the automation placing it. Then answer it on that placement's panel
  by choosing the second of the two on the pulldown, and the launch place lets the definition go.
given:
  # Claude Code is one of the two agents this machine can start — two being the fewest the premise
  # stands up — so nothing on the launch place is ever about who carries the step out.
  - { type: action, domain: workspace, op: can-start, with: { count: 2 } }

  # The action the panel is read on, holding the one step it runs. The way out that takes the task
  # is declared on both layers, and the line inside the action carries the step's out by the action's.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — a setting to answer off its list" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  # Both ways out say what happens after them, so the definition opens with nothing in its way and
  # the one line the launch place carries below is the one this road put there.
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: true

  # On the action placed there: the setting, the list under it a line to a choice, and insisting on it.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: action
    domain: automation
    op: open-part
    with:
      part: input

  - type: action
    domain: automation
    op: declare
    with:
      what: setting
      name: which way
      kind: choice

  - type: action
    domain: automation
    op: redeclare
    with:
      what: setting
      name: which way
      choices:
        - take the next one
        - stop here

  - type: action
    domain: automation
    op: redeclare
    with:
      what: setting
      name: which way
      required: true

  # Back on the definition, unanswered and in the way.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which way
      present: true

  # Answered on the placement, off the pulldown the list became — the second line of it.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: take

  - type: action
    domain: automation
    op: answer-choice
    with:
      setting: which way
      value: stop here

  - type: assert
    domain: automation
    op: launch
    with:
      ready: true
