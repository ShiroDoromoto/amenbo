# An automation is built from the terminal and read on the screen. The terminal prints a definition
# back as text (`automation show`), but the picture is the screen's alone — which actions are placed
# on it, what leaving each one by which way out does, and which of them is not finished yet, laid out
# so a person sees it at once. A build that drew the boxes and lost the lines, or drew the lines and
# lost what is written along them, would leave somebody building blind while every command they
# typed still answered.
id: read-the-picture-an-automation-is-built-into
title: The build screen draws the placed actions, the lines between them and the marks that say one is not finished
description: >
  Stand a definition of three placed actions up from the terminal, after the built-in that takes a
  task, open it on the screen, and read the picture back. Every claim is made against what the
  terminal put there: the action the taken task is handed to, the action whose required input nothing
  reaches, and the two lines — one going on by a named way out, one closing the run. A box nobody placed is asked for too, because a picture that
  drew every name it was given would read as green from the present half alone.
given:
  # The action the taken task is handed to first. The task is taken by the built-in placed before it,
  # whose `task_take` output is what makes the picture draw the dashed outline for that task's span.
  # What is inside this action is not what this picture is about, so it holds no step.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: note, kind: value, required: true } }

  # The action in the middle. Two required inputs are declared on it and only one is ever wired, which
  # is the state the picture marks.
  - { type: action, domain: automation, op: action-add, with: { name: work }, as: work }
  - { type: action, domain: automation, op: port-add, with: { action: work, name: note, kind: value, required: true } }
  - { type: action, domain: automation, op: port-add, with: { action: work, name: draft, kind: file, required: true } }

  - { type: action, domain: automation, op: action-add, with: { name: review }, as: review }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one task, three actions" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: work }, as: at_work }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: review }, as: at_review }
  - { type: action, domain: automation, op: wire-add, with: { target: at_take, exit: got one, from_port: note, to: at_work, to_port: note } }

  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_work } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_work, to: at_review } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_review } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  # The row before the picture: what this is, and that the built-in and three actions are placed on
  # it. A definition that had lost its placements would still be listed, so the count is the half
  # worth asking for.
  - type: assert
    domain: automation
    op: listed
    with:
      target: auto
      placements: 4
      present: true

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # The dashed outline around the boxes one task is worked by — `take`, which the built-in hands the
  # task to, and every box after it. The picture divides by that before it divides by anything else,
  # so a build that had lost the division would draw the boxes in a row and say nothing about what
  # they have in common.
  - type: assert
    domain: automation
    op: lap-pictured
    with:
      head: take

  - type: assert
    domain: automation
    op: pictured
    with:
      name: take
      present: true

  # The box a required input does not reach. What says so is the outline round it and the line under
  # its name naming the input — `draft` is declared on this action and nothing is ever wired to it on
  # this placement, while `note` beside it is.
  - type: assert
    domain: automation
    op: pictured
    with:
      name: work
      unfed: true

  - type: assert
    domain: automation
    op: pictured
    with:
      name: review
      present: true

  # The lines, and what is written along each. The first carries the name of the way out it leaves
  # by — a picture that drew the line and lost the name would leave a reader unable to say which of an
  # action's ways out goes where.
  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: take
      exit: got one
      to: work

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: review
      ends: done

  # A box nobody placed. A picture drawing every name it is handed would pass every assert above, and
  # this is the one that says it is drawing what the definition holds.
  - type: assert
    domain: automation
    op: pictured
    with:
      name: publish
      present: false
