[package]
name = "amenbo-scenario"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Schema and validating loader for amenbo pre-distribution verification scenarios."

[lib]
path = "src/lib.rs"

[[bin]]
name = "lint"
path = "src/bin/lint.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
