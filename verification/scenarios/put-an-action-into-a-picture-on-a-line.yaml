# A picture already drawn is added to on a line. The `+` on a line is the road that leaves nothing
# running past a box — the way out pressed comes to point at the new placement, and the new
# placement goes on to what that way out named. A build that made the placement and left the line
# running past it would leave a picture nobody asked for, and one that made the placement and dropped
# what the line used to reach would quietly throw away a decision somebody had made.
#
# ── Why the action is made on the spot ───────────────────────────────────────────────────────────
# What stands on an automation's picture is always a placement of a library action. One made on the
# line is asked a name and a library and nothing else: it is born empty, placed where it was asked
# for, and its own build screen opens for its steps. It is the arm of the `+` that makes the most — an
# action and a placement, and a line spliced — which is why it is the one walked here, and why the
# launch place is read after it: an empty action is one a run cannot start.
id: put-an-action-into-a-picture-on-a-line
title: An action made on a line takes over where that line went, and is named empty until it is built
description: >
  Stand a definition of one placed action up from the terminal, make a second action on the line
  that closes the task, and read both halves of what that press did: the pressed way out now points
  at the new placement, and the new placement now closes the task. The launch place then says an
  action placed on it has nothing in it. Last, on the first action's own screen, declare what its
  other way out hands on, and read the one thing that dialog does for a reader — the name starts on the way out's own,
  that way out having handed on nothing yet.
given:
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  # A second way out that hands nothing on yet — the one the output artefact is declared on last.
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: drafted } }

  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one action, then two" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  # The line the `+` is pressed on. It closes the task, which is the half of this road worth walking:
  # a way out that ends something carries no limit, and turning it into one that goes on to a box
  # needs one — so this is the arm where the press has the most to put right.
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # What the line says before the press, so that what it says afterwards is a change and not a
  # reading taken once.
  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: take
      exit: got one
      to_builtin: close_task

  - type: action
    domain: automation
    op: insert-box
    with:
      after: take
      exit: got one
      name: work

  - type: assert
    domain: automation
    op: pictured
    with:
      name: work
      present: true

  # The two halves of the press, each read on its own line. Either one alone would pass on a build
  # that had lost the other: a box pointed at with nothing after it, or a box after a line that still
  # runs past it.
  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: take
      exit: got one
      to: work

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: work
      to_builtin: close_task

  # Placed but empty: the launch place names it, rather than letting a run start into nothing.
  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: action_empty
      box: work
      present: true

  # And a way out that hands nothing on yet, with a control for saying what leaving by it hands on —
  # on the first action's own output, where its ways out are declared. The name the box starts on is
  # that way out's own: a name for what a way out produces is nine times out of ten its own name.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: action
    domain: automation
    op: open-part
    with:
      part: output

  - type: action
    domain: automation
    op: add-output
    with:
      exit: drafted
      name: drafted
      kind: file
      required: true
