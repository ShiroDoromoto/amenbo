# The other half of what a run keeps: not which places came back, but how much of a page each of them
# takes.
#
# A reader gives a pane the whole width because sharing it halves the columns, and half of a window
# with a column beside it is under the eighty a TUI wants
# (`stack-the-two-panes-so-each-keeps-the-whole-width`). That is a thing about the machine they are at
# and the work they do in it, not about this afternoon — so it is kept the way the places are, and a
# run that dropped it would put the reader back under eighty columns every morning.
#
# The line is worth walking for the reason the places' is: **both sides of it look right.** A face
# that fell back to the size every fresh pane starts at and a face that remembered are each a working
# screen, drawn without complaint, and nothing goes red on the way between them. The only way to tell
# is to end a run and look at what the next one lays out.
#
# ── Why the press is not read before the run ─────────────────────────────────────────────────────
# Because it is another road's. What the press does is proved where it is pressed; what is under test
# here is what survives. The pane it does open before ending is there to make the screen a definite
# one: what a folder starts a pane with is the operator's own machine, and a plain shell is the one
# state every machine can be put in.
#
# ── Why one pane is enough to set, and two are wanted to read ────────────────────────────────────
# A size is one pane's answer, so one pane is the whole of what there is to press for. Reading it is
# another matter: the whole width is what a pane with nothing beside it has anyway, so a page holding
# one pane cannot tell the kept answer from the unkept one. The second pane is what makes the reading
# say something — it comes up measured against the one already showing, so the two end up stacked,
# which is the screen the reader asked for and not the side by side an unkept answer would draw.
#
# ── Why only one pane is opened after the run ────────────────────────────────────────────────────
# Because the other one came back. The run keeps the place the road opened before it ended, with
# nothing running in it, so the page after it holds one place and room for one more: a shell started
# in the place that came back, a press for the one beside it, and the two are standing.
#
# Whether the places themselves come back is `open-the-app-again-on-the-places-you-left`; what is
# under test here is the size riding home beside them.
#
# The world is empty on purpose, as it is on every road on this face: a terminal is not a record, and
# what the pane runs is the reader's own shell. Choosing the folder is what raises the project it
# belongs to, so the road makes what it needs by walking in.
id: open-the-app-again-on-the-way-you-set-two-panes-to-sit
title: A run of the app keeps how much of a page a reader gave a pane, and the next run lays it out that way
description: >
  Open the workspace, choose the folder it runs in, and get the pane down to a plain shell. Give it
  the whole width and half the height. End the run and open the app again on the same store: the
  place comes back at that size with nothing running in it, so start a shell there and open the pane
  beside it. The two are stacked, each taking the whole width between the columns — the size the
  reader set, and not the side by side a pane nobody had sized would draw.

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The way in, and what binds the folder to the project the face is on. Which project the run comes
  # back on is the places road's question; here there is one, so it is the one that answers.
  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: workshop

  # Down to a plain shell, which is the one state every machine's face can be put in: what a folder
  # starts a pane with is the operator's own business, and the screen the run is ended on should be a
  # screen the road knows.
  - type: action
    domain: workspace
    op: open-shell

  # What the reader set, and the whole of what this road is about. It is one pull because a size is
  # one pane's answer — there is nothing else standing for it to be about.
  - type: action
    domain: workspace
    op: stretch-pane
    with:
      size: half-down

  # The run ends here and another comes up on the same store. Nothing is pressed for it — the app is
  # the run's own, and ending it is the harness's — and what the operator confirms is the window that
  # came back.
  - type: action
    domain: store
    op: run-again

  # Where a fresh launch opens is not the road's to know, so it presses for the face it reads rather
  # than reading whichever one the app came up on.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The place the run brought back, standing with nothing in it, so a shell is started there.
  - type: action
    domain: workspace
    op: open-shell

  # The size that rode home with it. Half a page laid down the page is the whole width and half the
  # height, and a pane that came back unsized would be taking the whole of both.
  - type: assert
    domain: workspace
    op: pane-size
    with:
      size: half-down

  # The pane beside it, which is what makes the reading above say something on a screen rather than
  # on its own. The folder is the project's and it is the only one, which is why that press is a press
  # and nothing else — and the pane it opens is measured against the one already showing, so it comes
  # up at the same size.
  - type: action
    domain: workspace
    op: open-pane
    with:
      from: face

  # And the page is full at two, which is the same thing as saying both of them are standing. A page
  # still offering a way in would be a page with one pane on it, and the reading below would be about
  # a box with nothing in it.
  - type: assert
    domain: workspace
    op: frames
    with:
      count: 2
      empty: 0

  # The arrangement the last run was told to keep. Had the size been dropped, these two would be side
  # by side under eighty columns each — a screen that draws perfectly well and is not the one the
  # reader asked for.
  - type: assert
    domain: workspace
    op: pane-size
    with:
      size: half-down
