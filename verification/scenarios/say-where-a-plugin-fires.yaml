# One switch, and it is a project's — so the only honest answer to "is this plugin on?" is a list of
# projects, and the row is where that list is read.
#
# What a single yes/no hides is a plugin still firing in a project nobody is looking at. Shutting a
# gate from one place and reading it back from that same place cannot catch it: the answer agrees with
# itself either way. What catches it is a row that names more than one project, and then names one
# fewer.
#
# Hence a road written for the screen alone. The rows name every project wherever they are read, but a
# terminal moves the switch belonging to the folder it stands in — there is no flag for another one —
# so a road written for it can only ever put one name on the list. Picking a project beside the plugin
# is where a second one comes from, which makes the screen the only place the list can be watched
# growing and the only place shutting one can be seen leaving the other alone.
#
# The switch is in the row and not in the picker: picking draws the crossing, and turning the plugin on
# there is itself the permission to run its code, so there is no third question and no step here answers
# one.
#
# The world it starts from is declared below and stood up before the app is launched. What is left to
# the operator is where to start: the installed plugins screen. Every step after the first moves the
# screen, so carry each move out when the run hands that step over.
#
# Every line is closed by an eye rather than by a reading. What each one names is a project, and the
# projects run down the side of every screen: a reading that finds the name cannot say it came from
# the row, and one that misses it would be reading a screen the rows are not even on.
id: say-where-a-plugin-fires
title: A plugin's switch is a project's — the row names every project it fires in, and shutting one leaves the others firing
description: >
  Start with the plugin installed and firing nowhere, and turn it on in one project by drawing that
  project's row and pressing the switch in it. Turn it on in a second, and read both rows saying so —
  which is the whole of what a truth value cannot say. Then shut the first project's gate and read the
  two rows again: the one just shut offers to turn the plugin back on, and the other is still firing,
  untouched by a switch moved somewhere else.
given:
  # Two projects, because one is what a truth value can already say. The row has to name more than one
  # before shutting a gate can be seen leaving the other alone.
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse

  - type: action
    domain: project
    op: create
    with:
      name: Toolshed

  # On the machine and firing nowhere, which is what installing leaves behind: opening a gate is the
  # separate act, and it is the one the road walks.
  - type: action
    domain: plugin
    op: install
    with:
      name: worktree

steps_gui:
  # Off everywhere is a state the row has to be able to say, or the readings after it would pass over
  # a row that names every project on the device.
  - type: assert
    domain: plugin
    op: fires-in
    with:
      name: worktree
      project: Greenhouse
      present: false

  - type: action
    domain: plugin
    op: enable-in
    with:
      name: worktree
      project: Greenhouse

  - type: assert
    domain: plugin
    op: fires-in
    with:
      name: worktree
      project: Greenhouse
      present: true

  # A second project, on the same switch. Nothing was answered twice — the first project was never
  # asked about again — so a row that now names one project alone has dropped something.
  - type: action
    domain: plugin
    op: enable-in
    with:
      name: worktree
      project: Toolshed

  - type: assert
    domain: plugin
    op: fires-in
    with:
      name: worktree
      project: Toolshed
      present: true

  - type: assert
    domain: plugin
    op: fires-in
    with:
      name: worktree
      project: Greenhouse
      present: true

  # Shutting one gate. The two readings after it are one line each of the same sentence, and the
  # second is the one this road exists for: a project nobody touched is still firing, and says so
  # where anyone can see it.
  - type: action
    domain: plugin
    op: disable-in
    with:
      name: worktree
      project: Greenhouse

  - type: assert
    domain: plugin
    op: fires-in
    with:
      name: worktree
      project: Greenhouse
      present: false

  - type: assert
    domain: plugin
    op: fires-in
    with:
      name: worktree
      project: Toolshed
      present: true
