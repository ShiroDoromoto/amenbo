# An action's ways out, its settings and what it takes in are what the rest of an automation is built
# against: a line hangs on a way out, a wire ends at an input, and a launch is refused for a setting
# nobody answered. All three are declarations, and a reader who can read them and not put one there
# is a reader sent back to the terminal to finish what the screen just showed them.
#
# ── Why they are declared on the action's own screen ────────────────────────────────────────────
# What is declared is the action's, and reaches every placement of it — so it is written in one place,
# the action's build screen, and the panel a placement opens on an automation reads it without a
# control to change it. A reader building an automation goes to the action, declares there, and comes
# back to the picture. Only the answer to a setting and the wire into an input are a placement's own.
#
# ── Why the launch place is the reading ─────────────────────────────────────────────────────────
# A declaration is not visible as itself: a way out with nothing after it, a required setting with
# no answer and a required input with nothing reaching it are all rows a panel simply draws. What
# says the definition moved is the launch place of an automation placing the action — each
# declaration puts a reason there, and taking it away takes the reason with it. So every one is read
# twice, there and gone. A build that drew that list once and answered from it afterwards would pass
# the first half of each and fail the second.
#
# ── Why required is a second press ──────────────────────────────────────────────────────────────
# The row that declares a new one takes a name and a kind. Whether a step is refused without it is
# on the row it becomes, which is the panel saying that declaring a thing and insisting on it are two
# moves — so the road makes them as two, rather than describing a control that is not under the box.
#
# ── Why each one goes whole ─────────────────────────────────────────────────────────────────────
# What a reason on the launch place names is the declaration's own name, and the reading that says
# the reason has gone is that name being off the screen. So each one is taken away by the press at
# the end of its row, not by clearing the insisting off it.
id: declare-what-an-action-needs-and-find-its-placements-follow
title: What an action declares is put in and taken away on its own screen, and the launch place of an automation placing it follows
description: >
  Open a definition that is short of nothing, go to the one action placed on it and declare three
  things there — a second way out, a required setting, and a required input. Back on the
  definition, each has put its own reason on the launch place. Then go back to the action and take
  all three away by the press at the end of each row. Each reason goes as its declaration does, and
  the definition ends where it started, ready to be started.
given:
  # Claude Code is one of the two agents this machine can start — two being the fewest the premise
  # stands up — so nothing on the launch place is ever about who carries the step out.
  - { type: action, domain: workspace, op: can-start, with: { count: 2 } }

  # The action the panel is read on, holding the one step it runs. The way out that takes the task
  # is declared on both layers, and the line inside the action carries the step's out by the action's.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, agent: claude-code, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — an action to declare on" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  # Both ways out say what happens after them, so the definition opens with nothing in its way and
  # every reason below is one the road put there.
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: true

  # To the action placed on it, where what it declares is written. A way out first, from its output.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: action
    domain: automation
    op: open-part
    with:
      part: output

  - type: action
    domain: automation
    op: declare
    with:
      what: exit
      name: needs a fix

  # A setting and an input, from its input — each declared, then insisted on as a second press.
  - type: action
    domain: automation
    op: open-part
    with:
      part: input

  - type: action
    domain: automation
    op: declare
    with:
      what: setting
      name: which
      kind: taskfilter

  - type: action
    domain: automation
    op: redeclare
    with:
      what: setting
      name: which
      required: true

  - type: action
    domain: automation
    op: declare
    with:
      what: input
      name: note
      kind: value

  - type: action
    domain: automation
    op: redeclare
    with:
      what: input
      name: note
      required: true

  # Back on the definition, each declaration has put its own reason on the launch place. Nothing is
  # wired to the input, there being one placement and nothing before it.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: open_exit
      box: take
      at: needs a fix
      present: true

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unanswered_cfg
      box: take
      at: which
      present: true

  - type: assert
    domain: automation
    op: launch
    with:
      ready: false
      reason: unwired_input
      box: take
      at: note
      present: true

  # And back to the action, taking all three away by the press at the end of each row.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: action
    domain: automation
    op: open-part
    with:
      part: output

  - type: action
    domain: automation
    op: undeclare
    with:
      what: exit
      name: needs a fix

  - type: action
    domain: automation
    op: open-part
    with:
      part: input

  - type: action
    domain: automation
    op: undeclare
    with:
      what: setting
      name: which

  - type: action
    domain: automation
    op: undeclare
    with:
      what: input
      name: note

  # Every reason gone with its declaration, and the definition ready again, where it opened —
  # read as one step, because "ready" is the launch place saying there is no list left.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: launch
    with:
      ready: true
