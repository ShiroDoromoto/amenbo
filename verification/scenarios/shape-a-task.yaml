# The road from "there is something to do" to a task that says what it is. Registering it takes
# nothing but a title, and the state it lands in is what every later line builds on; everything else
# — what it says, when it is due, when it may start, how it ranks — is filled in afterwards, and can
# be taken away again. Two of those fields are not decoration: a start day still ahead holds the task
# unready, and priority is what the mailbox sorts on. So each one is read back off the store rather
# than trusted to a write that exited zero.
#
# The screen walks the two days rather than the whole form. They are the fields it could read and not
# write until lately — a due date drawn on every card, with nowhere on the pane to put one there — so
# what its road answers for is the writing, and the premise the start day carries once it lands.
id: shape-a-task
title: A task registered with nothing but a title starts todo, is filled in field by field, and can be emptied again
description: >
  Register a task with only a title and read the state it starts in. Set title, notes, due date and
  priority, and read each one back — off the task's own page, and through the listing that filters on
  them. Declare a start day still ahead and watch readiness go with it. Then clear the start day and
  the priority and read the absence back: clearing is its own command, and a field that will not
  clear is a field the user cannot take back.
# One card of ordinary work, and the only premise either road has. The screen's road files its own task
# from a column head, and a board with nothing on it draws the first loop where the columns would be —
# so the world puts the columns there and nothing else. The terminal's road asks nothing of it.
given:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO WORLD — work this board already carried
    as: standing

  - type: action
    domain: task
    op: finish-creating
    with:
      target: standing

steps_cli:
  # Nothing but a title, and it is already a task in a state: todo, with nothing else said.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — freshly registered
    as: seed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: todo

  # Filing it is two moves, and the second one is walked here so that the readiness read further down
  # is the start day's answer alone. What the two stages are for is its own road.
  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  - type: action
    domain: task
    op: update
    with:
      target: seed
      title: SCENARIO SEED — after editing
      notes: SCENARIO — the note the task carries
      due: "2099-12-31"
      priority: high

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: title
      equals: SCENARIO SEED — after editing

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: notes
      equals: SCENARIO — the note the task carries

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: due_on
      equals: "2099-12-31"

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: priority
      equals: high

  # A field that is set is a field that can be filtered on — the two have to agree.
  - type: assert
    domain: task
    op: listed
    with:
      filter: "priority:high due:2099-12-31"
      target: seed
      present: true

  # A start day is not a note to self: until it comes, the task is not ready and cannot be reserved.
  - type: action
    domain: task
    op: update
    with:
      target: seed
      start: "2099-01-01"

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: ready
      equals: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "start:future"
      target: seed
      present: true

  - type: action
    domain: task
    op: clear
    with:
      target: seed
      field: start

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: ready
      equals: true

  - type: action
    domain: task
    op: clear
    with:
      target: seed
      field: priority

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: priority
      equals: null

  - type: assert
    domain: task
    op: listed
    with:
      filter: "priority:none"
      target: seed
      present: true

steps_gui:
  # Filed from the board, and finished, so that the readiness read at the end is the start day's answer
  # and not the creation's.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — dated from the screen
    as: seed

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  # The move the pane had no field for. Both days are written where the task is read, and neither is a
  # date the app chose: an empty picker draws a day of its own, so a build that let that through would
  # answer here with today rather than with what was typed.
  - type: action
    domain: task
    op: update
    with:
      target: seed
      due: "2099-12-31"
      start: "2099-01-01"

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: due_on
      equals: "2099-12-31"

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: start_on
      equals: "2099-01-01"

  # A start day is not a note to self on this face either. It is the third premise, and the pane says
  # so where the other premises stand — a day written and no reason drawn beside it would leave the
  # reader to find out at the reserve.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: not_started_until
      equals: "2099-01-01"

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: ready
      equals: false
