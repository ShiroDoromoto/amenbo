# The layers a change can touch, as path patterns. One declaration, read by both sides:
# _ci.yml's `changes` job hands this file to dorny/paths-filter and gates each job on the
# layer it belongs to, and the local gate (`make gate`, via scripts/changed-facets.sh)
# picks the stages it runs from the same answer. Written in two places they would drift,
# and the local gate would excuse a layer CI still runs.
#
# A key is a layer; its list is every path whose change can move that layer's verdict —
# the sources, the manifests they resolve through, and the gate's own definition, since a
# gate edited alone still has to re-open the thing it judges.
#
# CI reads only the keys the `changes` job declares as outputs. `ungated` at the bottom is
# the local gate's alone.

rust:
  - 'crates/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'clippy.toml'
  - '.config/nextest.toml'
  - '.cargo/**'
  - 'app/src-tauri/**'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
  # The harness the app-rust job's network-FS step runs (it stands up the real NFS/SMB/9P
  # mounts): change it and nothing else, and the step that uses it would not re-run.
  - 'scripts/verify-network-watch.sh'
  # The README demo's script and the transcript it is held to (crates/amenbo-cli's
  # demo_tape suite reads both). CLI drift already opens this gate through crates/**;
  # these entries cover the other direction — a tape edited on its own.
  - 'assets/cli-demo.tape'
  - 'assets/cli-demo.transcript.txt'
# The pre-distribution verification harness is a third out-of-workspace cargo workspace,
# so the `rust` job (default manifest = main workspace) never builds or tests it. This
# gates its own clippy+test job in _ci.yml — the ONLY thing that compiles core/cli/gui in CI.
verification:
  - 'verification/**'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
gui:
  - 'app/**'
  - '.nvmrc'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
  # The GUI's inputs are not confined to app/. The Rust↔TS parity tests hold one hand-written
  # TypeScript list against the Rust it mirrors, and they read that Rust straight out of the tree
  # with Vite's `?raw` — so a Rust file listed here is as much a build input of this job as any
  # file under app/. Left out, the layer excuses the very change that breaks the parity: the PR
  # that edits Rust alone is green with this job skipped, and the break lands on main under the
  # next PR that happens to touch app/. guards/check-gui-inputs.sh holds this list to what those
  # tests actually read.
  - 'crates/amenbo-core/src/error.rs'
  - 'crates/amenbo-core/src/doctor.rs'
  - 'crates/amenbo-core/src/store/tests.rs'
# devtool is one self-contained Go module with no dependency on the rest of the tree,
# so nothing outside it can move its verdict — except the gate itself, which holds the
# three checks this job runs.
go:
  - 'devtool/**'
  - 'scripts/go-gate.sh'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
shell:
  - '**/*.sh'
  - '.githooks/**'
  - 'Makefile'
  - '.github/workflows/**'
# The three below gate jobs whose steps live in _rot-gates.yml, so that file is a build
# input for them just as _ci.yml is. (`shell` needs no such entry: its
# '.github/workflows/**' rule already covers every workflow, _rot-gates.yml included.)
cargo_deps:
  - 'Cargo.toml'
  - 'Cargo.lock'
  # The Tauri host crate is out of the workspace, with a lockfile of its own — and the
  # audit job reads it too, so a bump there has to open this gate.
  - 'app/src-tauri/Cargo.toml'
  - 'app/src-tauri/Cargo.lock'
  # The verification harness is a third out-of-workspace cargo workspace with its own
  # lockfile; the cargo-license job reads it too, so a bump there has to open this gate.
  - 'verification/Cargo.toml'
  - 'verification/Cargo.lock'
  - '.cargo/audit.toml'
  # The license allow-list the cargo-license job reads.
  - 'deny.toml'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
  - '.github/workflows/_rot-gates.yml'
# The key comparison is a function of the file the key is compiled into and the guard
# that reads it. The far side of the comparison lives in another repository, which no
# filter here can see — that half is what the weekly leg is for.
catalog_key:
  - 'crates/amenbo-core/src/plugin_provenance.rs'
  - 'guards/check-catalog-key.sh'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
  - '.github/workflows/_rot-gates.yml'
npm_deps:
  - 'app/package.json'
  - 'app/package-lock.json'
  # The license half of this gate: the allow-list it reads (shared with the Rust side),
  # the gate itself, and the tests that hold its judgment down. All three decide the
  # verdict — a test edited alone still has to re-open this.
  - 'deny.toml'
  - 'guards/*.mjs'
  - '.github/workflows/_ci.yml'
  - '.github/paths-filters.yml'
  - '.github/workflows/_rot-gates.yml'
# What no layer needs to answer for: prose, pictures, the forms GitHub shows a visitor, and
# the hand-run baker that turns the brand origins into the rest of those pictures. Nothing
# compiles or runs from them, and the cheap stage — which the local gate runs whatever
# changed — already audits the prose of every tracked file.
#
# This is a declaration, not a catch-all: a path that matches no layer and is not named
# here makes the local gate fall to the whole of `make test`. That is the point. Config
# whose value a build reads (esorp.yaml, deny.toml, .node-version) belongs to a layer or
# to that fallback, never here.
ungated:
  - '**/*.md'
  - 'LICENSE'
  - 'assets/*.png'
  - 'assets/*.svg'
  - 'assets/*.gif'
  # The brand set: two origin SVGs and everything `make brand` bakes from them.
  - 'assets/brand/**'
  - 'scripts/gen-brand.py'
  - '.github/ISSUE_TEMPLATE/**'
