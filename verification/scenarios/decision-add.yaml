# Recording a decision — the append-only "why we chose X" — on the shipped build. The op registry
# carries no assert for a decision yet, so what this line proves is that the write reaches the
# installed store at all; reading one back arrives with the ops the decision line needs.
id: decision-add
title: A decision can be recorded on the shipped build
description: >
  Record a decision and let the driver's own execution be the verdict: a step that errors fails the
  scenario. The line grows an assert of its own once the registry has one to grow it with.
steps_cli:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — recorded by the driver
