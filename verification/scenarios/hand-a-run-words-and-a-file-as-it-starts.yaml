# What a person has in hand when they start a run — a line saying what it is for, a file to work
# from — goes in with the start, and the run keeps it. The first step is told it; nothing
# has to be typed into a pane after the run is under way.
#
# The terminal reads the run back and finds the text on it, and meets the guard in front of the file:
# a file that cannot be read is refused before any run is made, so there is no run left holding half
# of what it was meant to be handed. The screen starts the same automation from the dialog that asks
# what to hand the run, and reads the run over on the history tab.
id: hand-a-run-words-and-a-file-as-it-starts
title: A run started with a text and a file keeps the text, and a file that cannot be read is refused
description: >
  Start an automation handing it a text and a file the run wrote, and read the text back off the run.
  Start it again naming a file that is not there, and read the start refused with nothing made. On
  screen, start it from the dialog with a text typed in, and read the run over on the history tab.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  # The built-in that takes a task, as the entry, with no task handed to the AI: a run started on
  # screen finds none to take and ends, so the road reads it over rather than waiting on a step.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one handed something" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

# A run started from the terminal opens no step, so it stays `running`; what is read is what it keeps.
steps_cli:
  - type: action
    domain: repo
    op: write-file
    with:
      path: brief.md
      content: "the login page loses the password field on a narrow window\n"

  - type: action
    domain: automation
    op: start
    with:
      target: auto
      text: look at the brief before you start
      file: brief.md
    as: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running
      handed: look at the brief before you start

  # Read before anything is made: the start is refused, and no second run is left behind.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      text: this one names a file that is not there
      file: missing.md
      refused: not_found

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
      text: look at the brief before you start
    as: run

  # Nothing handed to the AI, so the built-in finds none to take and the run closes.
  - type: action
    domain: automation
    op: screen
    with:
      tab: history

  - type: assert
    domain: automation
    op: history-row
    with:
      target: run
      state: completed
