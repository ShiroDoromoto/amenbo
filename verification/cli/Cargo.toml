[package]
name = "amenbo-verify-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "CLI driver: maps a verification scenario to shipped-binary invocations and asserts via --json."
# The bins are declared explicitly (dashed names over the src/bin/ underscore defaults).
autobins = false

[lib]
name = "amenbo_verify_cli"
path = "src/lib.rs"

[[bin]]
name = "verify-cli"
path = "src/main.rs"

[[bin]]
name = "verify-all"
path = "src/bin/verify_all.rs"

[[bin]]
name = "verify-coverage"
path = "src/bin/coverage.rs"

[dependencies]
amenbo-scenario = { path = "../core" }
# The loopback host a scenario stands a catalog on. It lives in the main workspace beside the tests
# that share it, and is reached by path from here — this workspace is deliberately outside that one,
# and a second hand-rolled listener is what having one crate exists to stop.
amenbo-static-host = { path = "../../crates/amenbo-static-host" }
serde_json = "1"
serde_yaml = "0.9"
