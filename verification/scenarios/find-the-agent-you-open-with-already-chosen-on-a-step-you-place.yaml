# An action placed on an automation has steps, and each is carried out by an agent. A step nobody
# chose for is one the launch check refuses, so a reader once had to choose again for every step of
# every placement before a run could start. Nothing is written on a placement now: who carries a step
# out is decided in order — what the step names, then the role's default, then Amenbo's own
# (`amenbo_core::wake::step_agent`: the project's answer, else the agent the reader last opened a pane
# with). So a step nobody chose for is carried out by the agent the reader has already given, and the
# placement's own line for it stays on nobody chosen.
#
# ── Where it is read ────────────────────────────────────────────────────────────────────────────
# The panel of a pressed placement says only what the step itself names, and this one names nothing.
# What a step falls back to is drawn in one place: the table under the picture, a row per step the
# role's round reaches, with the agent and the model it is carried out by
# (`app/src/screens/AutomationRoleCarriers.tsx`). A cell the step chose is marked ●; one it falls back
# to is muted and unmarked, which is the reading here.
#
# ── Why the answer is given by opening a pane ───────────────────────────────────────────────────
# Both answers are written by the screen and by nothing else. The last agent is what a press on the
# empty frame's row leaves behind (`app/src-tauri/src/wake.rs`, `wake_chose`), and it is the one every
# reader has given by the time they build anything — so it is the rank this road walks. There is no
# terminal road to either answer, which is why this goal is the screen's alone.
#
# ── Why the agent is named ──────────────────────────────────────────────────────────────────────
# The cell reads the agent's own name, and a road reading a name has to have chosen it. The machine is
# stood up (`can-start`), which is what lets a road name one at all; two of them, so that nobody has
# chosen when the frame comes up and the press is the reader's rather than the only thing there was.
id: find-the-agent-you-open-with-already-chosen-on-a-step-you-place
title: A step of an action placed on an automation is carried out by the agent the reader last opened a pane with
description: >
  Stand a machine up with two agents on it, open a pane in the project on one of them by name, and go
  to the project's automations. On an automation that starts at the built-in that takes a task, put a
  library action of one step in on the line leaving it: the table under the picture says that step is
  carried out by the agent the pane was opened with, muted and unmarked as a value it falls back to
  rather than one anybody chose on it.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Harbour
      dir: harbour-side
    as: harbour

  - type: action
    domain: workspace
    op: can-start
    with:
      count: 2

  # One step, so the table draws one row for it and there is no question of which.
  - { type: action, domain: automation, op: action-add, with: { name: draft, project: harbour }, as: draft }
  - { type: action, domain: automation, op: step-add, with: { target: draft, name: write, prompt: write the draft }, as: write }
  - { type: action, domain: automation, op: action-entry, with: { target: draft, step: write } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — placed with an agent on it", project: harbour }, as: auto }
  # A picture with nothing on it takes only a built-in a run starts at, so the library
  # action goes in on a line leaving one. The built-in's way out for having taken a task ends the run,
  # which is the line the `+` stands on.
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_take }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した } }

steps_gui:
  # ── The answer, given the way a reader gives it ───────────────────────────────────────────────
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: go-project
    with:
      project: Harbour

  - type: action
    domain: workspace
    op: pick-start
    with:
      agent: Claude Code

  - type: action
    domain: workspace
    op: open-start

  # ── And the placement whose step falls back to it ─────────────────────────────────────────────
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: insert-box
    with:
      after_builtin: take_task
      exit: 着手した
      action: draft

  # The reading. Nobody chose on this placement, and the role has no default, so the step falls back
  # to Amenbo's — the agent the pane was opened with. A build that forgot the last agent draws no row
  # for the step, since nobody carries it out, or names another agent in the cell.
  - type: assert
    domain: automation
    op: carrier-shows
    with:
      step: write
      field: agent
      value: Claude Code
      marked: false
