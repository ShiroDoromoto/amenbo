# A start placed on its own leaves every one of its ways out saying nothing, and a way out saying
# nothing has no line for a `+` to hang on. So it is drawn dashed, ending in a press of its own, and
# that press is how a reader goes on from there. What they reach for first is a new action: they look
# for it in the library, find nothing, and make it there.
#
# What that makes stands over the automation rather than in its place, and it is still being made.
# The automation under it cannot be left by a tab, the sidebar or "＜" "＞" while it is, and it closes
# by one of two presses and nothing else: finishing keeps the action where it was placed, and giving it
# up takes the action and its placement away and leaves the picture as it was. A build that lost the
# first would leave the new box with nowhere to go on to; one that lost the second would leave a
# half-made action in the library, and a start whose way out points at nothing.
id: make-an-action-off-a-way-out-nothing-was-decided-for
title: An action made off a way out nothing was decided for is finished or given up over its automation
description: >
  Open an automation with nothing on it but the built-in that takes a task, and read its way out for
  having taken one drawn dashed. Press the button at its end, search the library for a name it does
  not hold, and make it there. Read the action's screen standing over the automation, still being
  made, with nothing behind it that can be pressed. Finish creating it, and read the new box on the
  picture — the start's way out now going on to it, and its own way out drawn dashed. Then make another
  off the start's other way out, give it up, and read it gone from the picture and the library, and
  that way out dashed again.
given:
  # The start alone, and nothing said about either of its ways out.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — a start and nothing after it" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task } }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # What the way out says before the press, so that what it says afterwards is a change.
  - type: assert
    domain: automation
    op: line-pictured
    with:
      from_builtin: take_task
      exit: 着手した
      present: false

  - type: action
    domain: automation
    op: insert-box
    with:
      after_builtin: take_task
      exit: 着手した
      undecided: true
      name: work
    as: work

  # Still being made, over the automation: nothing behind it can be pressed, and only the pair at its
  # foot closes it.
  - type: assert
    domain: automation
    op: action-over
    with:
      name: work
      draft: true

  - type: action
    domain: automation
    op: action-finish-creating

  # Back on the automation, which was never left. The start's way out goes on to the new box, and the
  # new box's own way out says nothing yet — the press that goes on from it is there too.
  - type: assert
    domain: automation
    op: pictured
    with:
      name: work
      present: true

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from_builtin: take_task
      exit: 着手した
      to: work

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: work
      present: false

  # Another, off the start's other way out, and given up this time.
  - type: action
    domain: automation
    op: insert-box
    with:
      after_builtin: take_task
      exit: 着手できるタスクが無い
      undecided: true
      name: spare
    as: spare

  - type: assert
    domain: automation
    op: action-over
    with:
      name: spare
      draft: true

  - type: action
    domain: automation
    op: action-abandon

  # The picture as it was before the press: no box for it, and the way out dashed again. The first one
  # finished is left where it was.
  - type: assert
    domain: automation
    op: pictured
    with:
      name: spare
      present: false

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from_builtin: take_task
      exit: 着手できるタスクが無い
      present: false

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from_builtin: take_task
      exit: 着手した
      to: work

  # What was given up was the action as well as its placement: the library keeps the one finished and
  # not the one given up.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: assert
    domain: automation
    op: action-listed
    with:
      target: work

  - type: assert
    domain: automation
    op: action-listed
    with:
      target: spare
      present: false
