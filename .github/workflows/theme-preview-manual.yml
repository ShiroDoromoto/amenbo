name: theme-preview-manual

# The way a theme's preview is built: dispatch it with the theme's id. What it builds, and why a
# preview is not a distribution, is in _theme-preview.yml.
#
# Dispatch is the only trigger, and deliberately: a preview is built when someone wants the team to
# look at something, not when a branch moves. A theme runs for weeks, so building on every push
# would produce artifacts nobody asked for and hand members a build they cannot tell from the one
# they were asked to judge.
#
# Dispatch it with the theme branch selected as the ref (`theme/<id>`) — the run builds whatever ref
# it was started on, and the id below only names the bundle.

on:
  workflow_dispatch:
    inputs:
      theme:
        description: the theme's id — the umbrella task's number, digits only (e.g. 3493)
        type: string
        required: true

# Per theme, not per ref: a second dispatch for the same theme replaces the first (the older
# artifacts are the ones nobody should be handed), while two themes never wait on each other.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.theme }}
  cancel-in-progress: true

jobs:
  preview:
    uses: ./.github/workflows/_theme-preview.yml
    with:
      theme: ${{ inputs.theme }}
