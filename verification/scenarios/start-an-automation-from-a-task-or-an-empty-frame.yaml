# The build screen is not the only way in. A reader looking at a task, and a reader looking at a page
# of the workspace with room left on it, are both in the position of wanting a run — and neither
# should have to go and find the definition's own screen to press the same button. What matters is
# that the run is the same one: nothing is handed over at any of the three presses, which task and
# which folder being the definition's, so a build that let one of the other two pass something along
# would make two kinds of run out of one.
id: start-an-automation-from-a-task-or-an-empty-frame
title: A run is started from a task's own pane and from an empty frame, and is the run the build screen would have made
description: >
  Stand one definition up and start it twice, from the two ways in that are not the build screen: the
  control on a task's pane, and the one an empty frame of the workspace carries. Each is read by the
  pane it stands up and by its row on the running tab. Both are walked in one road because what is
  under test is that they agree — a single way in proves only itself.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the one a run is started from }, as: seed }
  # The action the run opens, holding the one step it runs. The way out that takes the task is
  # declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — two ways in" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

steps_gui:
  # A workspace to put the runs in. Both ways in below need one for the same reason the build
  # screen's press does: a run's steps open terminals, and terminals live here.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  # The first way in: a task's own pane. Nothing is handed over — which task the run works is the
  # definition's to decide — so this is the same press as the build screen's, made where a reader
  # happened to be standing.
  - type: action
    domain: automation
    op: start-from-task
    with:
      target: auto
      task: seed
    as: from_task

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: from_task
      step: claim
      action: take
      present: true


  # The second way in: the box a page with room on it draws where the next pane would land.
  - type: action
    domain: automation
    op: start-from-frame
    with:
      target: auto
    as: from_frame

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: from_frame
      step: claim
      action: take
      present: true


  # And both are on the tab that draws every run this device is carrying.
  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: from_task
      state: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: from_frame
      state: running
