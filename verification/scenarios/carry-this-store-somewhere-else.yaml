# The road out for something that keeps a copy of this store elsewhere — a viewer, an audit trail, a
# mirror in another tool. It is walked in the order a carrier really uses it: ask the number, and take
# the picture only when the number moved. So what this road proves is not that two commands answer, but
# that the pair is usable — that the cheap question tells the truth about whether the expensive one is
# worth asking, and that the picture is closed to the window the caller reads through.
#
# The window is the half only a plugin can walk. A terminal reads with the whole device in view, which is
# the right answer for the person sitting at it and the wrong one to prove containment with — so the last
# stretch is made from inside a launched plugin, where a window is what it will be in the wild.
id: carry-this-store-somewhere-else
title: A carrier asks one number, sends only when it moved, and is handed its own window and nothing more
description: >
  Seed a store, read the version, and write — the number moves. Read it again with nothing written in
  between, and it stands still: that is the whole of what makes the cheap question worth asking. Then
  take the picture and read the written document back off disk, because that document is what the other
  side receives. Finally, file work in a second project and ask again from inside a plugin, where the
  window is real: the number the plugin is handed is its own project's, the picture it takes carries that
  project's work and not the work next door, reading on from the position that picture named hands it
  what moved since — or says so plainly when the cursor is one the ledger cannot speak for — and the
  records that page named read back as rows, its own and never the ones next door.
steps_cli:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — carried out to somewhere else
    as: seed

  - type: action
    domain: store
    op: sync-version
    as: before

  # A write inside the window moves the number. Nothing about *what* changed reaches a carrier — that is
  # the point of the number — so the change made here is an ordinary one and the assert is about the
  # number alone.
  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — a note is a change like any other, and the number says so
    as: note

  - type: assert
    domain: store
    op: version
    with:
      since: before
      moved: true

  # And the other half, which is what makes asking cheap worth anything: with nothing written, the number
  # stands still. A number that drifted on its own would send a carrier the whole store every time it
  # looked.
  - type: action
    domain: store
    op: sync-version
    as: settled

  - type: assert
    domain: store
    op: version
    with:
      since: settled
      moved: false

  # The picture. It is read back off disk rather than out of amenbo, for the same reason an export is:
  # what the other side receives is this document.
  - type: action
    domain: store
    op: sync-snapshot
    as: picture

  - type: assert
    domain: task
    op: synced
    with:
      target: seed
      from: picture
      present: true

  # And the picture says where it stands. Without this the carrier holds a complete state and no
  # defensible place to read on from, so it picks between losing the writes that landed while it read and
  # re-applying what it already has. It is asked of the document as text because the document is what the
  # other side receives — the number itself means nothing here, only that the picture names one.
  - type: assert
    domain: store
    op: snapshot
    with:
      target: picture
      contains: '"cursor":'

  # Work filed where a window will not reach. A project is the unit a plugin is let in on, so a second
  # project is where "outside" lives.
  - type: action
    domain: project
    op: create
    with:
      name: scenario-other
    as: other

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — filed where the carrier cannot see it
    as: unseen

  - type: action
    domain: task
    op: move
    with:
      target: unseen
      project: other

  # From here on the calls are made from inside a launched plugin, which is the only place a window is
  # what it will be in the wild: amenbo puts the store and the window into the child's environment, and
  # no argument the plugin passes widens either.
  - type: action
    domain: plugin
    op: install
    with:
      name: worktree

  - type: action
    domain: plugin
    op: enable
    with:
      name: worktree

  - type: action
    domain: plugin
    op: read-back-program
    with:
      name: worktree

  # The cheap question, asked with no actor anywhere — a read declares none, and the window has already
  # settled how far it gets. What comes back names the window it answered for, which is the only thing
  # that tells two carriers on one device whose number each is holding.
  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: version

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: project_id

  # And the picture, taken through that window. Its own project's work is in it.
  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: carry

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: carried out to somewhere else

  # What lies outside the window did not travel. This is the line the whole window exists for: a carrier
  # that could pick up the project next door would be publishing work nobody let it in on.
  - type: assert
    domain: plugin
    op: returned
    with:
      contains: filed where the carrier cannot see it
      present: false

  # And the road that follows the picture. Having sent the whole once, a carrier never sends it again: it
  # reads on from the position the picture named and re-reads only the records that moved. This is the
  # call it makes on every pass, so what it has to be is unambiguous — it names the window it answered
  # for, and hands back the cursor to come back with.
  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: changes
      args:
        - --since=0

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: '"cursor"'

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: project_id

  # The case a copy outside is silently ruined by: a cursor the ledger cannot speak for. Answered with an
  # empty page it reads as "nothing changed", and the carrier stays confident and stale for as long as
  # nobody looks. So it is said out loud, in a word the caller can branch on.
  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: changes
      args:
        - --since=900000001

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: sync_gap

  # And the road the page leads to. What came back names records and never what they hold, so a carrier
  # that could not read those rows back would be taking the whole window again to see one changed task —
  # which is the reading-on it just did, undone. The rows come back in the picture's own shape, so the
  # carrier holds one form of this store's data and not two.
  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: records
      task: seed

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: carried out to somewhere else

  # The window closes this road too, and it is the road where that is easiest to lose: the caller names
  # the ids, so nothing but the narrowing stands between a guessed number and the row it names.
  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: records
      task: unseen

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: filed where the carrier cannot see it
      present: false
