# What an installed plugin is told, and where it is kept. The settings are declared by the plugin's
# author and written by whoever runs it, for the project they are standing in — a plugin is a project's,
# so its values are too, and there is no tier under them to fall back to.
#
# Like every line that installs a plugin, this one goes to the catalog over the network on purpose
# (see `put-a-plugin-on-the-machine.yaml`): the settings are a face of a plugin that is really there.
id: tell-a-plugin-what-it-needs-to-know
title: A plugin's setting is filled in for the project, taken back, and never invented — and a secret one reaches the run it is for and comes back out nowhere, until a removal takes it
description: >
  Install the official `worktree` plugin, fill in the setting its manifest declares, and read it back.
  Take it away through the door an empty value opens, and see the read say the project holds nothing.
  Then a key the manifest never declared: it is refused, because a plugin is told only what its author
  said it takes. Finally the other route a value can take: a setting the author marked secret is filled
  in, and the read says it is set without saying what it is — while of the two files amenbo hands a
  person, the backup carries the value home and the export leaves it behind. Then the two ends nothing
  else can see: a run is asked what it was handed, and answers with the secret; and a plugin removed
  with one still set is installed again, to be handed nothing.
steps_cli:
  - type: action
    domain: plugin
    op: install
    with:
      name: worktree

  # Which project the value belongs to is never named here — it is the folder's binding, the same thing
  # that decides everything else this run reaches.
  - type: action
    domain: plugin
    op: config-set
    with:
      name: worktree
      key: base
      value: main

  - type: assert
    domain: plugin
    op: config
    with:
      name: worktree
      key: base
      equals: main

  # An empty value is how a setting is taken back — the unset door is the same door, so there is no
  # way to store a blank by accident and no second command to forget about.
  - type: action
    domain: plugin
    op: config-set
    with:
      name: worktree
      key: base
      value: ""

  - type: assert
    domain: plugin
    op: config
    with:
      name: worktree
      key: base
      set: false

  # The manifest is the vocabulary. A key the author never declared is turned away rather than kept
  # somewhere the plugin will never read it — a setting nobody reads is worse than one that is missing.
  - type: action
    domain: plugin
    op: config-set
    with:
      name: worktree
      key: not-a-declared-setting
      value: x
      refused: invalid_value

  # The other route a value can take. What is secret is the author's word — the flag on the field —
  # and no plugin in the official catalog carries one, so the declaration is put onto the installed
  # manifest here (see the op's own note). From this step on, everything is amenbo's own doing.
  - type: action
    domain: plugin
    op: declare-secret
    with:
      name: worktree
      key: token
      label: API token

  - type: action
    domain: plugin
    op: config-set
    with:
      name: worktree
      key: token
      value: amb_scenario_secret_9f2c4b7e0d1a5f36

  # A read of a secret says it is one and stops there. The value leaving through this door would put
  # it in the terminal, the scrollback and the shell's history — injection at run time is the only
  # thing that gets the value itself.
  - type: assert
    domain: plugin
    op: config
    with:
      name: worktree
      key: token
      secret: true

  - type: assert
    domain: plugin
    op: config
    with:
      name: worktree
      key: token
      set: true

  # The two files amenbo hands a person, and the secret goes out with one and not the other. A backup
  # is the road home — a restore that dropped the credentials would mean typing every one of them in
  # again — and an export is one-way, into another tool's hands, where a credential in the clear is one
  # nobody here controls any more. Both are asked for the token verbatim: what it looks like inside an
  # archive nobody has to know, only which of the two carries it.
  - type: action
    domain: store
    op: backup
    as: after-the-secret

  - type: assert
    domain: store
    op: snapshot
    with:
      target: after-the-secret
      contains: amb_scenario_secret_9f2c4b7e0d1a5f36

  - type: action
    domain: store
    op: export
    as: taken-out

  - type: assert
    domain: store
    op: snapshot
    with:
      target: taken-out
      absent: amb_scenario_secret_9f2c4b7e0d1a5f36

  # Nothing so far says the value ever reaches the plugin, and nothing a person can look at will: it
  # travels as an environment variable on the child process, which is the one place neither a reader
  # nor the store sees. So the only witness is a plugin willing to say what it was handed, and the
  # driver stands one in (see the op's own note). The gate is opened because a command run needs it —
  # what a plugin may be told is what it may be run for.
  - type: action
    domain: plugin
    op: echo-program
    with:
      name: worktree

  - type: action
    domain: plugin
    op: enable
    with:
      name: worktree

  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: config

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: amb_scenario_secret_9f2c4b7e0d1a5f36

  # A secret is taken back the way any other setting is — the same door, an empty value.
  - type: action
    domain: plugin
    op: config-set
    with:
      name: worktree
      key: token
      value: ""

  - type: assert
    domain: plugin
    op: config
    with:
      name: worktree
      key: token
      set: false

  # And the end of a secret's life. Once the plugin is gone the read that would answer for it is gone
  # with it, so it is filled in again, the plugin removed, and installed a second time: what a fresh
  # install is handed is the whole question, and it has to be nothing.
  - type: action
    domain: plugin
    op: config-set
    with:
      name: worktree
      key: token
      value: amb_scenario_secret_9f2c4b7e0d1a5f36

  - type: action
    domain: plugin
    op: uninstall
    with:
      name: worktree

  - type: action
    domain: plugin
    op: install
    with:
      name: worktree

  - type: action
    domain: plugin
    op: declare-secret
    with:
      name: worktree
      key: token
      label: API token

  - type: assert
    domain: plugin
    op: config
    with:
      name: worktree
      key: token
      set: false

  - type: action
    domain: plugin
    op: uninstall
    with:
      name: worktree
