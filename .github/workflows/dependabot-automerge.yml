name: Dependabot auto-merge

# Send a Dependabot PR into the merge queue once its lockfiles are complete — nobody has to watch it.
#
# The merge itself is the queue's: this asks for auto-merge, and the queue tests "main as it stands,
# plus this PR" before landing it, exactly as it does for a person's PR. What this workflow adds is
# the one repair the bot cannot make for itself (see `lockstep`), which has to happen *before* the
# queue judges the tree.
#
# It fires on CI finishing on the PR because that is the event that carries a writable token: a
# `pull_request` run raised by Dependabot gets a read-only one, so nothing there can push. That is
# also why CI still runs on pull requests at all (ci.yml says so at its trigger).
#
# `workflow_run` runs in the context of the base repo with a normal GITHUB_TOKEN, so a fork PR cannot
# reach these permissions — the usual pull_request_target hazard does not apply. The token cannot
# approve a PR, and none is needed: the queue's own checks are what stand between a bump and main.
#
# Merging is automatic. SHIPPING is not: releases stay an explicit human/AI step
# (wharfy), so bumps accumulate on main until someone cuts one deliberately.
#
# The merge is preceded by one repair the bot cannot make for itself — completing
# the bump in the lockfile that sits outside the workspace (see `lockstep`). That
# is why this workflow writes as well as merges.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  # The GUI shell crate and the verification harness are both `exclude`d from the workspace and
  # carry lockfiles of their own, but they reach core through a path dependency: a workspace bump
  # changes what those locks resolve to, and Dependabot's PR does not open the files. Merged as-is,
  # main's copies point at a resolution that is no longer real, and the next person to run cargo
  # over one of them wears the churn.
  #
  # So the bump is completed here, before it lands: re-resolve both, and push the result onto the
  # same branch. `cargo metadata` rewrites a lock without compiling, so this costs seconds and needs
  # none of the Tauri system libs.
  #
  # It runs ahead of the merge rather than as a CI job because CI's token is read-only on a
  # Dependabot pull request — this workflow's `workflow_run` trigger is what carries a writable one.
  # The push does not start another CI run (a GITHUB_TOKEN push never does), which is why the merge
  # below can follow immediately: the run that went green and the tree being merged differ only by a
  # lockfile cargo derived from the manifests CI already judged.
  #
  # A human's PR is held to the same contract by CI's `out-of-workspace-locks` job, which fails
  # instead of pushing.
  lockstep:
    name: Bring the out-of-workspace lockfiles along
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      # workflow_run checks out the default branch unless told otherwise, and the branch (not the
      # sha) is what a push needs to land on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # The same ownership check the merge job makes: the actor above says who triggered CI, this
      # says who owns the branch about to be written to.
      - name: Push the re-resolved lockfiles if they moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                  --json number,author --jq '.[0] | select(.author.login == "app/dependabot") | .number')"
          if [ -z "$pr" ]; then
            echo "no open Dependabot PR on ${BRANCH} — nothing to bring along"
            exit 0
          fi
          cargo metadata --manifest-path app/src-tauri/Cargo.toml --format-version 1 > /dev/null
          cargo metadata --manifest-path verification/Cargo.toml --format-version 1 > /dev/null
          if git diff --quiet -- app/src-tauri/Cargo.lock verification/Cargo.lock; then
            echo "the out-of-workspace lockfiles already follow the workspace"
            exit 0
          fi
          # GitHub's documented identity for a commit an action authored. The leading number is the
          # bot account's id, which is what ties the commit to it rather than to a stranger.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/Cargo.lock verification/Cargo.lock
          git commit -m "chore(deps): follow the workspace in the out-of-workspace lockfiles"
          git push origin "HEAD:${BRANCH}"
          echo "pushed the re-resolved lockfiles onto ${BRANCH} (PR #${pr})"

  merge:
    name: Send green Dependabot PRs into the merge queue
    runs-on: ubuntu-latest
    needs: lockstep
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      # workflow_run does not carry the PR, only the head branch it ran on. Find
      # the open PR for that branch and check it really is Dependabot's before
      # touching it (the actor check above is about who triggered CI; this is
      # about who owns the branch being queued).
      - name: Find the PR and queue it if it is Dependabot's
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                  --json number,author --jq '.[0] | select(.author.login == "app/dependabot") | .number')"
          if [ -z "$pr" ]; then
            echo "no open Dependabot PR on $BRANCH — nothing to queue"
            exit 0
          fi
          echo "queueing PR #$pr ($BRANCH), its lockfiles are complete"
          gh pr merge "$pr" --repo "$REPO" --auto --merge --delete-branch
