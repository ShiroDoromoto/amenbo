# Taking back an edge drawn at the wrong decision. This is a correction, not a change of mind:
# superseding a decision back would be a new decision, whereas an edge aimed at the wrong target is a
# miswiring with nothing to remember. What makes it worth its own line is that currency is *derived*
# from the edges — so removing one has to hand the older decision its standing back, on its own.
id: decision-unlink
title: Removing a supersedes edge makes the decision it pointed at current again
description: >
  Supersede one decision with another, confirm the older one has stopped being current, then unlink
  the pair and confirm it is current once more — read both from its own card and from the listing
  that separates current from superseded. A builds_on edge is drawn and taken back the same way, to
  show the pair is what names the edge, whichever kind it carries.
steps:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the policy aimed at by mistake
    as: old

  - type: action
    domain: decision
    op: accept
    with:
      target: old

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — the one that drew the wrong edge
    as: new

  - type: action
    domain: decision
    op: supersede
    with:
      target: new
      replaces: old

  # The edge is there, and the older decision has stopped counting — the state the correction undoes.
  - type: assert
    domain: decision
    op: edge
    with:
      target: new
      kind: supersedes
      other: old
      present: true

  - type: assert
    domain: decision
    op: field
    with:
      target: old
      field: current
      equals: false

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "current:no"
      target: old
      present: true

  - type: action
    domain: decision
    op: unlink
    with:
      target: new
      from: old

  # Gone from both sides of the pair.
  - type: assert
    domain: decision
    op: edge
    with:
      target: new
      kind: supersedes
      other: old
      present: false

  - type: assert
    domain: decision
    op: edge
    with:
      target: old
      kind: superseded_by
      other: new
      present: false

  # And standing again, derived rather than restored: nothing wrote `current` back.
  - type: assert
    domain: decision
    op: field
    with:
      target: old
      field: current
      equals: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "current:no"
      target: old
      present: false

  # The same command, on the other kind of edge: naming the pair is what names it.
  - type: action
    domain: decision
    op: builds-on
    with:
      target: new
      on: old

  - type: assert
    domain: decision
    op: edge
    with:
      target: new
      kind: builds_on
      other: old
      present: true

  - type: action
    domain: decision
    op: unlink
    with:
      target: new
      from: old

  - type: assert
    domain: decision
    op: edge
    with:
      target: new
      kind: builds_on
      other: old
      present: false

  - type: assert
    domain: decision
    op: edge
    with:
      target: old
      kind: built_on_by
      other: new
      present: false
