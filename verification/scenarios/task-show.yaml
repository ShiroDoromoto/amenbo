# A task's own page is where its context is read: not just its fields, but what it waits on, what
# waits on it, what has been said about it, and the decision it rests on. Those four come from four
# different tables, and the page is the one place they have to arrive together.
id: task-show
title: A task's page carries what it waits on, what waits on it, what was said, and what it rests on
description: >
  Build a small neighbourhood around one task — a blocker, a comment, a linked decision — and read
  it back off that task's own show output. The relationships are asserted by the name each side
  reports, so an edge recorded in one direction only is caught here rather than looking like an
  empty list.
steps:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the blocker
    as: blocker

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the task being read
    as: seed

  - type: action
    domain: task
    op: depend
    with:
      target: seed
      on: blocker

  # Both directions of the one edge: the page names what it waits on, and the blocker's page names
  # what waits on it.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: blocked_by.0.name
      equals: SCENARIO SEED — the blocker

  - type: assert
    domain: task
    op: field
    with:
      target: blocker
      field: blocks.0.name
      equals: SCENARIO SEED — the task being read

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — the last thing anyone said here

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: num_comments
      equals: 1

  # The page carries the timeline's tail, which is what the next session actually reads.
  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: recent_comments.0.text
      equals: SCENARIO — the last thing anyone said here

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — the premise this task rests on
    as: premise

  - type: action
    domain: decision
    op: link
    with:
      target: premise
      task: seed

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: linked_decisions.0.title
      equals: SCENARIO SEED — the premise this task rests on

  # The page also says what the task is filed under. Classification is set on one screen and filtered
  # on another, and until it appeared here the task's own page was the one place that never said it —
  # so a reader had to run a filter and look for the task in the answer.
  - type: action
    domain: dimension
    op: create
    with:
      name: bucket

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: bucket
      value: SCENARIO — the release this goes out in

  - type: action
    domain: dimension
    op: set
    with:
      target: seed
      dimension: bucket
      value: SCENARIO — the release this goes out in

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: dimensions.0.dimension
      equals: bucket

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: dimensions.0.value
      equals: SCENARIO — the release this goes out in
