# What a person has in hand when they start a run — a line saying what it is for, a file to work
# from — goes in with the start, and the run keeps it. The first step is told it; nothing
# has to be typed into a pane after the run is under way.
#
# Only an agent's step reads a text and a file, so that is what the run opens first. An entry that
# reads nothing handed over — the built-in that takes a task — turns a text away rather than keep what
# nothing would ever read.
#
# The terminal reads the run back and finds the text on it, and meets the guard in front of the file:
# a file that cannot be read is refused before any run is made, so there is no run left holding half
# of what it was meant to be handed. The screen starts the same automation from the dialog that asks
# what to hand the run, and reads the run on the running tab.
id: hand-a-run-words-and-a-file-as-it-starts
title: A run started with a text and a file keeps the text, and a file that cannot be read is refused
description: >
  Start an automation whose first step is an agent's, handing it a text and a file the run wrote, and
  read the text back off the run. Start it again naming a file that is not there, and read the start
  refused with nothing made. Hand a text to one whose entry takes a task, and read that refused too.
  On screen, start it from the dialog with a text typed in, and read the run on the running tab.
given:
  # Claude Code is one of the two agents this machine can start, and `reads` keeps the stand-in
  # standing in the pane the run opens.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }
  # The action the run opens, holding the one step that is told what was handed over. The way out
  # that takes the task is declared on both layers, as a run's entry has to.
  - { type: action, domain: automation, op: action-add, with: { name: read }, as: read }
  - { type: action, domain: automation, op: step-add, with: { target: read, name: brief, prompt: read what you were handed }, as: brief }
  - { type: action, domain: automation, op: action-entry, with: { target: read, step: brief } }
  - { type: action, domain: automation, op: exit-add, with: { step: brief, name: got one }, as: brief_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: brief_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: read, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: brief, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: brief, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one handed something" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: read }, as: at_read }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_read, step: brief, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_read, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_read } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_read } }
  # The built-in that takes a task, as the entry: it reads nothing handed over at launch.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that takes a task" }, as: taker }
  - { type: action, domain: automation, op: place-add, with: { target: taker, builtin: take_task }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: taker, builtin: close_task }, as: at_taken_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_taken_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_taken_close } }
  - { type: action, domain: automation, op: entry, with: { target: taker, placement: at_take } }

# A run started from the terminal opens no step, so it stays `running`; what is read is what it keeps.
steps_cli:
  - type: action
    domain: repo
    op: write-file
    with:
      path: brief.md
      content: "the login page loses the password field on a narrow window\n"

  - type: action
    domain: automation
    op: start
    with:
      target: auto
      text: look at the brief before you start
      file: brief.md
    as: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running
      handed: look at the brief before you start

  # Read before anything is made: the start is refused, and no second run is left behind.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      text: this one names a file that is not there
      file: missing.md
      refused: not_found

  # The entry takes a task and reads nothing handed over, so the text is turned away, not kept.
  - type: action
    domain: automation
    op: start
    with:
      target: taker
      text: nothing here reads this
      refused: invalid

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
      text: look at the brief before you start
    as: run

  # The first step is the agent's, told the text in its pane, so the run is under way.
  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: running
