# A run going round stands at its entry between two tasks, so before it takes the next it reads the
# automation's newest saved version, and goes on as the same run from that version's entry. That
# version is checked first, the way a launch checks it. One the check turns away ends the run as
# failed, like any other error: the run holds no task between two rounds, so there is nothing to hand
# back.
#
# Each half has an automation of its own, with its own task filed with its role: the run takes it,
# holds it in the built-in that waits, and the new version is saved in that time. The task going to
# done says the round is over and the run has read the newer version.
#
# ── What tells the copies apart ───────────────────────────────────────────────────────────────────────
# The first automation is started on a version whose wait holds a task for a minute and a half, and
# saved where it holds one for a second. The next task of its role is waiting once the first round is
# over, so that task is done well inside the minute and a half only if the run took the new version
# up.
#
# ── Why the agent is taken away ──────────────────────────────────────────────────────────────────────
# A save asks the launch check without this machine's agents, and a run taking up the newer version
# asks it with them. So the version the second run is turned away from is one the save lets through:
# its step's agent is gone from the machine by the time it is saved. The build screen is opened twice
# after that, since the first opening sets the look off and the second draws what it found — the
# answer the run's take-up reads as well. The step stands after the wait's error way out, which the
# wait never leaves by, so no round opens it; the check still reads its agent, as it reads every step
# a line reaches.
#
# The failed run stays on the running tab until it is acknowledged, and its line says nothing of why:
# the screen has no word for this reason yet, so the road reads only that it failed.
#
# A screen road alone: a run started at a terminal opens nothing, so it never goes round there.
id: fail-a-run-waiting-for-a-task-on-a-newer-definition-that-does-not-pass
title: A run takes up the automation saved while it works a task, and fails if that version does not pass
description: >
  Start a run whose first box takes a task, filed with its role, and holds it in a wait of a minute and
  a half. While it waits, shorten the wait to a second and save: once the task is done the run takes
  the new version up, takes the next task of its role and has it done well inside the minute and a
  half, and then, finding no task, completes. Start
  a run of a second automation the same way. While it waits, take Codex CLI, the agent of a step on
  its picture, off the machine, and open the build screen twice so it says the automation could not be
  started. Change how long it waits and save: the save goes through, and once the task is done the run
  is turned away by the check of the version it would take up and fails.
given:
  # Two agents, Claude Code and Codex CLI. The step is carried by Codex CLI, the one taken away.
  - { type: action, domain: workspace, op: can-start, with: { count: 2 } }

  # The tasks the two runs take, handed to the AI and written through.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task worked while a passing version is saved }, as: seed_passes }
  - { type: action, domain: task, op: assign, with: { target: seed_passes, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed_passes } }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task taken on the passing version }, as: next_passes }
  - { type: action, domain: task, op: assign, with: { target: next_passes, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: next_passes } }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task worked while a failing version is saved }, as: seed_fails }
  - { type: action, domain: task, op: assign, with: { target: seed_fails, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed_fails } }

  # The first: take → wait → close.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one saved to pass while its run works" }, as: passes }
  - { type: action, domain: automation, op: place-add, with: { target: passes, builtin: take_task, starts: true }, as: passes_take }
  # The task is the born role's, whose round starts there: a run takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed_passes, role_of: passes } }
  - { type: action, domain: task, op: update, with: { target: next_passes, role_of: passes } }
  - { type: action, domain: automation, op: place-add, with: { target: passes, builtin: wait }, as: passes_wait }
  - { type: action, domain: automation, op: place-add, with: { target: passes, builtin: close_task }, as: passes_close }
  - { type: action, domain: automation, op: edge-add, with: { target: passes_take, exit: 着手した, to: passes_wait } }
  - { type: action, domain: automation, op: edge-add, with: { target: passes_wait, exit: 完了, to: passes_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: passes_close } }

  # The action Codex CLI carries: one step, out by the action's done way out.
  - { type: action, domain: automation, op: action-add, with: { name: review }, as: review }
  - { type: action, domain: automation, op: step-add, with: { target: review, name: read, prompt: read what the task asks for }, as: read }
  - { type: action, domain: automation, op: action-entry, with: { target: review, step: read } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: read, exit_to: "" } }

  # The second: take → wait → close, and the review after the wait's error way out. The wait never
  # leaves by it, so no round opens the review; the check reads its agent all the same.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one saved to fail while its run works" }, as: fails }
  - { type: action, domain: automation, op: place-add, with: { target: fails, builtin: take_task, starts: true }, as: fails_take }
  - { type: action, domain: task, op: update, with: { target: seed_fails, role_of: fails } }
  - { type: action, domain: automation, op: place-add, with: { target: fails, builtin: wait }, as: fails_wait }
  - { type: action, domain: automation, op: place-add, with: { target: fails, action: review }, as: fails_review }
  - { type: action, domain: automation, op: place-add, with: { target: fails, builtin: close_task }, as: fails_close }
  - { type: action, domain: automation, op: agent-set, with: { target: fails_review, step: read, agent: codex-cli } }
  - { type: action, domain: automation, op: edge-add, with: { target: fails_take, exit: 着手した, to: fails_wait } }
  - { type: action, domain: automation, op: edge-add, with: { target: fails_wait, exit: 完了, to: fails_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: fails_wait, exit: "*", to: fails_review } }
  - { type: action, domain: automation, op: edge-add, with: { target: fails_review, to: fails_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: fails_close } }

steps_gui:
  - { type: action, domain: workspace, op: show-face, with: { face: workspace } }
  - { type: action, domain: workspace, op: show-face, with: { face: tasks } }

  # ── A version that passes ──
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: passes } }

  # Long enough to save the new version while the task is still being worked.
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "90" } }
  - { type: action, domain: automation, op: save, with: { target: passes } }
  - { type: action, domain: automation, op: start, with: { target: passes }, as: first }
  - { type: assert, domain: task, op: field, with: { target: seed_passes, field: status, equals: in_progress } }

  # Saved to hold a task for a second. The run takes that version up at its next entry, takes the
  # next task and has it done well inside the minute and a half the version it started on would have
  # held it, then finds no task and ends.
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "1" } }
  - { type: action, domain: automation, op: save, with: { target: passes } }
  - { type: action, domain: task, op: wait-field, with: { target: seed_passes, field: status, equals: done, seconds: 240 } }
  - { type: action, domain: task, op: wait-field, with: { target: next_passes, field: status, equals: done, seconds: 45 } }
  - { type: action, domain: automation, op: screen, with: { tab: history } }
  - { type: assert, domain: automation, op: history-row, with: { target: first, state: completed } }

  # ── A version that does not pass ──
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: fails } }

  # Longer, since the agent is taken away and the build screen read twice before the save.
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "180" } }
  - { type: action, domain: automation, op: save, with: { target: fails } }
  - { type: action, domain: automation, op: start, with: { target: fails }, as: second }
  - { type: assert, domain: task, op: field, with: { target: seed_fails, field: status, equals: in_progress } }

  # The step's agent goes while the run works its task. Amenbo looks again: the first opening sets the
  # look off, and the second draws what it found.
  - { type: action, domain: workspace, op: take-away, with: { command: codex } }
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: fails } }
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: fails } }
  - { type: assert, domain: automation, op: launch, with: { ready: false, reason: agent_missing } }

  # The wait changed and saved. The save does not ask for the agent, so it goes through; the run asks
  # for it as it takes the version up at its next entry, is turned away, and fails.
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "120" } }
  - { type: action, domain: automation, op: save, with: { target: fails } }
  - { type: action, domain: task, op: wait-field, with: { target: seed_fails, field: status, equals: done, seconds: 360 } }
  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: assert, domain: automation, op: run-row, with: { target: second, state: failed } }
