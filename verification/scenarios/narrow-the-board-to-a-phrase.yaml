# Narrowing the board by words. The reader has a project's cards in front of them and wants the few a
# phrase touches — a different question from where a word is written, and one answered on a screen
# rather than by a command, since what it narrows is a listing already drawn.
#
# Two words are typed and not one. They go over as words, so a phrase survives the trip whole, and they
# are ANDed over the card as a record rather than over any one face of it: one of them is written in a
# comment, which the board draws as a count and never as a body.
#
# What this wants in front of it is a project's own board, with the three cards the road makes and
# nothing else standing on it. Drive it stepped (`--step`).
id: narrow-the-board-to-a-phrase
title: A phrase typed over the board leaves the cards it touches, and reaches them through a face no card shows
description: >
  Put two words on one task — one in its title, the other in a comment on it — and each of them alone
  on a task of its own. Type both words over the board and read which cards are left standing. What is
  under test is the phrase surviving the trip and being ANDed over the record: a narrowing that took
  the first word only, or that kept whatever either word touched, leaves a half match standing, and one
  that never reached the comment takes the full match away.
steps_gui:
  - type: action
    domain: task
    op: create
    with:
      title: Ship the delivery gate before Friday
    as: gate

  # The second word goes where the board cannot draw it. A card carries a title and its notes; a
  # comment is a count on the card, so a narrowing judged on what is drawn would never find this.
  - type: action
    domain: task
    op: comment
    with:
      target: gate
      text: Measure the rollout window before it opens

  - type: action
    domain: task
    op: create
    with:
      title: Delivery notes for the archive
    as: archive

  - type: action
    domain: task
    op: create
    with:
      title: Measure the cold start
    as: coldstart

  - type: action
    domain: task
    op: narrow
    with:
      words: delivery measure

  - type: assert
    domain: task
    op: narrowed
    with:
      target: gate
      present: true

  # The two half matches fall, and each of them for a different reason: the first would be standing had
  # the phrase arrived as its opening word alone, the second had it arrived as its closing one.
  - type: assert
    domain: task
    op: narrowed
    with:
      target: archive
      present: false

  - type: assert
    domain: task
    op: narrowed
    with:
      target: coldstart
      present: false
