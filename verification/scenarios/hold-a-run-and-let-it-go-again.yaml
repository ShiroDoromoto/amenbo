# A run is a thing somebody can put a hand on. Holding one lets the step that is open finish and
# stops the next from opening; letting it go picks it up where it was; stopping it is final. The
# three are one road because they are read against each other: a build where holding stopped, or
# where letting go started a second run, would answer every one of them on its
# own and still be wrong about the pair.
id: hold-a-run-and-let-it-go-again
title: A run is held, picked up again and stopped, and says which of the three it is at each turn
description: >
  Start a run, then hold it, let it go and stop it, reading what it says it is doing after each. The
  terminal reads the run itself; the screen reads the row the running tab draws for it, which is
  where a person meets the same three controls. Stopping is pressed last on both roads because it
  is the one that cannot be taken back; afterwards the terminal reads the run as canceled, and the
  screen reads its row on the history tab.
given:
  # Two rather than one because the terminal's premise stands its programs up in front of the
  # machine's own and cannot make a row shorter than two; the step names the first of them either way.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task the first step takes on the screen. A hold settles only when a step reports and the run
  # has somewhere to go on to, so the screen road works the first step to its end.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the held run works }, as: seed }
  # The action the run opens, holding the one step it runs. The way out that takes the task is
  # declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, agent: claude-code, prompt: take the next task }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: port-add, with: { target: claim_got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: port-add, with: { target: got_one, name: task, kind: task_take, required: true } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  # The action the run goes on to. It is what makes the hold settle: a step that reports with nothing
  # after it closes the run, and a closed run is not a held one.
  - { type: action, domain: automation, op: action-add, with: { name: after }, as: after }
  - { type: action, domain: automation, op: step-add, with: { target: after, name: wait, agent: claude-code, prompt: carry on with the task }, as: wait }
  - { type: action, domain: automation, op: action-entry, with: { target: after, step: wait } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: wait, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one to hold" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: after }, as: at_after }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_after } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_after } }
  - { type: action, domain: automation, op: entry, with: { target: auto, placement: at_take } }

# A run started from the terminal opens no step — the host that opens them is the app's — so holding
# it never settles: pause is recorded as asked for and the run stays `running`, waiting for a step
# that will not report. Letting it go is only for a run that has settled, so the terminal road stops
# at the request and leaves the settled hold, and picking it up again, to the screen.
steps_cli:
  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running
      pause_requested: false

  - type: action
    domain: automation
    op: pause
    with:
      target: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running
      pause_requested: true

  - type: action
    domain: automation
    op: stop
    with:
      target: run

  # A person who said stop ends the run canceled, and a cancel carries no reason.
  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: canceled

  # And it is reachable afterwards from the automation it came from, which is one of the two doors a
  # run is ever found by — a run that ended is still a run that happened.
  - type: assert
    domain: automation
    op: runs-listed
    with:
      target: run
      automation: auto

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # The tab that draws every run this device is carrying. It is where the three controls are, so the
  # road moves there rather than staying on the definition that made this one.
  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: running

  # Holding while the first step is open. The step cannot be cut in half, so the row says the run
  # will hold when that step ends, not that it already has.
  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: pause

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: pausing

  # The step's agent finishing, typed in the pane the run opened for it. Reporting is what lets the
  # hold settle, and the way out it leaves by has a placement after it to go on to.
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: automation
    op: take-in-pane
    with:
      target: run
      task: seed

  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      exit: got one
      report: took the task and stopped where the hold asked

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: paused

  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: resume

  - type: assert
    domain: automation
    op: run-row
    with:
      target: run
      state: running

  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: stop

  # The run itself, read on the tab that holds the runs that are over: a canceled one goes straight
  # there, since the person who stopped it knows already.
  - type: action
    domain: automation
    op: screen
    with:
      tab: history

  - type: assert
    domain: automation
    op: history-row
    with:
      target: run
      state: canceled
