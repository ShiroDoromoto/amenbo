# An automation left running waits for tasks, and is rebuilt without stopping it: paused before its
# next task, it holds no task, so it is picked up again as the same run on the definition as it now
# stands, from that definition's entry. What the road rebuilds is the one thing that tells the two
# copies apart: the built-in it starts at stops waiting for a task. On the copy taken at the start the
# resumed run would wait again; on the new one it finds no task, leaves by the way out for that, and
# ends.
#
# A screen road alone: a run started at a terminal opens nothing, so its pause never settles there.
id: resume-a-run-paused-before-its-next-task-on-its-new-definition
title: A run paused before its next task is resumed on the definition as it now stands, from its entry
description: >
  Start a run whose first box waits for a task, with none to take, and pause the project's runs
  before their next task from the workspace's header — the run waiting is paused on the spot. On the
  automation's build screen, read the run named over the picture, set the first box not to wait,
  and walk the new picture as a test run. Resume the run from the running tab, and read it on the
  history tab as completed: it started at the entry of the new definition, found no task and ended.
given:
  # The built-in that takes a task, and the one that closes it. Nothing is handed to the AI, so its
  # filter finds no task; the road sets it to wait, so the run waits with nothing under way.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one rebuilt while paused" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_gui:
  - { type: action, domain: workspace, op: show-face, with: { face: workspace } }
  - { type: action, domain: workspace, op: show-face, with: { face: tasks } }
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: auto } }

  # Set to wait, so the run stays with nothing under way: the automation that is left running.
  - { type: action, domain: automation, op: pick-box, with: { builtin: take_task } }
  - type: action
    domain: automation
    op: answer-choice
    with:
      builtin: take_task
      setting: 着手できるタスクが無いとき
      value: 着手できるタスクが出るまで待つ

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # The project's pause. The run is waiting for a task, so it is paused on the spot.
  - { type: action, domain: workspace, op: show-face, with: { face: workspace } }
  - { type: action, domain: automation, op: pause-before-next-task }

  - { type: action, domain: workspace, op: show-face, with: { face: tasks } }
  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: assert, domain: automation, op: run-row, with: { target: run, state: paused } }

  # Rebuilt with the run paused on it: the first box no longer waits.
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: auto } }
  - { type: assert, domain: automation, op: held-by, with: { target: run } }
  - { type: action, domain: automation, op: pick-box, with: { builtin: take_task } }
  - type: action
    domain: automation
    op: answer-choice
    with:
      builtin: take_task
      setting: 着手できるタスクが無いとき
      value: 待たずに出口「着手できるタスクが無い」へ進む

  # The new picture, walked before the run is let go on it.
  - { type: action, domain: automation, op: test-run, with: { target: auto } }
  - type: assert
    domain: automation
    op: test-pane
    with: { step: 1, total: 2, builtin: take_task, exit: 着手した }
  - { type: action, domain: automation, op: test-move, with: { press: next } }
  - type: assert
    domain: automation
    op: test-pane
    with: { step: 2, total: 2, builtin: close_task }
  - { type: action, domain: automation, op: test-move, with: { press: next } }
  - { type: assert, domain: automation, op: test-pane-ended, with: { ended: completed } }

  # Picked up again, the same run starts at the new definition's entry: it does not wait, finds no
  # task, and ends — where the copy it started with would have it waiting still.
  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: action, domain: automation, op: press-run, with: { target: run, press: resume } }
  - { type: action, domain: automation, op: screen, with: { tab: history } }
  - { type: assert, domain: automation, op: history-row, with: { target: run, state: completed } }
