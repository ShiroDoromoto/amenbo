# A file put in the machine's bin from inside Amenbo, and taken straight back.
#
# What a person hands Amenbo is a folder they work in, and an agent writes in it while they watch.
# Deleting from a list like that is rare and mis-pressed more often than it is meant, and the bin is
# nowhere on the screen to reassure anybody afterwards — so the panel bins rather than deletes, and
# undoes what it binned. This road walks the whole of that: the row goes, and the row comes back.
#
# ── Why the row is read twice and the bin is read never ──────────────────────────────────────────
# Where the machine keeps what it deleted is the machine's, and it differs on every one of the three
# operating systems. What Amenbo answers for is the list: the row is gone from it, and the row is on
# it again. Both readings are of the same place, which is what makes the pair mean something — a
# second reading somewhere else would be proving that two screens agree rather than that a file came
# back.
#
# ── Why the question is a step ───────────────────────────────────────────────────────────────────
# The panel asks before it bins, with a "do not ask again" beside the answer. Whether it asks is a
# habit of the Mac the run is walked on rather than anything the build decides, so a road that only
# pressed the bin and asserted a question would read red on a machine where somebody once ticked the
# box and green on the next one — a verdict about the operator's history, filed as a verdict about
# the release.
#
# So the road puts the habit where it needs it first: the settings row moves the question back on,
# and it is read there before anything is binned. The press and the answer are then two steps — the
# press leaves the question standing, and the answer decides it. What is never touched is the
# checkbox, which would take the question away from every run walked on this machine afterwards.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no second road here. Deleting a file at a shell is `rm`, which is not this, and Amenbo is
# the subject of none of it.
id: take-a-file-back-after-binning-it
title: A file binned from the panel leaves the list, and undo puts it back
description: >
  Open the terminal face on a project whose folder holds a file, unfold the folder's section and
  open the file. Press the bin: the file leaves the list. Press the key this machine undoes with,
  and the row is on the list again.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

  # One ordinary file, with words in it, so the row being read is a row about something.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: watering.md
      content: SCENARIO the seedlings are watered every second morning

steps_gui:
  # Whatever this Mac's history, the question is on for this run. It is the first step because
  # everything after the bin depends on it, and it is walked rather than assumed: a road that only
  # asserted the row would go green on the machine that was already right.
  - type: action
    domain: files
    op: set
    with:
      position: asks

  # And it stands where it was put. This is the half that was missing until the row existed — the
  # question could only ever be turned off before, so a machine that had it off had no way back.
  - type: assert
    domain: files
    op: setting
    with:
      position: asks

  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  - type: action
    domain: terminal
    op: show-side
    with:
      side: files

  - type: action
    domain: files
    op: tree
    with:
      open: true

  # Read before it is binned, so a run that finds nothing afterwards fails on the binning rather than
  # on a row that was never there.
  - type: assert
    domain: files
    op: listed
    with:
      name: watering.md
      section: tree

  - type: action
    domain: files
    op: open
    with:
      name: watering.md
      section: tree

  - type: action
    domain: files
    op: trash

  # The question the row above put there. It is asked because the first step said so, so this is the
  # one place the build's own promise about deleting is read rather than guessed at.
  - type: action
    domain: files
    op: answer
    with:
      answer: yes

  # The file that was open has gone, so the column is the list again — and the list comes back folded,
  # the way it is drawn on the way in. Unfolded here rather than left to be assumed: a reading that
  # cannot find a name it is looking straight at passes an absent step, so a road that read a folded
  # section would come out green over a screen nobody could have seen the answer on.
  - type: action
    domain: files
    op: tree
    with:
      open: true

  - type: assert
    domain: files
    op: listed
    with:
      name: watering.md
      section: tree
      present: false

  - type: action
    domain: files
    op: undo

  # The goal the road is named for: what was binned is back where it was read from.
  - type: assert
    domain: files
    op: listed
    with:
      name: watering.md
      section: tree
