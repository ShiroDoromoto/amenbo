# One audited gateway for the process environment.
# Reading the process environment raw is banned in every crate; every read funnels through
# `amenbo_core::env`. An inherited variable decides behaviour nobody at the call site declared, so
# which ones we depend on has to stay in one reviewable list. Only `amenbo_core::env` itself is
# excepted, with #[allow(clippy::disallowed_methods)].
# When a new env variable is needed, add a typed getter to `amenbo_core::env` rather than a raw read.
# The CI gate promotes this to -D clippy::disallowed_methods (.github/workflows/ci.yml).
disallowed-methods = [
    { path = "std::env::var", reason = "read process env only via amenbo_core::env (the single audited gateway), so every process input we depend on stays in one reviewable list." },
    { path = "std::env::var_os", reason = "read process env only via amenbo_core::env (the single audited gateway), so every process input we depend on stays in one reviewable list." },
]
