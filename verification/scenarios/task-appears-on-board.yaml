# A task delegated to me-ai must surface in the me-ai mailbox listing — the one place a
# delegated task shows up for the next session. Driver-independent: no command line, no
# coordinates. The CLI driver maps each step to a shipped-binary call; the GUI harness
# maps it to a screen instruction.
id: task-appears-on-board
title: A task assigned to me-ai surfaces in the me-ai todo listing
description: >
  Create a task, assign it to me-ai, then assert it is present in the me-ai / todo
  listing. This is the smallest end-to-end proof that a write lands and is readable back.
steps:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — appears on board
    as: seed

  - type: action
    domain: task
    op: assign
    with:
      target: seed
      assignee: me-ai

  - type: assert
    domain: task
    op: listed
    with:
      filter: "assignee:me-ai status:todo"
      target: seed
      present: true
