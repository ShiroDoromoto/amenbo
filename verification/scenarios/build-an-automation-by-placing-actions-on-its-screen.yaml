# An automation's picture is built on its own screen, one layer over an action's: every box on it is
# a placement of an action. What a reader does there that no other screen asks of them is four things.
# An automation is born with one role that starts nowhere, and a picture with nothing on it has no `+`
# to press — so the role's start comes from the press beside the picture, which puts the built-in that
# takes a task on, the only start a role has. Every later placement goes in on a line, off the library.
# What leaving one way out leads to is said on that way out's row, with the limit a line going back to
# a box before it carries. And a placement is taken off outright, with the action left in the library.
# A build that lost any of them would leave an automation nobody could finish from the screen.
id: build-an-automation-by-placing-actions-on-its-screen
title: An automation's role is given its start, and its placements are joined, let go of and taken off on its own screen
description: >
  Open an automation with nothing on it, press the button beside the picture that starts its role
  with the built-in that takes a task, and read that box on the picture and the button gone. Say the
  way out for having taken a task finishes the task, put a library action in on that line, say
  that action's own way out finishes the task, and put a second library action in on that line —
  reading both halves of what that did. Turn the second library action's way out back to the first, write a limit on
  that line and empty it again, say instead that leaving it finishes the task, and take that back.
  Take the second placement off, find the start still drawn, and find the second action still in the
  library. Each change is read on the picture, because the panel alone could say a thing the picture
  never drew.
given:
  # Two library actions, each with a step inside it so a placement's panel has a first step to show.
  # The first declares a way out of its own, which is the row the lines are said on.
  - { type: action, domain: automation, op: action-add, with: { name: draft }, as: draft }
  - { type: action, domain: automation, op: step-add, with: { target: draft, name: write, prompt: write the draft }, as: write }
  - { type: action, domain: automation, op: action-entry, with: { target: draft, step: write } }
  - { type: action, domain: automation, op: exit-add, with: { action: draft, name: drafted } }
  - { type: action, domain: automation, op: action-add, with: { name: review }, as: review }
  - { type: action, domain: automation, op: step-add, with: { target: review, name: read, prompt: read the draft back }, as: read }
  - { type: action, domain: automation, op: action-entry, with: { target: review, step: read } }
  # An automation is born with one role that starts nowhere, which is the state the road opens on:
  # nothing placed, and no line.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — placed on screen" }, as: auto }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # The role's start, from the press beside the picture. A picture with no line at all is the case
  # the `+` on a line cannot reach, and a role starts only at the built-in that takes a task — so the
  # press puts that one on, with nothing to choose, and goes once the role has its start.
  - type: action
    domain: automation
    op: start-role

  - type: assert
    domain: automation
    op: pictured
    with:
      builtin: take_task
      present: true

  # A line to put a library action in on: leaving the start by the way out for having taken a task
  # finishes the task.
  - type: action
    domain: automation
    op: pick-box
    with:
      builtin: take_task

  - type: action
    domain: automation
    op: set-next
    with:
      builtin: take_task
      exit: 着手した
      ends: done

  - type: action
    domain: automation
    op: insert-box
    with:
      after_builtin: take_task
      exit: 着手した
      action: draft

  - type: assert
    domain: automation
    op: pictured
    with:
      name: draft
      present: true

  # The placing closed the panel, so the new box is pressed to bring its rows up.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: draft

  # A line to put the second one in on: leaving by the way out finishes the task.
  - type: action
    domain: automation
    op: set-next
    with:
      exit: drafted
      ends: done

  # The second placement, off the library the `+` on that line opens beside the picture. The way out
  # comes to open it, and it goes on to where the way out used to — both halves read on the picture.
  - type: action
    domain: automation
    op: insert-box
    with:
      after: draft
      exit: drafted
      action: review

  - type: assert
    domain: automation
    op: pictured
    with:
      name: review
      present: true

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: draft
      exit: drafted
      to: review

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: review
      ends: done

  # A limit is said only on a line that goes back to a box before it — a line going forward is
  # walked once per task, so it has nothing to cap. The second library action's way out is turned back to the
  # first, and on that row the limit is written and then emptied — the two ends of that box. The
  # placing closed the panel, so the second box is pressed to bring its rows up.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: review

  - type: action
    domain: automation
    op: set-next
    with:
      to: draft
      max_times: 3

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: review
      to: draft

  - type: action
    domain: automation
    op: set-next
    with:
      to: draft
      max_times: ~

  # The rest is said on the first library action's rows, so it is pressed again to bring them back.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: draft

  # Changed: the same way out now finishes the task, and the line to the second placement goes.
  - type: action
    domain: automation
    op: set-next
    with:
      exit: drafted
      ends: done

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: draft
      exit: drafted
      ends: done

  # Taken back: nothing said about that way out, which is a state of its own rather than an end.
  - type: action
    domain: automation
    op: set-next
    with:
      exit: drafted

  - type: assert
    domain: automation
    op: line-pictured
    with:
      from: draft
      exit: drafted
      present: false

  # Taking a placement off takes its box off the picture. The start is left as it was.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: review

  - type: action
    domain: automation
    op: remove-placement

  - type: assert
    domain: automation
    op: pictured
    with:
      name: review
      present: false

  - type: assert
    domain: automation
    op: pictured
    with:
      builtin: take_task
      present: true

  # What was taken off was the placement and not the action: the library still lists it.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: assert
    domain: automation
    op: action-listed
    with:
      target: review
