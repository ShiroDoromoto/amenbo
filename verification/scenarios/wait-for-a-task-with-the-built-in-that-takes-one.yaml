# The built-in that takes a task always waits for one where a role's round starts: it has no way out
# that says there was none. A run or a session closing a task can make another ready, and so can a new
# one being filed, so a launch does not end on an empty filter. Started with no task to take, it opens
# no run: the launch stands, and its pane with it — the launch's header and its roles, with no run's
# row under them. Amenbo looks again until a task turns up, then opens the run, which reserves it and
# goes on in that same pane.
#
# The road is the screen's alone. A run started at a terminal opens no step (`automation start`), so
# a built-in is only ever carried out on a run the window started.
id: wait-for-a-task-with-the-built-in-that-takes-one
title: The built-in that takes a task stands its launch's pane until a task turns up and then takes it
description: >
  Place the built-in that takes a task (`take_task`) where an automation's role starts, and draw a line
  from its one way out, "着手した". Start it while no task is handed to the AI: no run starts, and
  read the launch's pane standing all the same, its header and its roles on the bar with no run's row.
  Hand a task to the AI, wait up to 30 seconds for Amenbo's next look, and read the task gone to
  in_progress and the agent's step working it in that same pane.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: reads } }

  # Left unhanded: the built-in's filter, unanswered, takes the tasks given to the AI, so this one is
  # not a task the run can take until it is handed over. Its creation is left open for the same reason.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the waiting built-in takes }, as: seed }

  # The step the taken task goes on to: an agent's, so the run's pane stands on a terminal working it.
  - { type: action, domain: automation, op: action-add, with: { name: work }, as: work }
  - { type: action, domain: automation, op: step-add, with: { target: work, name: build, prompt: work the task }, as: build }
  - { type: action, domain: automation, op: action-entry, with: { target: work, step: build } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: build, exit_to: "" } }

  # The built-in, placed by its key. Its one way out, the one that took a task, goes on to the work.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one that waits for a task" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_take }
  # The task is the born role's, whose round starts there: a run takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed, role_of: auto } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: work }, as: at_work }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_work, step: build, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_work } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_work, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  # Started with nothing handed to the AI: nothing to take, and the start is not refused.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  # No task to take: the launch opens and no run does, and the screen goes to the launch's pane.
  - type: action
    domain: automation
    op: start
    with:
      target: auto
      waits: true

  # Waiting rather than gone: the launch's pane stands, its header and its roles, with no run in it.
  - type: assert
    domain: automation
    op: launch-pane
    with:
      target: auto

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: todo

  # Handed to the AI, and written through: the task the waiting run can now take.
  - type: action
    domain: task
    op: assign
    with:
      target: seed
      assignee: me-ai

  - type: action
    domain: task
    op: finish-creating
    with:
      target: seed

  # Reserved by the run the waiting launch opens, with nobody starting it again. Not at once: Amenbo
  # looks again every 30 seconds, so the hand-over is taken on the next look.
  - type: action
    domain: task
    op: wait-field
    with:
      target: seed
      field: status
      equals: in_progress
      seconds: 30

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: status
      equals: in_progress

  # In the launch's pane that was standing, with that run's row now under its header.
  - type: assert
    domain: automation
    op: run-pane
    with:
      step: build
      action: work
      task: seed
      present: true
