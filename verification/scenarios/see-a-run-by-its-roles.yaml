# A reader watching a run wants to know which role is doing what, which a terminal's output does not
# say. So the pane of a launch opens on its roles: a role whose round is under way is a desk, with a
# seat saying the task, the step under way and how long the round has run. A step that may wait for a
# person turns the pane to its terminal while it runs, so the question it asks is not left behind the
# desks; once it is over, the pane goes back to its roles. By hand, a seat pressed turns the pane to
# that seat's terminal, and "← Back to the roles" on the bar over the terminal is the one way back.
#
# The automation is the one pause-a-launch-after-the-current-task-from-its-pane walks, with its first
# step made one that may wait for a person. Its one role, the one it was born with, starts at the
# built-in that takes a task and the task is that role's, so its round is one desk named after the role.
id: see-a-run-by-its-roles
title: A launch's pane shows its round as a desk, and turns to the terminal while a step may wait for a person
description: >
  Start a run whose first step may wait for a person, and read its pane: turned to the terminal while
  that step runs. Report the step, and the pane is back on its roles, with a seat of the round's desk
  saying the next step. Press that seat to turn the pane to its terminal, and go back to the roles
  from the bar over it.
given:
  # Two rather than one because the terminal's premise stands its programs up in front of the
  # machine's own and cannot make a row shorter than two; the step names the first of them either way.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task the built-in takes on the screen.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run is watched by its roles over }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The action the run opens once the built-in has taken the task, holding the one step it runs. Its
  # way out is declared on both layers: the step's is what the step reports, and the action's is what the
  # automation's picture goes on from — the line inside the action carries the one out by the other.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  # The first step may wait for a person, which is what turns the pane to its terminal while it runs.
  - { type: action, domain: automation, op: step-update, with: { target: claim, interactive: true } }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  # The action the run goes on to, whose step does not wait for a person: the pane goes back to its
  # roles once the run reaches it.
  - { type: action, domain: automation, op: action-add, with: { name: after }, as: after }
  - { type: action, domain: automation, op: step-add, with: { target: after, name: wait, prompt: carry on with the task }, as: wait }
  - { type: action, domain: automation, op: action-entry, with: { target: after, step: wait } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: wait, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one watched by its roles" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_start }
  # The task is the born role's, whose round starts there: a run takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed, role_of: auto } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: after }, as: at_after }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_after, step: wait, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_after } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_after, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The first step may wait for a person, so its pane is on the terminal, though a launch's pane opens
  # on its roles.
  - type: assert
    domain: automation
    op: run-roles
    with:
      target: run
      face: terminal

  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      exit: got one
      report: worked the task, and the pane goes back to its roles

  # The step after does not wait for a person, so the pane is back on its roles: a seat of the round's
  # desk, named after the role, says the step it went on to.
  - type: assert
    domain: automation
    op: run-roles
    with:
      target: run
      face: roles
      desk: "SCENARIO SEED — one watched by its rolesの係"
      step: wait

  # The seat pressed turns the pane to its terminal.
  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: terminal
      on: pane

  - type: assert
    domain: automation
    op: run-roles
    with:
      target: run
      face: terminal

  # And the bar over the terminal takes it back.
  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: roles
      on: pane

  - type: assert
    domain: automation
    op: run-roles
    with:
      target: run
      face: roles
      desk: "SCENARIO SEED — one watched by its rolesの係"
      step: wait
