# A step is handed two things besides its prompt: the task the run is on — its notes, the decisions
# linked to it and its comments — and the run's story so far. Both are on unless somebody turns them
# off, because a step that reads no task is rare and a step that works without knowing
# its task is the worse mistake. Turning one off is what a step that needs neither is for: merging,
# say, where a task with long decisions and comments costs tokens and gives the step nothing. So the
# road is the switch, both ways, on a step already built — and a build that dropped the switch, or
# wrote one of the two when the reader turned the other, would leave every step paying for both.
id: leave-out-of-a-step-the-task-and-the-story-so-far
title: A step can be built without the task the run is on or the run's story so far, and either turned back on
description: >
  Build one library action of three steps: one handed everything, as every step is unless somebody
  says otherwise, one built without the task the run is on, and one built without the run's story
  so far. Read each back and find each of the two switches where it was set, apart from the other.
  Then turn the task back on for the step built without it, and the story off for the step handed
  everything, and read both again — a rewrite that moved the other switch too, or moved nothing,
  reads as a mismatch.
given:
  - { type: action, domain: automation, op: action-add, with: { name: SCENARIO SEED — build and merge }, as: act }
  - { type: action, domain: automation, op: step-add, with: { target: act, name: build, prompt: build the task }, as: build }
  - { type: action, domain: automation, op: step-add, with: { target: act, name: merge, prompt: merge what was built, task_context: false }, as: merge }
  - { type: action, domain: automation, op: step-add, with: { target: act, name: tidy, prompt: tidy up after the merge, history: false }, as: tidy }
  - { type: action, domain: automation, op: action-entry, with: { target: act, step: build } }

steps_cli:
  # The one nobody turned anything off on is handed both.
  - type: assert
    domain: automation
    op: step-read
    with: { target: act, name: build, task_context: true, history: true }

  # Each of the other two lost the one it was built without, and kept the other.
  - type: assert
    domain: automation
    op: step-read
    with: { target: act, name: merge, task_context: false, history: true }
  - type: assert
    domain: automation
    op: step-read
    with: { target: act, name: tidy, task_context: true, history: false }

  # Back on for the merge, and off for the build — each rewrite naming one switch and leaving the
  # other where it was.
  - type: action
    domain: automation
    op: step-update
    with: { target: merge, task_context: true }
  - type: action
    domain: automation
    op: step-update
    with: { target: build, history: false }

  - type: assert
    domain: automation
    op: step-read
    with: { target: act, name: merge, task_context: true, history: true }
  - type: assert
    domain: automation
    op: step-read
    with: { target: act, name: build, task_context: true, history: false }

steps_gui:
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: act

  # The step built without the task: its box for the task clear, and the one for the story ticked.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: merge

  - type: assert
    domain: automation
    op: panel-shows
    with:
      field: task_context
      on: false

  - type: assert
    domain: automation
    op: panel-shows
    with:
      field: history
      on: true

  - type: action
    domain: automation
    op: panel-set
    with:
      field: task_context
      on: true

  # The step handed everything, and the story taken off it.
  - type: action
    domain: automation
    op: pick-box
    with:
      name: build

  - type: assert
    domain: automation
    op: panel-shows
    with:
      field: task_context
      on: true

  - type: action
    domain: automation
    op: panel-set
    with:
      field: history
      on: false

  # Read again after leaving the screen, since a box that only looked ticked until the panel was
  # drawn again was never written.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: act

  - type: action
    domain: automation
    op: pick-box
    with:
      name: merge

  - type: assert
    domain: automation
    op: panel-shows
    with:
      field: task_context
      on: true

  - type: action
    domain: automation
    op: pick-box
    with:
      name: build

  - type: assert
    domain: automation
    op: panel-shows
    with:
      field: history
      on: false

  - type: assert
    domain: automation
    op: panel-shows
    with:
      field: task_context
      on: true
