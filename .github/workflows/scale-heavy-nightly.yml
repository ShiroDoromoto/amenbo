name: scale-heavy-nightly

# The full 10k read-scaling guard on the clock. What it runs and why that seed is not on the per-PR
# gate is in _scale-heavy.yml.
#
# The manual leg of the same body is scale-heavy-manual.yml — a separate file so that dispatching
# one does not cancel the other's run.

on:
  schedule:
    # Nightly at 06:00 UTC, the earliest of the timed legs. A regression here only has to surface
    # within a day, and going first leaves rot-gates-weekly.yml (07:00) and ci-full-nightly.yml
    # (08:00) an hour apiece to themselves rather than contending for the same runners.
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scale-heavy:
    uses: ./.github/workflows/_scale-heavy.yml
    permissions:
      contents: read
