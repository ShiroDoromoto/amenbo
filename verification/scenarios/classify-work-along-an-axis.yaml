# How a project is cut into views without growing a field per question. The axis and its values are
# only the half a person sets up; the half that matters to a reader is that filing a task under a
# value is what the filter then finds. An assignment nothing can query is not a classification, so
# every filing here is read back through `dim:<axis>=<value>` rather than off a field.
id: classify-work-along-an-axis
title: An axis is defined with its values, work is filed under one, and the filing is what the filter finds
description: >
  Define an axis and the values it offers, read the offer back, and file two tasks under different
  values. Each filing is then looked for through the filter, both halves every time — the task it
  should find and the one it should leave out. Re-filing one of them says the axis holds a single
  value rather than piling them up, and taking the filing off says the task keeps living once it is
  no longer filed under the axis at all. A decision is then filed under the same axis, with the same
  values: one classification model, whichever kind of thing is being filed.
steps_cli:
  - type: action
    domain: dimension
    op: create
    with:
      name: medium

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: medium
      value: print

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: medium
      value: web

  # What the axis offers is exactly what was added to it, which is asked from both sides: a value
  # nobody defined must not be on offer either.
  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: medium
      present: true

  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: medium
      value: print
      present: true

  - type: assert
    domain: dimension
    op: listed
    with:
      dimension: medium
      value: video
      present: false

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the printed piece
    as: feature

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the online piece
    as: banner

  - type: action
    domain: dimension
    op: set
    with:
      target: feature
      dimension: medium
      value: print

  - type: action
    domain: dimension
    op: set
    with:
      target: banner
      dimension: medium
      value: web

  # Filed under one value, and found by it — the assignment is read back through the filter, not a
  # field, and the other task standing outside the answer is half of what makes it an answer.
  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=print"
      target: feature
      present: true

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=print"
      target: banner
      present: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=web"
      target: banner
      present: true

  # Naming the axis twice asks for either value — the set the other filter keys spell with a comma,
  # which a value's name cannot borrow because it is the user's own text. An axis is single-select, so
  # reading the repetition as an AND would answer with nobody.
  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=print dim:medium=web"
      target: feature
      present: true

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=print dim:medium=web"
      target: banner
      present: true

  # Single-select: setting the other value replaces the first rather than piling up beside it.
  - type: action
    domain: dimension
    op: set
    with:
      target: feature
      dimension: medium
      value: web

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=print"
      target: feature
      present: false

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=web"
      target: feature
      present: true

  # Taken back off: the task keeps living, it is only no longer filed under the axis.
  - type: action
    domain: dimension
    op: unset
    with:
      target: feature
      dimension: medium
      value: web

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=web"
      target: feature
      present: false

  - type: assert
    domain: task
    op: field
    with:
      target: feature
      field: title
      equals: SCENARIO SEED — the printed piece

  # And the other way in: filed as it is created, rather than created and then filed. It is one
  # command and one transaction, so there is no moment where the record is on the board carrying no
  # answer — which is the whole difference from the pair above, and the reason it is walked rather
  # than assumed to be the same road.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — filed as it was made
      dimension: medium
      value: print
    as: born_filed

  - type: assert
    domain: task
    op: listed
    with:
      filter: "dim:medium=print"
      target: born_filed
      present: true

  # One axis, and not only tasks on it. A decision is filed under the same axis with the same values,
  # which is the whole of what "one classification model" means — a second set of values raised for
  # decisions would be two models wearing one name. It is read back the way the tasks above are, through
  # the filter and in the same grammar: an assignment nothing can query is no more a classification on
  # this side than on theirs.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — print goes to the same house
    as: ruling

  # The same create-and-file on this side, because it is the same flag and has to answer alike. It
  # matters more here than on the board: an axis a project requires is read where a decision is
  # settled, and that press belongs to whoever accepts it — so filing at the create is the only moment
  # its writer has.
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — recorded already filed
      dimension: medium
      value: web
    as: born_filed_ruling

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=web"
      target: born_filed_ruling
      present: true

  - type: action
    domain: dimension
    op: set
    with:
      target: ruling
      dimension: medium
      value: print

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=print"
      target: ruling
      present: true

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=web"
      target: ruling
      present: false

  # Single-select holds on this side too: the other value replaces rather than piles up.
  - type: action
    domain: dimension
    op: set
    with:
      target: ruling
      dimension: medium
      value: web

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=print"
      target: ruling
      present: false

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=web"
      target: ruling
      present: true

  # And taken back off, the decision keeps living — it is only no longer filed under the axis, which
  # `=none` is what says: gone from the value's answer and standing in the unfiled one.
  - type: action
    domain: dimension
    op: unset
    with:
      target: ruling
      dimension: medium
      value: web

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=web"
      target: ruling
      present: false

  - type: assert
    domain: decision
    op: listed
    with:
      filter: "dim:medium=none"
      target: ruling
      present: true

  - type: assert
    domain: decision
    op: field
    with:
      target: ruling
      field: title
      equals: SCENARIO SEED — print goes to the same house
