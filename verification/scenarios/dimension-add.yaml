id: dimension-add
title: An axis is defined with its values, a task is filed under one, and the filing is what a filter finds
description: >
  Classification is how a project is cut into views without growing a field per question. The axis and
  its values are one half; the half that matters to a reader is that filing a task under a value is
  what `dim:<axis>=<value>` finds — an assignment nothing can query is not a classification.
steps_cli:
  - { type: action, domain: dimension, op: create, with: { name: medium } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: medium, value: print } }
  - { type: action, domain: dimension, op: value-add, with: { dimension: medium, value: web } }
  - { type: assert, domain: dimension, op: listed, with: { dimension: medium, present: true } }
  - { type: assert, domain: dimension, op: listed, with: { dimension: medium, value: print, present: true } }
  - { type: assert, domain: dimension, op: listed, with: { dimension: medium, value: video, present: false } }

  # Filed under one value, and found by it — the assignment is read back through the filter, not a field.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the printed piece }, as: feature }
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the online piece }, as: banner }
  - { type: action, domain: dimension, op: set, with: { target: feature, dimension: medium, value: print } }
  - { type: action, domain: dimension, op: set, with: { target: banner, dimension: medium, value: web } }
  - { type: assert, domain: task, op: listed, with: { filter: "dim:medium=print", target: feature, present: true } }
  - { type: assert, domain: task, op: listed, with: { filter: "dim:medium=print", target: banner, present: false } }
  - { type: assert, domain: task, op: listed, with: { filter: "dim:medium=web", target: banner, present: true } }

  # Single-select: setting the other value replaces the first rather than piling up beside it.
  - { type: action, domain: dimension, op: set, with: { target: feature, dimension: medium, value: web } }
  - { type: assert, domain: task, op: listed, with: { filter: "dim:medium=print", target: feature, present: false } }
  - { type: assert, domain: task, op: listed, with: { filter: "dim:medium=web", target: feature, present: true } }

  # Taken back off: the task keeps living, it is only no longer filed under the axis.
  - { type: action, domain: dimension, op: unset, with: { target: feature, dimension: medium, value: web } }
  - { type: assert, domain: task, op: listed, with: { filter: "dim:medium=web", target: feature, present: false } }
  - { type: assert, domain: task, op: field, with: { target: feature, field: title, equals: SCENARIO SEED — the printed piece } }
