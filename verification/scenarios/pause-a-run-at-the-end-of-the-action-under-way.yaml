# A pause settles where the action under way ends, not where its step does. An action is one piece of
# work a person placed on the picture, and its steps are how it is carried out: stopping between two
# of them would leave the work half done while the run looked paused. So a pause asked for during the
# first of two steps lets the second open, and the run pauses once the second has reported and the
# run would leave the action.
#
# Every other road that pauses a run places an action of one step, where the step's end and the
# action's end are the same moment — a build that paused at a step's end would pass all of them. This
# is the road with two.
#
# The screen's alone: a run started at a terminal opens no step, so its pause never settles.
id: pause-a-run-at-the-end-of-the-action-under-way
title: A pause asked for during an action's first step lets its second step run, and settles when the action ends
description: >
  Start a run on an action of two steps, and pause it from the line over its pane while the first
  step is open. Report the first step: the run is not paused — the pane stands on the second step,
  still saying the pause is on its way. Report the second: the run leaves the action and is paused.
  Cancel it from the same line, and the pane says it was canceled.
given:
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task the built-in takes, so the run goes on to the action after it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the two-step action works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The action of two steps: the first goes on to the second inside it, and the second leaves the
  # action by its done way out.
  - { type: action, domain: automation, op: action-add, with: { name: work }, as: work }
  - { type: action, domain: automation, op: step-add, with: { target: work, name: draft, prompt: draft the change }, as: draft }
  - { type: action, domain: automation, op: step-add, with: { target: work, name: review, prompt: review the draft }, as: review }
  - { type: action, domain: automation, op: action-entry, with: { target: work, step: draft } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: draft, to: review } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: review, exit_to: "" } }
  # The action the run goes on to. A pause settles where the run would open the next box, so there
  # has to be one: a run that closes when the action ends is over, not paused.
  - { type: action, domain: automation, op: action-add, with: { name: after }, as: after }
  - { type: action, domain: automation, op: step-add, with: { target: after, name: wrap, prompt: carry on with the task }, as: wrap }
  - { type: action, domain: automation, op: action-entry, with: { target: after, step: wrap } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: wrap, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one paused at an action's end" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: work }, as: at_work }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: after }, as: at_after }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_work, step: draft, agent: claude-code } }
  - { type: action, domain: automation, op: agent-set, with: { target: at_work, step: review, agent: claude-code } }
  - { type: action, domain: automation, op: agent-set, with: { target: at_after, step: wrap, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_work } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_work, to: at_after } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_after, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: draft
      action: work
      state: running

  # Paused while the first step is open: the line says the pause is on its way.
  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: pause
      on: pane

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      state: pausing

  # The first step reports. The run stays inside the action, so it does not pause here: the second
  # step opens, and the pause is still on its way.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      report: drafted the change

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      step: review
      action: work
      state: pausing

  # The second step reports, and the run would leave the action: that is where it pauses.
  - type: action
    domain: automation
    op: done-in-pane
    with:
      target: run
      report: reviewed the draft

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      state: paused

  # Cancelled from the same line, with no question: nothing is under way in a paused run.
  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: cancel
      on: pane

  - type: assert
    domain: automation
    op: run-pane
    with:
      target: run
      state: canceled
