# A decision's body holds what was decided; everything said about it goes on its timeline. That split
# is the whole point of the decision timeline — the reasoning that did not belong in the record, and
# everything learned after it was written out, has to have somewhere to land — so the line that matters
# is a comment posted once the writing is over.
id: discuss-a-decision-after-it-is-settled
title: A decision's timeline stays open after its writing is finished, and its comments can be fixed or taken back
description: >
  Comment on a decision while it is still being written, finish the writing, and comment again — then
  rewrite one comment and delete the other, reading the timeline back each time. What is under test is
  that ending the writing closes nothing on the timeline.
steps_cli:
  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO SEED — a decision being discussed
    as: rec

  - type: action
    domain: decision
    op: comment
    with:
      target: rec
      text: SCENARIO — the question raised while it was still being written
    as: before

  - type: assert
    domain: decision
    op: commented
    with:
      target: rec
      text: SCENARIO — the question raised while it was still being written
      present: true

  - type: action
    domain: decision
    op: finish-writing
    with:
      target: rec

  # The record is written out from here on, and the talking goes on where it always went.
  - type: action
    domain: decision
    op: comment
    with:
      target: rec
      text: SCENARIO — what was learned after it was settled
    as: after

  - type: assert
    domain: decision
    op: commented
    with:
      target: rec
      text: SCENARIO — what was learned after it was settled
      present: true

  # The decision's own page carries the timeline's tail, which is what a reader opening the record
  # actually reads — a timeline reachable only from a second command is one nobody knows to run.
  - type: assert
    domain: decision
    op: field
    with:
      target: rec
      field: comments.1.text
      equals: SCENARIO — what was learned after it was settled

  - type: action
    domain: decision
    op: comment-edit
    with:
      target: after
      text: SCENARIO — what was learned after it was settled, said better

  - type: assert
    domain: decision
    op: commented
    with:
      target: rec
      text: SCENARIO — what was learned after it was settled, said better
      present: true

  - type: action
    domain: decision
    op: comment-rm
    with:
      target: before

  - type: assert
    domain: decision
    op: commented
    with:
      target: rec
      text: SCENARIO — the question raised while it was still being written
      present: false

  # Removing one leaves the rest of the timeline standing.
  - type: assert
    domain: decision
    op: commented
    with:
      target: rec
      text: SCENARIO — what was learned after it was settled, said better
      present: true
