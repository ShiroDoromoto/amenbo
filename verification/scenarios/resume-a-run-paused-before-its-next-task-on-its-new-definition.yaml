# A run paused before its next task holds no task, so it is picked up again as the same run on the
# definition as it now stands, from that definition's entry. What the road rebuilds is the one thing
# that tells the two copies apart: how long the built-in that waits holds a task. On the copy taken at
# the start it holds one for a minute; on the new one, for a second. The resumed run takes the next
# task filed with its role, so that task is done well inside the minute only if it went on the new
# copy.
#
# The run takes the task filed with its role and holds it in the built-in that waits, so the pause
# after that task is asked for while it is still being worked; the task going to done says the pause
# has taken hold.
#
# A screen road alone: a run started at a terminal opens nothing, so its pause never settles there.
id: resume-a-run-paused-before-its-next-task-on-its-new-definition
title: A run paused before its next task is resumed on the definition as it now stands, from its entry
description: >
  Start a run whose first box takes a task, filed with its role, and holds it in a wait of a minute.
  Pause it from the running tab after the task it is on, and wait for the task to be done. On the
  automation's build screen, read the run named over the picture, shorten the wait to a second, and
  walk the new picture as a test run. File another task with the role, resume the run from the
  running tab, and read that task done well inside the minute: the run started at the entry of the
  new definition. It then finds no task, and reads on the history tab as completed.
given:
  # The task the run takes, handed to the AI and written through.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the run is paused after }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }

  # Take → wait → close. How long the wait holds a task is what the road rebuilds.
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one rebuilt while paused" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task, starts: true }, as: at_take }
  # The task is the born role's, whose round starts there: a run takes only its role's tasks.
  - { type: action, domain: task, op: update, with: { target: seed, role_of: auto } }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: wait }, as: at_wait }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: 着手した, to: at_wait } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_wait, exit: 完了, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }

  # The next task of the role, filed after the first so the run takes the first before it. It is
  # still waiting when the run pauses, and the resumed run takes it.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the resumed run takes }, as: next }
  - { type: action, domain: task, op: assign, with: { target: next, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: next } }
  - { type: action, domain: task, op: update, with: { target: next, role_of: auto } }

steps_gui:
  - { type: action, domain: workspace, op: show-face, with: { face: workspace } }
  - { type: action, domain: workspace, op: show-face, with: { face: tasks } }
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: auto } }

  # Long enough to ask for the pause while the task is still being worked.
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "60" } }

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - { type: assert, domain: task, op: field, with: { target: seed, field: status, equals: in_progress } }

  # Paused after the task it is on: the wait ends, the task is closed, and the run pauses where it
  # would take the next one.
  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: action, domain: automation, op: press-run, with: { target: run, press: pause-before-next-task } }
  - { type: action, domain: task, op: wait-field, with: { target: seed, field: status, equals: done, seconds: 180 } }

  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: assert, domain: automation, op: run-row, with: { target: run, state: paused } }

  # Rebuilt with the run paused on it: the wait now holds a task for a second.
  - { type: action, domain: automation, op: screen, with: { tab: automations } }
  - { type: action, domain: automation, op: open, with: { target: auto } }
  - { type: assert, domain: automation, op: held-by, with: { target: run } }
  - { type: action, domain: automation, op: pick-box, with: { builtin: wait } }
  - { type: action, domain: automation, op: answer-text, with: { builtin: wait, setting: 秒, value: "1" } }

  # The new picture, walked before the run is let go on it. The close ends one round, and the run
  # goes round to the take, which finds none the second time, and the run ends there.
  - { type: action, domain: automation, op: test-run, with: { target: auto } }
  - type: assert
    domain: automation
    op: test-pane
    with: { step: 1, total: 3, builtin: take_task, exit: 着手した }
  - { type: action, domain: automation, op: test-move, with: { press: next } }
  - type: assert
    domain: automation
    op: test-pane
    with: { step: 2, total: 3, builtin: wait }
  - { type: action, domain: automation, op: test-move, with: { press: next } }
  - type: assert
    domain: automation
    op: test-pane
    with: { step: 3, total: 3, builtin: close_task }
  - { type: action, domain: automation, op: test-move, with: { press: next } }
  - { type: assert, domain: automation, op: test-pane-ended, with: { ended: completed } }

  # Picked up again, the same run starts at the new definition's entry: it takes the next task and
  # holds it for a second rather than the minute the copy it started with would have held it. Then it
  # finds no task and ends.
  - { type: assert, domain: task, op: field, with: { target: next, field: status, equals: todo } }
  - { type: action, domain: automation, op: screen, with: { tab: running } }
  - { type: action, domain: automation, op: press-run, with: { target: run, press: resume } }
  - { type: action, domain: task, op: wait-field, with: { target: next, field: status, equals: done, seconds: 30 } }
  - { type: action, domain: automation, op: screen, with: { tab: history } }
  - { type: assert, domain: automation, op: history-row, with: { target: run, state: completed } }
