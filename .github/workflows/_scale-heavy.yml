name: _scale-heavy

# The full 10k-seed read-scaling guard. It starts nothing itself — two callers reach it, for two
# different questions: _ci.yml's `scale-heavy` job runs it on the `full` legs (nightly, and the run
# that stands before a tag), and scale-heavy-manual.yml runs it on demand.
#
# `read_scaling_guard` proves the read hot paths stay O(result) as the store grows. Its deterministic
# ratio guards prove that at a medium seed in seconds (the `rust` job in _ci.yml runs them on every
# PR via `--features scale`), but its *wall-clock* guards — sublinearity and the board's O(N²) net —
# only bite at the full 10k seed, where they cost ~23s. Running that on every PR would tax the merge
# path for a regression class that does not need per-PR latency, so the full 10k runs here instead:
# nightly (the cadence at which an O(N²)/O(total) regression must be caught) and on demand.
#
# It stays a body of its own, rather than being inlined into that job, so that the on-demand leg has
# something to call: a change that touched a read hot path gets its verdict in a couple of minutes
# instead of waiting out a full _ci.yml run. Inlining would mean two copies of the same steps, and
# the copy nobody watches is the one that rots. See crates/amenbo-core/Cargo.toml for the `scale` /
# `scale-heavy` feature split.
#
# Cost: this repo is public, so Actions minutes are free — what keeps the full 10k off the per-PR
# gate is merge latency, not a quota. The job runs on Linux.

on:
  workflow_call:

# What the cargo line below has to be told: amenbo-core keeps no default for either, and an unset one
# stops the compile. This job calls cargo straight rather than through the Makefile, so it names the
# same non-production pair the merge gate does — nothing built here is distributed.
env:
  AMENBO_APP_NAME: amenbo
  AMENBO_LATEST_JSON_URL: http://127.0.0.1:1/latest.json

jobs:
  scale-heavy:
    name: read scaling guard (full 10k)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the channel/components; rustup installs them on first cargo use.
      - name: Show toolchain
        run: rustc --version

      # The merge gate's Linux entry for this workspace (_ci.yml's `rust` job, `shared-key:
      # workspace`), read and not written. This job builds the same workspace from the same lockfile,
      # and that job's clippy is `--all-targets --all-features` — `scale-heavy` included — so its
      # entry already holds every dependency artifact this one wants.
      #
      # `save-if: false` because a second copy of that answer is what this step used to be: a
      # hand-rolled actions/cache over the whole `target` dir, which stored this workspace's own
      # crates as well as its dependencies (rust-cache drops the former, since they change every
      # commit) and, with a `restore-keys` prefix, grew across lockfiles rather than being replaced.
      # It was 434MB of the repository's 10GB budget on 2026-08-17, spent to hold what the gate's
      # entry already held.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.3
        with:
          tool: cargo-nextest

      # `scale-heavy` implies `scale`, so this seeds the full 10k store and additionally runs the
      # timing guards. Scope to the single guard target — the rest of the suite is the PR gate's job.
      #
      # `--profile scale-heavy` and not `ci`: at the full 10k seed this one test costs an order more
      # than anything the merge gate runs, so the two legs need different lines for SLOW. The profile
      # (.config/nextest.toml) carries the same fail-fast and failure-output the `ci` one does.
      - name: Read scaling guard at full 10k seed
        run: cargo nextest run --profile scale-heavy --features scale-heavy -p amenbo-core --test read_scaling_guard
