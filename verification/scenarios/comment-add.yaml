# The timeline is how one session hands over to the next, so what matters is not only that a comment
# posts: it is that a wrong one can be fixed in place and a mistaken one can be taken back. Both of
# those are read back off the store, since a delete that leaves the row behind looks like a success.
id: comment-add
title: A comment posts to a task's timeline, is rewritten in place, and can be taken back
description: >
  Post a comment, find it in the task's timeline and in the count on its page, rewrite it and check
  the old wording is gone rather than duplicated, then delete it and check the timeline is empty
  again. Editing keeps the comment's place; deleting removes it for good.
steps_cli:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the task being discussed
    as: seed

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — what this session found
    as: note

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — what this session found
      present: true

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: num_comments
      equals: 1

  - type: action
    domain: comment
    op: edit
    with:
      target: note
      text: SCENARIO — what this session found, said better

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — what this session found, said better
      present: true

  # Rewritten in place: the old wording is gone, and no second comment was posted in its stead.
  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — what this session found
      present: false

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: num_comments
      equals: 1

  - type: action
    domain: comment
    op: rm
    with:
      target: note

  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — what this session found, said better
      present: false

  - type: assert
    domain: task
    op: field
    with:
      target: seed
      field: num_comments
      equals: 0
