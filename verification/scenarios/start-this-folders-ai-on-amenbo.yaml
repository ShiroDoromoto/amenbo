# The instruction to work with amenbo reaches this folder's AI through a file it is asked to read —
# and a file only works if it is read. The session-start hook is the way in that does not depend on
# that: it arrives through the tool's own protocol, before anything else is asked of the model.
#
# amenbo's part in it is text, and nothing else. It does not write the provider's settings file, and
# it never says a hook is working — what it can say is that this folder is not wired yet, and hand
# over what wires it. So the road here is the whole of what a release can break: the folder is told,
# the text is handed over with the file it goes in, the paste lands, and amenbo reads the folder as
# wired and stops telling.
#
# Nothing in it is visible from inside the workspace's own tests: the settings file is a real file in
# a real folder, and the folder is what answers for it.
id: start-this-folders-ai-on-amenbo
title: A folder that does not start its AI on amenbo says so, hands over what wires it, and stops saying it once that lands
description: >
  The reader has a folder their AI works in and no wiring in it, which is where everyone starts. The
  road walks what amenbo does about that: it names the tool it can see in the folder and says the AI
  is not being started on amenbo; the text that fixes it comes with the file it goes in and carries
  the launch instruction rather than the spec itself; pasting it is the reader's own act, so the run
  stands in for the hand that does it; and afterwards the folder reads as wired, with nothing left to
  finish and nothing more said about it.
steps_cli:
  # A folder this reader's AI already works in: the provider's own directory is there, with settings
  # that do nothing about amenbo. That is the state everyone is in before they are told.
  - type: action
    domain: repo
    op: write-file
    with:
      path: .claude/settings.json
      content: |
        {
          "permissions": {
            "allow": []
          }
        }

  # Told, and told by name: the folder shows what tool it is, so the report names it rather than
  # leaving the reader to work out which of five it means.
  - type: assert
    domain: repo
    op: ai-launch
    with:
      wired: false
      tool: claude-code

  # What is handed over. The file is half the answer — the same text in the wrong place leaves the
  # folder exactly as it was — and what it injects is the launch instruction, the one line that sends
  # the AI to the entry point, never the entry point's own contents.
  - type: assert
    domain: repo
    op: ai-launch-text
    with:
      tool: claude-code
      carries: agent --json
      paste_into: .claude/settings.json

  # The paste. amenbo writes no settings file, so this is the reader's hand and not amenbo's — the
  # run only stands in for it.
  - type: action
    domain: repo
    op: wire-ai
    with:
      tool: claude-code

  # And the folder reads as wired. Nothing was recorded to make it so: what changed is the file on
  # disk, which is read afresh every time, so this is the same question as the first assert and it
  # now comes back the other way.
  - type: assert
    domain: repo
    op: ai-launch
    with:
      wired: true
