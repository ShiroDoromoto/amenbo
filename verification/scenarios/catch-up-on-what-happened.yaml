# The activity stream is the one place where what the store did and what people said are read as one
# thing. A task's own history lands there without anyone writing it down, so what is under test is
# that the stream is fed at all — and that narrowing it by kind still answers.
#
# Both roads reach it. On the screen the narrowing is a chip a reader presses, and a build that drew
# the chips but narrowed nothing would answer every question on this road the same way — which is
# what the last step, the one that asks for an absence, is there to catch.
id: catch-up-on-what-happened
title: A task's events and comments arrive on one timeline, and each kind can be read on its own
description: >
  Register a task, comment on it, and read the shared timeline for that task — whole, then narrowed
  to the system events and to what was written. The system side is fed by the store itself, so an
  empty answer there means the stream is not being written, not that nothing happened.
steps_cli:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the task whose history is read
    as: seed

  # Registering it is itself an event: the stream is fed by the store, with nobody recording it.
  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      kind: system
      present: true

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — said on the way past

  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      text: SCENARIO — said on the way past
      present: true

  # The same entry, read through the narrowed stream: a comment is a comment on this side too.
  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      kind: comment
      text: SCENARIO — said on the way past
      present: true

  # And it is not on the system side — narrowing that returns nothing would be the same answer as
  # narrowing wrongly, so this is what tells the two apart.
  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      kind: system
      text: SCENARIO — said on the way past
      present: false

steps_gui:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — the task whose history is read
    as: seed

  # Registering it is itself an event: the row is there with nobody having written one.
  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      kind: system
      present: true

  - type: action
    domain: task
    op: comment
    with:
      target: seed
      text: SCENARIO — said on the way past

  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      text: SCENARIO — said on the way past
      present: true

  # The same row, read through the narrowed stream.
  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      kind: comment
      text: SCENARIO — said on the way past
      present: true

  # And not on the system side. A chip that narrowed nothing would leave the row standing here, and
  # every step above would still be green.
  - type: assert
    domain: task
    op: activity
    with:
      target: seed
      kind: system
      text: SCENARIO — said on the way past
      present: false

  # The task's own timeline is the other place what was written lands, and it is the one a reader
  # opens when the stream has told them which record to look at.
  - type: assert
    domain: task
    op: commented
    with:
      target: seed
      text: SCENARIO — said on the way past
      present: true
