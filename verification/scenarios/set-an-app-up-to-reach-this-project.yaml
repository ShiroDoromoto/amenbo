# MCP takes a setting per app, and the reader it is for is the one whose AI cannot open a folder at all.
# The screen is the app's rather than the project's, because a server is one per app and reaches as many
# folders as the reader chose — so what a row asks is which projects that app may reach. The apps
# themselves are listed, never asked about: which one the reader uses is not remembered and not guessed,
# since they change tools and a remembered answer is wrong by the next day.
#
# What *is* read off disk is the other question — whether an app already holds this project — and that
# is a fact about the settings rather than a preference about the reader. It is drawn with the folder
# that entry names, because set up for *which* folder is the half a reader cannot work out: an entry
# pointing at a folder nobody works in is drawn exactly like one pointing at the right folder.
#
# And one road per row. The app that cannot run a command is handed a file to open; every other app has
# an AI of its own, which is given the request and does the merge. Which of the two a row draws is the
# catalog's word, so a build that folded them into one button would be offering half its readers a road
# their app cannot walk.
#
# The road is the screen's alone. A terminal reaches this project by standing in its folder, so there is
# no list of apps there, nothing folded, and no row to read a state off.
#
# The world is declared below: one project bound to the folder named there, an ordinary card on its
# board, and that folder already carrying one app's own settings with Amenbo's entry in them. That last
# is written out here rather than asked of the build under test, which is the opposite of what
# `wire-ai` does one road over, and for a reason: nothing the shipped CLI hands over carries this text —
# both faces that produce it are the screen's — and the name the entry is found under is a compatibility
# surface in its own right, sitting in files readers' own AIs wrote. It is the machine's name rather than
# any one project's, so one entry is what a reader has however many projects they work; a build that moved
# it again would stop recognising every entry already out there, and this road going red is that being
# said out loud.
id: set-an-app-up-to-reach-this-project
title: One screen says which apps already reach Amenbo, for which folders, and hands each one the road its app can walk — and what is ticked there comes back off the app it was carried into
description: >
  The reader wants an AI that cannot open a folder to reach their projects. One screen lists the apps
  Amenbo knows. One of them already holds a server and says so with the folder its entry names — a
  folder that is not any of this reader's projects, which is exactly why the folder is drawn at all.
  The rest are not set up, and each row offers the one road its app can walk: a request for the apps
  that have an AI of their own, a file for the one that cannot run a command.

  Then the file road is walked to its end and the screen is asked again — because the app that takes a
  file keeps what it was given somewhere its settings file never sees, and a reader who has just set it
  up must not come back to a row saying they have not.

  What this road stands against is a fold that lists apps and says nothing about them: "set up" with no
  folder under it, or one button drawn for every row.

  Then the file road is walked to its end, off Amenbo's screen and into the app it was written for: the
  one app Amenbo writes settings for with nobody in between, asked whether it reads them — Amenbo among
  the servers it lists, with a tool of Amenbo's under it.
given:
  # The project and the folder it is bound to. A project with no folder has nowhere to point a server,
  # and the fold draws nothing at all — so the folder is the premise the whole road stands on.
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
      dir: workspace

  # One app already reaching this project: the entry a reader's own AI would have written, under the
  # name Amenbo answers to. The folder it names is deliberately not the folder these settings sit in —
  # an entry can name any folder, and reading back the one it names is the whole reason the screen
  # draws it.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: workspace
      path: .mcp.json
      content: |
        {
          "mcpServers": {
            "amenbo": {
              "command": "/usr/local/bin/amenbo",
              "args": ["mcp", "--dir", "/Users/reader/greenhouse"]
            }
          }
        }

steps_gui:
  # The screen is the app's, not the project's: a server is one per app, and it reaches as many folders
  # as the reader chose. Opening it is the step, because everything read after this is read against the
  # screen it opens onto.
  - type: action
    domain: repo
    op: mcp-open

  # The app that already holds this project, and the folder its entry reaches. The path is the reading:
  # it is the reader's own, the screen draws no other, and a build that dropped it would leave a row
  # saying "set up" about nobody knows what.
  - type: assert
    domain: repo
    op: mcp-app
    with:
      app: claude-code
      set: true
      dir: /Users/reader/greenhouse

  # And the road that row offers. This app has an AI of its own, so what it is handed is the request —
  # the AI makes the edit, which it does better than any generator, merging with what is already in the
  # file and saying what it changed.
  - type: assert
    domain: repo
    op: mcp-road
    with:
      app: claude-code
      road: request

  # The row beside it, on the same screen: an app nothing has been set up in. Nothing is named after
  # it, a folder being what an entry has and this one has none. It is one of the apps whose settings
  # live in the folder, so this run's own folder is the whole of what is asked — the answer is the
  # same on every machine, whatever the person walking this road has installed.
  - type: assert
    domain: repo
    op: mcp-app
    with:
      app: cursor
      set: false

  # And what that row offers while nothing reaches it. An app no entry names opens on nothing ticked,
  # and what is ticked is what goes over — so the request has nothing to carry and says so before it is
  # pressed. Read here rather than on the row above, which opens on the folder it already reaches and is
  # right to be live.
  - type: assert
    domain: repo
    op: mcp-road-shut
    with:
      app: cursor
      road: request

  # And the other road, which is why this app is the one to read it on: it cannot run a command, so
  # there is no AI in it to hand a request to and a file is the only way in. Two rows on one screen
  # offering two different things is what says the road is the catalog's word and not the screen's.
  - type: assert
    domain: repo
    op: mcp-road
    with:
      app: claude-desktop
      road: file

  # The same emptiness on the other road, before anything is ticked into it. Both roads answering it the
  # same way is the reading: a build where one is shut and the other live is one that lets a folderless
  # hand-over out down whichever road happens to be live.
  - type: assert
    domain: repo
    op: mcp-road-shut
    with:
      app: claude-desktop
      road: file

  # And taken. What goes out is the whole of what is ticked, not the difference from what was there —
  # so the step names every project that is to be ticked and says the rest are to be left clear. That
  # is the move this screen exists to make the same the second time as the first.
  - type: action
    domain: repo
    op: mcp-choose
    with:
      app: claude-desktop
      projects:
        - Greenhouse

  # And the file taken the rest of the way, into the app it was written for. This is the one place the
  # road leaves Amenbo's own screen, and the one app it has to: everywhere else a reader's own AI writes
  # the settings and Amenbo holds only the wording, but here Amenbo writes the file itself and it lands
  # with nobody in between. A format got wrong is Amenbo's fault, and nothing this side of the app
  # reading it would say so.
  #
  # What the app is asked for is the whole of what the file is for — Amenbo among its servers, and a
  # tool of Amenbo's under it, which is the server having started. Going further, to the app's AI making
  # a task, is one round trip walked once and not per release: what is on the other side of it is
  # somebody else's product, which changes without Amenbo changing.
  - type: assert
    domain: repo
    op: mcp-in-app
    with:
      app: claude-desktop
      tool: run

  # And back, to the screen that offered the file, with the question it asked before: is this app set
  # up? The app writes nothing into the settings file a bundle came from, so the answer lives in what
  # it keeps of the extension itself — and a build that looked only at the file would say "not set up"
  # to a reader who has just watched it work. The screen is opened again rather than looked at where
  # it stood, because what is under test is the reading and not a cached draw.
  - type: action
    domain: repo
    op: mcp-open

  # The loop closes here. What was ticked went out with the file, the app took it, and the row is read
  # back off what the app kept — standing on the same project it was ticked for. A build that wrote the
  # selection and could not read it again would pass every step before this one.
  - type: assert
    domain: repo
    op: mcp-app
    with:
      app: claude-desktop
      set: true
      projects:
        - Greenhouse
