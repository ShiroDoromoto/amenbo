# Finding where a word is written. A listing answers which records match; this answers which places
# carry the word, which is the question anyone holding half a memory of something actually asks — and
# since words left the filter grammar, this is the only place they go. The line holds the five faces a
# reader lands on (a title, a body, a remark on it, a label it was filed under, the name of what is
# attached), the folding that decides what counts as a match at all, the narrowings, and what each row
# says about where the record it points at stands.
id: find-where-a-word-is-written
title: A word leads to the places it is written — a title, a body, a comment, a label, an attachment — and the narrowings leave the rest out
description: >
  Write one word into a task's title, another into its notes and a third into a comment on it, and
  write the first word into a decision as well. Then ask for each word and check the face it comes
  back on. What is under test is that the answer names the place: a search that returned the right
  record on the wrong face, or that quietly returned everything, reads as a green list either way, so
  every arm names the face it expects and every narrowing is asserted from both sides. The row is asked
  one thing more — where the record it points at stands — because a place in work that is over is a
  different answer from a place in work still to be taken, and the ref says neither.
steps_cli:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the retention window
    as: window

  - type: action
    domain: task
    op: update
    with:
      target: window
      notes: the window is measured in days, never in rows

  - type: action
    domain: task
    op: comment
    with:
      target: window
      text: the sweep runs nightly

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — retention of the outbox
    as: outbox

  # The three faces of one record. Each word was written in exactly one of them, so a search that
  # answered on the wrong face would be caught here rather than read as a hit.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      face: body

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      face: comment

  # The same word, written on another record entirely: a search crosses the two sides, and reaching
  # a decision is not something a task listing could do at all.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      face: title

  # Past the bodies, onto what a person named rather than wrote: the label a task was filed under, the
  # axis that label belongs to, and the name of what is attached to it. None of that text is held on the
  # task, so each is the join under test — and the task filed under neither stays out.
  - type: action
    domain: dimension
    op: create
    with:
      name: surface

  - type: action
    domain: dimension
    op: value-add
    with:
      dimension: surface
      value: typography

  - type: action
    domain: dimension
    op: set
    with:
      target: window
      dimension: surface
      value: typography

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the one filed under nothing
    as: bystander

  - type: action
    domain: repo
    op: write-file
    with:
      path: measurements.log
      content: "one\n"

  - type: action
    domain: task
    op: attach
    with:
      target: bystander
      file: measurements.log
      name: the latency measurements

  - type: assert
    domain: task
    op: found
    with:
      words: typography
      target: window
      face: label

  - type: assert
    domain: task
    op: found
    with:
      words: surface
      target: window
      face: label

  - type: assert
    domain: task
    op: found
    with:
      words: typography
      target: bystander
      present: false

  - type: assert
    domain: task
    op: found
    with:
      words: measurements
      target: bystander
      face: attachment

  - type: assert
    domain: task
    op: found
    with:
      words: measurements
      target: window
      present: false

  # The words are matched on a folded copy, so one reaches the place it is written however it was
  # typed — width and case are not differences anyone means by them.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — ＧＡＭＭＡ, the one spelled the wide way
    as: gamma

  - type: assert
    domain: task
    op: found
    with:
      words: gamma
      target: gamma
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: RETENTION
      target: window
      face: title

  # Words are ANDed over the RECORD, not over one face: the title carries the first word and the
  # comment the second, and the title is still a place the reader is sent to.
  - type: assert
    domain: task
    op: found
    with:
      words: retention nightly
      target: window
      face: title

  # A word nobody wrote leaves nothing standing, however much of the query the record does carry.
  - type: assert
    domain: task
    op: found
    with:
      words: retention unwritten
      target: window
      present: false

  # `--kind` keeps one side: the decision is out of a search narrowed to tasks.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      present: false

  # `--face` is the other axis: which face of the record the words are on. The word written in the
  # notes is still a place when the search is narrowed to the body, and nowhere when it is narrowed to
  # the title — the record carries the word either way, so a narrowing that did nothing would read as
  # green without the second half.
  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      only_face: body
      face: body

  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      only_face: title
      present: false

  # The two axes are judged apart, so naming both asks for their product — the remarks on decisions,
  # which neither axis alone can reach. The same word is written on a remark on each side, and the
  # pair keeps the decision's while the task's falls away.
  - type: action
    domain: decision
    op: comment
    with:
      target: outbox
      text: the sweep was agreed to here

  - type: assert
    domain: decision
    op: found
    with:
      words: sweep
      target: outbox
      kind: decision
      only_face: comment
      face: comment

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      kind: decision
      only_face: comment
      present: false

  # Past where the words are, to what the record carrying them is. A row that says only the ref sends
  # the reader off to `show` for the very thing they were about to ask — is this place work still to be
  # taken, or work that is over — so both answers are asked for, and the decision is asked in its own
  # vocabulary rather than the task's.
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the retention pass that already ran
    as: ran

  - type: action
    domain: task
    op: finish-creating
    with:
      target: ran

  - type: action
    domain: task
    op: done
    with:
      target: ran

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: ran
      standing: done

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      standing: todo

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      standing: proposed

  # `--filter` is read in the grammar of the side named beside it, and each side has its own: the task
  # list's keys narrow the tasks, the decision list's narrow the decisions. Both halves are walked,
  # because a narrowing that reached only one side would read as green from either one alone.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      kind: task
      filter: "status:todo"
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      filter: "status:todo"
      present: false

  # The other grammar, on the other side. `status:proposed` is a decision's word — a task has no such
  # status — and the decision comes back on it, which is the whole of what this narrowing was for.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: decision
      filter: "status:proposed"
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: decision
      filter: "status:accepted"
      present: false

  # `--project` is the other narrowing, and deliberately not a key of that grammar: a project is an
  # axis both sides carry, so scoping to one has to leave the decisions standing where the filter above
  # took them out. Both halves are asserted — the neighbour's rows fall away, and the decision of the
  # project asked for does not.
  - type: action
    domain: project
    op: create
    with:
      name: scenario-elsewhere
    as: elsewhere

  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the retention window, filed elsewhere
    as: exile

  - type: action
    domain: task
    op: move
    with:
      target: exile
      project: elsewhere

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — retention, decided elsewhere
      project: elsewhere
    as: exile_why

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: exile
      present: true

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: exile
      project: elsewhere
      face: title

  # The half the filter cannot do: the scope keeps the decision of the project asked for.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: exile_why
      project: elsewhere
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      project: elsewhere
      present: false

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      project: elsewhere
      present: false

# The same goal reached on the screen that answers it. The road is shorter than the terminal's, and cut
# on what a reading can settle rather than on what matters less: a hit row leads with the record it
# belongs to whichever face the words were on, so the screen says which records the words reach, and the
# face is named in each step for the eye that closes it. That is also why every step that asks for
# something to be missing asks it of the whole record — a word narrowed off one face still draws the
# other faces' rows, and the title with them.
steps_gui:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO TASK — the retention window
    as: window

  - type: action
    domain: task
    op: update
    with:
      target: window
      notes: the window is measured in days, never in rows

  - type: action
    domain: task
    op: comment
    with:
      target: window
      text: the sweep runs nightly

  - type: action
    domain: decision
    op: create
    with:
      title: SCENARIO DECISION — retention of the outbox
    as: outbox

  # One word per face. Each was written in exactly one of the three, so the record coming back for all
  # three is the screen reaching every face a card of its own would never show.
  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: measured
      target: window
      face: body

  - type: assert
    domain: task
    op: found
    with:
      words: sweep
      target: window
      face: comment

  # The crossing to the other side, which is what makes this a screen of its own rather than a board's
  # search box: a decision has no card on any board.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      face: title

  - type: assert
    domain: task
    op: found
    with:
      words: retention unwritten
      target: window
      present: false

  # The two narrowings the screen draws its own controls for — the chips that keep one side, and the box
  # that takes that side's own grammar. Each takes the decision out of an answer it was in a step ago,
  # and the box is read in whichever grammar the chip beside it names.
  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      present: false

  - type: assert
    domain: task
    op: found
    with:
      words: retention
      target: window
      kind: task
      filter: "status:todo"
      face: title

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: task
      filter: "status:todo"
      present: false

  - type: assert
    domain: decision
    op: found
    with:
      words: retention
      target: outbox
      kind: decision
      filter: "status:proposed"
      face: title
