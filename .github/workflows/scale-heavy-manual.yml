name: scale-heavy-manual

# The full 10k read-scaling guard on demand — the same body the nightly leg runs
# (scale-heavy-nightly.yml), for when a change touched a read hot path and waiting for the clock is
# not the answer.
#
# It is a file of its own rather than a second trigger on the nightly leg because both would then
# share one concurrency group, and dispatching this would cancel a scheduled run midway.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  scale-heavy:
    uses: ./.github/workflows/_scale-heavy.yml
    permissions:
      contents: read
