name: Dependabot auto-merge

# Merge a Dependabot PR once CI has passed on it — nobody has to watch the queue.
#
# Why not GitHub's own auto-merge button: it only waits for *required* status
# checks, and required checks come from branch protection / rulesets, which this
# repo cannot have (private on the Free plan — the protection API answers 403
# "Upgrade to GitHub Pro"). With no required checks, native auto-merge merges
# immediately, i.e. before CI says anything. So the wait is done here instead:
# fire on CI *completing*, and merge only if it completed green.
#
# `workflow_run` runs in the context of the base repo with a normal GITHUB_TOKEN,
# so a fork PR cannot reach these permissions — the usual pull_request_target
# hazard does not apply. The token still cannot approve a PR (a token cannot
# approve its own repo's PRs), but approval is not required here: no branch
# protection means merge needs no review.
#
# Merging is automatic. SHIPPING is not: releases stay an explicit human/AI step
# (wharfy), so bumps accumulate on main until someone cuts one deliberately.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge green Dependabot PRs
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      # workflow_run does not carry the PR, only the head branch it ran on. Find
      # the open PR for that branch and check it really is Dependabot's before
      # touching it (the actor check above is about who triggered CI; this is
      # about who owns the branch being merged).
      - name: Find the PR and merge it if it is Dependabot's
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                  --json number,author --jq '.[0] | select(.author.login == "app/dependabot") | .number')"
          if [ -z "$pr" ]; then
            echo "no open Dependabot PR on $BRANCH — nothing to merge"
            exit 0
          fi
          echo "merging PR #$pr ($BRANCH), CI was green"
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
