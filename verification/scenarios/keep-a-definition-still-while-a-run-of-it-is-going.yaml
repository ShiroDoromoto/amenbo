# A run works from the copy of its definition it took at the start, and while it is running or paused
# the definition it came from is held: nothing about the automation, or about an action placed on it,
# can be rewritten until the run ends. The refusal and the release are one road because they are read
# against each other — a build that refused every edit, or none, would pass either half on its own.
id: keep-a-definition-still-while-a-run-of-it-is-going
title: A definition a run is going on refuses to be edited, and takes edits again once the run is stopped
description: >
  Start a run, then try to rename the automation, archive it, and rename the action placed on it —
  each is refused as a conflict while the run is going. Stop the run, and the same renames go
  through. On the screen the same hold is read rather than pressed into: the automation's build
  screen and the action's list the run over the picture and offer no write, the run's row goes to its
  pane, and once the run is stopped the list is gone and the writes are back.
given:
  # Two rather than one because the terminal's premise stands its programs up in front of the
  # machine's own and cannot make a row shorter than two; the step names the first of them either way.
  - { type: action, domain: workspace, op: can-start, with: { count: 2, then: runs } }
  # The task the built-in the run starts at takes on the screen, so the run goes on to the step after
  # it and stays there while the definition is tried.
  - { type: action, domain: task, op: create, with: { title: SCENARIO SEED — the task the held run works }, as: seed }
  - { type: action, domain: task, op: assign, with: { target: seed, assignee: me-ai } }
  - { type: action, domain: task, op: finish-creating, with: { target: seed } }
  # The built-in that takes a task, one action of one step after it, and every way out decided — the
  # least an automation needs to be started.
  - { type: action, domain: automation, op: action-add, with: { name: take }, as: take }
  - { type: action, domain: automation, op: step-add, with: { target: take, name: claim, prompt: work the task the run took }, as: claim }
  - { type: action, domain: automation, op: action-entry, with: { target: take, step: claim } }
  - { type: action, domain: automation, op: exit-add, with: { step: claim, name: got one }, as: claim_got_one }
  - { type: action, domain: automation, op: exit-add, with: { action: take, name: got one }, as: got_one }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit: got one, exit_to: got one } }
  - { type: action, domain: automation, op: edge-add, with: { in_action: true, target: claim, exit_to: "" } }
  - { type: action, domain: automation, op: create, with: { name: "SCENARIO SEED — one to hold still" }, as: auto }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: take_task }, as: at_start }
  - { type: action, domain: automation, op: place-add, with: { target: auto, action: take }, as: at_take }
  - { type: action, domain: automation, op: place-add, with: { target: auto, builtin: close_task }, as: at_close }
  - { type: action, domain: automation, op: agent-set, with: { target: at_take, step: claim, agent: claude-code } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take, exit: got one, to: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_close } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手した, to: at_take } }
  - { type: action, domain: automation, op: edge-add, with: { target: at_start, exit: 着手できるタスクが無い } }

steps_cli:
  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: running

  # The automation's own fields, archiving included: an archived automation is still the one the run
  # is filed under and working from.
  - type: action
    domain: automation
    op: update
    with:
      target: auto
      name: SCENARIO SEED — renamed under a run
      refused: conflict

  - type: action
    domain: automation
    op: update
    with:
      target: auto
      archived: true
      refused: conflict

  # An action placed on it is held too — the run copied its steps at the start, and the library
  # definition is what a person reads as the one being run.
  - type: action
    domain: automation
    op: action-update
    with:
      target: take
      name: take, renamed under a run
      refused: conflict

  - type: action
    domain: automation
    op: stop
    with:
      target: run

  - type: assert
    domain: automation
    op: run
    with:
      target: run
      status: canceled

  # Once the run is over nothing holds the definition, and the same edits go through.
  - type: action
    domain: automation
    op: update
    with:
      target: auto
      name: SCENARIO SEED — renamed once the run ended

  - type: action
    domain: automation
    op: action-update
    with:
      target: take
      name: take, renamed once the run ended

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  - type: action
    domain: workspace
    op: open-folder
    with:
      dir: lantern

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: action
    domain: automation
    op: start
    with:
      target: auto
    as: run

  # The automation's own build screen, which the start was pressed on: the run is named over the
  # picture, and nothing on it can be written.
  - type: assert
    domain: automation
    op: held-by
    with:
      target: run

  # The action placed on it is held by the same run, read from the library's side.
  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: assert
    domain: automation
    op: held-by
    with:
      target: run

  # The row names the way out of the hold: the pane the run is drawn in, where it is stopped.
  - type: action
    domain: automation
    op: held-go
    with:
      target: run

  - type: action
    domain: workspace
    op: show-face
    with:
      face: tasks

  - type: action
    domain: automation
    op: screen
    with:
      tab: running

  - type: action
    domain: automation
    op: press-run
    with:
      target: run
      press: stop

  # Once the run is over nothing holds the definition, and both build screens take writes again.
  - type: action
    domain: automation
    op: screen
    with:
      tab: automations

  - type: action
    domain: automation
    op: open
    with:
      target: auto

  - type: assert
    domain: automation
    op: held-by
    with:
      present: false

  - type: action
    domain: automation
    op: screen
    with:
      tab: actions

  - type: action
    domain: automation
    op: action-open
    with:
      target: take

  - type: assert
    domain: automation
    op: held-by
    with:
      present: false
