# A message with a picture in it, written in the box under a pane and actually sent.
#
# Amenbo pastes what was written and sends a return behind it. How long it waits in between is the
# pane's agent's, and for Claude Code it is 1300ms — but only where a picture Amenbo put into the
# body is still standing in it. The agent reads the picture off the line before it looks at the
# return, and a return that arrives while it is still reading is taken as a newline: the message does
# not go, and the person is left looking at their own words in the agent's input box wondering what
# they pressed wrong.
#
# Windows puts a floor under every send on top of that, because a return can outrun a paste the host
# has not finished handing over. This road is far over that floor, so what it walks is the agent's
# own number on all three.
#
# ── Why this cannot be read anywhere but here ───────────────────────────────────────────────────
# The wait is a number measured against one version of one product. Nothing in the code knows when
# that version moves, and no unit test can: what is being waited for happens inside somebody else's
# program, on a machine with that program on it. A road is the only thing that finds out — so when
# the day comes that 1300ms is not enough, this is what says so, and it says so before anybody ships.
#
# ── Why the pane opens on a real agent ──────────────────────────────────────────────────────────
# The stand-ins a stood-up machine puts in front of the `PATH` answer and stop. They do not read
# pictures, so nothing about them takes time, so a road walked against one would be green whatever
# the wait was — including none. So no machine is stood up here: the row is drawn in the catalog's
# order off whatever the operator really has, and the first of them is the one this road is about.
# It costs the operator's own account one turn, which is what it costs to know.
#
# **That is a claim on the machine this is walked on, and the only one this road makes.** A machine
# with no agent installed draws a row with the plain shell alone on it, and the press below opens on
# that — a pane with no one in it to answer. Such a run is this road saying the machine it was given
# is not one it can be walked on, which is a different thing from the build being wrong.
#
# ── Why the picture is asked for by size ────────────────────────────────────────────────────────
# Under about four megabytes the agent takes the picture in fast enough that a return sent with no
# wait at all still lands, so a road walked with a small one goes green on a build that waits for
# nothing. The size is what puts the road inside the window the wait exists for. It is drawn by the
# run rather than kept on the fixtures shelf: a file that large tracked in this repository would be
# carried by everyone who ever clones it, for this road alone.
#
# ── Why the reading is the answer that comes back ───────────────────────────────────────────────
# "It went" and "it did not go" put the same words on the same window. Sent, they stand above as the
# turn that was taken; unsent, they stand below in the agent's own input box. What a shot is read by
# is which words are on it and never which part of it they are on, so *where* the words are is not a
# reading this harness has: a step saying they are not in the input line names words a working build
# leaves standing a little higher up the same window, and a step saying the pane holds them is met by
# the very failure this road exists for.
#
# So what is read is the one thing only a message that arrived can put there: the agent's own answer.
# The message asks for a word back, and asks for it in halves — `RAIN` and `FELL` are written apart
# and asked for run together, so the letters the reading looks for are nowhere in the message itself,
# on the pane or in the box. `RAINFELL` on the pane is the agent having been given the line and
# having replied to it. A return that arrived while the picture was still being read leaves the
# message standing in the input box, nothing sent, and nothing to answer with.
#
# ── Why the words are the road's own and not the path ───────────────────────────────────────────
# What the paste puts in the box is a path in this run's throwaway directory, which is different
# every run and which no reading can name. The sentence written beside it is the road's, so it is
# the sentence read in the box before the press — and it is carried in the same message as the
# picture, which is what makes the message one the wait applies to.
#
# ── The screen road alone ───────────────────────────────────────────────────────────────────────
# There is no second road. The box under a pane is drawn in the webview, the clipboard is not
# something a shell holds, and the thing under test is a wait between two writes that only ever
# happen on a press.
id: send-a-message-with-a-picture-in-it
title: A message with a picture in it goes when it is sent, rather than sitting in the agent's input box
description: >
  Open a pane on the first agent this machine has, and open the box Amenbo folds away under it.
  Write a line in that box asking for one word back, paste a large picture in beside it, and send
  the two together. The message goes: the agent answers with the word, which is the one thing on
  that screen a message left sitting in the input box could not have put there.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Orchard
    as: orchard

  - type: action
    domain: folder
    op: bind
    with:
      dir: orchard
      project: orchard

  # The picture, drawn rather than kept: what matters about it is that it is large enough for the
  # agent to spend time on. It lands in the run's own folder — outside every folder this road binds —
  # so what reaches the box can only have come through the clipboard. The run says where that folder
  # is before the first step is handed over.
  - type: action
    domain: repo
    op: write-picture
    with:
      path: orchard-in-the-rain.png
      megabytes: 6

steps_gui:
  - type: action
    domain: workspace
    op: show-face
    with:
      face: workspace

  # The first thing on the row, which is the catalog's own order against what this machine really
  # has. No model is named under it: what the agent comes up on is the reader's own setting, and a
  # road naming one would be a road about somebody's account.
  - type: action
    domain: workspace
    op: pick-start

  - type: action
    domain: workspace
    op: open-start

  # The box, which a pane comes up without: a pane is opened by somebody about to work the program in
  # it, so the presses go there until the reader asks for somewhere else to put them. Everything
  # below this line is written in that box, and a pane that came up folded has nothing to write in.
  - type: action
    domain: workspace
    op: open-box

  # ── The message, written and not yet sent ─────────────────────────────────────────────────────
  # The words the readings below rest on. They are written first so the paste goes in beside them,
  # which is the shape a person's message really has: a sentence, and a picture with it. What the
  # sentence asks for is the road's whole reading — one word, spelled in two halves so that no part
  # of the message is the word that comes back.
  - type: action
    domain: workspace
    op: write-to-pane
    with:
      text: "SCENARIO the orchard rows after the rain. Answer with one word and nothing else: RAIN and FELL run together in capitals, with nothing between them."

  - type: action
    domain: repo
    op: copy-image-outside
    with:
      path: orchard-in-the-rain.png

  - type: action
    domain: workspace
    op: paste-image-into-box

  # Both halves are standing in Amenbo's box, unsent. Read before the press, because everything after
  # it is about a message that went — and a press that had nothing to send would leave the reading
  # below saying nothing at all.
  - type: assert
    domain: workspace
    op: still-to-send
    with:
      shows: SCENARIO the orchard rows after the rain

  - type: assert
    domain: workspace
    op: still-to-send
    with:
      shows: ".png"

  # ── Sent ──────────────────────────────────────────────────────────────────────────────────────
  - type: action
    domain: workspace
    op: send-written
    with:
      by: key

  # **The reading the road is for.** The word is on the pane, which means the agent was given the
  # line and answered it. Nothing else on this screen can have put those letters there: the message
  # spells the two halves apart, so a build whose return arrived while the picture was still being
  # read leaves its words standing in the input box with no answer under them, and this comes back
  # red on a screen where nothing else looks wrong.
  - type: assert
    domain: workspace
    op: pane
    with:
      shows: RAINFELL
