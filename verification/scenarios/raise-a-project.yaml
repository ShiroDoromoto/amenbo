# The other way in, walked to the screen a new project ends on — and the one thing about that screen
# only a shot of it ever says.
#
# The first loop is the single push that joins the two ends a project starts with no bridge between:
# the reader asks their AI, the AI writes to amenbo, and what it wrote lands on the board. Every move
# the interface can make on their behalf it makes — the terminal opens already inside the linked
# folder, and the request is handed over finished, with no hole left to fill in — so what stays with
# the reader is launching their own AI and pasting.
#
# None of that reaches the store. A request that lost the file name it sends the AI to read, a
# terminal opened somewhere other than the linked folder, a loop no longer leading the screen it was
# put on: each leaves behind exactly the rows a working one does, so there is no read to ask and no
# exit code to fail. The screen is the only witness there is.
#
# The order is the half that went out unwatched: it shipped on the strength of the part's own tests,
# which say what the loop draws and nothing about where it was put. A reading says which words are on
# a shot and never which came first, so that step is closed by an eye — which is why the road is
# walked to it rather than the screen being stood up by hand.
#
# The device this starts on already holds a project, and that is what the premise stands up: the open
# card is drawn only where there is something to open, so on an empty device the screen the first step
# reads offers one way in rather than two. What is left to bring is a folder to give the new project —
# the loop is what a linked folder buys, and the screen says so in its place. Stand on the getting
# started screen when the run hands its first step over.
#
# Clear the notices along the top of the window before shooting. One of them — the one that says the
# AI guidance in a folder is an old version — names the very file the request names, and a reading
# says which words are on a shot, not which part of it they came from: left up, it answers for the
# card, and the card could be blank.
id: raise-a-project
title: A reader who raises a project is left on a screen that leads with the first loop, and the request it hands over names the file the AI is told to read
description: >
  Take the way in that raises a project, give it a name and a folder, and read what the screen it
  ends on offers. The loop leads it — open a terminal, copy the request, watch the tasks arrive — and
  the request it hands over names AGENTS.md, which is what sends the reader's AI to learn amenbo
  before it writes anything. The moves that were there before the loop sit underneath it, and the way
  on to the board is last.
given:
  # The project the open card has to have to be drawn at all. It is nothing this road touches — the
  # one it raises is its own — but the first step reads a screen offering both ways in, and with an
  # empty device there is only one.
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse

steps_gui:
  - type: assert
    domain: folder
    op: ways-in
    with:
      absent: "bind --project"

  - type: action
    domain: project
    op: create
    with:
      name: Seedbed

  - type: assert
    domain: folder
    op: first-loop
    with:
      hands_over: agent --json

  - type: assert
    domain: folder
    op: first-loop-order
    with:
      order: the first loop, then the other moves, then the way on to the board
