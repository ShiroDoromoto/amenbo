# Calling a plugin and using what it hands back.
#
# The contract is that **stdout belongs to the plugin**: the return value is meant to
# be consumed — `eval "$(amenbo plugin run worktree start 42)"` — so amenbo prints no courtesy line
# into it, and its own voice, plus the plugin's diagnostics, go to stderr beside it. A single line
# of amenbo's leaking into that stream corrupts the value at the caller, and nothing but a call to
# the shipped binary can show whether the two streams really came apart.
#
# The subject is the official `worktree` plugin's `start` / `finish`, which return the `cd` into a
# checkout of the task's own. It resolves everything from the repository it is called in, which is
# the folder amenbo is bound to — a real one for a real plugin.
#
# A call that fails is not driven here: a plugin exiting non-zero is a failed call, and the driver
# reads that as the run erroring out rather than as an assert coming back false. Asserting a refusal
# is its own piece of work.
id: plugin-run
title: An enabled plugin is called with a task's id, and what it prints comes back as the value
description: >
  Install and enable the official `worktree` plugin, then call its command face for a task this
  scenario just registered. The returned value is read back and checked for the shape the contract
  promises — the way into the checkout — and the call that takes the checkout away again is read
  back off the execution log as having ended cleanly.
steps:
  - type: action
    domain: task
    op: create
    with:
      title: SCENARIO SEED — given a checkout of its own by a plugin
    as: seed

  - type: action
    domain: plugin
    op: install
    with:
      name: worktree

  # The gate has to be open before a command face answers at all: an explicit call is still a call,
  # so an installed-but-shut plugin refuses rather than running.
  - type: action
    domain: plugin
    op: enable
    with:
      name: worktree

  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: start
      task: seed

  # What came back is the plugin's own stdout: one `cd` line into the checkout it made. amenbo's
  # account of what happened rode the other stream, and is not in here.
  - type: assert
    domain: plugin
    op: returned
    with:
      contains: "cd "

  - type: assert
    domain: plugin
    op: returned
    with:
      contains: "-worktrees/"

  - type: action
    domain: plugin
    op: run
    with:
      name: worktree
      command: finish
      task: seed

  - type: assert
    domain: plugin
    op: ran
    with:
      name: worktree
      outcome: ok
