# The agent saying "look at this", and the person looking.
#
# An agent working in a pane produces things worth reading, and the pane is the worst place to read
# them: a file's contents scrolled past in a terminal is gone the moment the next command runs. So the
# surface layer has a word for it — the agent says what is worth opening and why — and the file face
# beside the pane is where that lands, as rows a person presses when they are ready.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no second road here and no gap in one. The layer exists only inside a pane — said anywhere
# else it is refused, deliberately — and what it leaves is drawn on a screen. A terminal driver has
# nowhere to say it and nothing to read it off.
#
# ── Why a hand types it ──────────────────────────────────────────────────────────────────────────
# The words are only accepted from inside the pane that is running, which does not exist until the app
# does, so the operator types what an agent types. That is not a shortcut around the seam — it is the
# seam, walked by the only door there is.
#
# ── The target that is not opened, and why it is the point ───────────────────────────────────────
# An agent may point at anything, including something outside the folder the project answers for. The
# face draws that row — it is what the agent said, and hiding it would be the app editing the agent —
# but it does **not** make it something to press: what is reachable is fenced by the folder, and a
# button that opened it would be a fence with a door in it. So the road points at two things and
# reads that one of them is a row and the other is a row that opens.
#
# ── The half nobody is looking at, and how it calls ──────────────────────────────────────────────
# The panel opens on the page a person writes on, not on the folder. That is deliberate and it is what
# makes the badge part of this road rather than a detail beside it: a person goes to the files when
# they want them, and an agent that pointed at something **cannot send anybody there**. So the switch
# knocks. The road walks it where it matters — said into a panel nobody has open, said again while the
# reader is standing on the half — and reads that coming to the half spends the mark.
#
# ── What is not kept ─────────────────────────────────────────────────────────────────────────────
# None of this outlives the window. What an agent pointed at belongs to the session it was said in and
# is gone with it, which is why the road reads it while the pane is still running rather than proving
# anything about coming back to it.
id: open-what-the-agent-pointed-at
title: An agent points at a file from inside its pane, and the person is called over and opens it
description: >
  Open the terminal face on a project whose folder holds a file, open a plain shell in the pane, and
  point at the file from in there — the agent's own word for "this is worth opening", said with the CLI from inside the
  terminal. Say it into a panel nobody has open: the switch for the files wears a mark, and coming to
  the half spends it. The row is standing there, and pressing it opens the file. Point at
  something outside the folder as well: the row is drawn, because it is what the agent said, and it is
  not something to press, because what is reachable is fenced by the folder.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: notes/watering.md
      content: SCENARIO the seedlings are watered every second morning

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # The panel beside the panes opens on the page a person writes on rather than on the folder, so the
  # road asks for the half it is about before reading anything in it.
  - type: action
    domain: terminal
    op: show-side
    with:
      side: files

  # The pane has to be running before anything can be said in it: the layer is refused everywhere else.
  - type: action
    domain: terminal
    op: open-folder
    with:
      dir: greenhouse

  # And down to a plain shell, because what is said below is said by running the CLI. A folder with an
  # agent on it opens on the agent, and asking one to run a command is asking rather than doing — the
  # road would go green or red on whether it obliged. The operator types what an agent types, at a
  # prompt that does what it is told.
  - type: action
    domain: terminal
    op: open-shell

  # Nothing has been said yet, and the column says so rather than drawing an empty space that could be
  # read as a section that failed to load.
  - type: assert
    domain: files
    op: says
    with:
      note: nothing-pointed

  # And the switch says nothing either, for the same reason: there is nothing to be called about.
  - type: assert
    domain: files
    op: pointed-badge
    with:
      present: false

  # ── the half that is not up, calling ──────────────────────────────────────────────────────────
  # The panel goes away, which is the state the badge exists for: a person who is not looking at the
  # files cannot be sent there, so what the agent says next has to reach them on the switch.
  - type: action
    domain: terminal
    op: hide-side
    with:
      side: files

  - type: action
    domain: terminal
    op: point
    with:
      target: notes/watering.md
      why: SCENARIO this is the schedule the whole plan turns on

  # Said into a panel nobody has open, and the switch knocks.
  - type: assert
    domain: files
    op: pointed-badge

  - type: action
    domain: terminal
    op: show-side
    with:
      side: files

  # Being on the half is being told, so the mark is spent by coming here — and what it was about is
  # standing in the column, which is where the road goes on.
  - type: assert
    domain: files
    op: pointed-badge
    with:
      present: false

  # Said in the pane, read in the column. The reason travels with it: a thing to open with no reason
  # to open it is a row a person has to go and find out about.
  - type: assert
    domain: files
    op: listed
    with:
      name: notes/watering.md
      section: pointed

  - type: action
    domain: files
    op: open
    with:
      name: notes/watering.md
      section: pointed

  - type: assert
    domain: files
    op: reading
    with:
      shows: SCENARIO the seedlings are watered every second morning

  - type: action
    domain: files
    op: back

  # And something outside the folder. What the agent said is drawn — the app does not edit it — and
  # what the folder fences is not opened.
  - type: action
    domain: terminal
    op: point
    with:
      target: ../elsewhere/ledger.md
      why: SCENARIO this one is outside what the project answers for

  - type: assert
    domain: files
    op: listed
    with:
      name: ../elsewhere/ledger.md
      section: pointed

  - type: assert
    domain: files
    op: openable
    with:
      name: ../elsewhere/ledger.md
      present: false

  # And nothing knocked. The reader is on the half this was said into, so there is nowhere to call
  # them from — a badge here would be the face telling somebody about what they are looking at.
  - type: assert
    domain: files
    op: pointed-badge
    with:
      present: false

  # And the end of it. While the pane runs, what is left unopened is a count and nothing more — there
  # is still time. Once the session is over there is not, so the column says it in words: this is the
  # one moment the reader can be told what they never got to, and after it the whole map is gone with
  # the session.
  - type: action
    domain: terminal
    op: end-pane

  - type: assert
    domain: files
    op: says
    with:
      note: unopened
