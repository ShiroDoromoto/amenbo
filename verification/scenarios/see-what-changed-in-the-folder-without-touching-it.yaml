# The folder moving under the app, and the app noticing on its own.
#
# A person working with an AI in a folder is not the only one writing in it — the agent is, and so is
# whatever it runs. What the file face is for at that moment is the one question a person cannot ask
# a static listing: what moved. So the tree is laid over a watch, and this road is the difference:
# the screen changes with **nothing on it pressed**.
#
# ── The screen road alone ────────────────────────────────────────────────────────────────────────
# There is no second road here and no gap in one. A terminal watching a folder is `ls` run twice, and
# Amenbo is the subject of neither.
#
# ── Why the file is written from outside ─────────────────────────────────────────────────────────
# Every other road on the screen presses something and reads what the press did. This one presses
# nothing: the operator is sent out of the app to write a file, and what is under test is the app
# having moved by the time they look back. A step that wrote the file through Amenbo would be proving
# that Amenbo can redraw what Amenbo just did, which nobody doubted.
#
# ── The ignored folder, and why it is on the tree ────────────────────────────────────────────────
# `.gitignore` says what git does not record, not what a reader may not look at — the files a person
# goes to after an agent has been at work, `.env` and `.amenbo`, are ignored in most repositories.
# So the road writes a second file that the folder has said to ignore, and reads that it is on the
# tree like any other.
#
# The world writes the `.gitignore` before anything else, because what is left out of the **watch**
# is decided as the walk runs and a rule that arrived later would be a rule for the next walk.
#
# ── What this road does not read ─────────────────────────────────────────────────────────────────
# The colour each row wears — what git says about it — is the other half of the same face and is
# **not** read here. Two ops are missing for it: a world where a bound folder is a repository
# (`repo git-init` makes the run's own folder one, and no other), and an assert that reads a row's
# colour. Both are filed for; the lines belong in this file once they land.
id: see-what-changed-in-the-folder-without-touching-it
title: A file written outside Amenbo shows up in the tree, the folder's own ignore rules included
description: >
  Open the terminal face on a project whose folder is being watched and unfold the folder's tree,
  then leave Amenbo and put a file in that folder from outside. Come back to a screen nothing was
  pressed on: the new folder is on the tree. Write a second file the folder's own ignore rules cover,
  and it is on the tree too — what git does not record is still something somebody wrote.

given:
  - type: action
    domain: project
    op: create
    with:
      name: Greenhouse
    as: greenhouse

  - type: action
    domain: folder
    op: bind
    with:
      dir: greenhouse
      project: greenhouse

  # Written first: what the watch is laid over is decided as the walk runs, so a rule that arrived
  # after one would be a rule for the next.
  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: .gitignore
      content: compost/

  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: notes/watering.md
      content: SCENARIO the seedlings are watered every second morning

steps_gui:
  - type: action
    domain: terminal
    op: show-face
    with:
      face: terminal

  # The panel beside the panes opens on the page a person writes on rather than on the folder: a
  # person goes to the files when they want them, and what an agent points at calls from the switch
  # itself. So the road asks for the half it is about before reading anything in it.
  - type: action
    domain: terminal
    op: show-side
    with:
      side: files

  # The tree starts folded — a panel nobody is looking at must not walk a repository — so the road
  # opens it before it can read anything on it.
  - type: action
    domain: files
    op: tree
    with:
      open: true

  # What the folder already held. It is read before anything is written, which is what makes the
  # next step's arrival readable as an arrival rather than as the first thing anybody looked at.
  - type: assert
    domain: files
    op: listed
    with:
      name: notes
      section: tree

  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: orchard/pruning.md
      content: SCENARIO cut back the old wood before the sap rises

  # Nothing was pressed. The screen moved because the folder did.
  - type: assert
    domain: files
    op: listed
    with:
      name: orchard
      section: tree

  - type: action
    domain: repo
    op: write-file
    with:
      dir: greenhouse
      path: compost/heap.md
      content: SCENARIO turned twice a week

  # And this one the folder said to ignore. It is on the tree all the same: being ignored by git is
  # not being hidden from a reader, and it is the watch and the search that leave these out.
  - type: assert
    domain: files
    op: listed
    with:
      name: compost
      section: tree
