[package]
name = "amenbo-cli"
description = "The amenbo CLI: the first interface an AI agent reaches for"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "amenbo"
path = "src/main.rs"

[features]
default = []
# The real-binary suites (`cli_e2e_*`, `demo_tape`, `cli_ask`) fork the built `amenbo` binary once per
# test (~1–2s each) — heavy by *attribute*, not by logic. Gate them behind an off-by-default feature
# so the everyday `cargo test` stays fast; CI runs them via `--features e2e`. A feature-gated test
# rots unless CI runs every feature (see .github/workflows/_ci.yml).
e2e = []

[dependencies]
amenbo-core = { path = "../amenbo-core" }
serde.workspace = true
serde_json.workspace = true
# Read a `.yaml` manifest an author points `plugin validate` at; JSON is read through serde_json.
# Parsing lives at this surface, the shared validation rules in amenbo-core.
serde_norway.workspace = true
chrono.workspace = true
clap.workspace = true
# Hidden password entry for the encrypted recovery kit (`recovery backup`): read the passphrase from
# the TTY without echoing it. Small, widely-used crate; no-op'd by `--password-stdin` for
# non-interactive/scripted runs.
rpassword = "7"

# Restores SIGPIPE to its default at startup (`main`), so a reader that walks away ends this process
# the way a Unix tool ends: at once, and quietly. Windows has no such signal, so the dependency is
# scoped to the platforms that do.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
amenbo-scratch.workspace = true
amenbo-static-host.workspace = true

# The real-binary end-to-end suite, one target per surface it walks (`tests/e2e/`), all sharing
# `tests/e2e/harness.rs`. Every one of them is gated behind `e2e`; build/run them with
# `cargo test --features e2e`, and aim at one with `--test cli_e2e_<surface>`. The `cli_e2e_` prefix
# is load-bearing: it is what CI and the Makefile name the suite by, to run it on a box of its own
# (`-E 'binary(/^cli_e2e/)'`), so a new slice added here joins that run by being named like its
# siblings. Cargo does not find a target under a subdirectory on its own, hence the explicit `path`.
[[test]]
name = "cli_e2e_talk"
path = "tests/e2e/talk.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_task"
path = "tests/e2e/task.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_decision"
path = "tests/e2e/decision.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_comment"
path = "tests/e2e/comment.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_project"
path = "tests/e2e/project.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_store"
path = "tests/e2e/store.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_reach"
path = "tests/e2e/reach.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_dimension"
path = "tests/e2e/dimension.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_activity"
path = "tests/e2e/activity.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_hooks"
path = "tests/e2e/hooks.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_process"
path = "tests/e2e/process.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_plugin"
path = "tests/e2e/plugin.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_plugin_run"
path = "tests/e2e/plugin_run.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_mcp"
path = "tests/e2e/mcp.rs"
required-features = ["e2e"]

[[test]]
name = "cli_e2e_tick"
path = "tests/e2e/tick.rs"
required-features = ["e2e"]

# The README demo's script, replayed against this build. It forks the binary once per line the film
# types, so it sits behind the same gate for the same reason.
[[test]]
name = "demo_tape"
required-features = ["e2e"]

# The questions amenbo puts on a terminal, driven on a real one (a pty). Same gate as the rest of the
# real-binary suites, and Unix-only inside — a pty is what the platform hands out.
[[test]]
name = "cli_ask"
required-features = ["e2e"]
